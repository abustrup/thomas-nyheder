<!doctype html>
<html lang="da" data-chrome="minimal" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Thomas' Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),

.media-fallback-label {

.story-eyebrow {

.story-byline,

.story-headline {

.headline-link { text-decoration: none; }

.story-subheadline {

.story-card .story-subheadline {

.story-body,

.story-body p,

.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {

  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);

}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {

  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 90ms ease;
  /* Suppress the grey flash iOS paints over a tapped button, which otherwise
     competes with the :active state below, and remove the 300ms tap delay. */
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}
/* A tap must feel like a press. :hover and :focus-visible never fire on a touch
   tap, so before this the chip was visually inert on a phone and the reader had
   no way to tell the click had registered. :active gives the immediate press,
   .is-selected gives the lasting answer, matching .feedback-button above. */
.reason-chip:active {
  background: color-mix(in srgb, var(--ink) 12%, transparent);
  transform: scale(0.96);
}
.reason-chip.is-selected {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.reason-chip.is-selected:hover,
.reason-chip.is-selected:focus-visible {
  background: color-mix(in srgb, var(--ink) 86%, var(--paper));
}
@media (prefers-reduced-motion: reduce) {
  .reason-chip { transition: none; }
  .reason-chip:active { transform: none; }
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

/* A reader with only a daily edition gets no bar at all: three of the five
   edition links would 404, and the "Vis som" switcher is a question nobody
   asked. Keyed off <html data-chrome>, stamped at render time from the profile,
   so the bar is gone before first paint rather than flashing in and vanishing
   once the module boots. The bindings are skipped too (see bindEditionNav), so
   the links are absent from the DOM rather than merely invisible. */
:root[data-chrome="minimal"] .top-bar {
  display: none;
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {

nderet for. Myndighederne kalder Vogel \"hjernen bag\". Han ønsker ikke at kommentere sagen, oplyser hans advokat."],"whyItMatters":"Det, der flytter sig, er ikke beløbet, men rækkevidden: Danmark kan nu forfølge en privatperson ved en hollandsk domstol uden først at afvente udfaldet i Canada.","analysis":"Ifølge den hollandske dom slog Landsskatteretten 13. maj sidste år fast, at pensionsfondene ikke havde løftet bevisbyrden for at eje aktierne. Den canadiske sag ventes efter myndighedernes egen vurdering først afgjort om flere år.","counterpoint":"Tilladelsen til at føre sagen er ikke en afgørelse af den. Vogels advokat kaldte for år siden det danske krav \"en falsk anklage\".","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/cvibra5j/vogel-org_sloeret_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR Nyheder (Foto: Privatfoto)","alt":"Privatfoto anvendt af DR til historien om det danske skattekrav: en gråhåret mand i hvid skjorte sidder smilende på en restaurant med et glas i hånden, mens gæsterne bag ham er slørede.","sourceUrl":"https://www.dr.dk/nyheder/penge/danmark-tager-et-stik-i-retsopgoer-mod-hollandsk-milliardaer"},"topics":["udbytteskat","skat","Holland","retssag"],"entities":["Frank Vogel","Skattestyrelsen","Landsskatteretten","Appelretten i Amsterdam"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":62,"novelty":78,"sourceQuality":86,"personalRelevance":66,"contrast":52},"claims":[{"text":"Appelretten i Amsterdam har ophævet en blokering, så de danske skattemyndigheder kan føre et krav på cirka 95 millioner kroner mod Frank Vogel og en række af hans selskaber.","sourceUrls":["https://www.dr.dk/nyheder/penge/danmark-tager-et-stik-i-retsopgoer-mod-hollandsk-milliardaer"],"confidence":"high"},{"text":"Ifølge den hollandske dom slog Landsskatteretten 13. maj sidste år fast, at de canadiske pensionsfonde ikke havde løftet bevisbyrden for ejerskab til aktierne.","sourceUrls":["https://www.dr.dk/nyheder/penge/danmark-tager-et-stik-i-retsopgoer-mod-hollandsk-milliardaer"],"confidence":"high"},{"text":"Vogels advokat Jasper Hagers kaldte for år siden det danske krav en falsk anklage.","sourceUrls":["https://www.dr.dk/nyheder/penge/danmark-tager-et-stik-i-retsopgoer-mod-hollandsk-milliardaer"],"confidence":"high"}],"sources":[{"title":"Danmark tager et stik i retsopgør mod hollandsk milliardær","publisher":"DR Nyheder","url":"https://www.dr.dk/nyheder/penge/danmark-tager-et-stik-i-retsopgoer-mod-hollandsk-milliardaer","publishedAt":"2026-08-15T11:00:00.000Z","kind":"reporting"}]},{"id":"thomas-2026-08-16-mjda-mekka","eventKey":"tyrkiet-saudi-pakistan-forsvarspagt-mekka-2026-08","materialFacts":["Tyrkiet, Saudi-Arabien og Pakistan underskrev Mecca Joint Defense Agreement i Mekka i begyndelsen af august","Pakistans udenrigsministerium siger, at et eksternt vaebnet angreb paa et af de tre lande betragtes som et angreb paa dem alle","Pakistans premierminister skrev, at MJDA hverken ophaever eller erstatter eksisterende aftaler","Houthierne angreb faa dage efter igen saudiarabiske olieanlaeg, uden at Tyrkiet eller Pakistan blandede sig"],"section":"Sikkerhed og geopolitik","headline":"En ny alliance er født i Mellemøsten – hvad betyder det for USA og Nato?","primarySourceUrl":"https://www.dr.dk/nyheder/udland/en-ny-alliance-er-foedt-i-mellemoesten-hvad-betyder-det-usa-og-nato","subheadline":"Tyrkiet, Saudi-Arabien og Pakistan har underskrevet en forsvarspagt med en formulering, der ligner Natos artikel 5. Et Nato-land binder sig dermed til to lande uden for alliancen.","body":["Tyrkiet, Saudi-Arabien og Pakistan underskrev i begyndelsen af august Mecca Joint Defense Agreement i Mekka. Ifølge Pakistans udenrigsministerium vil et eksternt væbnet angreb på et af de tre lande blive betragtet som et angreb på dem alle.","De tre lægger hver sit i puljen: saudisk økonomisk tyngde, tyrkisk militærindustri og et stort pakistansk militær, som det eneste med atomvåben. Pakistans premierminister skrev, at pagten ikke erstatter eksisterende aftaler."],"whyItMatters":"Tyrkiet råder over Natos næststørste militær og er omfattet af artikel 5. Nu binder det sig parallelt til to lande uden for alliancen.","analysis":"Khalid al-Jaber fra Middle East Council on Global Affairs ser en region, der \"forbereder sig på en mulig amerikansk tilbagetrækning\".","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/dy1dc1i0/20260807-131526-2.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR Nyheder (Foto: Murat Cetinmuhurdar, Reuters/Ritzau Scanpix)","alt":"DR's billede til historien, ifølge billedteksten af kronprins Mohammed bin Salman, præsident Recep Tayyip Erdogan og premierminister Shehbaz Sharif. To giver hånd, alle tre holder en mappe.","sourceUrl":"https://www.dr.dk/nyheder/udland/en-ny-alliance-er-foedt-i-mellemoesten-hvad-betyder-det-usa-og-nato"},"topics":["forsvar","Mellemøsten","Nato","Tyrkiet","Pakistan"],"entities":["Tyrkiet","Saudi-Arabien","Pakistan","Hakan Fidan","Nato"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":88,"decisionValue":58,"novelty":82,"sourceQuality":80,"personalRelevance":54,"contrast":66},"claims":[{"text":"Tyrkiet, Saudi-Arabien og Pakistan underskrev Mecca Joint Defense Agreement i Mekka i begyndelsen af august 2026.","sourceUrls":["https://www.dr.dk/nyheder/udland/en-ny-alliance-er-foedt-i-mellemoesten-hvad-betyder-det-usa-og-nato"],"confidence":"medium"},{"text":"Pakistans premierminister skrev kort efter underskrivelsen, at MJDA hverken ophæver eller erstatter eksisterende bilaterale eller multilaterale aftaler.","sourceUrls":["https://www.dr.dk/nyheder/udland/en-ny-alliance-er-foedt-i-mellemoesten-hvad-betyder-det-usa-og-nato"],"confidence":"high"},{"text":"Houthierne angreb få dage efter underskrivelsen igen saudiarabiske olieanlæg, uden at Tyrkiet eller Pakistan blandede sig.","sourceUrls":["https://www.dr.dk/nyheder/udland/en-ny-alliance-er-foedt-i-mellemoesten-hvad-betyder-det-usa-og-nato"],"confidence":"high"}],"sources":[{"title":"En ny alliance er født i Mellemøsten – hvad betyder det for USA og Nato?","publisher":"DR Nyheder","url":"https://www.dr.dk/nyheder/udland/en-ny-alliance-er-foedt-i-mellemoesten-hvad-betyder-det-usa-og-nato","publishedAt":"2026-08-15T17:10:00.000Z","kind":"reporting"}],"counterpoint":"Løftet holdt ikke ved første lejlighed: Houthierne angreb få dage senere igen saudiarabiske olieanlæg, \"men hverken Tyrkiet eller Pakistan blandede sig\"."},{"id":"thomas-2026-08-16-humac-rekonstruktion","eventKey":"humac-rekonstruktion-butikslukning-2026-08","materialFacts":["Humac gaar i rekonstruktion og lukker midlertidigt alle 14 butikker i Danmark samt webshoppen","Sagen behandles i skifteretten under Soe- og Handelsretten","Ejeren C&C Denmark tabte godt 27 millioner kroner i 2025 og har hverken egenkapital eller likviditet","Selskabet har akut brug for knap 30 millioner kroner"],"section":"Detailhandel","headline":"Humac i alvorlige problemer efter kæmpe-underskud - lukker alle danske butikker i redningsforsøg","primarySourceUrl":"https://www.computerworld.dk/art/296507/humac-i-alvorlige-problemer-efter-kaempe-underskud-lukker-alle-danske-butikker-i-redningsforsoeg","subheadline":"Apple-forhandleren går i rekonstruktion og lukker 14 butikker og webshoppen. Det italienske moderselskab er selv i rekonstruktion.","body":["Apple-forhandleren Humac er gået i rekonstruktion og har midlertidigt lukket alle sine 14 danske butikker og sin webshop. Skifteretten under Sø- og Handelsretten skal nu vurdere, om selskabet kan overleve, helt eller delvist salg og kreditoraftaler indbefattet. Lykkes det ikke, ender det med konkurs.","Ejeren, C&C Denmark, tabte godt 27 millioner kroner i 2025 ifølge årsregnskabet offentliggjort for en måneds tid siden. Der er hverken egenkapital eller likviditet tilbage, og selskabet mangler akut knap 30 millioner kroner."],"whyItMatters":"Kæden har rødder tilbage til 1993 som AUC Unicom og har heddet Humac siden 2006. Falder et specialiseret led bort, flytter salget til producenten og kæderne.","analysis":"Ledelsen skrev i regnskabet, at den forventede at kunne skaffe kapitalen. Rekonstruktionen kom en måned senere, og at det italienske moderselskab selv er i rekonstruktion, begrænser hvor pengene kan komme fra.","image":{"url":"https://www.computerworld.dk/fil/230578?width=1200&height=630&focus=1","credit":"Kilde: Computerworld","alt":"Computerworlds topbillede til historien: facaden af en Humac-butik med lysende logo og et Apple Premium Reseller-skilt, set gennem glasruden ind mod udstillede computere og tilbehør.","sourceUrl":"https://www.computerworld.dk/art/296507/humac-i-alvorlige-problemer-efter-kaempe-underskud-lukker-alle-danske-butikker-i-redningsforsoeg"},"topics":["detailhandel","rekonstruktion","Danmark","Apple"],"entities":["Humac","C&C Denmark","Sø- og Handelsretten"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":66,"decisionValue":62,"novelty":70,"sourceQuality":72,"personalRelevance":62,"contrast":40},"claims":[{"text":"Humac er gået i rekonstruktion og har midlertidigt lukket alle 14 danske butikker og webshoppen.","sourceUrls":["https://www.computerworld.dk/art/296507/humac-i-alvorlige-problemer-efter-kaempe-underskud-lukker-alle-danske-butikker-i-redningsforsoeg"],"confidence":"high"},{"text":"C&C Denmark tabte godt 27 millioner kroner i 2025 og har akut brug for knap 30 millioner kroner.","sourceUrls":["https://www.computerworld.dk/art/296507/humac-i-alvorlige-problemer-efter-kaempe-underskud-lukker-alle-danske-butikker-i-redningsforsoeg"],"confidence":"high"},{"text":"Det italienske moderselskab C&C er selv i gang med en rekonstruktion.","sourceUrls":["https://www.computerworld.dk/art/296507/humac-i-alvorlige-problemer-efter-kaempe-underskud-lukker-alle-danske-butikker-i-redningsforsoeg"],"confidence":"high"}],"sources":[{"title":"Humac i alvorlige problemer efter kæmpe-underskud - lukker alle danske butikker i redningsforsøg","publisher":"Computerworld","url":"https://www.computerworld.dk/art/296507/humac-i-alvorlige-problemer-efter-kaempe-underskud-lukker-alle-danske-butikker-i-redningsforsoeg","publishedAt":"2026-08-14T09:43:00.000Z","kind":"reporting"}]},{"id":"thomas-2026-08-16-roskilde-knivdrab","eventKey":"roskilde-knivdrab-puttefest-gymnasieelev-2026-08","materialFacts":["En 16-aarig dreng doede efter knivstik ved Louisevej taet paa Folkeparken i Roskilde fredag aften","En anden 16-aarig er anholdt og skulle fremstilles i grundlovsforhoer loerdag","Vicepolitiinspektoer Michael Sehested kalder det et internt opgoer mellem de to","Offeret var elev paa Himmelev Gymnasium"],"section":"Danmark i dag","headline":"Gymnasieelev knivdræbt under 'internt opgør' til puttefest","primarySourceUrl":"https://www.dr.dk/nyheder/indland/teenager-er-knivdraebt-i-roskilde-under-internt-opgoer","subheadline":"En 16-årig døde efter knivstik ved Folkeparken i Roskilde. En jævnaldrende er anholdt, og ifølge DR tyder intet på en forbindelse til kriminelle miljøer.","body":["En 16-årig dreng døde fredag aften efter knivstik ved Louisevej tæt på Folkeparken i Roskilde. En jævnaldrende er anholdt og skulle ifølge politiet fremstilles i grundlovsforhør lørdag. Vicepolitiinspektør Michael Sehested fra Midt- og Vestsjællands Politi beskriver det som et internt opgør mellem de to, der eskalerede.","Det skete til en puttefest, et tilbagevendende arrangement for nye gymnasieelever i parken ved skolestart. Himmelev Gymnasium oplyser, at offeret var elev på skolen. Ifølge DR tyder intet på, at drabet har forbindelse til kriminelle miljøer."],"whyItMatters":"Det er den historie, hele Danmark læser i dag, og der er foreløbig intet, der peger mod kriminelle miljøer.","analysis":"Politiet fandt spor fra gerningsmanden på gerningsstedet og nåede hurtigt frem til ham. Klaus Walmod fra Natteravnene i Roskilde fortæller, at parken hurtigt fyldtes med udrykning, og at en lægehelikopter blev tilkaldt.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/yuwkzfql/20260814-211802-l_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR Nyheder (Foto: Steven Knap, Ritzau Scanpix)","alt":"DR's billede fra afspærringen i Roskilde: betjente står bag rød-hvid afspærringstape på en villavej i aftenlys, med parkerede biler til venstre og en politibil mærket indsatsleder til højre.","sourceUrl":"https://www.dr.dk/nyheder/indland/teenager-er-knivdraebt-i-roskilde-under-internt-opgoer"},"topics":["kriminalitet","Roskilde","unge","Danmark"],"entities":["Midt- og Vestsjællands Politi","Michael Sehested","Himmelev Gymnasium"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":74,"decisionValue":34,"novelty":76,"sourceQuality":82,"personalRelevance":46,"contrast":38},"claims":[{"text":"En 16-årig dreng døde efter knivstik ved Louisevej tæt på Folkeparken i Roskilde, og en jævnaldrende er anholdt.","sourceUrls":["https://www.dr.dk/nyheder/indland/teenager-er-knivdraebt-i-roskilde-under-internt-opgoer"],"confidence":"high"},{"text":"Vicepolitiinspektør Michael Sehested beskriver hændelsen som et internt opgør mellem de to 16-årige.","sourceUrls":["https://www.dr.dk/nyheder/indland/teenager-er-knivdraebt-i-roskilde-under-internt-opgoer"],"confidence":"high"},{"text":"Himmelev Gymnasium oplyser, at offeret var elev på skolen.","sourceUrls":["https://www.dr.dk/nyheder/indland/teenager-er-knivdraebt-i-roskilde-under-internt-opgoer"],"confidence":"high"}],"sources":[{"title":"Gymnasieelev knivdræbt under 'internt opgør' til puttefest","publisher":"DR Nyheder","url":"https://www.dr.dk/nyheder/indland/teenager-er-knivdraebt-i-roskilde-under-internt-opgoer","publishedAt":"2026-08-15T06:33:07.000Z","kind":"reporting"}]},{"id":"thomas-2026-08-16-noah-vilum-port","eventKey":"sydals-11-aarig-redder-mor-traeport-2026-08","materialFacts":["En cirka 400 kilo tung traeport vaeltede ned over Malene Jensen paa familiens ejendom paa Sydals","Hendes 11-aarige soen Noah Vilum fik en saekkevogn ind under porten og loeftede den nok til at hun kom fri","Han ringede til alarmcentralen, sin morfar og sine storebroedre","Malene Jensen fik brud paa nederste laendehvirvel og paa begge sider af baekkenet og var indlagt i 13 dage"],"section":"Danmark i dag","headline":"Hun vågnede stolt i ambulancen: 11-årig reddede sin mor fri under voldsom ulykke","primarySourceUrl":"https://nyheder.tv2.dk/samfund/2026-08-15-hun-vaagnede-stolt-i-ambulancen-11-aarig-reddede-sin-mor-fri-under-voldsom-ulykke","subheadline":"En 400 kilo tung port væltede ned over Malene Jensen på Sydals. Ingen voksne var i nærheden, kun hendes 11-årige søn.","body":["En cirka 400 kilo tung træport hoppede af skinnen og væltede ned over Malene Jensen på familiens nykøbte ejendom på Sydals. Ingen andre voksne var til stede. Hendes 11-årige søn, Noah Vilum, forsøgte først selv at løfte porten og kunne holde den kortvarigt, men måtte lægge den ned igen.","Han fandt en sækkevogn i en nærliggende lade, fik den ind under porten og løftede den lige længe nok til, at moderen kom fri. Undervejs ringede han til alarmcentralen, sin morfar og sine storebrødre. Hun har brud på nederste lændehvirvel og på begge sider af bækkenet."],"whyItMatters":"En historie om, at det gik godt, fortalt lige så præcist som en om, at det gik galt.","analysis":"Malene Jensen husker kun et glimt af, at hun ramte jorden, og derefter intet, før hun kom til sig selv i ambulancen. Hun var indlagt i 13 dage i Aabenraa og Odense og er fortsat bundet til kørestol og seng det meste af tiden.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/a/e/4/ae4e4fa7-da8a-45bb-b3bd-71bc89b171af?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=MSwwLDExNDUsNjQ0&s=b1e9a4b6316f13d85dce1085666139ab","credit":"Kilde: TV 2 (Foto: Privatfoto)","alt":"TV 2's billede til historien, ifølge mediets egen billedtekst et privatfoto af Malene Jensen og hendes 11-årige søn Noah Vilum.","sourceUrl":"https://nyheder.tv2.dk/samfund/2026-08-15-hun-vaagnede-stolt-i-ambulancen-11-aarig-reddede-sin-mor-fri-under-voldsom-ulykke"},"topics":["Danmark","ulykke","konstruktiv journalistik"],"entities":["Malene Jensen","Noah Vilum","Sydals"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":44,"decisionValue":22,"novelty":72,"sourceQuality":74,"personalRelevance":40,"contrast":70},"claims":[{"text":"Noah Vilum, 11 år, fik en sækkevogn ind under en cirka 400 kilo tung træport og løftede den nok til, at hans mor kom fri.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-08-15-hun-vaagnede-stolt-i-ambulancen-11-aarig-reddede-sin-mor-fri-under-voldsom-ulykke"],"confidence":"high"},{"text":"Malene Jensen fik brud på nederste lændehvirvel og på begge sider af bækkenet og var indlagt i 13 dage.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-08-15-hun-vaagnede-stolt-i-ambulancen-11-aarig-reddede-sin-mor-fri-under-voldsom-ulykke"],"confidence":"high"}],"sources":[{"title":"Hun vågnede stolt i ambulancen: 11-årig reddede sin mor fri under voldsom ulykke","publisher":"TV 2","url":"https://nyheder.tv2.dk/samfund/2026-08-15-hun-vaagnede-stolt-i-ambulancen-11-aarig-reddede-sin-mor-fri-under-voldsom-ulykke","publishedAt":"2026-08-15T20:22:16.000Z","kind":"reporting"}]},{"id":"thomas-2026-08-16-dgc-finalerunde","eventKey":"danish-golf-championship-kerteminde-finalerunde-2026-08","materialFacts":["Jeff Winther er bedste dansker paa sjettepladsen med ti slag under par foer finalerunden","Rasmus Hoejgaard deler syvendepladsen med ni slag under par","Franske Romain Langasque foerer turneringen","Praemiepuljen er steget fra 2,75 til 3 millioner dollar siden sidste aar"],"section":"Sport","headline":"Danskere snuser til toppen før finalerunden i Kerteminde","primarySourceUrl":"https://sport.tv2.dk/golf/2026-08-15-danskere-snuser-til-toppen-foer-finalerunden-i-kerteminde","subheadline":"Jeff Winther og Rasmus Højgaard ligger begge i top-10 ved Danish Golf Championship. Finalerunden spilles i dag.","body":["38-årige Jeff Winther er bedste dansker på sjettepladsen med ti slag under par før søndagens finalerunde ved Danish Golf Championship i Kerteminde. Han lavede lørdag syv birdies og tre bogeys. Franske Romain Langasque fører fire slag foran ham.","Rasmus Højgaard, 25 år, deler syvendepladsen med ni slag under par efter en dobbeltbogey på hul 6 og en eagle på hul 16. Jacob Skov Olesen og Marcus Helligkilde deler 15.-pladsen, mens Lucas Bjerregaard er faldet til 52.-pladsen."],"whyItMatters":"Det er første gang, banen i Kerteminde er ramme om turneringen, og præmiepuljen er steget fra 2,75 til 3 millioner dollar, knap 19,5 millioner kroner, siden sidste år.","analysis":"Danmark har med undtagelse af 2020 været vært for en DP World Tour-turnering siden 2014. Næsten hele den danske elite deltager; kun Nicolai Højgaard mangler, fordi han spiller slutspil på PGA Touren.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/e/e/e/eeeff030-b6ed-49e4-b8f1-2da3c61db472?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=MCw4MzEsODAzOSw0NTI4&s=b686918167a10fed951fad41e89e4bb0","credit":"Kilde: TV 2 (Foto: Frank Cilius, Ritzau Scanpix)","alt":"TV 2's billede til historien om Danish Golf Championship, ifølge mediets billedtekst af Rasmus Højgaard og Jeff Winther, der begge ligger i top-10.","sourceUrl":"https://sport.tv2.dk/golf/2026-08-15-danskere-snuser-til-toppen-foer-finalerunden-i-kerteminde"},"topics":["golf","Danmark","DP World Tour"],"entities":["Jeff Winther","Rasmus Højgaard","Romain Langasque","Danish Golf Championship"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":40,"decisionValue":26,"novelty":62,"sourceQuality":70,"personalRelevance":78,"contrast":34},"claims":[{"text":"Jeff Winther ligger på sjettepladsen med ti slag under par, fire slag efter føreren Romain Langasque.","sourceUrls":["https://sport.tv2.dk/golf/2026-08-15-danskere-snuser-til-toppen-foer-finalerunden-i-kerteminde"],"confidence":"high"},{"text":"Præmiepuljen ved Danish Golf Championship er steget fra 2,75 til 3 millioner dollar siden sidste år.","sourceUrls":["https://sport.tv2.dk/golf/2026-08-15-danskere-snuser-til-toppen-foer-finalerunden-i-kerteminde"],"confidence":"high"}],"sources":[{"title":"Danskere snuser til toppen før finalerunden i Kerteminde","publisher":"TV 2","url":"https://sport.tv2.dk/golf/2026-08-15-danskere-snuser-til-toppen-foer-finalerunden-i-kerteminde","publishedAt":"2026-08-15T15:16:23.000Z","kind":"reporting"}]},{"id":"thomas-2026-08-16-dorgu-united-milan","eventKey":"manchester-united-ac-milan-testkamp-dorgu-2026-08","materialFacts":["Manchester United tabte 2-4 til AC Milan i en traeningskamp i Polen loerdag","Harry Maguire bragte United foran 1-0 efter to minutter, og Samuel Chukwueze udlignede til 1-1","Patrick Dorgu scorede godt fem minutter efter pausen efter en daarlig tilbagelaegning","AC Milans nye cheftraener er Ruben Amorim, der tidligere traente Manchester United"],"section":"Sport","headline":"Dorgu scorer i United-nedtur","primarySourceUrl":"https://sport.tv2.dk/fodbold/2026-08-15-dorgu-scorer-i-united-nedtur","subheadline":"Den 21-årige danske landsholdsspiller scorede efter pausen, men blev skiftet ud efter en time og så holdet tabe 2-4 i Polen.","body":["Patrick Dorgu scorede for Manchester United i lørdagens træningskamp mod AC Milan i Polen. Harry Maguire headede United foran 1-0 efter to minutter, og Samuel Chukwueze udlignede til 1-1 senere i første halvleg. Dorgus scoring kom godt fem minutter efter pausen, da den 21-årige dansker udnyttede en dårlig tilbagelægning i det italienske forsvar.","Dorgu blev skiftet ud efter en time. Derefter kollapsede United, og Alphadjo Cisse, Gonçalo Ramos og Ruben Loftus-Cheek sørgede for Milans sejr på 4-2. Kampen var et gensyn mellem Milans nye cheftræner, Ruben Amorim, og hans tidligere klub."],"whyItMatters":"Dorgu er den danske spiller tættest på en fast plads i den engelske storklubs hold, og en optaktskamp er stedet, hvor den slags afgøres inden sæsonstart.","analysis":"Amorim mødte som Milan-træner sin tidligere klub, og hans nye hold vendte kampen. For United er de tre mål efter Dorgus scoring det, der bliver hængende.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/2/d/a/2da1964a-19e6-4964-b0fc-632fbe03bedf?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=NjAwLDYyLDIwMDAsMTEyNA&s=42a20ec2ce2462a1c82fe27f2ee70a95","credit":"Kilde: TV 2 (Foto: Cathal Mcnaughton, Ritzau Scanpix)","alt":"TV 2's billede til historien, ifølge mediets billedtekst af Patrick Dorgu, der scorede forgæves for Manchester United i testkampen.","sourceUrl":"https://sport.tv2.dk/fodbold/2026-08-15-dorgu-scorer-i-united-nedtur"},"topics":["fodbold","Manchester United","Danmark"],"entities":["Patrick Dorgu","Manchester United","AC Milan","Ruben Amorim"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":36,"decisionValue":18,"novelty":58,"sourceQuality":68,"personalRelevance":80,"contrast":30},"claims":[{"text":"Patrick Dorgu scorede godt fem minutter efter pausen, og Manchester United tabte 2-4 til AC Milan i en træningskamp i Polen.","sourceUrls":["https://sport.tv2.dk/fodbold/2026-08-15-dorgu-scorer-i-united-nedtur"],"confidence":"high"},{"text":"Harry Maguire scorede til 1-0 efter to minutter, og Samuel Chukwueze udlignede til 1-1 i første halvleg.","sourceUrls":["https://sport.tv2.dk/fodbold/2026-08-15-dorgu-scorer-i-united-nedtur"],"confidence":"high"},{"text":"AC Milans nye cheftræner Ruben Amorim mødte sin tidligere klub Manchester United.","sourceUrls":["https://sport.tv2.dk/fodbold/2026-08-15-dorgu-scorer-i-united-nedtur"],"confidence":"high"}],"sources":[{"title":"Dorgu scorer i United-nedtur","publisher":"TV 2","url":"https://sport.tv2.dk/fodbold/2026-08-15-dorgu-scorer-i-united-nedtur","publishedAt":"2026-08-15T17:31:48.000Z","kind":"reporting"}]},{"id":"thomas-2026-08-16-riksbanken-renovering","eventKey":"riksbanken-brunkebergstorg-renovering-billeder-2026-08","materialFacts":["Riksbankens lokaler paa Brunkebergstorg i Stockholm skal renoveres for 3,3 milliarder svenske kroner","De foerste billeder af de renoverede lokaler er nu offentliggjort","Ifoelge Svenska Dagbladet er beloebet naesten tre gange hoejere end renoveringen af Sveriges nationalmuseum","Riksbanken har haft til huse i den fredede bygning i 50 aar, og der er ikke renoveret gennemgribende siden 1976"],"section":"Nordisk oekonomi","headline":"Sveriges sentralbank skal pusses opp for 3,3 milliarder","primarySourceUrl":"https://e24.no/internasjonal-oekonomi/i/k0BQkQ/sveriges-sentralbank-skal-pusses-opp-for-3-3-milliarder","subheadline":"De første billeder af Riksbankens renovering er offentliggjort. Marmorgarderobe og dampbad har udløst kritik på bankens egne sociale medier.","body":["Sveriges Riksbank skal renovere sine lokaler på Brunkebergstorg i Stockholm for 3,3 milliarder svenske kroner. Prisen blev kendt før sommeren; det nye er, at de første billeder af de renoverede lokaler er lagt ud. Ifølge Svenska Dagbladet er beløbet næsten tre gange højere end renoveringen af Sveriges nationalmuseum.","Billeder af en marmorbeklædt garderobe med dampbad har udløst kritik på bankens Instagram- og Facebook-sider, hvor brugere peger på behovet for lærere og sygeplejersker. Andre forsvarer projektet med, at bygningen er fredet."],"whyItMatters":"En centralbank, der bruger 3,3 milliarder på sit eget hus, bruger også af sin autoritet over for et publikum, der samtidig hører om mangel på lærere.","analysis":"Riksbanken afviser at have hævet standarden og siger, at den blot er opretholdt. Banken har haft til huse i bygningen i 50 år, og der er ikke renoveret større siden 1976. Beløbet er et første estimat.","image":{"url":"https://akamai.vgc.no/v2/images/54d156da-4164-3142-8dd7-8fbc58c7178a?format=auto&w=1080&s=fcf8ce0335c20829ddcaa5845c1c175abc2c815f","credit":"Foto: Bob Strong, Reuters/NTB, via E24","alt":"E24's billede af Riksbankens bygning på Brunkebergstorg 11 i Stockholm: en mørk stenfacade set nedefra gennem bladløse træer med lyskæder. Arkivfoto taget om vinteren.","sourceUrl":"https://e24.no/internasjonal-oekonomi/i/k0BQkQ/sveriges-sentralbank-skal-pusses-opp-for-3-3-milliarder"},"topics":["Sverige","centralbank","offentlige udgifter"],"entities":["Riksbanken","Brunkebergstorg","Svenska Dagbladet"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":48,"decisionValue":30,"novelty":66,"sourceQuality":70,"personalRelevance":52,"contrast":62},"claims":[{"text":"Riksbankens lokaler på Brunkebergstorg i Stockholm skal renoveres for 3,3 milliarder svenske kroner.","sourceUrls":["https://e24.no/internasjonal-oekonomi/i/k0BQkQ/sveriges-sentralbank-skal-pusses-opp-for-3-3-milliarder"],"confidence":"high"},{"text":"Ifølge Svenska Dagbladet er prisen næsten tre gange højere end renoveringen af Sveriges nationalmuseum.","sourceUrls":["https://e24.no/internasjonal-oekonomi/i/k0BQkQ/sveriges-sentralbank-skal-pusses-opp-for-3-3-milliarder"],"confidence":"high"},{"text":"Riksbanken har haft til huse i den fredede bygning i 50 år, og der er ikke foretaget større renoveringer siden 1976.","sourceUrls":["https://e24.no/internasjonal-oekonomi/i/k0BQkQ/sveriges-sentralbank-skal-pusses-opp-for-3-3-milliarder"],"confidence":"high"}],"sources":[{"title":"Sveriges sentralbank skal pusses opp for 3,3 milliarder","publisher":"E24","url":"https://e24.no/internasjonal-oekonomi/i/k0BQkQ/sveriges-sentralbank-skal-pusses-opp-for-3-3-milliarder","publishedAt":"2026-08-15T10:29:04.000Z","kind":"reporting"}]}],"signals":[{"headline":"Højrefløjen angriber høje energipriser overalt. Deres nye våben kan ryste Europas klimapolitik","url":"https://www.altinget.dk/artikel/energipriser-er-hoejrefloejens-nye-slagnummer-det-foerer-nu-til-opgoer-med-baerende-soejle-i-europas-klimapolitik","publisher":"Altinget","section":"EU og klimapolitik","publishedAt":"2026-08-16T00:00:00.000Z","summary":"Altingets EU-korrespondent Peter Ingemann Nielsen skriver, at en reform af EU's vigtigste klimaværktøj markerer kulminationen på højrefløjens felttog mod dyr grøn regulering, og at alle øjne i Europa-Parlamentet hviler på én gruppe. Artiklen er bag betalingsmur; kun rubrik og manchet er læst her.","text":"Højrefløjen angriber høje energipriser overalt. Deres nye våben kan ryste Europas klimapolitik"},{"headline":"Efter afpresningsforsøg: Hackere frigiver store mængder hemmelig Novo Nordisk-data - lægger alt gratis ud","url":"https://www.computerworld.dk/art/296511/efter-afpresningsforsoeg-hackere-frigiver-store-maengder-hemmelig-novo-nordisk-data-laegger-alt-gratis-ud","publisher":"Computerworld","section":"Cybersikkerhed","publishedAt":"2026-08-14T11:45:00.000Z","summary":"En hackergruppe har efter et afpresningsforsøg offentliggjort stjålne data fra Novo Nordisk og hævder ifølge Computerworld at have 30 modeller, 70 datasæt og et halvt terabyte mikroskopibilleder fra selskabets egen laboratorieplatform. Artiklens brødtekst er bag Premium-mur; kun manchetten er læst her.","text":"Efter afpresningsforsøg: Hackere frigiver store mængder hemmelig Novo Nordisk-data - lægger alt gratis ud"},{"headline":"Flere evakueret som følge af rekordstor naturbrand i Belgien","url":"https://www.dr.dk/nyheder/udland/eu/flere-evakueret-som-foelge-af-rekordstor-naturbrand-i-belgien","publisher":"DR Nyheder","section":"Klima og beredskab","publishedAt":"2026-08-16T00:39:18.000Z","summary":"Den belgiske naturbrand havde sent lørdag aften bredt sig til mere end 2.700 hektar og er landets største i nyere tid. Flere er evakueret, og EU sendte lørdag tre helikoptere og to brandslukningsfly efter anmodning fra Belgien.","text":"Flere evakueret som følge af rekordstor naturbrand i Belgien"},{"headline":"Briter mødes med sms-advarsler og forbud mod køb af engangsgrill","url":"https://www.dr.dk/nyheder/udland/briter-moedes-med-sms-advarsler-og-forbud-mod-koeb-af-engangsgrill","publisher":"DR Nyheder","section":"Klima og beredskab","publishedAt":"2026-08-15T08:03:31.000Z","summary":"Britiske myndigheder frygter flere skovbrande i et knastørt landskab og tager sms-advarsler og forbud mod salg af engangsgrill i brug.","text":"Briter mødes med sms-advarsler og forbud mod køb af engangsgrill"},{"headline":"Kameraer får bilister til at stoppe ved jernbaneoverkørsler","url":"https://www.dr.dk/nyheder/indland/kameraer-faar-bilister-til-stoppe-ved-jernbaneoverkoersler","publisher":"DR Nyheder","section":"Infrastruktur","publishedAt":"2026-08-15T14:30:00.000Z","summary":"Efter opsætning af kameraer ved seks jernbaneoverkørsler i Sønderjylland stopper bilisterne nu, når klokkerne ringer og varselssignalerne blinker.","text":"Kameraer får bilister til at stoppe ved jernbaneoverkørsler"},{"headline":"Togulykke kostede 60-årig kvinde livet, men et år efter er der stadig ikke svar på, hvad der skete","url":"https://www.dr.dk/nyheder/indland/togulykke-kostede-60-aarig-kvinde-livet-men-et-aar-efter-er-der-stadig-ikke-svar-paa-hvad-der-skete","publisher":"DR Nyheder","section":"Infrastruktur","publishedAt":"2026-08-15T08:00:00.000Z","summary":"For præcis et år siden mistede en kvinde livet, og to personer kom alvorligt til skade, da et tog ramte en gylletransport i Sønderjylland. Årsagen er stadig ikke fastslået.","text":"Togulykke kostede 60-årig kvinde livet, men et år efter er der stadig ikke svar på, hvad der skete"},{"headline":"I 15 annoncer sælger ung kvinde tøj identisk med varer fra Shein som vintage. Og hun er ikke den eneste","url":"https://www.dr.dk/nyheder/indland/i-15-annoncer-saelger-ung-kvinde-toej-identisk-med-varer-fra-shein-som-vintage-og-hun-er-ikke-den","publisher":"DR Nyheder","section":"Forbrug og handel","publishedAt":"2026-08-15T09:20:00.000Z","summary":"En bruger har 15 stykker tøj til salg som vintage, der ifølge DR ser ud til at være identisk med varer fra kinesiske Shein, og tager sig godt betalt for dem. Hun er ikke den eneste.","text":"I 15 annoncer sælger ung kvinde tøj identisk med varer fra Shein som vintage. Og hun er ikke den eneste"},{"headline":"Partier forstår ikke ti timers tavshed om ulvenedskydning","url":"https://nyheder.tv2.dk/politik/2026-08-15-partier-forstaar-ikke-ti-timers-tavshed-om-ulvenedskydning","publisher":"TV 2","section":"Dansk politik","publishedAt":"2026-08-15T11:35:34.000Z","summary":"En medarbejder fra Naturstyrelsen skød torsdag klokken 21.48 en såkaldt problemulv i Vestjylland. Flere partier kritiserer, at der gik ti timer, før det blev meldt ud.","text":"Partier forstår ikke ti timers tavshed om ulvenedskydning"},{"headline":"Laudrup-Dufour henter sin tredje VM-medalje","url":"https://sport.tv2.dk/ridning/2026-08-15-laudrup-dufour-henter-sin-tredje-vm-medalje","publisher":"TV 2","section":"Sport","publishedAt":"2026-08-15T20:52:08.000Z","summary":"Cathrine Laudrup-Dufour fik sin tredje medalje ved dette VM i dressur, da hun sluttede bag en brite i Grand Prix Freestyle.","text":"Laudrup-Dufour henter sin tredje VM-medalje"},{"headline":"I S arbejder topprofiler på en ny strategi. Her er de foreløbige hovedpunkter","url":"https://www.altinget.dk/artikel/med-disse-tre-fokusomraader-vil-socialdemokratiet-bevare-en-selvstaendig-politisk-profil","publisher":"Altinget","section":"Dansk politik","publishedAt":"2026-08-16T00:00:00.000Z","summary":"Kommentator Lars Olsen skriver i Altinget, at flere markante socialdemokrater arbejder på et politisk projekt, der skal overbevise vælgerne om, at partiet stadig arbejder for jævne danskeres interesser. Hverken Mattias Tesfaye eller Kaare Dybvad fik ministerpost denne gang, og begge er dybt involveret. Artiklen er bag betalingsmur; kun rubrik og manchet er læst her.","text":"I S arbejder topprofiler på en ny strategi. Her er de foreløbige hovedpunkter"},{"headline":"Frygt for stigende intolerance over for homoseksuelle: Minister vil have nye tal om muslimer","url":"https://www.dr.dk/nyheder/politik/frygt-stigende-intolerance-over-homoseksuelle-minister-vil-have-nye-tal-om-muslimer","publisher":"DR Nyheder","section":"Dansk politik","publishedAt":"2026-08-15T14:46:19.000Z","summary":"En minister vil have nye tal om holdninger blandt muslimer i Danmark på grund af frygt for stigende intolerance over for homoseksuelle.","text":"Frygt for stigende intolerance over for homoseksuelle: Minister vil have nye tal om muslimer"}],"column":{"authoredBy":"ai","slug":"det-der-ikke-blev-skrevet-i-dag","title":"Datoen på en nyhed er ikke datoen på begivenheden","thesis":"En nyhedsstrøm daterer artikler, ikke hændelser. Forskellen er lille de fleste dage og afgørende de dage, hvor den ikke er.","body":["Denne udgave skulle have haft en anden tophistorie. Økonomisk Ugebrev bragte i går en artikel om, at Saxo Banks stifter Kim Fournais træder tilbage som topchef efter J. Safra Sarasin Groups overtagelse. Alt i den var rigtigt. Kun tidspunktet var det ikke: Saxo Bank har på sit eget pressesite en meddelelse om præcis den beslutning, og billedet i artiklen ligger i et arkiv fra marts 2026.","Det er ikke svindel, og det er ikke sjældent. Et medie kan genudsende eller referere en ældre sag, og feedets dato følger udsendelsen, ikke begivenheden. En læser, der kun ser rubrik og dato, får en korrekt sætning præsenteret som en ny oplysning. Den eneste pålidelige kontrol er at gå til den, der handlede: selskabet, myndigheden, retten."],"uncertainty":"Kontrollen koster tid og fanger ikke alt. Den fanger den slags fejl, hvor hver sætning kan forsvares, og helheden alligevel er misvisende.","topics":["kildekritik","nyhedsstrøm","medier"],"claims":[{"text":"Saxo Bank har på sit eget pressesite en meddelelse med titlen \"J. Safra Sarasin Group completes the acquisition of majority stake in Saxo Bank\", hvoraf det fremgår, at Kim Fournais træder tilbage som CEO og bliver bestyrelsesformand, og at Daniel Belfer bliver ny CEO.","sourceUrls":["https://www.home.saxo/content/commentari           utterance.onend = () => {
            playing = false;
            api.onstatechange?.("stopped");
          };
        }
        synth.speak(utterance);
      }
      playing = true;
      api.onstatechange?.("playing");
    };
    const api = {
      onstatechange: null,
      play() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
          return;
        }
        speakFrom(0);
      },
      pause() {
        if (synth.speaking && !synth.paused) {
          synth.pause();
          playing = false;
          api.onstatechange?.("paused");
        }
      },
      resume() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
        }
      },
      toggle() {
        if (synth.speaking && !synth.paused) {
          api.pause();
        } else if (synth.paused) {
          api.resume();
        } else {
          speakFrom(0);
        }
      },
      stop() {
        synth.cancel();
        index = 0;
        playing = false;
        api.onstatechange?.("stopped");
      },
      get isPlaying() {
        return playing;
      }
    };
    return api;
  }
  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {
      slot.hidden = true;
      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";
      toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";
      toggleButton.setAttribute("aria-pressed", String(active));
      stopButton.disabled = state === "stopped";
    };
    toggleButton.addEventListener("click", () => narrator.toggle());
    stopButton.addEventListener("click", () => narrator.stop());
    globalThis.addEventListener?.("beforeunload", () => narrator.stop());
    slot.replaceChildren(toggleButton, stopButton);
    return narrator;
  }
  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }
    bindEditionNav("archive");
    bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
</html>
