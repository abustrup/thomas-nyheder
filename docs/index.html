<!doctype html>
<html lang="da" data-chrome="minimal" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Thomas' Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),

.media-fallback-label {

.story-eyebrow {

.story-byline,

.story-headline {

.headline-link { text-decoration: none; }

.story-subheadline {

.story-card .story-subheadline {

.story-body,

.story-body p,

.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {

  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);

}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {

  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 90ms ease;
  /* Suppress the grey flash iOS paints over a tapped button, which otherwise
     competes with the :active state below, and remove the 300ms tap delay. */
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}
/* A tap must feel like a press. :hover and :focus-visible never fire on a touch
   tap, so before this the chip was visually inert on a phone and the reader had
   no way to tell the click had registered. :active gives the immediate press,
   .is-selected gives the lasting answer, matching .feedback-button above. */
.reason-chip:active {
  background: color-mix(in srgb, var(--ink) 12%, transparent);
  transform: scale(0.96);
}
.reason-chip.is-selected {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.reason-chip.is-selected:hover,
.reason-chip.is-selected:focus-visible {
  background: color-mix(in srgb, var(--ink) 86%, var(--paper));
}
@media (prefers-reduced-motion: reduce) {
  .reason-chip { transition: none; }
  .reason-chip:active { transform: none; }
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

/* A reader with only a daily edition gets no bar at all: three of the five
   edition links would 404, and the "Vis som" switcher is a question nobody
   asked. Keyed off <html data-chrome>, stamped at render time from the profile,
   so the bar is gone before first paint rather than flashing in and vanishing
   once the module boots. The bindings are skipped too (see bindEditionNav), so
   the links are absent from the DOM rather than merely invisible. */
:root[data-chrome="minimal"] .top-bar {
  display: none;
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {

inger arbejdsgiveren til bordet. Her holdt en amerikansk arbejdsgiver stand i tre år og betalte sig så ud af konflikten.","analysis":"Arbejdsmarkedsforsker Laust Høgedahl fra Aalborg Universitet siger til DR, at han ikke har set noget lignende udfald. Blev der først slået hul på Tesla i Sverige, kunne man ifølge ham forestille sig, at andre lande ville få blod på tanden.","counterpoint":"Teslas kommunikationsansvarlige i Sverige, Maria Lantz, skriver til TT, at selskabets aftaler med de ansatte er \"ligeværdige eller bedre end dem, der er omfattet af en overenskomst\".","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/6/1/7/6172e1de-e640-4f24-9e4c-53889698fd29?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=MCwwLDYxOTIsMzQ4OQ&s=aab7dcb7539aa0e332692386606f3afa","credit":"Kilde: TV 2 (Foto: Tt News Agency / Ritzau Scanpix)","alt":"TV 2's billede til historien: en strejkevagt holder øje med Teslas servicecenter i svenske Segeltorp.","sourceUrl":"https://nyheder.tv2.dk/udland/2026-08-13-tesla-koeber-strejkende-ud-ikke-set-lignende-i-100-aar"},"topics":["arbejdsmarked","overenskomst","den nordiske model","Sverige","Tesla"],"entities":["Tesla","IF Metall","Landsorganisationen i Sverige","Veli-Pekka Säikkälä","Laust Høgedahl","Maria Lantz","Sverige"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":76,"novelty":88,"sourceQuality":82,"personalRelevance":86,"contrast":74},"claims":[{"text":"Tesla har betalt omkring 80 strejkende medarbejdere for at afslutte deres ansættelse hos selskabet i Sverige.","sourceUrls":["https://nyheder.tv2.dk/udland/2026-08-13-tesla-koeber-strejkende-ud-ikke-set-lignende-i-100-aar"],"confidence":"high"},{"text":"Veli-Pekka Säikkälä fra Landsorganisationen i Sverige siger, at sådanne metoder ikke er set i Sverige i næsten 100 år.","sourceUrls":["https://nyheder.tv2.dk/udland/2026-08-13-tesla-koeber-strejkende-ud-ikke-set-lignende-i-100-aar"],"confidence":"high"},{"text":"IF Metall indledte strejken mod Tesla i oktober 2023, efter at overenskomstforhandlinger var brudt sammen.","sourceUrls":["https://www.dr.dk/nyheder/penge/arbejdsmarkedsforsker-om-teslas-nedlukning-af-strejke-ikke-set-foer"],"confidence":"high"},{"text":"Alle strejketiltag mod Teslas svenske selskab slutter fra og med onsdag den 19. august.","sourceUrls":["https://nyheder.tv2.dk/udland/2026-08-13-tesla-koeber-strejkende-ud-ikke-set-lignende-i-100-aar"],"confidence":"high"},{"text":"Arbejdsmarkedsforsker Laust Høgedahl fra Aalborg Universitet siger, at han ikke har set noget lignende udfald på en arbejdskonflikt.","sourceUrls":["https://www.dr.dk/nyheder/penge/arbejdsmarkedsforsker-om-teslas-nedlukning-af-strejke-ikke-set-foer"],"confidence":"high"}],"sources":[{"title":"Tesla køber strejkende ud – ikke set lignende i 100 år","publisher":"TV 2","url":"https://nyheder.tv2.dk/udland/2026-08-13-tesla-koeber-strejkende-ud-ikke-set-lignende-i-100-aar","publishedAt":"2026-08-13T16:22:07.000Z","kind":"reporting"},{"title":"Arbejdsmarkedsforsker om Teslas nedlukning af strejke: 'Ikke set før'","publisher":"DR Nyheder","url":"https://www.dr.dk/nyheder/penge/arbejdsmarkedsforsker-om-teslas-nedlukning-af-strejke-ikke-set-foer","publishedAt":"2026-08-13T16:49:45.000Z","kind":"reporting"}]},{"id":"thomas-2026-08-14-maersk-q2","eventKey":"maersk-q2-2026-opjustering-fragtmaengder","materialFacts":["Overskuddet mere end fordoblet til 1,3 mia. dollar i andet kvartal 2026","Omsaetningen paa naesten 15,8 mia. dollar, 20 procent mere end aaret foer","Forventningen til driftsresultat hoejnet til 10,5-12,5 mia. dollar fra 8-10","Opjusteringen bygger paa en forventet vaekst i globale fragtmaengder paa fire procent i 2026"],"section":"Eksport og verdenshandel","headline":"Mærsk fordobler milliardoverskud","primarySourceUrl":"https://www.dr.dk/nyheder/penge/maersk-fordobler-sit-milliardoverskud","subheadline":"Regnskabet er interessant for ét tal: Mærsk regner nu med, at de globale fragtmængder vokser fire procent i år.","body":["A.P. Møller - Mærsk mere end fordoblede sit overskud til 1,3 milliarder dollar i andet kvartal, svarende til 8,5 milliarder kroner. Omsætningen landede på næsten 15,8 milliarder dollar, 20 procent mere end året før, og væksten var især drevet af søfartsdivisionen Ocean.","Forventningen til hele 2026 hæves: et underliggende driftsresultat før af- og nedskrivninger på 10,5 til 12,5 milliarder dollar mod tidligere otte til ti. Opjusteringen bygger på en forventning om fire procents vækst i de globale fragtmængder."],"whyItMatters":"Mængdeforventningen er den mest direkte aflæsning af, om verdenshandlen stadig vokser i volumen. Fire procent siger, at Mærsk indtil videre mener, den gør.","analysis":"Vincent Clerc kalder kvartalet \"endnu et tydeligt bevis på, at vi befinder os i en ny virkelighed præget af markant højere volatilitet\". Første kvartal gav tilbagegang i både omsætning og overskud, drevet af netop Ocean.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/n50aqlva/20260630-125802-l_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR Nyheder (Foto: Martin Bernetti, AFP/Ritzau Scanpix)","alt":"DR's billede til historien om A.P. Møller - Mærsks regnskab for andet kvartal 2026.","sourceUrl":"https://www.dr.dk/nyheder/penge/maersk-fordobler-sit-milliardoverskud"},"topics":["søfart","verdenshandel","regnskab","told","Danmark"],"entities":["A.P. Møller - Mærsk","Vincent Clerc","Ocean","Danmark"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":86,"decisionValue":80,"novelty":62,"sourceQuality":84,"personalRelevance":90,"contrast":58},"claims":[{"text":"Mærsk mere end fordoblede sit overskud til 1,3 milliarder dollar i andet kvartal 2026, svarende til 8,5 milliarder kroner.","sourceUrls":["https://www.dr.dk/nyheder/penge/maersk-fordobler-sit-milliardoverskud"],"confidence":"high"},{"text":"Omsætningen landede på næsten 15,8 milliarder dollar, 20 procent mere end i samme periode sidste år.","sourceUrls":["https://www.dr.dk/nyheder/penge/maersk-fordobler-sit-milliardoverskud"],"confidence":"high"},{"text":"Forventningen til underliggende driftsresultat før af- og nedskrivninger er hævet til 10,5-12,5 milliarder dollar fra tidligere otte til ti milliarder.","sourceUrls":["https://www.dr.dk/nyheder/penge/maersk-fordobler-sit-milliardoverskud"],"confidence":"high"},{"text":"Opjusteringen baserer sig på en forventning om, at de globale fragtmængder vokser sammenlagt fire procent i 2026.","sourceUrls":["https://www.dr.dk/nyheder/penge/maersk-fordobler-sit-milliardoverskud"],"confidence":"high"}],"sources":[{"title":"Mærsk fordobler milliardoverskud","publisher":"DR Nyheder","url":"https://www.dr.dk/nyheder/penge/maersk-fordobler-sit-milliardoverskud","publishedAt":"2026-08-13T06:05:02.000Z","kind":"reporting"}]},{"id":"thomas-2026-08-14-pfa-al-sydbank","eventKey":"al-sydbank-firmapensionsudbud-pfa-velliv-danica-2026-08","materialFacts":["PFA, Danica og Velliv skal inden for faa uger byde paa firmapensionen for 4.000 medarbejdere i AL Sydbank","I dag har PFA 45 pct., Velliv 45 pct. og AP Pension 10 pct. af pensionerne fra Sydbank, Vestjysk Bank og Arbejdernes Landsbank","PFA vandt foer sommerferien aftalen om kundernes pensioner i AL Sydbank via Letpension","AP Pension trak sig kort efter fra udbuddet af medarbejdernes pensioner"],"section":"Kapitalforvaltning","headline":"Spektakulært firmapensionsudbud kan koste PFA Pension dyrt","primarySourceUrl":"https://ugebrev.dk/finans/spektakulaert-firmapensionsudbud-kan-koste-pfa-pension-dyrt/","subheadline":"En af landets største firmapensionsaftaler skal i udbud. Økonomisk Ugebrev beskriver et magtspil, hvor den oplagte vinder kan blive den økonomiske taber.","body":["PFA, Danica og Velliv skal inden for få uger give deres første bud på firmapensionen for 4.000 højtlønnede medarbejdere i AL Sydbank. Af de samlede pensioner fra Sydbank, Vestjysk Bank og Arbejdernes Landsbank sidder PFA i dag på 45 procent, Velliv på 45 procent og AP Pension på de sidste ti.","Før sommerferien vandt PFA aftalen om kundernes pensioner i AL Sydbank gennem Letpension. AP Pension og Nærpension tabte. Kort efter trak AP Pension sig offentligt fra udbuddet af medarbejdernes pensioner."],"whyItMatters":"Store firmapensioner følger ofte bankforbindelsen frem for udbuddet. Ugebrevet nævner Mærsk og Danske Bank tæt på Danica, Novo Nordisk på PFA og Nordea på Velliv.","analysis":"Fagredaktør Carsten Vitoft beskriver et magtspil med fordækte kort. PFA ser på papiret ud som den oplagte vinder, men bag kulisserne er der lagt op til et rænkespil, hvor selskabet let kan ende som økonomisk taber.","image":{"url":"https://ugebrev.dk/wp-content/uploads/2025/05/PFAs-Ole-Krogh-Petersen.jpg","credit":"Kilde: Økonomisk Ugebrev","alt":"Økonomisk Ugebrevs billede til analysen, med sidens egen billedtekst: PFA's Ole Krogh Petersen.","sourceUrl":"https://ugebrev.dk/finans/spektakulaert-firmapensionsudbud-kan-koste-pfa-pension-dyrt/"},"topics":["pension","udbud","finanssektoren","Danmark"],"entities":["PFA Pension","Danica","Velliv","AP Pension","AL Sydbank","Arbejdernes Landsbank","Vestjysk Bank","Letpension","Carsten Vitoft","Nærpension"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":72,"decisionValue":78,"novelty":84,"sourceQuality":80,"personalRelevance":82,"contrast":66},"claims":[{"text":"PFA, Danica og Velliv skal inden for få uger give deres første bud på firmapensionen for 4.000 højtlønnede medarbejdere i AL Sydbank.","sourceUrls":["https://ugebrev.dk/finans/spektakulaert-firmapensionsudbud-kan-koste-pfa-pension-dyrt/"],"confidence":"high"},{"text":"Af de samlede pensioner fra Sydbank, Vestjysk Bank og Arbejdernes Landsbank sidder PFA på 45 pct., Velliv på 45 pct. og AP Pension på ti pct.","sourceUrls":["https://ugebrev.dk/finans/spektakulaert-firmapensionsudbud-kan-koste-pfa-pension-dyrt/"],"confidence":"high"},{"text":"PFA vandt før sommerferien aftalen om kundernes pensioner i AL Sydbank via samarbejdet med Letpension, hvor AP Pension og Nærpension tabte.","sourceUrls":["https://ugebrev.dk/finans/spektakulaert-firmapensionsudbud-kan-koste-pfa-pension-dyrt/"],"confidence":"high"},{"text":"AP Pension trak sig kort efter offentligt fra udbuddet af medarbejdernes pensioner.","sourceUrls":["https://ugebrev.dk/finans/spektakulaert-firmapensionsudbud-kan-koste-pfa-pension-dyrt/"],"confidence":"high"}],"sources":[{"title":"Spektakulært firmapensionsudbud kan koste PFA Pension dyrt","publisher":"Økonomisk Ugebrev","url":"https://ugebrev.dk/finans/spektakulaert-firmapensionsudbud-kan-koste-pfa-pension-dyrt/","publishedAt":"2026-08-13T09:55:03.000Z","kind":"analysis"}]},{"id":"thomas-2026-08-14-coloplast-comeback","eventKey":"coloplast-governance-krise-comeback-2026-08","materialFacts":["Coloplast-aktien er faldet 45 pct. over de seneste to aar","Governance-krisen fulgte af, at bestyrelsesformand Lars Rasmussen indsatte sig selv som midlertidig direktoer","Niels B. Christiansen er ny formand og Gavin Wood ny adm. direktoer","Det islandske opkoeb Kerecis er ramt af aendrede amerikanske Medicare-tilskudsregler"],"section":"Selskabsledelse","headline":"Sådan overvandt Coloplast sin største krise","primarySourceUrl":"https://ugebrev.dk/formue/saadan-overvandt-coloplast-sin-stoerste-krise-2/","subheadline":"En udrensning i toppen og et sundt halvårsregnskab. Aktieanalytiker Carsten Dehn ser på, om medico-selskabet er på vej tilbage.","body":["Coloplasts status som stabil defensiv havn blev rystet af en governance-krise, efter at bestyrelsesformand Lars Rasmussen indsatte sig selv som midlertidig direktør. Aktien er faldet 45 procent over to år. Ledelsen er skiftet ud: LEGO-direktøren Niels B. Christiansen som formand, Gavin Wood som adm. direktør.","Wood er sårplejeekspert og har ifølge Ugebrevet haft det globale ansvar for sårplejekategorier hos blandt andet Mölnlycke. Det peger mod det islandske opkøb Kerecis, hvor det ambulante marked i USA genopretter sig langsomt efter ændrede Medicare-regler."],"whyItMatters":"To ting presser samtidig: amerikansk refusionsregulering og kinesiske konkurrenter på stomimarkedet. Den dobbelteksponering deler dansk medico.","analysis":"Kerecis er nedskrevet med 3 mia. kr., og vækstforventningen er sat ned fra 7 til 5-6 procent. Analysens pointe er alligevel, at maskinrummet viste operationel modstandskraft gennem krisen.","image":{"url":"https://ugebrev.dk/wp-content/uploads/2026/04/Ny-CEO-hos-Coloplast-–-Gavin-Wood.png","credit":"Kilde: Økonomisk Ugebrev","alt":"Økonomisk Ugebrevs billede til analysen om Coloplast: et portræt af en mand i jakkesæt ved siden af Coloplasts logo.","sourceUrl":"https://ugebrev.dk/formue/saadan-overvandt-coloplast-sin-stoerste-krise-2/"},"topics":["medico","selskabsledelse","Kina","USA","Danmark"],"entities":["Coloplast","Lars Rasmussen","Niels B. Christiansen","Gavin Wood","Kerecis","Mölnlycke","Carsten Dehn","Medicare"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":70,"decisionValue":72,"novelty":74,"sourceQuality":78,"personalRelevance":80,"contrast":64},"claims":[{"text":"Coloplast-aktien er faldet 45 procent over de seneste to år.","sourceUrls":["https://ugebrev.dk/formue/saadan-overvandt-coloplast-sin-stoerste-krise-2/"],"confidence":"high"},{"text":"Bestyrelsesformand Lars Rasmussen indsatte sig selv som midlertidig direktør, hvilket udløste stærk kritik.","sourceUrls":["https://ugebrev.dk/formue/saadan-overvandt-coloplast-sin-stoerste-krise-2/"],"confidence":"high"},{"text":"LEGO-direktør Niels B. Christiansen er ny bestyrelsesformand og Gavin Wood ny adm. direktør.","sourceUrls":["https://ugebrev.dk/formue/saadan-overvandt-coloplast-sin-stoerste-krise-2/"],"confidence":"high"},{"text":"Gavin Wood har tidligere haft det globale ansvar for sårplejekategorier hos blandt andet Mölnlycke.","sourceUrls":["https://ugebrev.dk/formue/saadan-overvandt-coloplast-sin-stoerste-krise-2/"],"confidence":"high"},{"text":"Coloplast vil ikke gå ind i en priskrig på det kinesiske stomimarked, men fastholder sin premiumpositionering.","sourceUrls":["https://ugebrev.dk/formue/saadan-overvandt-coloplast-sin-stoerste-krise-2/"],"confidence":"high"},{"text":"Den organiske vækstforventning blev nedjusteret fra 7 pct. til 5-6 pct., og nedjusteringen indeholdt en nedskrivning på 3 mia. kr. relateret til Kerecis.","sourceUrls":["https://ugebrev.dk/formue/saadan-overvandt-coloplast-sin-stoerste-krise-2/"],"confidence":"high"}],"sources":[{"title":"Sådan overvandt Coloplast sin største krise","publisher":"Økonomisk Ugebrev","url":"https://ugebrev.dk/formue/saadan-overvandt-coloplast-sin-stoerste-krise-2/","publishedAt":"2026-08-13T09:40:05.000Z","kind":"analysis"}]},{"id":"thomas-2026-08-14-boligpriser-juli","eventKey":"boligsiden-juli-2026-koebenhavn-stagnation-aarhus","materialFacts":["Huspriserne paa landsplan er steget 9,6 pct. paa et aar, lejligheder knap 18 pct.","Priserne er stagneret i Koebenhavn og Frederiksberg kommuner","Udbuddet af lejligheder i Koebenhavn er vokset 70 pct. paa et aar","Det aarhusianske lejlighedsmarked stiger kraftigt"],"section":"Dansk økonomi","headline":"Priserne på danske boliger stiger stadig – i København er festen forbi","primarySourceUrl":"https://nyheder.tv2.dk/business/2026-08-13-priserne-paa-danske-boliger-stiger-stadig-i-koebenhavn-er-festen-forbi","subheadline":"Nye tal for juli fra Boligsiden: huspriserne op 9,6 procent på et år, men hovedstaden er gået i stå, mens Aarhus tager over.","body":["Over det seneste år er huspriserne på landsplan steget 9,6 procent, mens lejligheder er steget knap 18 procent. Ifølge Boligsiden er huspriserne højere end for et år siden i samtlige landsdele. Men i København og Frederiksberg er priserne nu stagneret.","En mulig forklaring er udbuddet: antallet af lejligheder til salg i hovedstaden er vokset 70 procent på et år, hvilket ifølge TV 2 lægger låg på prisstigningerne. I Aarhus er udbuddet omvendt lavt nu."],"whyItMatters":"Boligmarkedet er den mest følsomme aflæsning af dansk husholdningsøkonomi. At stigningen flytter fra København til Aarhus handler om udbud, ikke om svækket efterspørgsel.","analysis":"Boligøkonom Lise Nytoft Bergmann peger på stærk dansk økonomi og høj jobvækst, hvor beskæftigelsen nærmest sætter rekord måned efter måned. Men lønchecks er ikke eksploderet, og hendes bud er, at når den ydre tryghed er truet, søger danskerne mod den lille.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/c/a/d/cade8fc5-17f6-48c1-88cd-3626c17f1aca?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=MCw0ODksNTc2MCwzMjM1&s=a0cdfe616b0796f63ee1585b551f435a","credit":"Kilde: TV 2 (Foto: Linda Kastrup / Scanpix Denmark)","alt":"TV 2's billede til historien om boligpriserne i juli 2026: luftfoto af danske parcel- og rækkehuse.","sourceUrl":"https://nyheder.tv2.dk/business/2026-08-13-priserne-paa-danske-boliger-stiger-stadig-i-koebenhavn-er-festen-forbi"},"topics":["boligmarked","dansk økonomi","København","Aarhus"],"entities":["Boligsiden","Lise Nytoft Bergmann","København","Frederiksberg","Aarhus","Danmark"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":68,"decisionValue":70,"novelty":66,"sourceQuality":76,"personalRelevance":72,"contrast":60},"claims":[{"text":"Over det seneste år er huspriserne på landsplan steget 9,6 procent, mens lejligheder er steget knap 18 procent.","sourceUrls":["https://nyheder.tv2.dk/business/2026-08-13-priserne-paa-danske-boliger-stiger-stadig-i-koebenhavn-er-festen-forbi"],"confidence":"high"},{"text":"Priserne er stagneret i Københavns og Frederiksberg kommuner efter mere end to år med konstante prisstigninger.","sourceUrls":["https://nyheder.tv2.dk/business/2026-08-13-priserne-paa-danske-boliger-stiger-stadig-i-koebenhavn-er-festen-forbi"],"confidence":"high"},{"text":"Udbuddet af lejligheder i København er vokset med 70 procent i løbet af det seneste år.","sourceUrls":["https://nyheder.tv2.dk/business/2026-08-13-priserne-paa-danske-boliger-stiger-stadig-i-koebenhavn-er-festen-forbi"],"confidence":"high"},{"text":"Tallene er Boligsidens opgørelse for juli måned 2026.","sourceUrls":["https://nyheder.tv2.dk/business/2026-08-13-priserne-paa-danske-boliger-stiger-stadig-i-koebenhavn-er-festen-forbi"],"confidence":"high"}],"sources":[{"title":"Priserne på danske boliger stiger stadig – i København er festen forbi","publisher":"TV 2","url":"https://nyheder.tv2.dk/business/2026-08-13-priserne-paa-danske-boliger-stiger-stadig-i-koebenhavn-er-festen-forbi","publishedAt":"2026-08-13T05:28:59.000Z","kind":"reporting"}]},{"id":"thomas-2026-08-14-sverige-lavalder","eventKey":"sverige-kriminel-lavalder-14-aar-2026-08-13","materialFacts":["Den svenske rigsdag stemte torsdag aften ja til at saenke den kriminelle lavalder fra 15 til 14 aar","Aendringen gaelder de mest alvorlige forbrydelser","Lavalderen har ligget paa 15 aar siden 1864","Regeringen, Sverigedemokraterne og Socialdemokraterne stemte for"],"section":"Norden","headline":"Sveriges politikere stemmer ja til historisk kursændring: ’En brik i puslespillet’ i kampen mod banderne","primarySourceUrl":"https://www.dr.dk/nyheder/udland/sveriges-politikere-stemmer-ja-til-historisk-kursaendring-en-brik-i-puslespillet-i-kampen-mod","subheadline":"Efter mere end 160 år sænker Sverige den kriminelle lavalder til 14 år for de alvorligste forbrydelser. Valget er om en måned.","body":["Siden 1864 har den kriminelle lavalder i Sverige ligget på 15 år. Torsdag aften stemte et stort flertal i rigsdagen for at sænke den til 14 år ved de mest alvorlige forbrydelser. Ud over regeringen stemte Sverigedemokraterne og Socialdemokraterne for.","Forud for afstemningen sagde justitsminister Gunnar Strömmer fra Moderaterne, at systemet hverken beskytter borgerne mod livsfarlig vold, giver ofrene oprejsning eller bryder de destruktive mønstre omkring børnene. Socialdemokraternes Teresa Carvalho kaldte det \"en brik i puslespillet\"."],"whyItMatters":"Sverige er Danmarks nærmeste sammenligningsgrundlag i bandepolitik. Det opsigtsvækkende er, at socialdemokraterne stemmer med de borgerlige om strafskærpelsen.","analysis":"Forslaget har mødt hård modstand fra organisationer og opposition. Venstrepartiets Gudrun Nordborg sagde, at meget er sket siden 1864, men at børn stadig er børn — og at grænsen snarere burde hæves.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/zkrlntwr/20260602-140006-4_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR Nyheder (Foto: Tom Little, Reuters/Ritzau Scanpix)","alt":"DR's billede til historien, med sidens egen billedtekst: fængslet Rosersberg nord for Stockholm, et af de fængsler, der skal huse de 14-årige.","sourceUrl":"https://www.dr.dk/nyheder/udland/sveriges-politikere-stemmer-ja-til-historisk-kursaendring-en-brik-i-puslespillet-i-kampen-mod"},"topics":["retspolitik","bandekriminalitet","Sverige","Norden"],"entities":["Sveriges Riksdag","Gunnar Strömmer","Moderaterne","Sverigedemokraterne","Socialdemokraterne","Teresa Carvalho","Gudrun Nordborg","Venstrepartiet","Sverige"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":78,"decisionValue":58,"novelty":72,"sourceQuality":82,"personalRelevance":54,"contrast":80},"claims":[{"text":"Den kriminelle lavalder i Sverige har ligget på 15 år siden 1864.","sourceUrls":["https://www.dr.dk/nyheder/udland/sveriges-politikere-stemmer-ja-til-historisk-kursaendring-en-brik-i-puslespillet-i-kampen-mod"],"confidence":"high"},{"text":"Et stort flertal i den svenske rigsdag stemte torsdag aften for at sænke den til 14 år for de mest alvorlige forbrydelser.","sourceUrls":["https://www.dr.dk/nyheder/udland/sveriges-politikere-stemmer-ja-til-historisk-kursaendring-en-brik-i-puslespillet-i-kampen-mod"],"confidence":"high"},{"text":"Ud over regeringen stemte Sverigedemokraterne og Socialdemokraterne for.","sourceUrls":["https://www.dr.dk/nyheder/udland/sveriges-politikere-stemmer-ja-til-historisk-kursaendring-en-brik-i-puslespillet-i-kampen-mod"],"confidence":"high"},{"text":"Justitsminister Gunnar Strömmer er fra det liberalkonservative parti Moderaterne.","sourceUrls":["https://www.dr.dk/nyheder/udland/sveriges-politikere-stemmer-ja-til-historisk-kursaendring-en-brik-i-puslespillet-i-kampen-mod"],"confidence":"high"}],"sources":[{"title":"Sveriges politikere stemmer ja til historisk kursændring: ’En brik i puslespillet’ i kampen mod banderne","publisher":"DR Nyheder","url":"https://www.dr.dk/nyheder/udland/sveriges-politikere-stemmer-ja-til-historisk-kursaendring-en-brik-i-puslespillet-i-kampen-mod","publishedAt":"2026-08-13T15:52:36.000Z","kind":"reporting"}]},{"id":"thomas-2026-08-14-ebola-drcongo","eventKey":"drcongo-ebola-bundibugyo-udbrud-2026-08","materialFacts":["4.381 bekraeftede tilfaelde og 2.011 doede ifoelge DR Congos regering","Udbruddet har spredt sig til seks provinser ifoelge Africa CDC","45,9 pct. af de bekraeftede tilfaelde er endt med doedsfald mod 39,6 pct. i 2014-2016","Sundhedsarbejdere naar kun frem til omkring 30 pct. af tilfaeldene"],"section":"Global sundhed","headline":"Ebola spreder sig i DR Congo - WHO frygter det dødeligste udbrud nogensinde","primarySourceUrl":"https://www.dr.dk/nyheder/udland/ebola-spreder-sig-i-dr-congo-who-frygter-det-doedeligste-udbrud-nogensinde","subheadline":"2.011 døde og seks ramte provinser. Dødeligheden er højere end under det hidtil værste udbrud, og smitten er 35 kilometer fra Sydsudan.","body":["Udbruddet i DR Congo har spredt sig til seks provinser, oplyser Den Afrikanske Unions sundhedsmyndighed Africa CDC. De seneste regeringstal viser 4.381 bekræftede tilfælde og 2.011 døde. Udbruddet blev erklæret 15. maj, men virussen menes at have spredt sig fra februar.","Det er allerede det næststørste udbrud i historien målt på registrerede tilfælde. Ifølge AP er 45,9 procent af tilfældene endt med dødsfald mod 39,6 procent i Vestafrika 2014-2016, hvor mere end 11.000 døde."],"whyItMatters":"Sundhedsarbejdere når ifølge WHO kun frem til omkring 30 procent af tilfældene, fordi det østlige DR Congo har været præget af voldelige konflikter i årtier. Tidlige tilfælde blev desuden fejlvurderet som malaria.","analysis":"WHO-direktør for Afrika Mohamed Janabi siger: \"Vi jagter virussen. Virussen er foran os.\" Mercy Corps advarede torsdag om spredning til Sydsudan; tilfælde er registreret 35 km fra grænsen.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/ydklsa2a/20260811-151709-3.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR Nyheder","alt":"DR's billede til historien om ebolaudbruddet i DR Congo.","sourceUrl":"https://www.dr.dk/nyheder/udland/ebola-spreder-sig-i-dr-congo-who-frygter-det-doedeligste-udbrud-nogensinde"},"topics":["global sundhed","ebola","DR Congo","WHO","Afrika"],"entities":["WHO","Africa CDC","DR Congo","Mohamed Janabi","Tedros Adhanom Ghebreyesus","Mercy Corps","Sydsudan","Ituri"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":88,"decisionValue":52,"novelty":70,"sourceQuality":84,"personalRelevance":48,"contrast":82},"claims":[{"text":"DR Congos regering har registreret 4.381 bekræftede tilfælde og 2.011 dødsfald.","sourceUrls":["https://www.dr.dk/nyheder/udland/ebola-spreder-sig-i-dr-congo-who-frygter-det-doedeligste-udbrud-nogensinde"],"confidence":"high"},{"text":"Udbruddet har spredt sig til seks provinser ifølge Africa CDC.","sourceUrls":["https://www.dr.dk/nyheder/udland/ebola-spreder-sig-i-dr-congo-who-frygter-det-doedeligste-udbrud-nogensinde"],"confidence":"high"},{"text":"45,9 procent af de bekræftede tilfælde er endt med dødsfald mod 39,6 procent under udbruddet i 2014-2016.","sourceUrls":["https://www.dr.dk/nyheder/udland/ebola-spreder-sig-i-dr-congo-who-frygter-det-doedeligste-udbrud-nogensinde"],"confidence":"high"},{"text":"Sundhedsarbejdere når ifølge WHO kun frem til omkring 30 procent af tilfældene.","sourceUrls":["https://www.dr.dk/nyheder/udland/ebola-spreder-sig-i-dr-congo-who-frygter-det-doedeligste-udbrud-nogensinde"],"confidence":"high"},{"text":"Bekræftede tilfælde er registreret blot 35 kilometer fra grænsen til Sydsudan ifølge Mercy Corps.","sourceUrls":["https://www.dr.dk/nyheder/udland/ebola-spreder-sig-i-dr-congo-who-frygter-det-doedeligste-udbrud-nogensinde"],"confidence":"high"}],"sources":[{"title":"Ebola spreder sig i DR Congo - WHO frygter det dødeligste udbrud nogensinde","publisher":"DR Nyheder","url":"https://www.dr.dk/nyheder/udland/ebola-spreder-sig-i-dr-congo-who-frygter-det-doedeligste-udbrud-nogensinde","publishedAt":"2026-08-13T20:05:00.000Z","kind":"reporting"}]},{"id":"thomas-2026-08-14-teton-nattevagt","eventKey":"vordingborg-teton-ai-nattevagt-2026-08","materialFacts":["Vordingborg Kommune skal teste AI-systemet Teton.ai paa to botilbud i Praestoe fra efteraaret 2026","Systemet bruges allerede i Naestved, Kalundborg, Stevns, Guldborgsund og Holbaek kommuner","En loftsensor registrerer, om beboeren sover, er faldet, sidder, ligger i sengen eller er ude","Beboeren vises som en taendstiksfigur, ikke med ansigt og krop"],"section":"Velfærdsteknologi","headline":"Nattevagten får kunstig hjælper","primarySourceUrl":"https://nyheder.tv2.dk/samfund/2026-08-13-nattevagten-faar-kunstig-hjaelper","subheadline":"Fem kommuner på Sjælland og Lolland-Falster bruger allerede Teton.ai. Nu tester Vordingborg det på to botilbud i Præstø.","body":["En loftsensor registrerer, om beboeren sover, er faldet, sidder, ligger i sengen eller har forladt værelset, og sender besked til personalet. Borgeren vises ikke med ansigt og krop, men som en tændstiksfigur.","Vordingborg Kommune implementerer fra efteråret 2026 systemet på botilbuddene Lundegården og Rødegårdsvej i Præstø. Det er i brug i Næstved, Kalundborg, Stevns, Guldborgsund og Holbæk. Ena Hove, beboer på Kildemarkscenteret i Næstved, kalder det trygt."],"whyItMatters":"Rekruttering til nattevagter er svær i hele landet, og der er ofte brug for vikarer. Kommunen fremhæver selv, at teknologien ikke kan erstatte relationer eller faglighed.","analysis":"Fagkonsulent Ida Agnes Riishøj Edelmark siger, at nabokommunernes erfaringer taler for sig selv: medarbejderne får ikke dårlig samvittighed ved at være nærværende hos én borger, fordi systemet slår alarm et andet sted.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/2/2/d/22d1a1ff-b264-4cae-be7e-d1d73e397507?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=MSwwLDEwMTIsNTY5&s=aa2720d28aff487fba7e13776f626809","credit":"Kilde: TV 2 (Foto: Phillippa Maigaard / TV2 ØST)","alt":"TV 2's billede til historien: Ena Hove, beboer på Kildemarkscenteret i Næstved, hvor Teton.ai er i brug.","sourceUrl":"https://nyheder.tv2.dk/samfund/2026-08-13-nattevagten-faar-kunstig-hjaelper"},"topics":["velfærdsteknologi","kunstig intelligens","ældrepleje","Danmark"],"entities":["Vordingborg Kommune","Teton.ai","Næstved","Kalundborg","Stevns","Guldborgsund","Holbæk","Ida Agnes Riishøj Edelmark","Ena Hove","Præstø"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":62,"decisionValue":64,"novelty":76,"sourceQuality":74,"personalRelevance":58,"contrast":78},"claims":[{"text":"Teton.ai er i brug i Næstved, Kalundborg, Stevns, Guldborgsund og Holbæk kommuner på botilbud og plejecentre.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-08-13-nattevagten-faar-kunstig-hjaelper"],"confidence":"high"},{"text":"Vordingborg Kommune implementerer fra efteråret 2026 systemet på Lundegården og Rødegårdsvej i Præstø.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-08-13-nattevagten-faar-kunstig-hjaelper"],"confidence":"high"},{"text":"Loftsensoren viser, om beboeren sover, er faldet, sidder, ligger i sengen eller er ude, og borgeren vises som en tændstiksfigur.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-08-13-nattevagten-faar-kunstig-hjaelper"],"confidence":"high"},{"text":"Ida Agnes Riishøj Edelmark er fagkonsulent i           const storyId = article?.dataset.storyId;
          const contentType = article?.dataset.contentType === "recommendation" ? "recommendation" : "story";
          const wasSelected = reasonButton.classList.contains("is-selected");
          reasonButton.classList.add("is-selected");
          reasonButton.setAttribute("aria-pressed", "true");
          if (storyId) rememberReason(storyId, contentType, reasonButton.dataset.reason);
          rollbackReason = () => {
            reasonButton.classList.toggle("is-selected", wasSelected);
            reasonButton.setAttribute("aria-pressed", String(wasSelected));
            if (storyId && !wasSelected) forgetReason(storyId, contentType, reasonButton.dataset.reason);
          };
        }
        try {
          await sendFeedback(directionButton, transport, button.dataset.reason);
        } catch (error) {
          rollbackReason?.();
          throw error;
        }
      } catch {
        const status = document.querySelector("#feedback-status");
        if (status) status.textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      }
    });
  }
  function bindReadLater() {
    const panel = document.querySelector("#read-later");
    document.addEventListener("click", (event) => {
      const save = event.target.closest("[data-save-story]");
      if (save) {
        toggleSaved({
          id: save.dataset.saveStory,
          headline: save.dataset.saveHeadline,
          url: save.dataset.saveUrl
        });
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const dismiss = event.target.closest("[data-readlater-dismiss]");
      if (dismiss) {
        clearSaved(dismiss.dataset.readlaterDismiss);
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const link = event.target.closest(".read-later-link");
      if (link?.href) {
        markOpened(link.href);
      }
    });
  }
  function buildNarrationSegments(brief) {
    const segments = [];
    if (brief.title) segments.push(brief.title);
    if (brief.dek) segments.push(brief.dek);
    const ordered = [...brief.stories].sort((a, b) => Number(b.isLead) - Number(a.isLead));
    for (const story of ordered) {
      if (story.headline) segments.push(story.headline);
      if (story.subheadline) segments.push(story.subheadline);
      if (Array.isArray(story.body)) {
        for (const paragraph of story.body) segments.push(paragraph);
      }
      if (story.whyItMatters) segments.push(story.whyItMatters);
      if (story.analysis) segments.push(story.analysis);
    }
    return segments.filter((segment) => typeof segment === "string" && segment.trim().length > 0);
  }
  function pickDanishVoice(synth) {
    const voices = synth.getVoices?.() ?? [];
    return voices.find((voice) => voice.lang === "da-DK") ?? voices.find((voice) => voice.lang?.toLowerCase().startsWith("da")) ?? null;
  }
  function createNarrator(brief, synth = globalThis.speechSynthesis) {
    if (!synth || typeof globalThis.SpeechSynthesisUtterance !== "function") return null;
    const segments = buildNarrationSegments(brief);
    if (!segments.length) return null;
    let index = 0;
    let playing = false;
    const speakFrom = (start) => {
      synth.cancel();
      index = start;
      const voice = pickDanishVoice(synth);
      for (let i = start; i < segments.length; i += 1) {
        const utterance = new globalThis.SpeechSynthesisUtterance(segments[i]);
        utterance.lang = "da-DK";
        if (voice) utterance.voice = voice;
        utterance.rate = 1.05;
        utterance.onstart = () => {
          index = i;
        };
        if (i === segments.length - 1) {
          utterance.onend = () => {
            playing = false;
            api.onstatechange?.("stopped");
          };
        }
        synth.speak(utterance);
      }
      playing = true;
      api.onstatechange?.("playing");
    };
    const api = {
      onstatechange: null,
      play() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
          return;
        }
        speakFrom(0);
      },
      pause() {
        if (synth.speaking && !synth.paused) {
          synth.pause();
          playing = false;
          api.onstatechange?.("paused");
        }
      },
      resume() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
        }
      },
      toggle() {
        if (synth.speaking && !synth.paused) {
          api.pause();
        } else if (synth.paused) {
          api.resume();
        } else {
          speakFrom(0);
        }
      },
      stop() {
        synth.cancel();
        index = 0;
        playing = false;
        api.onstatechange?.("stopped");
      },
      get isPlaying() {
        return playing;
      }
    };
    return api;
  }
  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {
      slot.hidden = true;
      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";
      toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";
      toggleButton.setAttribute("aria-pressed", String(active));
      stopButton.disabled = state === "stopped";
    };
    toggleButton.addEventListener("click", () => narrator.toggle());
    stopButton.addEventListener("click", () => narrator.stop());
    globalThis.addEventListener?.("beforeunload", () => narrator.stop());
    slot.replaceChildren(toggleButton, stopButton);
    return narrator;
  }
  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }
    bindEditionNav("archive");
    bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
</html>
