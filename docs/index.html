<!doctype html>
<html lang="da" data-chrome="minimal" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Thomas' Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

/* A reader with only a daily edition gets no bar at all: three of the five
   edition links would 404, and the "Vis som" switcher is a question nobody
   asked. Keyed off <html data-chrome>, stamped at render time from the profile,
   so the bar is gone before first paint rather than flashing in and vanishing
   once the module boots. The bindings are skipped too (see bindEditionNav), so
   the links are absent from the DOM rather than merely invisible. */
:root[data-chrome="minimal"] .top-bar {
  display: none;
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band

.","Begrundelsen er både juridisk og industripolitisk. Den vindende byder skal leve op til Lov om styrket beredskab i energisektoren, der implementerer EU's NIS2- og CER-direktiver, og myndighederne fører tilsyn. Aarestrup Jepsen taler om risikoen for at give Beijing en digital afbryderknap til dansk energiproduktion."],"whyItMatters":"Beskæftigelsen er det andet argument. En kommende rapport sætter én gigawatt havvind i danske farvande til mindst 4.500 årsværk alene i anlægsfasen, og de to parker på tilsammen 1,8 GW dermed mindst 8.100.","analysis":"Hjemlen er det interessante. Beredskabsloven flytter en del af spørgsmålet fra udbudsret til sikkerhedstilsyn, men organisationen mener ikke, den rækker: den efterlyser klarere regler i kommende politiske aftaler, fastsat på EU-niveau.","counterpoint":"Tallene stammer fra en rapport, der endnu ikke er udgivet, og han taler for en branche, der leverer alternativet.","image":{"url":"https://greenpowerdenmark.dk/files/styles/open_graph/public/media/image/Vestas%20offshore%20vindm%C3%B8lle%20V236-15.jpg?itok=iMOMqyj6","credit":"Kilde: Green Power Denmark. Arkivbillede: Vestas","alt":"Havvindmøllepark på havet i en visualisering, som Green Power Denmark bruger til artiklen om leverandørerne til Nordsøen Midt og Hesselø.","sourceUrl":"https://greenpowerdenmark.dk/nyheder/danske-havvindmilliarder-skal-styrke-europa-ikke-kina"},"topics":["havvind","industripolitik","kina","kritisk infrastruktur","leverandørkæde"],"entities":["Green Power Denmark","Thomas Aarestrup Jepsen","Vattenfall","Nordsøen Midt","Hesselø","Kina"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":78,"decisionValue":82,"novelty":74,"sourceQuality":72,"personalRelevance":96,"contrast":76},"claims":[{"text":"Green Power Denmarks politiske direktør Thomas Aarestrup Jepsen siger, at han ikke kan forestille sig kinesiske møller i de to projekter","sourceUrls":["https://greenpowerdenmark.dk/nyheder/danske-havvindmilliarder-skal-styrke-europa-ikke-kina"],"confidence":"high"},{"text":"Den vindende byder skal leve op til Lov om styrket beredskab i energisektoren, som implementerer EU's NIS2- og CER-direktiver, og myndighederne fører tilsyn med kravene","sourceUrls":["https://greenpowerdenmark.dk/nyheder/danske-havvindmilliarder-skal-styrke-europa-ikke-kina"],"confidence":"high"},{"text":"En kommende rapport sætter én gigawatt havvind i danske farvande til mindst 4.500 årsværk i anlægsfasen, og de to parker på 1,8 GW til mindst 8.100 årsværk","sourceUrls":["https://greenpowerdenmark.dk/nyheder/danske-havvindmilliarder-skal-styrke-europa-ikke-kina"],"confidence":"medium"}],"sources":[{"title":"Danske havvindmilliarder skal styrke Europa – ikke Kina","publisher":"Green Power Denmark","url":"https://greenpowerdenmark.dk/nyheder/danske-havvindmilliarder-skal-styrke-europa-ikke-kina","publishedAt":"2026-08-06T11:58:28.000Z","kind":"reporting"}]},{"id":"thomas-20260807-vilsund-blue-sorteringskrav","eventKey":"vilsund-blue-muslingefiskeri-eu-sorteringskrav-produktionsstop","materialFacts":["Fiskerikontrollen kræver nu, at hele fangsten sorteres i hver sin kategori af marine arter, ikke kun de salgsmodne muslinger","Direktør Poul Kærgaard har foreløbig sendt 50 ansatte hjem","Fiskeristyrelsen har forgæves forsøgt at få en stikprøveordning godkendt i EU, som har afvist at tage stilling, fordi nye regler kommer i 2027","Miljøstyrelsen er fortsat i dialog med EU-Kommissionen om en løsning","96 procent af de muslinger, der skrabes på dansk havbund og landes hos Vilsund Blue, eksporteres"],"section":"Erhverv","headline":"Slut med moules frites fra Danmark? 'Hul i hovedet-krav' gør udskældt fiskeri umuligt","primarySourceUrl":"https://www.dr.dk/nyheder/indland/slut-med-moules-frites-fra-danmark-hul-i-hovedet-krav-goer-udskaeldt-fiskeri-umuligt","subheadline":"Danmarks største muslingeproducent har lagt skraberne i havn. Ingen ny lov er vedtaget, kun en ny håndhævelse af en gammel EU-regel, som hverken styrelsen eller Kommissionen kan lempe lige nu.","body":["Hos Danmarks største muslingeproducent, Vilsund Blue på Mors, er der usædvanligt stille. Skraberne er sejlet i havn, efter fiskerikontrollen for et par uger siden krævede, at hele fangsten sorteres i hver sin kategori af marine arter. Poul Kærgaard har foreløbig sendt 50 ansatte hjem.","Ingen ny lov er vedtaget. Fiskeristyrelsen har forsøgt at få en stikprøveordning godkendt i EU, men EU afviste at tage stilling, fordi der kommer nye regler i 2027. Direktøren siger, der skal være en løsning inden midt september, ellers bliver virksomheden efter hans ord udfaset som leverandør i Frankrig."],"whyItMatters":"96 procent af muslingerne fra Vilsund Blue eksporteres. Det er regelbyrde i ren form: samme regel, ny håndhævelse.","analysis":"Sagen handler ikke om regelmængde, men om fortolkningsrum: en styrelse kan stramme en praksis, den ikke selv kan lempe uden Kommissionen. DR bemærker, at det ikke er højsæson nu.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/muuhetcx/muslinger_2_adobe-stock-gul.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR","alt":"Arkivfoto af blåmuslinger anvendt af DR til historien om produktionsstoppet hos Vilsund Blue på Mors.","sourceUrl":"https://www.dr.dk/nyheder/indland/slut-med-moules-frites-fra-danmark-hul-i-hovedet-krav-goer-udskaeldt-fiskeri-umuligt"},"topics":["regelbyrde","eu-regulering","fiskeri","fødevareeksport","erhvervsvilkår"],"entities":["Vilsund Blue","Poul Kærgaard","Fiskeristyrelsen","Maria Reumert Gjerding","Miljøstyrelsen","Mors"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":70,"decisionValue":74,"novelty":76,"sourceQuality":84,"personalRelevance":90,"contrast":78},"claims":[{"text":"Fiskerikontrollen kræver nu, at al fangst sorteres i hver sin kategori af marine arter, og Vilsund Blues direktør har sendt 50 ansatte hjem","sourceUrls":["https://www.dr.dk/nyheder/indland/slut-med-moules-frites-fra-danmark-hul-i-hovedet-krav-goer-udskaeldt-fiskeri-umuligt"],"confidence":"high"},{"text":"Fiskeristyrelsen har forsøgt at få en stikprøveordning godkendt i EU, men EU har afvist at tage stilling, fordi der kommer nye regler i 2027","sourceUrls":["https://www.dr.dk/nyheder/indland/slut-med-moules-frites-fra-danmark-hul-i-hovedet-krav-goer-udskaeldt-fiskeri-umuligt"],"confidence":"high"},{"text":"96 procent af de muslinger, der skrabes på dansk havbund og landes hos Vilsund Blue, eksporteres, og direktøren siger, der skal være en løsning inden midt september","sourceUrls":["https://www.dr.dk/nyheder/indland/slut-med-moules-frites-fra-danmark-hul-i-hovedet-krav-goer-udskaeldt-fiskeri-umuligt"],"confidence":"high"}],"sources":[{"title":"Slut med moules frites fra Danmark? 'Hul i hovedet-krav' gør udskældt fiskeri umuligt","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/slut-med-moules-frites-fra-danmark-hul-i-hovedet-krav-goer-udskaeldt-fiskeri-umuligt","publishedAt":"2026-08-05T18:00:00.000Z","kind":"reporting"}]},{"id":"thomas-20260807-pandora-cfo","eventKey":"pandora-cfo-skifte-anders-boyer-paulo-garcia","materialFacts":["Anders Boyer går på pension 30. november 2026 efter mere end 14 år i Pandora, men bliver i virksomheden indtil 31. marts 2027 for at støtte overgangen","Paulo Garcia tiltræder 1. oktober 2026 og overtager CFO-rollen 1. december 2026","Garcia kommer fra posten som CFO i Walmart Mexico & Central America, et selvstændigt børsnoteret selskab med 50 mia. dollar i omsætning og 240.000 ansatte","Boyer kom i Pandoras bestyrelse i 2012 og blev udnævnt til CFO i 2018"],"section":"Navne","headline":"Pandora udnævner Paulo Garcia som ny CFO, da Anders Boyer går på pension","primarySourceUrl":"https://ugebrev.dk/flashnews/pandora-udnaevner-paulo-garcia-som-ny-cfo-da-anders-boyer-gaar-paa-pension/","subheadline":"En af de mest profilerede finansdirektører i dansk børsnoteret erhvervsliv stopper. Efterfølgeren kommer fra Walmarts mexicanske selskab og tiltræder allerede 1. oktober.","body":["Pandora har udpeget portugisiske Paulo Garcia til ny finansdirektør. Anders Boyer går på pension 30. november 2026 efter mere end 14 år i selskabet. Garcia tiltræder 1. oktober og overtager CFO-rollen 1. december, og Boyer bliver i virksomheden indtil 31. marts 2027 for at støtte overgangen.","Han kommer fra posten som CFO i Walmart Mexico & Central America, et selvstændigt børsnoteret datterselskab med 50 milliarder dollar i omsætning og 240.000 ansatte. Boyer kom i Pandoras bestyrelse i 2012 og blev CFO i 2018."],"whyItMatters":"Boyer er et af de navne, danske bestyrelser bruger som reference, når de leder efter en finansdirektør. Når han træder ud, flytter det på listen over, hvem der er ledig.","analysis":"Bestyrelsesformand Peter Ruzicka fremhæver, at successionen er forberedt sammen med adm. direktør Berta de Pablos-Barbier. Garcia er i selskabet to måneder før overtagelsen, og Boyer bliver fire måneder efter.","topics":["direktionsskifte","navnestof","børsnoteret","corporate governance"],"entities":["Pandora","Anders Boyer","Paulo Garcia","Peter Ruzicka","Berta de Pablos-Barbier","Walmex"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":66,"decisionValue":80,"novelty":82,"sourceQuality":88,"personalRelevance":94,"contrast":58},"claims":[{"text":"Anders Boyer går på pension 30. november 2026, og Paulo Garcia tiltræder 1. oktober og bliver CFO 1. december 2026","sourceUrls":["https://ugebrev.dk/flashnews/pandora-udnaevner-paulo-garcia-som-ny-cfo-da-anders-boyer-gaar-paa-pension/","https://pandoragroup.com/news/27941"],"confidence":"high"},{"text":"Garcia kommer fra CFO-posten i Walmart Mexico & Central America med 50 mia. dollar i omsætning og 240.000 ansatte","sourceUrls":["https://pandoragroup.com/news/27941"],"confidence":"high"},{"text":"Boyer kom i Pandoras bestyrelse i 2012 og blev udnævnt til CFO i 2018","sourceUrls":["https://pandoragroup.com/news/27941"],"confidence":"high"}],"sources":[{"title":"Pandora udnævner Paulo Garcia som ny CFO, da Anders Boyer går på pension","publisher":"Økonomisk Ugebrev","url":"https://ugebrev.dk/flashnews/pandora-udnaevner-paulo-garcia-som-ny-cfo-da-anders-boyer-gaar-paa-pension/","publishedAt":"2026-08-06T06:48:31.000Z","kind":"reporting"},{"title":"Pandora appoints Paulo Garcia as new CFO as Anders Boyer will retire","publisher":"Pandora","url":"https://pandoragroup.com/news/27941","publishedAt":"2026-08-06T06:17:30.000Z","kind":"primary"}]},{"id":"thomas-20260807-ea-pif","eventKey":"saudi-pif-konsortium-koeber-electronic-arts","materialFacts":["Electronic Arts er solgt til et konsortium med Saudi-Arabiens statslige investeringsfond PIF for 55 milliarder dollar, svarende til 356 milliarder kroner","PIF kontrolleres af Saudi-Arabiens kronprins Mohammed bin Salman","EA tages af børsen efter 36 år som børsnoteret selskab","DR beskriver handlen som en af de største i spilbranchens historie; Microsofts køb af Activision Blizzard i 2023 udgjorde 69 milliarder dollar"],"section":"Udland","headline":"Oliestat opkøber spilgigant for trecifret milliardbeløb: 'Saudi-Arabien vil gerne være, hvad Hollywood er for film'","primarySourceUrl":"https://www.dr.dk/nyheder/penge/oliestat-opkoeber-spilgigant-trecifret-milliardbeloeb-saudi-arabien-vil-gerne-vaere-hvad-hollywood","subheadline":"Saudi-Arabiens statsfond køber Electronic Arts for 356 milliarder kroner og tager selskabet af børsen efter 36 år. Spillerforeningen forsøger at få konkurrencemyndighederne til at blokere handlen.","body":["Electronic Arts er solgt til et konsortium med Saudi-Arabiens statslige investeringsfond PIF, som kontrolleres af kronprins Mohammed bin Salman. Prisen er 55 milliarder dollar, svarende til 356 milliarder kroner, og EA tages af børsen efter 36 år.","Handlen er en af de største, der nogensinde er lavet i spilbranchen. Microsofts køb af Activision Blizzard i 2023 udgjorde 69 milliarder dollar. En spillerforening opfordrer gamere til at få konkurrencemyndighederne i USA, EU og Storbritannien til at blokere handlen."],"whyItMatters":"En statslig fond køber sig ind i en kulturindustri frem for i infrastruktur, altså samme statskapital, som europæiske regeringer møder i energi og forsvar.","analysis":"Ejerformen er mere interessant end prisen. Et afnoteret selskab under statsligt ejerskab har hverken kvartalsrapporter eller aktionærmøder, så myndighederne får et selskab, der fremover oplyser markant mindre om sig selv.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/ykubtzju/ea_saudi.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Foto: AFP/Ritzau Scanpix. Grafik: Søren Winther Nørbæk, DR","alt":"DR's grafik til historien om, at Electronic Arts sælges til et konsortium med Saudi-Arabiens investeringsfond PIF og tages af børsen.","sourceUrl":"https://www.dr.dk/nyheder/penge/oliestat-opkoeber-spilgigant-trecifret-milliardbeloeb-saudi-arabien-vil-gerne-vaere-hvad-hollywood"},"topics":["statskapital","opkøb","saudi-arabien","gaming","konkurrence"],"entities":["Electronic Arts","Public Investment Fund","Mohammed bin Salman","Microsoft","Activision Blizzard","Saudi-Arabien"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":82,"decisionValue":58,"novelty":86,"sourceQuality":80,"personalRelevance":52,"contrast":88},"claims":[{"text":"Electronic Arts er solgt til et konsortium med PIF for 55 milliarder dollar, svarende til 356 milliarder kroner, og tages af børsen efter 36 år","sourceUrls":["https://www.dr.dk/nyheder/penge/oliestat-opkoeber-spilgigant-trecifret-milliardbeloeb-saudi-arabien-vil-gerne-vaere-hvad-hollywood"],"confidence":"high"},{"text":"DR beskriver handlen som en af de største i spilbranchens historie, og Microsofts køb af Activision Blizzard i 2023 udgjorde 69 milliarder dollar","sourceUrls":["https://www.dr.dk/nyheder/penge/oliestat-opkoeber-spilgigant-trecifret-milliardbeloeb-saudi-arabien-vil-gerne-vaere-hvad-hollywood"],"confidence":"high"}],"sources":[{"title":"Oliestat opkøber spilgigant for trecifret milliardbeløb: 'Saudi-Arabien vil gerne være, hvad Hollywood er for film'","publisher":"DR","url":"https://www.dr.dk/nyheder/penge/oliestat-opkoeber-spilgigant-trecifret-milliardbeloeb-saudi-arabien-vil-gerne-vaere-hvad-hollywood","publishedAt":"2026-08-06T15:50:00.000Z","kind":"reporting"}]},{"id":"thomas-20260807-dsb-fjernbusser","eventKey":"dsb-punktlighed-passagerer-til-fjernbusser-sommer-2026","materialFacts":["61,5 procent af passagererne i DSB's fjern- og regionaltog ankom til tiden i juni 2026","DSB's kontrakt med staten kræver mindst 75 procents rettidighed","Punktligheden mellem København og Odense var nede på 34,6 procent","Kombardo Expressen havde 43 procent flere passagerer fra januar til og med juli i år end i samme periode sidste år","Banedanmark venter normale tilstande, når sporarbejdet efter planen afsluttes 16. august"],"section":"Danmark","headline":"Togproblemer sender rekordmange passagerer over i busserne","primarySourceUrl":"https://www.dr.dk/nyheder/indland/togproblemer-sender-rekordmange-passagerer-over-i-busserne","subheadline":"DSB ramte 61,5 procents rettidighed i juni mod de 75, kontrakten med staten kræver. Fjernbusselskaberne melder om deres bedste sommer nogensinde.","body":["Sommerens sporarbejde har flyttet passagerer fra skinnerne til vejen. Kombardo Expressen, der drives af Molslinjen, havde 43 procent flere passagerer fra januar til og med juli i år end i samme periode sidste år. Flixbus i Norden kobler en bookingstigning på over 30 procent fra én uge til den næste direkte til DSB's problemer.","DSB's egne tal viser, at 61,5 procent af passagererne i fjern- og regionaltog ankom til tiden i juni. Kontrakten kræver mindst 75 procent. Mellem København og Odense var punktligheden 34,6 procent."],"whyItMatters":"Banedanmark venter normale tilstande, når sporarbejdet efter planen afsluttes 16. august. Spørgsmålet er, hvor mange passagerer der kommer tilbage.","analysis":"Kontraktkravet gør tallene til andet end sommerbesvær: 61,5 mod et krav på 75 procent er et brud på det, staten har købt. Både DSB og Banedanmark peger dog på sporarbejdet som årsag, og Banedanmark tager ansvaret på sig.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/ux2j5bqk/image-4.jpg?im=AspectCrop%3D%281024%2C576%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281024%2C576%29","credit":"Foto: Charlotte Pedersen, DR","alt":"Laura Gherlan står på bussen i Odense. Hun skal nå et fly og har bevidst valgt Flixbus frem for toget.","sourceUrl":"https://www.dr.dk/nyheder/indland/togproblemer-sender-rekordmange-passagerer-over-i-busserne"},"topics":["transport","dsb","infrastruktur","danmark"],"entities":["DSB","Banedanmark","Kombardo Expressen","Molslinjen","Flixbus","Odense"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":62,"decisionValue":54,"novelty":72,"sourceQuality":84,"personalRelevance":60,"contrast":58},"claims":[{"text":"61,5 procent af passagererne i DSB's fjern- og regionaltog ankom til tiden i juni 2026, mod et kontraktkrav på mindst 75 procent","sourceUrls":["https://www.dr.dk/nyheder/indland/togproblemer-sender-rekordmange-passagerer-over-i-busserne"],"confidence":"high"},{"text":"Punktligheden mellem København og Odense var nede på 34,6 procent","sourceUrls":["https://www.dr.dk/nyheder/indland/togproblemer-sender-rekordmange-passagerer-over-i-busserne"],"confidence":"high"},{"text":"Kombardo Expressen havde 43 procent flere passagerer fra januar til og med juli i år end i samme periode sidste år","sourceUrls":["https://www.dr.dk/nyheder/indland/togproblemer-sender-rekordmange-passagerer-over-i-busserne"],"confidence":"high"}],"sources":[{"title":"Togproblemer sender rekordmange passagerer over i busserne","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/togproblemer-sender-rekordmange-passagerer-over-i-busserne","publishedAt":"2026-08-07T03:41:00.000Z","kind":"reporting"}]},{"id":"thomas-20260807-hvidovre-ransomware","eventKey":"hvidovre-hospital-ransomware-bygningsnetvaerk","materialFacts":["Et ransomware-angreb har ramt et lokalt bygningsnetværk på Hvidovre Hospital, der styrer og overvåger de fysiske installationer","Journaler og kliniske systemer er ikke ramt, og patientbehandlingen er ikke påvirket","Den automatiske overvågning af en række bygningstekniske funktioner er sat ud af spil, og hospitalet holdes kørende med øget bemanding og ændrede arbejdsgange","Region Hovedstaden vil ikke oplyse, hvem der står bag, eller hvornår systemerne er fuldt genoprettet"],"section":"Teknologi","headline":"Ransomware lammer bygningsnetværk på Hvidovre Hospital: \"Vi arbejder på højtryk\"","primarySourceUrl":"https://www.computerworld.dk/art/296413","subheadline":"Angrebet ramte ikke journalerne, men det lag af teknik, der styrer hospitalets fysiske installationer. Overvågningen er sat ud af spil, og driften holdes i gang med ekstra bemanding.","body":["Et ransomware-angreb har ramt Hvidovre Hospital. Det gik ikke efter journaler eller kliniske systemer, men efter et lokalt bygningsnetværk, altså det lag af teknik, der styrer hospitalets fysiske installationer. Patientbehandlingen er ikke påvirket, oplyser Region Hovedstaden.","Den automatiske overvågning af en række bygningstekniske funktioner er sat ud af spil. Regionen specificerer ikke hvilke. Hospitalet holdes kørende med øget bemanding, ekstra kontrol og midlertidigt ændrede arbejdsgange."],"whyItMatters":"Regionen vil af sikkerhedsmæssige årsager hverken oplyse, hvem der står bag, hvornår systemerne er genoprettet, eller om flere hospitaler er ramt.","analysis":"Målet er det bemærkelsesværdige. Angrebet ramte driftsteknikken frem for patientsystemerne, og regionen oplyser ikke, hvilke bygningstekniske funktioner der er berørt. Hvor stor konsekvensen er, kan derfor ikke vurderes udefra.","image":{"url":"https://www.computerworld.dk/fil/241683?width=1200&height=630&focus=1","credit":"Kilde: Computerworld","alt":"Hvidovre Hospitals facade med hospitalets navn over hovedindgangen.","sourceUrl":"https://www.computerworld.dk/art/296413"},"topics":["cybersikkerhed","kritisk infrastruktur","sundhed","danmark"],"entities":["Hvidovre Hospital","Region Hovedstaden","Center for IT og Medicoteknologi"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":74,"decisionValue":68,"novelty":80,"sourceQuality":76,"personalRelevance":70,"contrast":66},"claims":[{"text":"Angrebet ramte et lokalt bygningsnetværk, ikke journaler eller kliniske systemer, og patientbehandlingen er ikke påvirket","sourceUrls":["https://www.computerworld.dk/art/296413","https://www.dr.dk/nyheder/seneste/hvidovre-hospital-ramt-af-hackerangreb"],"confidence":"high"},{"text":"Den automatiske overvågning af en række bygningstekniske funktioner er ude af drift, og hospitalet holdes kørende med øget bemanding og ændrede arbejdsgange","sourceUrls":["https://www.computerworld.dk/art/296413"],"confidence":"high"}],"sources":[{"title":"Ransomware lammer bygningsnetværk på Hvidovre Hospital: \"Vi arbejder på højtryk\"","publisher":"Computerworld","url":"https://www.computerworld.dk/art/296413","publishedAt":"2026-08-06T14:15:00.000Z","kind":"reporting"},{"title":"Hvidovre Hospital ramt af hackerangreb","publisher":"DR","url":"https://www.dr.dk/nyheder/seneste/hvidovre-hospital-ramt-af-hackerangreb","publishedAt":"2026-08-06T12:24:15.000Z","kind":"reporting"}]},{"id":"thomas-20260807-genmab-q2","eventKey":"genmab-q2-2026-regnskab-opjustering","materialFacts":["Omsætningen steg 24,9 procent til 1.155 mio. dollar mod en Bloomberg-konsensus på 1.108 mio. dollar","Driftsmarginen faldt til 32,5 procent fra 38,9 procent året før","Nettoresultatet faldt til 303 mio. dollar fra 336 mio. dollar","Omsætningsforventningen for hele året hæves til 4.325-4.523 mio. dollar","Forventningerne til milepæle sænkes til 105-135 mio. dollar fra 135-155 mio. dollar"],"section":"Medicinal","headline":"Genmab Q2 slår analytikernes forventning: Løfter årsforventning","primarySourceUrl":"https://ugebrev.dk/flashnews/genmab-slaar-analytikernes-forventning-loefter-aarsforventning/","subheadline":"Omsætningen kom 4,2 procent over konsensus, og årsforventningen hæves. Men marginen falder, nettoresultatet falder, og forventningerne til milepælsbetalinger sænkes.","body":["Genmab omsatte for 1.155 millioner dollar i andet kvartal, en stigning på 24,9 procent og over Bloombergs analytikerkonsensus på 1.108 millioner. Selskabet hæver omsætningsforventningen for hele året til 4.325-4.523 millioner dollar.","Under overskriften ser billedet mere blandet ud. Driftsmarginen faldt til 32,5 procent fra 38,9 procent året før, nettoresultatet faldt til 303 millioner dollar fra 336 millioner, og forventningerne til milepælsbetalinger sænkes til 105-135 millioner fra 135-155 millioner."],"whyItMatters":"Koncentrationen i dansk eksport gør selskabstal som disse til makrotal. En marginudvikling hos Genmab er ikke kun Genmabs.","analysis":"Marginfaldet er det, der er værd at følge. Selskabet henviser selv til højere royaltyindtægter fra DARZALEX og højere salg af EPKINLY som drivere bag opjusteringen, mens faldet i driftsmargin står uforklaret i meddelelsen.","image":{"url":"https://ugebrev.dk/wp-content/uploads/2024/10/Jan-Van-De-Winkel.jpg","credit":"Foto: Gregers Tycho/Ritzau Scanpix, via Økonomisk Ugebrev","alt":"Portrætfoto af Genmabs administrerende direktør Jan van de Winkel, anvendt af Økonomisk Ugebrev til kvartalsregnskabet.","sourceUrl":"https://ugebrev.dk/flashnews/genmab-slaar-analytikernes-forventning-loefter-aarsforventning/"},"topics":["pharma","regnskab","eksportkoncentration","danmark"],"entities":["Genmab","DARZALEX","EPKINLY","Bloomberg"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":64,"decisionValue":62,"novelty":70,"sourceQuality":74,"personalRelevance":82,"contrast":54},"claims":[{"text":"Omsætningen steg 24,9 procent til 1.155 mio. dollar mod en Bloomberg-konsensus på 1.108 mio. dollar","sourceUrls":["https://ugebrev.dk/flashnews/genmab-slaar-analytikernes-forventning-loefter-aarsforventning/"],"confidence":"high"},{"text":"Driftsmarginen faldt til 32,5 procent fra 38,9 procent, og nettoresultatet faldt til 303 mio. dollar fra 336 mio. dollar","sourceUrls":["https://ugebrev.dk/flashnews/genmab-slaar-analytikernes-forventning-loefter-aarsforventning/"],"confidence":"high"},{"text":"Årsforventningen hæves til 4.325-4.523 mio. dollar, mens milepælsforventningen sænkes til 105-135 mio. dollar","sourceUrls":["https://ugebrev.dk/flashnews/genmab-slaar-analytikernes-forventning-loefter-aarsforventning/"],"confidence":"high"}],"sources":[{"title":"Genmab Q2 slår analytikernes forventning: Løfter årsforventning","publisher":"Økonomisk Ugebrev","url":"https://ugebrev.dk/flashnews/genmab-slaar-analytikernes-forventning-loefter-aarsforventning/","publishedAt":"2026-08-06T15:29:36.000Z","kind":"reporting"}]},{"id":"thomas-20260807-laudrup-dufour","eventKey":"laudrup-dufour-verdensrangliste-foersteplads-foer-vm-2026","materialFacts":["Cathrine Laudrup-Dufour er gået fra en 31.-plads i juli til førstepladsen på verdensranglisten","Springet skete efter to sejre i svenske Falsterbo med hesten Freestyle","Det var hendes sjette sejr ud af seks starter på højeste niveau i denne sæson","VM begynder tirsdag 11. august med holdkonkurrencerne, og de individuelle konkurrencer begynder fredag 14. august"],"section":"Sport","headline":"Laudrup-Dufour slår verdensranglistens rekord lige inden VM","primarySourceUrl":"https://www.dr.dk/sporten/ridning/laudrup-dufour-slaar-verdensranglistens-rekord-lige-inden-vm","subheadline":"Fra en 31.-plads i juli til nummer ét på fem uger. Den 34-årige dressurrytter går til VM i næste uge som en af guldfavoritterne.","body":["I juli var Cathrine Laudrup-Dufour faldet til en 31.-plads på verdensranglisten. To sejre i svenske Falsterbo med hesten Freestyle løftede hende til førstepladsen, og ifølge Det Internationale Rideforbund er det et nyt rekordspring til toppen af listen.","Det var samtidig hendes sjette sejr ud af seks starter på højeste niveau i denne sæson. Udsvinget skyldes hendes eget program: hun starter væsentligt færre stævner end sine konkurrenter af hensyn til hoppen Freestyles alder."],"whyItMatters":"VM begynder tirsdag 11. august med holdkonkurrencerne, og de individuelle konkurrencer begynder fredag den 14. Hun går ind som en af guldfavoritterne.","analysis":"Ranglisten belønner også antallet af starter, ikke kun niveauet: point falder bort en måned efter de blev vundet. Seks sejre i seks starter er derfor den skarpere oplysning end førstepladsen.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/fhfhalmc/20240804-150909-l_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Foto: Caroline Brehman, EPA/Ritzau Scanpix","alt":"Arkivfoto af den danske dressurrytter Cathrine Laudrup-Dufour, der rider ind til VM som en af guldfavoritterne.","sourceUrl":"https://www.dr.dk/sporten/ridning/laudrup-dufour-slaar-verdensranglistens-rekord-lige-inden-vm"},"topics":["sport","dressur","danske sportsfolk","vm"],"entities":["Cathrine Laudrup-Dufour","Freestyle","Falsterbo","Det Internationale Rideforbund"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":52,"decisionValue":40,"novelty":78,"sourceQuality":80,"personalRelevance":84,"contrast":62},"claims":[{"text":"Laudrup-Dufour gik fra en 31.-plads i juli til førstepladsen på verdensranglisten efter to sejre i Falsterbo, hvilket ifølge Det Internationale Rideforbund er et nyt rekordspring","sourceUrls":["https://www.dr.dk/sporten/ridning/laudrup-dufour-slaar-verdensranglistens-rekord-lige-inden-vm"],"confidence":"high"},{"text":"Det var hendes sjette sejr ud af seks starter på højeste niveau i sæsonen","sourceUrls":["https://www.dr.dk/sporten/ridning/laudrup-dufour-slaar-verdensranglistens-rekord-lige-inden-vm"],"confidence":"high"}],"sources":[{"title":"Laudrup-Dufour slår verdensranglistens rekord lige inden VM","publisher":"DR Sporten","url":"https://www.dr.dk/sporten/ridning/laudrup-dufour-slaar-verdensranglistens-rekord-lige-inden-vm","publishedAt":"2026-08-06T11:18:00.000Z","kind":"reporting"}]}],"signals":[{"text":"Den Europæiske Investeringsfond skifter direktør","headline":"Den Europæiske Investeringsfond skifter direktør","url":"https://www.altinget.dk/navnenyt/den-europaeiske-investeringsfond-skifter-direktoer","summary":"Jean-Christophe Laloux er udpeget til ny direktør for Den Europæiske Investeringsfond med tiltrædelse 1. januar 2027 og afløser Marjut Falkstedt. Altinget bringer kun selve udnævnelsen; resten af artiklen er bag betalingsmur.","publisher":"Altinget","section":"Navne","publishedAt":"2026-08-03T12:50:00.000Z"},{"text":"Forsvarsministeriets pressechef rykker til Udenrigsministeriet","headline":"Forsvarsministeriets pressechef rykker til Udenrigsministeriet","url":"https://www.altinget.dk/navnenyt/forsvarsministeriets-pressechef-rykker-til-udenrigsministeriet","summary":"Morten Kaus tiltrådte mandag som pressechef for udenrigsminister Lars Løkke Rasmussen. Han kommer fra samme rolle i Forsvarsministeriet, hvor han i over fire år har betjent fire forskellige ministre.","publisher":"Altinget","section":"Navne","publishedAt":"2026-08-04T09:31:00.000Z"},{"text":"Dansker i spidsen for Arups arbejde med at udvikle og lande de største europæiske bygge- og infrastrukturprojekter","headline":"Dansker i spidsen for Arups arbejde med at udvikle og lande de største europæiske bygge- og infrastrukturprojekter","url":"https://via.ritzau.dk/pressemeddelelse/15078695/dansker-i-spidsen-for-arups-arbejde-med-at-udvikle-og-lande-de-storste-europaeiske-bygge-og-infrastrukturprojekter?publisherId=13562720&lang=da","summary":"Ingeniør- og designvirksomheden Arup har udnævnt danske Sussi Kristine Abildgaard til European Priority Pursuit and Capture Lead. Hun skal lede arbejdet med at vinde de største europæiske bygge- og infrastrukturprojekter, før de når i udbud.","publisher":"Arup via Ritzau","section":"Navne","publishedAt":"2026-08-06T12:20:00.000Z"},{"text":"Brødrene A. & O. Johansen A/S har modtaget mindst 90% accepter i forbindelse med sit anbefalede frivillige kontante overtagelsestilbud på Elektroimportøren AS","headline":"Brødrene A. & O. Johansen A/S har modtaget mindst 90% accepter i forbindelse med sit anbefalede frivillige kontante overtagelsestilbud på Elektroimportøren AS","url":"https://view.news.eu.nasdaq.com/view?id=ba9780665a5fe47d433c08f720d86640a&lang=da&src=listed","summary":"Den danske el-grossist AO har fået accepter svarende til cirka 92,5 procent af aktiekapitalen og stemmerettighederne i norske Elektroimportøren, og der er ingen udestående gennemførelsesbetingelser tilbage. Afvikling ventes gennemført 26. august 2026 til 22 norske kroner per aktie.","publisher":"Nasdaq Copenhagen","section":"Erhverv","publishedAt":"2026-08-06T06:30:00.000Z"},{"text":"Copenhagen Infrastructure Partners reaches financial close and starts construction on its first project in Mexico","headline":"Copenhagen Infrastructure Partners reaches financial close and starts construction on its first project in Mexico","url":"https://www.globenewswire.com/news-release/2026/08/06/3339981/0/en/Copenhagen-Infrastructure-Partners-reaches-financial-close-and-starts-construction-on-its-first-project-in-Mexico.html","summary":"CIP har nået endelig investeringsbeslutning på La Esperanza Solar i Campeche i Mexico: 420 MWdc sol og et batteri på 150 MW i fem timer. Gældsfinansieringen er cirka 510 millioner dollar fra fem banker, heriblandt BNP Paribas, JPMorgan og Santander.","publisher":"Copenhagen Infrastructure Partners","section":"Energi","publishedAt":"2026-08-06T09:00:00.000Z"},{"text":"Industriledere slår alarm: – Savner en følelse av hastverk","headline":"Industriledere slår alarm: – Savner en følelse av hastverk","url":"https://e24.no/energi-og-klima/i/k0KjWk/industriledere-slaar-alarm-savner-en-foelelse-av-hastverk","summary":"Topcheferne i Yara, Elkem og Norsk Industri samt energidirektørerne i Hydro og Alcoa advarer om, at der bygges for lidt ny kraft i Norge, og at vinduet for at fastholde investeringerne er ved at lukke.","publisher":"E24","section":"Energi","publishedAt":"2026-08-06T13:56:00.000Z"},{"text":"Rheinmetall leverer bedre end forventet i Q2 – aktien ligger stort set flad","headline":"Rheinmetall leverer bedre end forventet i Q2 – aktien ligger stort set flad","url":"https://ugebrev.dk/flashnews/rheinmetall-leverer-bedre-end-forventet-i-q2-aktien-ligger-stort-set-flad/","summary":"Omsætningen steg 69 procent år-til-år til 3,29 milliarder euro, cirka 4 procent over konsensus. Driftsresultatet på 562 millioner euro gav en rekordhøj margin på 17,1 procent.","publisher":"Økonomisk Ugebrev","section":"Europa","publishedAt":"2026-08-06T11:00:26.000Z"},{"text":"Eurozonen: Detailhandlen faldt med 0,3 % i juni, understøtter synspunkt om begrænset vækst i forbrug","headline":"Eurozonen: Detailhandlen faldt med 0,3 % i juni, understøtter synspunkt om begrænset vækst i forbrug","url":"https://ugebrev.dk/flashnews/eurozonen-detailhandlen-faldt-med-03-i-juni-understoetter-synspunkt-om-begraenset-vaekst-i-forbrug/","summary":"Detailhandlen faldt 0,3 procent fra maj til juni efter en stigning på 0,4 procent i maj, og årsvæksten faldt fra 1,9 til 0,7 procent. Beskæftigelsesforventningerne steg til gengæld markant i juli.","publisher":"Økonomisk Ugebrev","section":"Økonomi","publishedAt":"2026-08-06T09:27:58.000Z"},{"text":"Iran og Oman er enige om Hormuz-aftale","headline":"Iran og Oman er enige om Hormuz-aftale","url":"https://www.dr.dk/nyheder/seneste/iran-og-oman-er-enige-om-hormuz-aftale","summary":"De to lande er ifølge Irans viceudenrigsminister principielt enige om en fragtrute gennem Hormuzstrædet. Skibstrafikken åbner ikke med det samme: Iran kræver, at USA samtidig ophæver blokeringen, og USA har ikke deltaget i forhandlingerne.","publisher":"DR","section":"Udland","publishedAt":"2026-08-06T10:40:00.000Z"},{"text":"Domstol pålægger Meta milliardbetaling til indsats for børns sikkerhed","headline":"Domstol pålægger Meta milliardbetaling til indsats for børns sikkerhed","url":"https://www.dr.dk/nyheder/seneste/domstol-paalaegger-meta-milliardbetaling-til-indsats-boerns-sikkerhed","summary":"En domstol i New Mexico har pålagt Meta at betale yderligere 567 millioner dollar for ikke at have advaret offentligheden om de risici, platformene udgør for børn, og at indføre en række sikkerhedsforanstaltninger for unge.","publisher":"DR","section":"Udland","publishedAt":"2026-08-07T02:09:44.000Z"},{"text":"Bitter strid om fjernvarme ender i Højesteret","headline":"Bitter strid om fjernvarme ender i Højesteret","url":"https://www.dr.dk/nyheder/indland/bitter-strid-om-fjernvarme-ender-i-hoejesteret","summary":"Erstatningsforeningen i geotermi-sagen fra Viborg har fået fri proces til Højesteret. Et projekt godkendt til 11-13 millioner kroner endte med at koste 165 millioner, som blev sendt videre til fjernvarmekunderne.","publisher":"DR","section":"Danmark","publishedAt":"2026-08-06T10:14:40.000Z"},{"text":"Gæster sad fast i Legoland-rutsjebane i ti meters højde","headline":"Gæster sad fast i Legoland-rutsjebane i ti meters højde","url":"https://www.dr.dk/nyheder/indland/gaester-sad-fast-i-legoland-rutsjebane-i-ti-meters-hoejde","summary":"Tyve gæster sad onsdag aften fast omkring ti meter over jorden i Billund. Brandvæsenet blev tilkaldt klokken 17.19, og først efter klokken 20 var alle hjulpet ned. Ingen kom til skade.","publisher":"DR","section":"Danmark","publishedAt":"2026-08-05T19:22:19.000Z"},{"text":"15-årig pige fra Hedensted er fundet i live i Ungarn","headline":"15-årig pige fra Hedensted er fundet i live i Ungarn","url":"https://www.dr.dk/nyheder/seneste/15-aarig-pige-fra-hedensted-er-fundet-i-live","summary":"Efter mere end to døgns forsvinden er pigen torsdag fundet i live i Ungarn. Sydøstjyllands Politi oplyser, at forældrene er orienteret, og at fokus nu er at få hende sikkert hjem til Danmark.","publisher":"DR","section":"Danmark","publishedAt":"2026-08-06T16:00:34.000Z"}],"column":{"authoredBy":"ai","slug":"det-der-gaar-tabt-er-registret","title":"Det, der går tabt i oversættelse, er ikke betydningen","thesis":"Det, en oversættelse taber, er sjældent meningen, men registret: den sociale plads, sætningen giver den, der siger den.","body":["En sætning gør to ting på én gang. Den siger noget, og den placerer den, der siger det: som ligemand eller underordnet, som insider eller gæst, som en der beder eller en der forventer. Ordbogen dækker det første. Det andet står ikke i den.","Derfor kan en oversættelse være korrekt og alligevel forkert. Et høfligt japansk afslag bliver til et engelsk nej, der lyder brysk. En dansk underdrivelse bliver til en amerikansk beskedenhed, der lyder som mangel på selvtillid. Indholdet overlevede. Positionen gjorde ikke.","Jeg mener, det forklarer, hvorfor maskinoversættelse virker rigtig og forkert på samme tid. Den er trænet på, hvad sætninger betyder, ikke på, hvad de gør ved forholdet mellem to mennesker. Den, der læser resultatet, mærker afstanden uden at kunne pege på ordet."],"uncertainty":"Jeg tager fejl, hvis register er en del af betydningen frem for noget ved siden af. Kan det oversættes lige så systematisk som resten, beskriver skellet kun, hvad vi endnu ikke er gode nok til.","topics":["sprog","oversættelse","kommunikation"]},"recommendations":[{"id":"thomas-rec-20260807-freefall-boeing","mode":"watch","kind":"Dokumentarfilm","status":"upcoming","title":"Freefall: A Reckoning for Boeing","creator":"Instruktør Rory Kennedy","provider":"Netflix","url":"https://www.netflix.com/title/81780118","availability":"Kræver Netflix-abonnement. Premiere 19. august 2026, altså ikke tilgængelig endnu. Verdenspremiere på DC/DOX 14. juni 2026.","commitment":"1 t 33 min","description":"Rory Kennedys opfølgning på Downfall fra 2022. Filmen tager udgangspun     bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
</html>
