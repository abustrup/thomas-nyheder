<!doctype html>
<html lang="da" data-chrome="minimal" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Thomas' Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),

.media-fallback-label {

.story-eyebrow {

.story-byline,

.story-headline {

.headline-link { text-decoration: none; }

.story-subheadline {

.story-card .story-subheadline {

.story-body,

.story-body p,

.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {

  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);

}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {

  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 90ms ease;
  /* Suppress the grey flash iOS paints over a tapped button, which otherwise
     competes with the :active state below, and remove the 300ms tap delay. */
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}
/* A tap must feel like a press. :hover and :focus-visible never fire on a touch
   tap, so before this the chip was visually inert on a phone and the reader had
   no way to tell the click had registered. :active gives the immediate press,
   .is-selected gives the lasting answer, matching .feedback-button above. */
.reason-chip:active {
  background: color-mix(in srgb, var(--ink) 12%, transparent);
  transform: scale(0.96);
}
.reason-chip.is-selected {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.reason-chip.is-selected:hover,
.reason-chip.is-selected:focus-visible {
  background: color-mix(in srgb, var(--ink) 86%, var(--paper));
}
@media (prefers-reduced-motion: reduce) {
  .reason-chip { transition: none; }
  .reason-chip:active { transform: none; }
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

/* A reader with only a daily edition gets no bar at all: three of the five
   edition links would 404, and the "Vis som" switcher is a question nobody
   asked. Keyed off <html data-chrome>, stamped at render time from the profile,
   so the bar is gone before first paint rather than flashing in and vanishing
   once the module boots. The bindings are skipped too (see bindEditionNav), so
   the links are absent from the DOM rather than merely invisible. */
:root[data-chrome="minimal"] .top-bar {
  display: none;
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {

 med AfD, hvilket gør regeringsdannelsen i Sachsen-Anhalt uafklaret. Resultatet er et pejlemærke for, hvor tæt et parti de øvrige tyske partier officielt friholder sig fra, nu er på at kunne besætte en delstatsregering.","analysis":"At AfD trods fremgangen ikke opnåede absolut flertal, betyder, at 'brandmuren' mod partiet formelt holder — men kun fordi de øvrige partier kan finde sammen om et alternativ. Lykkes det ikke, står Sachsen-Anhalt uden en stabil regering, hvilket i sig selv styrker AfD's fortælling om et politisk system, der ikke leverer.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/1yupp34b/20260906-211720-1.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR","alt":"Valgplakater og optælling fra delstatsvalget i Sachsen-Anhalt, september 2026","sourceUrl":"https://www.dr.dk/nyheder/udland/afd-misser-absolut-flertal-i-en-ellers-historisk-sejr-i-tysk-delstatsvalg"},"topics":["politik","Tyskland","EU-medlemsland","højrepopulisme"],"entities":["AfD","Ulrich Siegmund","CDU","Sachsen-Anhalt","Tyskland"],"isLead":true,"isOutsideProfile":true,"scores":{"importance":90,"decisionValue":50,"novelty":80,"sourceQuality":85,"personalRelevance":20,"contrast":85},"claims":[{"text":"AfD fik 43,8% af stemmerne og 39 mandater i delstatsvalget i Sachsen-Anhalt, en fremgang på 23 procentpoint siden 2021, men manglede 3 mandater i absolut flertal.","sourceUrls":["https://www.dr.dk/nyheder/udland/afd-misser-absolut-flertal-i-en-ellers-historisk-sejr-i-tysk-delstatsvalg"],"confidence":"high"},{"text":"Det er første gang siden 2. verdenskrig, at et parti klassificeret som højreekstremt står med mulighed for at få regeringsmagten i en tysk delstat.","sourceUrls":["https://www.dr.dk/nyheder/udland/afd-misser-absolut-flertal-i-en-ellers-historisk-sejr-i-tysk-delstatsvalg"],"confidence":"medium"}],"sources":[{"title":"AfD misser absolut flertal i en ellers historisk sejr i tysk delstatsvalg","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/afd-misser-absolut-flertal-i-en-ellers-historisk-sejr-i-tysk-delstatsvalg","publishedAt":"2026-09-07T03:00:44Z","kind":"reporting"}]},{"id":"story-us-iran-hormuz-2026-09-07","eventKey":"us-iran-hormuz-escalation-2026","materialFacts":["USA angreb tre iranske olietankere nær Kharg Island 5. september","Mindst én tanker sat varigt ud af drift","Irans Revolutionsgarde svarede med angreb på seks skibe","60-dages våbenhvile udløb måneden før"],"section":"Udland","headline":"USA har angrebet tre iranske olieskibe","primarySourceUrl":"https://www.dr.dk/nyheder/seneste/usa-har-angrebet-tre-iranske-olieskibe","subheadline":"Angrebet nær Kharg Island er gengæld for iranske missilangreb på to amerikanske krigsskibe, og Iran svarer igen mod seks skibe i Hormuzstrædet","body":["Det amerikanske militær angreb den 5. september tre iranske olietankere nær Kharg Island som gengæld for iranske missilangreb på to amerikanske krigsskibe. Mindst én tanker blev sat varigt ud af drift; én af tankerne tilhører ifølge USA direkte Irans Revolutionsgarde, de øvrige et netværk, der finansierer garden.","Revolutionsgarden svarede igen med angreb på seks skibe: tre olietankere i Hormuzstrædet og tre fartøjer med tilknytning til USA andre steder i regionen. Det iranske statsmedie Irib meldte ingen dræbte eller sårede fra det amerikanske angreb."],"whyItMatters":"Optrapningen kommer, efter en 60-dages våbenhvile udløb måneden før, og rammer et af verdens vigtigste olie-transitpunkter.","analysis":"At begge parter angriber skibe direkte uden at erklære åben krig, er et mønster, der har kendetegnet konflikten i flere år: gengældelse holdes lige under tærsklen for fuld eskalering.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/cyzpth5w/20260905-171418-7.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR","alt":"Militærskib i Hormuzstrædet under den amerikansk-iranske optrapning, september 2026","sourceUrl":"https://www.dr.dk/nyheder/seneste/usa-har-angrebet-tre-iranske-olieskibe"},"topics":["geopolitik","Mellemøsten","militær eskalering","olie/energi"],"entities":["USA","Iran","Revolutionsgarden","Hormuzstrædet"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":90,"decisionValue":40,"novelty":80,"sourceQuality":75,"personalRelevance":20,"contrast":90},"claims":[{"text":"USA's militær angreb den 5. september tre iranske olietankere nær Kharg Island som gengæld for iranske missilangreb på to amerikanske krigsskibe.","sourceUrls":["https://www.dr.dk/nyheder/seneste/usa-har-angrebet-tre-iranske-olieskibe"],"confidence":"high"},{"text":"Irans revolutionsgarde svarede med angreb på seks skibe: tre olietankere i Hormuzstrædet og tre USA-forbundne fartøjer andetsteds i regionen.","sourceUrls":["https://www.dr.dk/nyheder/seneste/iran-melder-om-angreb-paa-seks-skibe-efter-amerikanske-angreb"],"confidence":"medium"}],"sources":[{"title":"USA har angrebet tre iranske olieskibe","publisher":"DR","url":"https://www.dr.dk/nyheder/seneste/usa-har-angrebet-tre-iranske-olieskibe","publishedAt":"2026-09-05T13:53:01Z","kind":"reporting"},{"title":"Iran melder om angreb på seks skibe efter amerikanske angreb","publisher":"DR","url":"https://www.dr.dk/nyheder/seneste/iran-melder-om-angreb-paa-seks-skibe-efter-amerikanske-angreb","publishedAt":"2026-09-05T22:57:02Z","kind":"reporting"}]},{"id":"story-isar-aerospace-orbit-2026-09-07","eventKey":"isar-aerospace-first-we-orbit-2026","materialFacts":["Spectrum 2 nåede kredsløb 5. september fra Andøya","Første privatudviklede raket fra vesteuropæisk jord i kredsløb","Medbragte fem satellitter inkl. norsk FramSat-1","Efter eksplosion i marts 2025 og fem aflyste forsøg"],"section":"Videnskab","headline":"Historisk milepæl: Første raket fra Vesteuropa er nået i kredsløb","primarySourceUrl":"https://www.dr.dk/nyheder/udland/historisk-milepael-foerste-raket-fra-vesteuropa-er-naaet-i-kredsloeb","subheadline":"Den tyske raket Spectrum 2 fra Isar Aerospace nåede kredsløb fra Andøya i Nordnorge lørdag, efter en eksplosion og fem aflyste forsøg","body":["Raketten Spectrum 2 fra det tyske selskab Isar Aerospace nåede lørdag klokken 22.12 kredsløb syv minutter efter opsendelse fra Andøya Spaceport i Nordnorge. Det er første gang, en privatudviklet raket opsendt fra vesteuropæisk jord når kredsløb — efter en eksplosion i marts 2025 og fem aflyste forsøg.","Raketten medbragte fem små satellitter, heriblandt det norske FramSat-1. Isar Aerospace skrev: 'We are in orbit! And we have just written European history.' Norges statsminister Jonas Gahr Støre kaldte det 'et gennembrud for Norge som rumfartsnation.'"],"whyItMatters":"Milepælen styrker Europas uafhængige adgang til rummet og mindsker afhængigheden af SpaceX og ArianeGroup, som hidtil har haft en de facto monopolstilling.","analysis":"At det lykkedes på andet forsøg, efter en eksplosion og fem udskudte datoer, viser, hvor svært det er at bygge en raketindustri fra bunden.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/xysft31q/20260121-124424-1.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR","alt":"Historisk milepæl: Første raket fra Vesteuropa er nået i kredsløb","sourceUrl":"https://www.dr.dk/nyheder/udland/historisk-milepael-foerste-raket-fra-vesteuropa-er-naaet-i-kredsloeb"},"topics":["rumfart","teknologi","Norge","europæisk industripolitik"],"entities":["Isar Aerospace","Spectrum 2","Andøya Space","Jonas Gahr Støre"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":65,"decisionValue":30,"novelty":90,"sourceQuality":80,"personalRelevance":15,"contrast":90},"claims":[{"text":"Raketten Spectrum 2 fra Isar Aerospace nåede kredsløb syv minutter efter opsendelse fra Andøya Spaceport i Nordnorge den 5. september.","sourceUrls":["https://www.dr.dk/nyheder/udland/historisk-milepael-foerste-raket-fra-vesteuropa-er-naaet-i-kredsloeb","https://isaraerospace.com/mission-updates-overview"],"confidence":"high"}],"sources":[{"title":"Historisk milepæl: Første raket fra Vesteuropa er nået i kredsløb","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/historisk-milepael-foerste-raket-fra-vesteuropa-er-naaet-i-kredsloeb","publishedAt":"2026-09-05T21:54:17Z","kind":"reporting"},{"title":"Mission Updates Overview","publisher":"Isar Aerospace","url":"https://isaraerospace.com/mission-updates-overview","publishedAt":"2026-09-05T09:09:00Z","kind":"primary"}]},{"id":"story-dronning-margrethe-2026-09-07","eventKey":"dronning-margrethe-hospitalized-blodprop","materialFacts":["Ny blodansamling i hoftepartiet og mild dehydrering","Deltager ikke i kong Haralds begravelse i Oslo","Tilsvarende blodansamling i maj 2026"],"section":"Indland","headline":"Dronning Margrethe indlagt på Rigshospitalet","primarySourceUrl":"https://nyheder.tv2.dk/samfund/2026-09-06-dronning-margrethe-indlagt-paa-rigshospitalet","subheadline":"Lægerne har konstateret en ny blodansamling i hoftepartiet samt mild dehydrering; dronningen ventes indlagt den kommende uge","body":["Dronning Margrethe er indlagt på Rigshospitalet, efter at lægerne har konstateret en ny blodansamling i hoftepartiet samt mild dehydrering. Hun ventes indlagt til observation og behandling i den kommende uge.","Det betyder, at dronningen ikke deltager i kong Haralds begravelse i Oslo på onsdag. Danmark repræsenteres i stedet af kong Frederik, dronning Mary, kronprins Christian og prinsesse Benedikte. Dronning Margrethe havde en tilsvarende blodansamling i hoften i maj 2026."],"whyItMatters":"Indlæggelsen kommer, mens kongehuset er i internationalt fokus omkring en europæisk kongelig begravelse, og understreger, hvor skrøbeligt fremmødet kan være for en 86-årig med gentagne blodansamlinger.","analysis":"At dronningen i maj havde en lignende blodansamling og nu igen indlægges, peger på et tilbagevendende helbredsproblem snarere end en enkeltstående hændelse.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/9/2/9/9297df4e-9271-41bb-b218-2210a02a4bef?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=MCw0NSwxNzA2LDk2MA&s=20dbbd898c53b9135ee219325b028817","credit":"Kilde: TV 2","alt":"Dronning Margrethe, som er indlagt på Rigshospitalet efter en ny blodansamling, september 2026","sourceUrl":"https://nyheder.tv2.dk/samfund/2026-09-06-dronning-margrethe-indlagt-paa-rigshospitalet"},"topics":["kongehus","sundhed"],"entities":["Dronning Margrethe","Rigshospitalet","Kong Frederik","Dronning Mary","Kronprins Christian","Prinsesse Benedikte","Kong Harald"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":85,"decisionValue":20,"novelty":65,"sourceQuality":90,"personalRelevance":15,"contrast":40},"claims":[{"text":"Dronning Margrethe er indlagt på Rigshospitalet med en ny blodansamling i hoftepartiet samt mild dehydrering og ventes indlagt den kommende uge.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-09-06-dronning-margrethe-indlagt-paa-rigshospitalet","https://www.dr.dk/nyheder/indland/dronning-margrethe-indlagt"],"confidence":"high"},{"text":"Hun deltager derfor ikke i kong Haralds begravelse i Oslo på onsdag; Kong Frederik, Dronning Mary, Kronprins Christian og Prinsesse Benedikte repræsenterer i stedet Danmark.","sourceUrls":["https://www.dr.dk/nyheder/indland/dronning-margrethe-indlagt"],"confidence":"high"}],"sources":[{"title":"Dronning Margrethe indlagt på Rigshospitalet","publisher":"TV 2","url":"https://nyheder.tv2.dk/samfund/2026-09-06-dronning-margrethe-indlagt-paa-rigshospitalet","publishedAt":"2026-09-06T15:55:00Z","kind":"reporting"},{"title":"Dronning Margrethe indlagt","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/dronning-margrethe-indlagt","publishedAt":"2026-09-06T15:55:53Z","kind":"reporting"}]},{"id":"story-nuuk-eu-groenland-2026-09-07","eventKey":"groenland-eu-partnerskab-nuuk-besoeg","materialFacts":["Frederiksen og von der Leyen ankommet til Nuuk","To-dages besøg for at styrke EU-Grønland-forholdet","Fælles erklæring om styrket partnerskab underskrives dagen efter ankomsten"],"section":"Udland","headline":"Mette Frederiksen og Ursula von der Leyen er ankommet til Nuuk","primarySourceUrl":"https://www.dr.dk/nyheder/indland/groenland/mette-frederiksen-og-ursula-von-der-leyen-er-ankommet-til-nuuk","subheadline":"Det to-dages besøg skal styrke forholdet mellem EU og Grønland med en sejltur til indlandsisen og en fælles erklæring om partnerskabet","body":["Statsminister Mette Frederiksen er ankommet til Nuuk, hvor hun blev budt velkommen af Grønlands formand for Naalakkersuisut, Jens-Frederik Nielsen. Kort efter landede EU-Kommissionens formand Ursula von der Leyen samme sted. Besøget skal styrke forholdet mellem EU og Grønland.","Senere i dag skal lederne på en sejltur til indlandsisen, og en fælles erklæring om et styrket partnerskab underskrives dagen efter. Ifølge DR kan en aftale give et økonomisk rygstød til projekter i Grønland, blandt andet forbedret satellitforbindelse."],"whyItMatters":"Besøget kommer, mens Grønlands strategiske placering og digitale infrastruktur tiltrækker stigende international interesse.","analysis":"At von der Leyen selv rejser til Nuuk, og ikke blot sender en kommissær, signalerer, at EU nu behandler Grønland som et selvstændigt geopolitisk tyngdepunkt snarere end et dansk anliggende alene.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/fzyarlyt/20260906-152046-l.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR","alt":"Mette Frederiksen og Ursula von der Leyen ved ankomsten til Nuuk, september 2026","sourceUrl":"https://www.dr.dk/nyheder/indland/groenland/mette-frederiksen-og-ursula-von-der-leyen-er-ankommet-til-nuuk"},"topics":["udenrigspolitik","Grønland","EU"],"entities":["Mette Frederiksen","Ursula von der Leyen","Jens-Frederik Nielsen","Nuuk","EU","Grønland"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":75,"decisionValue":15,"novelty":60,"sourceQuality":85,"personalRelevance":25,"contrast":50},"claims":[{"text":"Mette Frederiksen og Ursula von der Leyen ankom begge til Nuuk for et to-dages besøg for at styrke forholdet mellem EU og Grønland.","sourceUrls":["https://www.dr.dk/nyheder/indland/groenland/mette-frederiksen-og-ursula-von-der-leyen-er-ankommet-til-nuuk"],"confidence":"high"},{"text":"En aftale mellem EU og Grønland kan give et økonomisk rygstød til projekter i Grønland, blandt andet et projekt for forbedret satellitforbindelse.","sourceUrls":["https://www.dr.dk/nyheder/indland/groenland/mette-frederiksen-og-ursula-von-der-leyen-er-ankommet-til-nuuk"],"confidence":"medium"}],"sources":[{"title":"Mette Frederiksen og Ursula von der Leyen er ankommet til Nuuk","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/groenland/mette-frederiksen-og-ursula-von-der-leyen-er-ankommet-til-nuuk","publishedAt":"2026-09-06T13:53:41Z","kind":"reporting"}]},{"id":"story-dk-datacentre-2026-09-07","eventKey":"dk-29-new-datacenters","materialFacts":["29 nye datacenterprojekter på vej mod Danmark","Microsoft-anlæg planlagt i Varde Kommune","Datacentre brugte ca. en tredjedel af eltilslutningskøen i 2025","Hastelovgivning vil nedprioritere datacentre i strømforsyningen"],"section":"Erhverv","headline":"Mens protesterne vokser, er 29 nye datacentre på vej mod Danmark: Her skal de ligge","primarySourceUrl":"https://ing.dk/artikel/mens-protesterne-vokser-er-29-nye-datacentre-paa-vej-mod-danmark-her-skal-de-ligge","subheadline":"Datacentre brugte næsten en tredjedel af køen til nye eltilslutninger i 2025, og regeringen har fremsat hastelovgivning, der vil nedprioritere dem i strømforsyningen","body":["29 nye datacenterprojekter er på vej mod Danmark, viser en gennemgang, på trods af regeringens forsøg på at bremse udviklingen. Et navngivet Microsoft-anlæg er planlagt i Varde Kommune nær landsbyen Tinghøj.","Datacentre brugte næsten en tredjedel af køen til nye eltilslutninger i 2025. Regeringen har fremsat hastelovgivning, der vil rangere nye datacentre lavest i prioritet for strømforsyning. Cheføkonom Finn Lauritzen siger, det umiddelbart ser sort ud for branchen, sådan som lovforslaget ser ud nu."],"whyItMatters":"Konflikten sætter Danmarks AI- og datacenter-ambitioner op mod den samme elnet-kapacitet, som resten af erhvervslivet og den grønne omstilling konkurrerer om.","analysis":"At så mange projekter fortsætter, mens loven strammes, tyder på, at investorerne enten regner med at nå i drift før reglerne slår igennem, eller vurderer, at efterspørgslen er stærk nok til at bære risikoen.","image":{"url":"https://ing.dk/sites/mi/files/styles/open_graph_image_16_9/public/2026-06/dji_20260319103328_0009_d.jpg?itok=6lX8IIF9","credit":"Kilde: Ingeniøren","alt":"Luftfoto af en landsby i Varde Kommune, nær hvor et nyt datacenter er planlagt","sourceUrl":"https://ing.dk/artikel/mens-protesterne-vokser-er-29-nye-datacentre-paa-vej-mod-danmark-her-skal-de-ligge"},"topics":["AI-infrastruktur","energi","dansk politik","datacentre"],"entities":["Microsoft","Varde Kommune","Tinghøj","Erhvervslivets Tænketank","Finn Lauritzen"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":70,"decisionValue":50,"novelty":60,"sourceQuality":60,"personalRelevance":80,"contrast":60},"claims":[{"text":"29 nye datacenterprojekter er på vej mod Danmark trods regeringens forsøg på at bremse udviklingen; et Microsoft-anlæg er planlagt i Varde Kommune nær Tinghøj.","sourceUrls":["https://ing.dk/artikel/mens-protesterne-vokser-er-29-nye-datacentre-paa-vej-mod-danmark-her-skal-de-ligge"],"confidence":"medium"},{"text":"Datacentre brugte næsten en tredjedel af køen til nye eltilslutninger i 2025, og regeringen har fremsat hastelovgivning, der vil rangere nye datacentre lavest i prioritet for strømforsyning.","sourceUrls":["https://ing.dk/artikel/mens-protesterne-vokser-er-29-nye-datacentre-paa-vej-mod-danmark-her-skal-de-ligge"],"confidence":"medium"}],"sources":[{"title":"Mens protesterne vokser, er 29 nye datacentre på vej mod Danmark: Her skal de ligge","publisher":"Ingeniøren","url":"https://ing.dk/artikel/mens-protesterne-vokser-er-29-nye-datacentre-paa-vej-mod-danmark-her-skal-de-ligge","publishedAt":"2026-09-07T03:00:00Z","kind":"reporting"}]},{"id":"story-pensiondanmark-stampe-2026-09-07","eventKey":"pensiondanmark-stampe-departure-2026-09","materialFacts":["Claus Stampe fratræder efter 23 år som investeringsdirektør","Ingen efterfølger udpeget endnu","Fratræder ved udgangen af januar 2027"],"section":"Erhverv","headline":"Investeringsdirektør i Pensiondanmark stopper efter 23 år","primarySourceUrl":"https://www.altinget.dk/erhverv/navnenyt/investeringsdirektoer-i-pensiondanmark-stopper-efter-23-aar","subheadline":"Claus Stampe fratræder uden en udpeget efterfølger, efter at have leveret et af branchens bedste og mest robuste afkast","body":["Claus Stampe fratræder som investeringsdirektør i Pensiondanmark efter 23 år i rollen. Han begrunder sin exit med et ønske om mere tid til interesser uden for arbejdslivet. Han fratræder ved udgangen af januar 2027.","Under Stampe har Pensiondanmark leveret et af branchens bedste og mest robuste afkast. Ingen efterfølger er udpeget endnu, hvilket efterlader en periode uden en fast investeringschef i en af landets største pensionskasser."],"whyItMatters":"Skiftet er en af de mest markante lederrokader i dansk pensionsbranche i år, fordi Stampes resultater har gjort ham til en reference for, hvordan pensionskapital forvaltes.","analysis":"At en investeringschef med så lang en periode stopper uden en klar efterfølger på plads, er usædvanligt for en sektor, der normalt planlægger lederskifter i god tid.","image":{"url":"https://legacy.altinget.dk/images/article/305958/160275.jpg","credit":"Kilde: Altinget","alt":"Illustrationsbillede til Altingets navnenyt-dækning af lederskifte i pensionsbranchen","sourceUrl":"https://www.altinget.dk/erhverv/navnenyt/investeringsdirektoer-i-         numbers: "#month-numbers",
        numbersSection: "#month-numbers-section",
        shortNews: "#short-news"
      }
    });
  }

  // src/web/renderYearly.js
  function renderYearly(brief) {
    renderPeriod(brief, {
      rangeLabel: periodRangeLabel,
      selectors: {
        range: "#brief-range",
        readingTime: "#brief-reading-time",
        title: "#brief-title",
        dek: "#brief-dek",
        featuredGrid: "#featured-grid",
        threads: "#threads",
        moreGrid: "#more-year-grid",
        numbers: "#year-numbers",
        numbersSection: "#year-numbers-section",
        shortNews: "#short-news"
      }
    });
  }

  // src/web/renderArchive.js
  function weekLabel(weekId) {
    const match = /^\d{4}-W(\d{2})$/.exec(weekId ?? "");
    return match ? `Uge ${Number(match[1])}` : weekId ?? "";
  }
  function periodEntry(entry, label) {
    if (entry.frozen) {
      const link = element("a", "archive-entry archive-entry-link", label);
      link.href = `${entry.id}.html`;
      link.addEventListener("click", (event) => event.stopPropagation());
      return link;
    }
    const span = element("span", "archive-entry archive-entry-empty", label);
    span.setAttribute("aria-disabled", "true");
    return span;
  }
  function renderMonth(month) {
    const box = element("details", "archive-month");
    const summary = element("summary", "archive-month-summary");
    summary.append(periodEntry(month, monthLabelFor(month.id)));
    box.append(summary);
    const weeks = element("ul", "archive-weeks");
    for (const week of month.weeks) {
      const item = element("li", "archive-week");
      item.append(periodEntry(week, weekLabel(week.id)));
      weeks.append(item);
    }
    box.append(weeks);
    return box;
  }
  function renderArchiveBrowser(index) {
    const root = element("div", "archive-browser");
    const years = index?.years ?? [];
    if (years.length === 0) {
      root.append(element("p", "archive-empty", "Arkivet er tomt indtil videre."));
      return root;
    }
    years.forEach((year, yearIndex) => {
      const box = element("details", "archive-year");
      if (yearIndex === 0) box.open = true;
      const summary = element("summary", "archive-year-summary");
      summary.append(periodEntry({ id: year.id, frozen: year.frozen }, String(year.year)));
      box.append(summary);
      for (const month of year.months) {
        box.append(renderMonth(month));
      }
      root.append(box);
    });
    return root;
  }

  // src/web/app.js
  function renderBrief(brief) {
    document.querySelector("#brief-date").textContent = formatDate(brief.date);
    document.querySelector("#brief-reading-time").textContent = `${brief.readingMinutes} minutters l\xE6sning`;
    document.querySelector("#brief-title").textContent = brand();
    document.querySelector("#brief-dek").textContent = brief.dek;
    const keyNumberSlot = document.querySelector("#key-number-slot");
    if (keyNumberSlot) {
      const keyNumberPanel = renderKeyNumber(brief.keyNumber);
      keyNumberSlot.replaceChildren(...keyNumberPanel ? [keyNumberPanel] : []);
      keyNumberSlot.hidden = !keyNumberPanel;
    }
    const klummeSlot = document.querySelector("#klumme-slot");
    if (klummeSlot) {
      const klummePanel = renderColumn(brief.column);
      klummeSlot.replaceChildren(...klummePanel ? [klummePanel] : []);
      klummeSlot.hidden = !klummePanel;
    }
    const leadContainer = document.querySelector("#lead-story");
    const storyGrid2 = document.querySelector("#story-grid");
    const leadSignals = document.querySelector("#lead-signals");
    const shortNews = document.querySelector("#short-news");
    const shortNewsSection = document.querySelector("#short-news-section");
    leadContainer.replaceChildren();
    storyGrid2.replaceChildren();
    leadSignals.replaceChildren(element("h2", "signals-title", "Morgenens signaler"));
    shortNews.replaceChildren();
    for (const story of brief.stories) {
      (story.isLead ? leadContainer : storyGrid2).append(renderStory(story));
    }
    for (const signal of brief.signals.slice(0, 4)) {
      leadSignals.append(renderSignal(signal));
    }
    const remainingSignals = brief.signals.slice(4);
    for (const signal of remainingSignals) shortNews.append(renderSignal(signal));
    shortNewsSection.hidden = remainingSignals.length === 0;
    renderRecommendations(brief.recommendations);
    renderQualityFooter(brief.quality);
  }
  async function sendFeedback(button, transport, reason) {
    const article = button.closest("article");
    const direction = button.dataset.direction ?? article.querySelector('[aria-pressed="true"]')?.dataset.direction;
    const isRecommendation = article.dataset.contentType === "recommendation";
    const payload = {
      storyId: article.dataset.storyId,
      browserId: getBrowserId(),
      direction,
      ...isRecommendation ? { contentType: "recommendation" } : {},
      ...reason ? { reason } : {},

        control.classList.toggle("is-selected", pressed);
      });
    };
    applyState(true);
    const reasonsPanel = article.querySelector(".feedback-reasons");
    if (reasonsPanel) reasonsPanel.hidden = false;
    localStorage.setItem(
      feedbackStorageKey(payload.storyId, payload.contentType),
      direction
    );
    const status = document.querySelector("#feedback-status");
    if (status) status.textContent = "Feedback gemt";
    try {
      const result = await transport(payload);
      if (status && result?.status !== "saved") {
        status.textContent = "Gemt lokalt i denne browser \u2013 p\xE5virker ikke morgendagens udvalg";
      }
      return payload;
    } catch (error) {
      applyState(false);
      if (status) status.textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      throw error;
    }
  }
  function appsScriptTransport(payload) {

      globalThis.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveFeedback(payload);
    });
  }
  async function httpFeedbackTransport(payload, fetcher = globalThis.fetch) {
    const response = await fetcher(feedbackUrl(), {
      method: "POST",
      redirect: "follow",

  function defaultFeedbackTransport() {

    return () => Promise.resolve({ status: "saved-local" });
  }
  function bindFeedback(transport = defaultFeedbackTransport()) {
    document.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-direction], button[data-reason]");
      if (!button) return;
      try {
        const directionButton = button.dataset.direction ? button : button.closest("article").querySelector('[data-direction][aria-pressed="true"]');
        if (!directionButton) return;
        const reasonButton = button.dataset.reason ? button : null;
        let rollbackReason = null;
        if (reasonButton) {
          const article = reasonButton.closest("article");
          const storyId = article?.dataset.storyId;
          const contentType = article?.dataset.contentType === "recommendation" ? "recommendation" : "story";
          const wasSelected = reasonButton.classList.contains("is-selected");
          reasonButton.classList.add("is-selected");
          reasonButton.setAttribute("aria-pressed", "true");
          if (storyId) rememberReason(storyId, contentType, reasonButton.dataset.reason);
          rollbackReason = () => {
            reasonButton.classList.toggle("is-selected", wasSelected);
            reasonButton.setAttribute("aria-pressed", String(wasSelected));
            if (storyId && !wasSelected) forgetReason(storyId, contentType, reasonButton.dataset.reason);
          };
        }
        try {
          await sendFeedback(directionButton, transport, button.dataset.reason);
        } catch (error) {
          rollbackReason?.();
          throw error;
        }
      } catch {
        const status = document.querySelector("#feedback-status");
        if (status) status.textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      }
    });
  }
  function bindReadLater() {
    const panel = document.querySelector("#read-later");
    document.addEventListener("click", (event) => {
      const save = event.target.closest("[data-save-story]");
      if (save) {
        toggleSaved({
          id: save.dataset.saveStory,
          headline: save.dataset.saveHeadline,
          url: save.dataset.saveUrl
        });
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const dismiss = event.target.closest("[data-readlater-dismiss]");
      if (dismiss) {
        clearSaved(dismiss.dataset.readlaterDismiss);
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const link = event.target.closest(".read-later-link");
      if (link?.href) {
        markOpened(link.href);
      }
    });
  }
  function buildNarrationSegments(brief) {
    const segments = [];
    if (brief.title) segments.push(brief.title);
    if (brief.dek) segments.push(brief.dek);
    const ordered = [...brief.stories].sort((a, b) => Number(b.isLead) - Number(a.isLead));
    for (const story of ordered) {
      if (story.headline) segments.push(story.headline);
      if (story.subheadline) segments.push(story.subheadline);
      if (Array.isArray(story.body)) {
        for (const paragraph of story.body) segments.push(paragraph);
      }
      if (story.whyItMatters) segments.push(story.whyItMatters);
      if (story.analysis) segments.push(story.analysis);
    }
    return segments.filter((segment) => typeof segment === "string" && segment.trim().length > 0);
  }
  function pickDanishVoice(synth) {
    const voices = synth.getVoices?.() ?? [];
    return voices.find((voice) => voice.lang === "da-DK") ?? voices.find((voice) => voice.lang?.toLowerCase().startsWith("da")) ?? null;
  }
  function createNarrator(brief, synth = globalThis.speechSynthesis) {

    if (!segments.length) return null;
    let index = 0;
    let playing = false;
    const speakFrom = (start) => {
      synth.cancel();
      index = start;
      const voice = pickDanishVoice(synth);
      for (let i = start; i < segments.length; i += 1) {
        const utterance = new globalThis.SpeechSynthesisUtterance(segments[i]);
        utterance.lang = "da-DK";
        if (voice) utterance.voice = voice;
        utterance.rate = 1.05;
        utterance.onstart = () => {
          index = i;
        };
        if (i === segments.length - 1) {
          utterance.onend = () => {
            playing = false;
            api.onstatechange?.("stopped");
          };
        }
        synth.speak(utterance);
      }
      playing = true;
      api.onstatechange?.("playing");
    };
    const api = {
      onstatechange: null,
      play() {

          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
          return;
        }
        speakFrom(0);
      },
      pause() {
        if (synth.speaking && !synth.paused) {
          synth.pause();
          playing = false;
          api.onstatechange?.("paused");
        }
      },
      resume() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
        }
      },
      toggle() {

        }
      },
      stop() {
        synth.cancel();
        index = 0;
        playing = false;
        api.onstatechange?.("stopped");

      }

  }
  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {
      slot.hidden = true;
      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";
      toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";
      toggleButton.setAttribute("aria-pressed", String(active));
      stopButton.disabled = state === "stopped";

    stopButton.addEventListener("click", () => narrator.stop());

  }
  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }
    bindEditionNav("archive");
    bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;

    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
