<!doctype html>
<html lang="da" data-chrome="minimal" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Thomas' Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

/* A reader with only a daily edition gets no bar at all: three of the five
   edition links would 404, and the "Vis som" switcher is a question nobody
   asked. Keyed off <html data-chrome>, stamped at render time from the profile,
   so the bar is gone before first paint rather than flashing in and vanishing
   once the module boots. The bindings are skipped too (see bindEditionNav), so
   the links are absent from the DOM rather than merely invisible. */
:root[data-chrome="minimal"] .top-bar {
  display: none;
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band

","Barth Eide beskriver satsen som resultat af en systematisk øvelse: efter at USA's højesteret underkendte den oprindelige told, åbnede amerikanerne undersøgelser mod 60 lande, der ifølge ham alle endte på mellem 10 og 12,5 procent. Færøerne og Island slap helt, EU og Storbritannien fik 10."],"whyItMatters":"Forskellen på 10 og 12,5 procent er lille i sig selv, men ikke når den løber mellem nabolande, der sælger de samme varer til de samme amerikanske indkøbere. Sjømad udgør 22 procent af Norges vareeksport til USA.","analysis":"Den juridiske sejr gav ikke virksomhederne toldfrihed, men en ny told med en anden hjemmel. For europæiske eksportører er retssagerne derfor ikke stedet at følge udviklingen. Landeundersøgelserne er.","counterpoint":"At amerikanerne ledte efter en begrundelse er Barth Eides tolkning. Handelsrepræsentanten peger på en konkret mangel i norsk lovgivning, som ikke er efterprøvet.","image":{"url":"https://akamai.vgc.no/v2/images/c31f6a2a-99b2-3108-b5bd-915f93e8a579?format=auto&w=1080&s=d6f9b60a8b38952c36676f4ca82568528c24036d","credit":"Foto: Jonas Been Henriksen / NTB","alt":"Norges fiskeri- og havminister Marianne Sivertsen Næss efter mødet med erhvervslivet og arbejdsmarkedets parter om den amerikanske told.","sourceUrl":"https://e24.no/norsk-oekonomi/i/rr9Qy3/regjeringen-moeter-naeringslivet-om-tollkrisen"},"topics":["handelspolitik","told","usa","norden","eksport"],"entities":["Espen Barth Eide","Marianne Sivertsen Næss","Norge","USA","Færøerne","Island"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":86,"novelty":78,"sourceQuality":82,"personalRelevance":94,"contrast":70},"claims":[{"text":"USA har lagt 12,5 procents told på norske varer, og regeringen indkaldte onsdag eksportører og parter til møde","sourceUrls":["https://e24.no/norsk-oekonomi/i/rr9Qy3/regjeringen-moeter-naeringslivet-om-tollkrisen"],"confidence":"high"},{"text":"Espen Barth Eide oplyser, at amerikanerne efter højesterets underkendelse åbnede undersøgelser mod 60 lande, der endte med satser på 10-12,5 procent","sourceUrls":["https://e24.no/norsk-oekonomi/i/rr9Qy3/regjeringen-moeter-naeringslivet-om-tollkrisen"],"confidence":"high"},{"text":"Færøerne og Island er undtaget, mens EU og Storbritannien fik 10 procent","sourceUrls":["https://e24.no/norsk-oekonomi/i/rr9Qy3/regjeringen-moeter-naeringslivet-om-tollkrisen"],"confidence":"high"},{"text":"Sjømad udgør 22 procent af værdien af Norges vareeksport til USA","sourceUrls":["https://e24.no/norsk-oekonomi/i/rr9Qy3/regjeringen-moeter-naeringslivet-om-tollkrisen"],"confidence":"high"}],"sources":[{"title":"Regjeringen møtte næringslivet: – Helt ny verdenssituasjon","publisher":"E24","url":"https://e24.no/norsk-oekonomi/i/rr9Qy3/regjeringen-moeter-naeringslivet-om-tollkrisen","publishedAt":"2026-08-05T11:14:39.000Z","kind":"reporting"},{"title":"Trump-administrationen betaler mere end 600 milliarder tilbage i told","publisher":"DR","url":"https://www.dr.dk/nyheder/seneste/trump-administrationen-betaler-mere-end-600-milliarder-tilbage-i-told","publishedAt":"2026-08-05T21:43:47.000Z","kind":"reporting"}]},{"id":"thomas-20260806-eli-lilly-opjustering","eventKey":"eli-lilly-q2-2026-beat-og-opjustering","materialFacts":["Eli Lilly hævede omsætningsprognosen for 2026 fra 82-85 til 85-87 milliarder dollar, mens den øvre grænse for indtjeningsprognosen blev sænket en smule på grund af særlige omkostninger","Salget af Mounjaro steg 91 procent til 9,94 milliarder dollar, Zepbound gav 4,93 milliarder","De to midler stod tilsammen for knap 65 procent af kvartalets omsætning","Den nye daglige slankepille Foundayo omsatte for 98 millioner dollar","Tallene er Reuters' rapportering, videregivet af Økonomisk Ugebrev"],"section":"Medicinal","headline":"Novo Nordisk: Eli Lilly overgår forventninger og opjusterer","primarySourceUrl":"https://ugebrev.dk/flashnews/4586523/","subheadline":"Novo Nordisks amerikanske konkurrent slog forventningerne og hævede omsætningsprognosen for året. To lægemidler stod for knap to tredjedele af omsætningen i kvartalet.","body":["Eli Lilly leverede et kvartal over forventning og hævede omsætningsprognosen for 2026 fra 82-85 til 85-87 milliarder dollar, skriver Økonomisk Ugebrev med henvisning til Reuters. Den øvre grænse for indtjeningsprognosen blev til gengæld sænket en smule på grund af særlige omkostninger.","Salget af Mounjaro steg 91 procent til 9,94 milliarder dollar, og Zepbound gav 4,93 milliarder, tilsammen knap 65 procent af kvartalets omsætning. Lillys nye daglige slankepille Foundayo omsatte for 98 millioner dollar."],"whyItMatters":"GLP-1-markedet er ikke kun en virksomhedssag for Danmark. Når Novo Nordisks nærmeste konkurrent hæver sin omsætningsprognose, flytter det konkurrencebilledet for det produktområde, dansk medicinaleksport hviler tungt på.","analysis":"De 98 millioner dollar svarer til 0,7 procent af de to injektionsmidlers kvartalssalg. Kilden kalder det en mindre skuffelse. Tabletformen har endnu ikke rykket tallene.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/Lilly_mounjaro_KwikPen_Tirzepatid_5_mg_per_dose_rate-9442.jpg/1280px-Lilly_mounjaro_KwikPen_Tirzepatid_5_mg_per_dose_rate-9442.jpg","credit":"Foto: Raimond Spekking / Wikimedia Commons, CC BY-SA 4.0","alt":"En Mounjaro KwikPen med tirzepatid, 5 mg pr. dosis — Eli Lillys diabetesmiddel, hvis salg steg 91 procent i kvartalet.","sourceUrl":"https://commons.wikimedia.org/wiki/File:Lilly_mounjaro_KwikPen_Tirzepatid_5_mg_per_dose_rate-9442.jpg"},"topics":["medicinal","glp-1","dansk eksport","novo nordisk","regnskab"],"entities":["Eli Lilly","Novo Nordisk","Mounjaro","Zepbound","Foundayo","Reuters"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":76,"novelty":74,"sourceQuality":66,"personalRelevance":92,"contrast":62},"claims":[{"text":"Eli Lilly hævede omsætningsprognosen for 2026 fra 82-85 til 85-87 milliarder dollar og sænkede samtidig den øvre grænse for indtjeningsprognosen en smule","sourceUrls":["https://ugebrev.dk/flashnews/4586523/"],"confidence":"high"},{"text":"Mounjaro-salget steg 91 procent til 9,94 milliarder dollar og Zepbound gav 4,93 milliarder","sourceUrls":["https://ugebrev.dk/flashnews/4586523/"],"confidence":"high"},{"text":"De to midler stod for knap 65 procent af kvartalets omsætning","sourceUrls":["https://ugebrev.dk/flashnews/4586523/"],"confidence":"high"},{"text":"Den daglige slankepille Foundayo omsatte for 98 millioner dollar i kvartalet","sourceUrls":["https://ugebrev.dk/flashnews/4586523/"],"confidence":"high"}],"sources":[{"title":"Novo Nordisk: Eli Lilly overgår forventninger og opjusterer","publisher":"Økonomisk Ugebrev (efter Reuters)","url":"https://ugebrev.dk/flashnews/4586523/","publishedAt":"2026-08-05T12:00:31.000Z","kind":"reporting"}]},{"id":"thomas-20260806-google-deepmind","eventKey":"google-deepmind-hassabis-dean-discovery-loop","materialFacts":["Demis Hassabis afgiver den daglige ledelse af Google DeepMind og bliver formand for Google DeepMind og chefforsker i Alphabet, mens han fortsat leder Isomorphic Labs","Koray Kavukcuoglu, hidtil teknologidirektør i Google DeepMind, bliver SVP for Google DeepMind med reference til Sundar Pichai og ansvar for Gemini-modeller, frontier-forskning og Gemini-app- og udviklerteams","Jeff Dean forlader Google efter 27 år og starter sammen med Sanjay Ghemawat et uafhængigt public benefit-selskab","Google fortsætter som founding investor og cloud-partner i det nye selskab","Meldingen kom i to beskeder til medarbejderne fra Sundar Pichai og Demis Hassabis, offentliggjort samlet"],"section":"Teknologi","headline":"The next chapter of our AI momentum","primarySourceUrl":"https://blog.google/company-news/inside-google/message-ceo/next-chapter-ai-momentum/","subheadline":"Demis Hassabis afgiver den daglige ledelse af Google DeepMind, og Jeff Dean forlader Google efter 27 år for at starte eget selskab. Google går selv ind som founding investor i det.","body":["Demis Hassabis afgiver den daglige ledelse af Google DeepMind og bliver formand for enheden og chefforsker i Alphabet, mens han fortsat leder Isomorphic Labs. Koray Kavukcuoglu, hidtil teknologidirektør, rykker op som SVP med reference direkte til Sundar Pichai og ansvar for Gemini-modellerne.","Jeff Dean forlader Google efter 27 år og starter sammen med Sanjay Ghemawat et uafhængigt public benefit-selskab. Google skriver, at man går ind som founding investor og cloud-partner. Meldingen kom i to beskeder til medarbejderne, offentliggjort samlet."],"whyItMatters":"Google DeepMind får ny daglig ledelse, idet teknologidirektøren rykker op. For europæiske kunder er spørgsmålet, om Gemini-køreplanen ændrer sig.","analysis":"Google beskriver selv exitten som Deans eget ønske og sig selv som founding investor. Koncernen slipper altså lønomkostningen, men tager efter eget udsagn en tidlig position i det, han bygger.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Demis_Hassabis_at_the_2024_Nobel_Lectures_2.jpg/1280px-Demis_Hassabis_at_the_2024_Nobel_Lectures_2.jpg","credit":"Foto: Jay Dixit / Wikimedia Commons, CC BY-SA 4.0","alt":"Demis Hassabis taler fra en talerstol med Kungliga Vetenskapsakademiens skilt under Nobelforelæsningerne i 2024.","sourceUrl":"https://commons.wikimedia.org/wiki/File:Demis_Hassabis_at_the_2024_Nobel_Lectures_2.jpg"},"topics":["kunstig intelligens","google","ledelsesskifte"],"entities":["Demis Hassabis","Jeff Dean","Sanjay Ghemawat","Koray Kavukcuoglu","Sundar Pichai","Google DeepMind","Alphabet","Isomorphic Labs"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":68,"novelty":92,"sourceQuality":88,"personalRelevance":70,"contrast":78},"claims":[{"text":"Demis Hassabis bliver formand for Google DeepMind og chefforsker i Alphabet og fortsætter med at lede Isomorphic Labs","sourceUrls":["https://blog.google/company-news/inside-google/message-ceo/next-chapter-ai-momentum/"],"confidence":"high"},{"text":"Koray Kavukcuoglu bliver SVP for Google DeepMind med reference til Sundar Pichai","sourceUrls":["https://blog.google/company-news/inside-google/message-ceo/next-chapter-ai-momentum/"],"confidence":"high"},{"text":"Jeff Dean forlader Google efter 27 år og starter et selskab sammen med Sanjay Ghemawat","sourceUrls":["https://blog.google/company-news/inside-google/message-ceo/next-chapter-ai-momentum/"],"confidence":"high"},{"text":"Google fortsætter som founding investor og cloud-partner i det nye selskab","sourceUrls":["https://blog.google/company-news/inside-google/message-ceo/next-chapter-ai-momentum/"],"confidence":"high"}],"sources":[{"title":"The next chapter of our AI momentum","publisher":"Google","url":"https://blog.google/company-news/inside-google/message-ceo/next-chapter-ai-momentum/","publishedAt":"2026-08-05T16:00:00.000Z","kind":"primary"}]},{"id":"thomas-20260806-europol-nve","eventKey":"europol-dansk-politi-nve-netvaerk","materialFacts":["Europols antiterrorchef Anna Sjöberg oplyser til DR, at Europol har samarbejdet med dansk politi i dusinvis af sager knyttet til de sadistiske NVE-netværk","Europol har på under et år identificeret næsten 180 gerningspersoner og beskyttet otte personer mod overhængende trusler mod deres liv","Danmark og 30 andre lande deltager i Europols Projekt Compass, der er oprettet mod netværkene","Sjöberg vil ikke sætte tal på den danske andel af sagerne","Hverken Rigspolitiet eller PET ville stille op til interview"],"section":"Danmark","headline":"Europol: Vi har samarbejdet med dansk politi i 'dusinvis af sager', der knytter sig til sadistiske netværk","primarySourceUrl":"https://www.dr.dk/nyheder/indland/europol-vi-har-samarbejdet-med-dansk-politi-i-dusinvis-af-sager-der-knytter-sig-til-sadistiske","subheadline":"Europols antiterrorchef sætter tal på myndighedens samlede indsats: næsten 180 identificerede gerningspersoner på under et år og 31 lande i samme projekt. Den danske andel vil hun ikke opgøre.","body":["Europol har samarbejdet med dansk politi i \"dusinvis\" af sager knyttet til de sadistiske NVE-netværk på internettet, hvor videoer af overfald og selvskade cirkulerer. Det siger Anna Sjöberg, chef for Europols antiterrorenhed, til DR Nyheder.","Europol har på under et år identificeret næsten 180 gerningspersoner og beskyttet otte mennesker mod overhængende trusler mod deres liv. Danmark deltager sammen med 30 andre lande i Projekt Compass. Hverken Rigspolitiet eller PET ville stille op til interview."],"whyItMatters":"DR beskriver angrebsplanen mod skolen i Hadsten som ét eksempel blandt flere sager med tråde til netværkene. Europol placerer dem i en struktur på tværs af 31 lande.","analysis":"Tallene gælder Europols samlede indsats, ikke Danmark. Det er værd at bemærke, at en europæisk myndighed stiller op og kvantificerer arbejdet, mens de to danske myndigheder, der kender sagerne bedst, afviser at tale om dem.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/afmkzgee/nva_filter_oeje.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Foto: Søren Winther Nørbæk / DR","alt":"Stiliseret, rødtonet nærbillede af et øje, brugt af DR til historien om de sadistiske NVE-netværk.","sourceUrl":"https://www.dr.dk/nyheder/indland/europol-vi-har-samarbejdet-med-dansk-politi-i-dusinvis-af-sager-der-knytter-sig-til-sadistiske"},"topics":["kriminalitet","online-ekstremisme","politi","eu-samarbejde"],"entities":["Europol","Anna Sjöberg","PET","Rigspolitiet","Projekt Compass","Danmark"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":78,"decisionValue":40,"novelty":84,"sourceQuality":86,"personalRelevance":34,"contrast":66},"claims":[{"text":"Anna Sjöberg, chef for Europols antiterrorenhed, siger, at Europol har samarbejdet med dansk politi i dusinvis af sager om NVE-netværkene","sourceUrls":["https://www.dr.dk/nyheder/indland/europol-vi-har-samarbejdet-med-dansk-politi-i-dusinvis-af-sager-der-knytter-sig-til-sadistiske"],"confidence":"high"},{"text":"Europol har på under et år identificeret næsten 180 gerningspersoner og beskyttet otte personer mod overhængende trusler","sourceUrls":["https://www.dr.dk/nyheder/indland/europol-vi-har-samarbejdet-med-dansk-politi-i-dusinvis-af-sager-der-knytter-sig-til-sadistiske"],"confidence":"high"},{"text":"Danmark deltager sammen med 30 andre lande i Europols Projekt Compass","sourceUrls":["https://www.dr.dk/nyheder/indland/europol-vi-har-samarbejdet-med-dansk-politi-i-dusinvis-af-sager-der-knytter-sig-til-sadistiske"],"confidence":"high"}],"sources":[{"title":"Europol: Vi har samarbejdet med dansk politi i 'dusinvis af sager', der knytter sig til sadistiske netværk","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/europol-vi-har-samarbejdet-med-dansk-politi-i-dusinvis-af-sager-der-knytter-sig-til-sadistiske","publishedAt":"2026-08-06T04:30:00.000Z","kind":"reporting"}]},{"id":"thomas-20260806-heunicke-ai-gymnasiet","eventKey":"heunicke-strakspakke-ai-snyd-ungdomsuddannelser","materialFacts":["Undervisningsminister Magnus Heunicke præsenterer i dag en strakspakke mod AI-snyd på ungdomsuddannelserne","Tre tiltag: skolerne opfordres til at overvåge elevernes skærme ved skriftlige eksamener, flere opgaver skal skrives på skolen, og hf-elever skal forsvare den større skriftlige opgave mundtligt","Der findes i dag ingen retningslinjer for skærmovervågning ved eksamen","Mundtligt forsvar af den større skriftlige opgave findes allerede på almene gymnasier, hhx, htx og eux, så tiltaget udvider ordningen til hf","Danske Gymnasiers forperson Maja Bødtcher-Hansen bakker op om alle tre tiltag, mens elevorganisationen DGS bakker op, men kalder det tre relativt små ændringer"],"section":"Uddannelse","headline":"Overvågning og mundtligt forsvar skal sætte stopper for snyd med AI","primarySourceUrl":"https://www.dr.dk/nyheder/indland/overvaagning-og-mundtligt-forsvar-paa-gymnasiet-skal-saette-stopper-snyd-med-ai","subheadline":"Undervisningsministeren vil have skolerne til at kigge med på elevernes skærme og lade flere opgaver skrive på skolen. Elevorganisationen bakker op, men kalder det tre relativt små ændringer.","body":["Undervisningsminister Magnus Heunicke præsenterer i dag en strakspakke mod snyd med kunstig intelligens på ungdomsuddannelserne. Skolerne opfordres til at overvåge elevernes skærme ved skriftlige eksamener, flere opgaver skal skrives på skolen, og hf-elever skal forsvare den større skriftlige opgave mundtligt.","\"Vi kan desværre se, at AI bliver misbrugt, og der bliver snydt med AI på vores gymnasier,\" siger ministeren. Danske Gymnasiers forperson bakker op om alle tre tiltag, mens elevorganisationen DGS bakker op, men kalder pakken tre relativt små ændringer."],"whyItMatters":"Der findes i dag ingen retningslinjer for skærmovervågning ved eksamen. Pakken regulerer altså prøveformen frem for at forbyde værktøjet.","analysis":"Det mundtlige forsvar findes allerede på almene gymnasier, hhx, htx og eux, så tiltaget lukker et hul på hf. Det er til gengæld det eneste af de tre, der måler forståelse frem for adfærd.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/g4bpbb51/ai-skolerelever.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Foto: Oliver Salim Benameur / DR","alt":"Elever på Frederiksberg Gymnasium, hvis rektor er forperson for Danske Gymnasier.","sourceUrl":"https://www.dr.dk/nyheder/indland/overvaagning-og-mundtligt-forsvar-paa-gymnasiet-skal-saette-stopper-snyd-med-ai"},"topics":["kunstig intelligens","uddannelse","regulering"],"entities":["Magnus Heunicke","Undervisningsministeriet","Danske Gymnasier","Maja Bødtcher-Hansen","Danske Gymnasieelevers Sammenslutning"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":66,"decisionValue":52,"novelty":80,"sourceQuality":84,"personalRelevance":56,"contrast":54},"claims":[{"text":"Strakspakken rummer tre tiltag: skærmovervågning ved skriftlige eksamener, flere opgaver skrevet på skolen og mundtligt forsvar af hf-elevernes større skriftlige opgave","sourceUrls":["https://www.dr.dk/nyheder/indland/overvaagning-og-mundtligt-forsvar-paa-gymnasiet-skal-saette-stopper-snyd-med-ai"],"confidence":"high"},{"text":"Der findes i dag ingen retningslinjer for overvågning af elevernes skærme ved eksamen","sourceUrls":["https://www.dr.dk/nyheder/indland/overvaagning-og-mundtligt-forsvar-paa-gymnasiet-skal-saette-stopper-snyd-med-ai"],"confidence":"high"},{"text":"Mundtligt forsvar af den større skriftlige opgave findes allerede på almene gymnasier, hhx, htx og eux","sourceUrls":["https://www.dr.dk/nyheder/indland/overvaagning-og-mundtligt-forsvar-paa-gymnasiet-skal-saette-stopper-snyd-med-ai"],"confidence":"high"},{"text":"Elevorganisationen DGS kalder pakken tre relativt små ændringer","sourceUrls":["https://www.dr.dk/nyheder/indland/overvaagning-og-mundtligt-forsvar-paa-gymnasiet-skal-saette-stopper-snyd-med-ai"],"confidence":"high"}],"sources":[{"title":"Overvågning og mundtligt forsvar skal sætte stopper for snyd med AI","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/overvaagning-og-mundtligt-forsvar-paa-gymnasiet-skal-saette-stopper-snyd-med-ai","publishedAt":"2026-08-06T04:00:00.000Z","kind":"reporting"}]},{"id":"thomas-20260806-green-power-denmark","eventKey":"green-power-denmark-martin-hansen-viceadm-direktoer","materialFacts":["Martin Hansen tiltræder 1. september som viceadministrerende direktør i Green Power Denmark med ansvar for industri og energiproduktion","Han afløser Jan Hylleberg, der stopper midt i august for at blive administrerende direktør i Foreningen af Rådgivende Ingeniører","Martin Hansen kommer fra en stilling som afdelingschef i Miljøministeriet og var 2015-2024 vicedirektør i Energistyrelsen med ansvar for blandt andet Power-to-X, elektrificering og CCS","Green Power Denmarks administrerende direktør Kristian Jensen begrunder ansættelsen med konkurrenceevnen for små og mellemstore industrivirksomheder i energikæden"],"section":"Navne","headline":"Martin Hansen bliver ny viceadm. direktør i Green Power Denmark","primarySourceUrl":"https://greenpowerdenmark.dk/nyheder/martin-hansen-bliver-ny-viceadm-direktoer-green-power-denmark","subheadline":"Energibranchens interesseorganisation henter sin nye viceadm. direktør i Miljøministeriet. Samme rokade giver Foreningen af Rådgivende Ingeniører en ny direktør.","body":["Martin Hansen tiltræder 1. september som viceadministrerende direktør i Green Power Denmark med ansvar for industri og energiproduktion. Han kommer fra en stilling som afdelingschef i Miljøministeriet og var 2015-2024 vicedirektør i Energistyrelsen med ansvar for blandt andet Power-to-X, elektrificering og CCS.","Rokaden flytter to poster på én gang. Hansen afløser Jan Hylleberg, der stopper midt i august for at blive administrerende direktør i Foreningen af Rådgivende Ingeniører."],"whyItMatters":"To organisationer i den danske energi- og rådgivningsbranche får ny ledelse ud af samme bevægelse. Interesseorganisationerne rekrutterer direkte fra centraladministrationen på næstøverste ledelsesniveau.","analysis":"Profilen er ikke tilfældig. Hansen har ni år i Energistyrelsen bag sig med Power-to-X, elektrificering og CCS på bordet, altså netop de sagsområder, hvor branchens projekter afhænger af myndighedsbehandling.","image":{"url":"https://greenpowerdenmark.dk/files/styles/open_graph/public/media/image/Martin-Hansen-web.jpg?itok=pbmiY4xx","credit":"Pressefoto: Green Power Denmark","alt":"Martin Hansen, der 1. september tiltræder som viceadministrerende direktør i Green Power Denmark.","sourceUrl":"https://greenpowerdenmark.dk/nyheder/martin-hansen-bliver-ny-viceadm-direktoer-green-power-denmark"},"topics":["navne","energi","interesseorganisationer","dansk erhvervsliv"],"entities":["Martin Hansen","Jan Hylleberg","Kristian Jensen","Green Power Denmark","Miljøministeriet","Energistyrelsen","Foreningen af Rådgivende Ingeniører"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":58,"decisionValue":82,"novelty":72,"sourceQuality":74,"personalRelevance":96,"contrast":48},"claims":[{"text":"Martin Hansen tiltræder 1. september 2026 som viceadm. direktør i Green Power Denmark med ansvar for industri og energiproduktion","sourceUrls":["https://greenpowerdenmark.dk/nyheder/martin-hansen-bliver-ny-viceadm-direktoer-green-power-denmark"],"confidence":"high"},{"text":"Jan Hylleberg stopper midt i august 2026 for at blive adm. direktør i Foreningen af Rådgivende Ingeniører","sourceUrls":["https://greenpowerdenmark.dk/nyheder/martin-hansen-bliver-ny-viceadm-direktoer-green-power-denmark"],"confidence":"high"},{"text":"Martin Hansen var 2015-2024 vicedirektør i Energistyrelsen med ansvar for blandt andet Power-to-X, elektrificering og CCS","sourceUrls":["https://greenpowerdenmark.dk/nyheder/martin-hansen-bliver-ny-viceadm-direktoer-green-power-denmark"],"confidence":"high"}],"sources":[{"title":"Martin Hansen bliver ny viceadm. direktør i Green Power Denmark","publisher":"Green Power Denmark","url":"https://greenpowerdenmark.dk/nyheder/martin-hansen-bliver-ny-viceadm-direktoer-green-power-denmark","publishedAt":"2026-08-03T07:33:22.000Z","kind":"primary"}]},{"id":"thomas-20260806-dst-konkurser","eventKey":"dst-konkurser-juli-2026","materialFacts":["Der var 137 erklærede konkurser blandt aktive virksomheder i juli, sæsonkorrigeret, et fald på 12,9 procent fra juni","Konkurserne medførte 661 tabte fuldtidsjob i faktiske tal, 10,2 procent færre end i juni","I maj-juli var antallet af konkurser 9,3 procent lavere end i februar-april, mens jobtabet var 5 procent højere","Af 292 faktiske konkurser i juli var 164 nulvirksomheder uden ansatte og med kun mindre omsætning","Set over hele 2026 til og med juli står Region Syddanmark for 18,3 procent af konkurserne, men 25,6 procent af de tabte job"],"section":"Økonomi","headline":"Færre konkurser og tabte job i juli","primarySourceUrl":"https://www.dst.dk/da/Statistik/nyheder-analyser-publ/nyt/NytHtml?cid=52491","subheadline":"Danmarks Statistik opgør 137 konkurser blandt aktive virksomheder i juli og 661 tabte fuldtidsjob. Fordelingen mellem regionerne er mere interessant end niveauet.","body":["Der var 137 erklærede konkurser blandt aktive danske virksomheder i juli, sæsonkorrigeret, 12,9 procent færre end i juni. Konkurserne kostede 661 fuldtidsstillinger, 10,2 procent færre end måneden før. I maj til juli lå antallet af konkurser 9,3 procent under februar til april, mens jobtabet lå 5 procent højere.","Af 292 faktiske konkurser i juli var 164 nulvirksomheder uden ansatte og med kun mindre omsætning. Set over hele 2026 til og med juli står Region Syddanmark for 18,3 procent af konkurserne, men 25,6 procent af de tabte job."],"whyItMatters":"Færre lukninger og et større samlet jobtab hen over foråret peger i hver sin retning. Det er ikke antallet af konkurser, der flytter beskæftigelsen, men størrelsen på dem, der lukker.","analysis":"56 procent af julis faktiske konkurser var nulvirksomheder. Derfor er det tallet for aktive virksomheder, ikke det samlede antal konkurser, der siger noget om dansk erhvervsliv.","image":{"url":"https://www.dst.dk/site/dst/udgivelser/nyt/getimage.aspx?cid=52491","credit":"Kilde: Danmarks Statistik","alt":"Danmarks Statistiks egen figur over konkurser og tabte job i juli 2026.","sourceUrl":"https://www.dst.dk/da/Statistik/nyheder-analyser-publ/nyt/NytHtml?cid=52491"},"topics":["dansk økonomi","konkurser","beskæftigelse","statistik"],"entities":["Danmarks Statistik","Region Syddanmark","Region Hovedstaden"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":68,"decisionValue":74,"novelty":70,"sourceQuality":96,"personalRelevance":84,"contrast":52},"claims":[{"text":"Der var 137 sæsonkorrigerede konkurser blandt aktive virksomheder i juli 2026, 12,9 procent færre end i juni","sourceUrls":["https://www.dst.dk/da/Statistik/nyheder-analyser-publ/nyt/NytHtml?cid=52491"]," kkerhed.","body":["En drone med en ukendt sprængladning og en detonator blev fundet på en landingsbane i Leipzig/Halle lufthavn tæt på et ukrainsk Antonov-fragtfly. Sent tirsdag ramte et DHL-fragtfly et ukendt objekt omkring 400 meter over jorden og blev omdirigeret til Hannover.","Ifølge Bild, som TV 2 refererer, behandler tysk politi sagen som en forseelse mod statens sikkerhed, og indenrigsminister Alexander Dobrindt afbrød sin ferie for at mødes med sikkerhedsmyndighederne."],"whyItMatters":"Leipzig/Halle bruges især til store fragtfly, og der står blandt andet ukrainske Antonov-maskiner. En sprængladning på en landingsbane dér rammer et af Europas fragtknudepunkter direkte.","analysis":"Sagen er overtaget af delstatsanklageren i Leipzig med bistand fra anklagemyndighedens ekstremismeafdeling og delstatens antiterrorenhed. Valget af efterforskningsspor siger noget om, hvad man leder efter, og intet om, hvad man har fundet.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/9/8/5/98551b48-c9ef-436f-a801-d1334265fec0?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=NjksMCwxMDM5LDU4NA&s=935323e636c58fd3bdda7d55c104f74a","credit":"Foto: Reuters / via TV 2","alt":"To DHL-fragtfly bag et hegn om natten i Leipzig/Halle lufthavn, som især bruges til fragt.","sourceUrl":"https://nyheder.tv2.dk/udland/2026-08-05-drone-med-spraengstof-fundet-i-tysk-lufthavn-minister-haster-hjem-fra-ferie"},"topics":["sikkerhed","tyskland","droner","logistik"],"entities":["Leipzig/Halle","Alexander Dobrindt","DHL","Antonov","Sachsen","ZESA","Bild"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":76,"decisionValue":58,"novelty":86,"sourceQuality":72,"personalRelevance":52,"contrast":72},"claims":[{"text":"En drone med ukendt sprængladning og detonator blev fundet på en landingsbane i Leipzig/Halle lufthavn","sourceUrls":["https://nyheder.tv2.dk/udland/2026-08-05-drone-med-spraengstof-fundet-i-tysk-lufthavn-minister-haster-hjem-fra-ferie"],"confidence":"high"}   function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }
    bindEditionNav("archive");
    bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
</html>
