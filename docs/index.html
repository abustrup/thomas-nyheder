<!doctype html>
<html lang="da" data-chrome="minimal" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Thomas' Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),

.media-fallback-label {

.story-eyebrow {

.story-byline,

.story-headline {

.headline-link { text-decoration: none; }

.story-subheadline {

.story-card .story-subheadline {

.story-body,

.story-body p,

.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {

  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);

}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {

  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 90ms ease;
  /* Suppress the grey flash iOS paints over a tapped button, which otherwise
     competes with the :active state below, and remove the 300ms tap delay. */
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}
/* A tap must feel like a press. :hover and :focus-visible never fire on a touch
   tap, so before this the chip was visually inert on a phone and the reader had
   no way to tell the click had registered. :active gives the immediate press,
   .is-selected gives the lasting answer, matching .feedback-button above. */
.reason-chip:active {
  background: color-mix(in srgb, var(--ink) 12%, transparent);
  transform: scale(0.96);
}
.reason-chip.is-selected {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.reason-chip.is-selected:hover,
.reason-chip.is-selected:focus-visible {
  background: color-mix(in srgb, var(--ink) 86%, var(--paper));
}
@media (prefers-reduced-motion: reduce) {
  .reason-chip { transition: none; }
  .reason-chip:active { transform: none; }
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

/* A reader with only a daily edition gets no bar at all: three of the five
   edition links would 404, and the "Vis som" switcher is a question nobody
   asked. Keyed off <html data-chrome>, stamped at render time from the profile,
   so the bar is gone before first paint rather than flashing in and vanishing
   once the module boots. The bindings are skipped too (see bindEditionNav), so
   the links are absent from the DOM rather than merely invisible. */
:root[data-chrome="minimal"] .top-bar {
  display: none;
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {

erikansk told sender kinesisk eksport mod EU. Om det modsatte gælder – at mindre friktion mindsker presset for at omdirigere eksport til Europa – er redaktionens egen slutning, ikke noget artiklen selv hævder.","analysis":"EU er under alle omstændigheder reelt tredjepart i en aftale, der former markedsvilkårene for europæiske eksportører, mens Bruxelles selv forhandler parallelt med Beijing uden at sidde med ved det amerikansk-kinesiske bord.","counterpoint":"Et modargument: et stabiliseret forhold mellem Washington og Beijing reducerer risikoen for en fuld handelskrig, som ville ramme europæisk eksport hårdere.","image":{"url":"https://images.euronews.com/articles/stories/09/92/35/71/1200x675_cmsv2_8b8a9651-fcb6-55c6-ab1b-8b96192af5bb-9923571.jpg","credit":"Kilde: Euronews","alt":"The Trump-Xi summit: Why Europe has so much at stake","sourceUrl":"https://www.euronews.com/my-europe/2026/09/23/the-trump-xi-summit-why-europe-has-so-much-at-stake"},"topics":["trade-policy","eu-us","eu-china"],"entities":["Donald Trump","Xi Jinping","EU-Kommissionen","Kina"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":88,"decisionValue":65,"novelty":60,"sourceQuality":62,"personalRelevance":85,"contrast":60},"claims":[{"text":"Xi Jinping arrived in the US on Wednesday 23 September 2026 for a three-day summit with Trump in Washington covering trade, technology and Taiwan, their third meeting within a year.","sourceUrls":["https://www.euronews.com/my-europe/2026/09/23/the-trump-xi-summit-why-europe-has-so-much-at-stake"],"confidence":"medium"},{"text":"The EU's trade deficit with China is roughly €1 billion a day, and US tariffs on China risk rerouting Chinese exports toward the EU market.","sourceUrls":["https://www.euronews.com/my-europe/2026/09/23/the-trump-xi-summit-why-europe-has-so-much-at-stake"],"confidence":"medium"}],"sources":[{"title":"The Trump-Xi summit: Why Europe has so much at stake","publisher":"Euronews","url":"https://www.euronews.com/my-europe/2026/09/23/the-trump-xi-summit-why-europe-has-so-much-at-stake","publishedAt":"2026-09-23T06:00:00Z","kind":"reporting"}]},{"id":"story-nationalbanken-risiko-2026-09-24","eventKey":"nationalbanken-rentestigninger-risikoappetit","materialFacts":["Nationalbanken har hævet renten 25 basispoint i både juni og september 2026, i takt med ECB.","Nationalbanken advarer om høj risikoappetit: amerikanske og europæiske aktier op hhv. 14 og 11 pct., og hedgefonde med høj gearing ejer nu ca. 8,5 pct. af amerikanske statsobligationer."],"section":"Makroøkonomi","headline":"Rentestigninger og høj risikoappetit","primarySourceUrl":"https://www.nationalbanken.dk/da/viden-og-nyheder/publikationer-og-taler/analyse/2026/rentestigninger-og-hoej-risikoappetit","subheadline":"Nationalbanken har fulgt ECB med renteforhøjelser i både juni og september – men advarer samtidig om, at markedernes risikovillighed er blevet farligt høj.","body":["Nationalbanken har i takt med ECB hævet renten 25 basispoint i både juni og september 2026. Renten ligger fortsat 40 basispoint under ECB's, mens danske lange realkreditrenter er steget omkring 60 basispoint siden marts.","Nationalbanken advarer samtidig om høj risikoappetit: aktiemarkederne i euroområdet og USA er steget hhv. 11 og 14 procent siden sidste rapport, drevet af AI-forventninger, mens gearede hedgefonde nu ejer omkring 8,5 procent af amerikanske statsobligationer via basis-trades med op mod 25 gange gearing."],"whyItMatters":"Nationalbanken peger på to separate risici: høje aktiekurser drevet af AI-optimisme, og en skrøbelig obligationsmarkedsstruktur på grund af gearede basis-trades.","analysis":"Nationalbanken taler ikke om en forestående krise, men om skrøbelighed – at prisfastsættelsen forudsætter, at meget går rigtigt på én gang, mens renterne strammes.","image":{"url":"https://www.nationalbanken.dk/media/feip4rdn/01-nationalbankens-bygning-havnegade.jpg?rxy=0.5922330097087378,0.4538834951456311&width=1200&height=630&v=1d94789dc234190&hmac=d0ef9eb26df5ae5bcf7671292b0586540e425250797397f5655fd77cb118ff40","credit":"Kilde: Danmarks Nationalbank","alt":"Rentestigninger og høj risikoappetit","sourceUrl":"https://www.nationalbanken.dk/da/viden-og-nyheder/publikationer-og-taler/analyse/2026/rentestigninger-og-hoej-risikoappetit"},"topics":["monetary-policy","financial-stability","macroeconomics"],"entities":["Danmarks Nationalbank","ECB"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":75,"decisionValue":60,"novelty":55,"sourceQuality":95,"personalRelevance":75,"contrast":65},"claims":[{"text":"Nationalbanken raised its policy rate 25bp in both June and September 2026, following the ECB, with the spread to the ECB unchanged at -40bp; long mortgage rates rose ~60bp since March.","sourceUrls":["https://www.nationalbanken.dk/da/viden-og-nyheder/publikationer-og-taler/analyse/2026/rentestigninger-og-hoej-risikoappetit"],"confidence":"high"},{"text":"Euro-area and US stocks rose 11% and 14% since the last report; leveraged hedge funds hold ~8.5% of outstanding US Treasuries via ~25x-leveraged basis trades.","sourceUrls":["https://www.nationalbanken.dk/da/viden-og-nyheder/publikationer-og-taler/analyse/2026/rentestigninger-og-hoej-risikoappetit"],"confidence":"high"}],"sources":[{"title":"Rentestigninger og høj risikoappetit","publisher":"Danmarks Nationalbank","url":"https://www.nationalbanken.dk/da/viden-og-nyheder/publikationer-og-taler/analyse/2026/rentestigninger-og-hoej-risikoappetit","publishedAt":"2026-09-23T08:00:00Z","kind":"primary"}]},{"id":"story-dtcp-defencefund-eifo-2026-09-24","eventKey":"dtcp-defence-tech-fund-close","materialFacts":["DTCP lukkede 24. september 2026 en vækstfond på 455 mio. euro med EIFO som investor.","Fonden investerer i AI, autonome systemer, cyberforsvar, sikker kommunikation og rumteknologi; DTCP åbner Københavns-kontor i 2027."],"section":"Venturekapital","headline":"DTCP closes €455M defence fund to scale Europe’s strategic tech capabilities","primarySourceUrl":"https://tech.eu/2026/09/24/dtcp-closes-eur455m-defence-fund-to-scale-europes-strategic-tech-capabilities","subheadline":"Den danske eksport- og investeringsfond EIFO er blandt investorerne i en europæisk vækstfond på 455 millioner euro til forsvarsteknologi, autonome systemer og cybersikkerhed.","body":["Den europæiske investor DTCP har lukket en vækstfond på 455 millioner euro med Deutsche Telekom, Porsche SE, danske EIFO, Danica og estiske SmartCap som investorer. Fonden investerer i AI, autonome systemer, cyberforsvar, sikker kommunikation og rumteknologi.","Blandt DTCP's porteføljeselskaber er dronevirksomheden Quantum Systems og forsvarsselskabet STARK Defence. DTCP åbner desuden kontor i København i 2027."],"whyItMatters":"For EIFO er det en markering af, at forsvarsteknologi nu er et almindeligt vækstfelt for kapital, ikke en niche forbeholdt forsvarsministerier, og det giver adgang til dealflow i et segment, hvor kapitalen ellers har været koncentreret i få amerikanske fonde.","analysis":"Det er også et signal om, hvor europæisk sikkerhedspolitisk kapital reelt bevæger sig hen, mens EU diskuterer fælles forsvarsfinansiering: gennem private vækstfonde med statslige medinvestorer, snarere end nye EU-programmer.","image":{"url":"https://cdn.tech.eu/uploads/2026/09/untitled-design-27-648.png","credit":"Kilde: Tech.eu","alt":"Illustration fra Tech.eu til nyheden om DTCP's forsvarsteknologifond","sourceUrl":"https://tech.eu/2026/09/24/dtcp-closes-eur455m-defence-fund-to-scale-europes-strategic-tech-capabilities"},"topics":["venture-capital","defence-tech","deeptech"],"entities":["DTCP","EIFO","Deutsche Telekom","Porsche SE"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":62,"decisionValue":68,"novelty":60,"sourceQuality":68,"personalRelevance":88,"contrast":45},"claims":[{"text":"DTCP closed a EUR 455M defence-tech growth fund on 24 September 2026, with EIFO among the named investors alongside Deutsche Telekom, Porsche SE, Danica and SmartCap.","sourceUrls":["https://tech.eu/2026/09/24/dtcp-closes-eur455m-defence-fund-to-scale-europes-strategic-tech-capabilities"],"confidence":"medium"}],"sources":[{"title":"DTCP closes €455M defence fund to scale Europe’s strategic tech capabilities","publisher":"Tech.eu","url":"https://tech.eu/2026/09/24/dtcp-closes-eur455m-defence-fund-to-scale-europes-strategic-tech-capabilities","publishedAt":"2026-09-24T07:00:00Z","kind":"reporting"}]},{"id":"story-roswall-danmark-besoeg-2026-09-24","eventKey":"eu-commissioner-roswall-danish-industry-visit","materialFacts":["EU's kommissær for miljø og konkurrencedygtig cirkulær økonomi, Jessika Roswall, besøgte 23.-24. september Grundfos, Carlsberg og Beirholm's Textile.","Besøget er hendes andet i Danmark i 2026, efter et tilsvarende besøg i april."],"section":"EU og dansk erhvervsliv","headline":"Jessika Roswall i Danmark","primarySourceUrl":"https://denmark.representation.ec.europa.eu/news/jessika-roswall-i-danmark-2026-09-23_da","subheadline":"EU's kommissær for miljø og konkurrencedygtig cirkulær økonomi besøgte onsdag og torsdag Grundfos, Carlsberg og Beirholm's Textile for at se dansk industris omstilling til ressourceeffektiv produktion.","body":["EU's kommissær for miljø og konkurrencedygtig cirkulær økonomi, Jessika Roswall, besøgte onsdag Grundfos i Bjerringbro og fortsatte torsdag til Carlsbergs bryggeri i Fredericia og Beirholm's Textile i Kolding, ledsaget af miljøminister Maria Reumert Gjerding.","Besøget er kommissærens andet i Danmark i år efter et tilsvarende besøg i april, og indgår i en turné med fokus på virksomheder inden for ressourceeffektivitet og bæredygtig produktion."],"whyItMatters":"At en EU-kommissær lægger vejen forbi navngivne danske produktionsvirksomheder frem for kun at mødes med ministre i København, viser, hvilke danske cases Bruxelles bruger til at underbygge sin cirkulære økonomi-dagsorden.","analysis":"Besøget er ikke en beslutning, og meddelelsen indeholder ingen udtalelser fra Roswall om konklusioner – kun en rejseplan. Værdien ligger i synligheden snarere end i noget nyt, kommissæren har lovet.","image":{"url":"https://denmark.representation.ec.europa.eu/sites/default/files/styles/ewcms_metatag_image/public/media_avportal_thumbnails/K2OJnxlqd5xRmXXOCEP2nvcZlQ6CM5fOfzH722A00Ks.jpg?h=c9f93661&itok=rx74MeSg","credit":"Kilde: EU-Kommissionens repræsentation i Danmark","alt":"Visit of Jessika Roswall, European Commissioner, to Portugal","sourceUrl":"https://denmark.representation.ec.europa.eu/news/jessika-roswall-i-danmark-2026-09-23_da"},"topics":["eu-competitiveness","circular-economy","danish-industry"],"entities":["Jessika Roswall","Grundfos","Carlsberg","Beirholm's Textile","EU-Kommissionen"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":42,"decisionValue":40,"novelty":45,"sourceQuality":78,"personalRelevance":62,"contrast":35},"claims":[{"text":"EU Commissioner for environment, water resilience and competitive circular economy Jessika Roswall visited Grundfos, Carlsberg and Beirholm's Textile in Denmark on 23-24 September 2026, accompanied at the last two stops by Environment Minister Maria Reumert Gjerding.","sourceUrls":["https://denmark.representation.ec.europa.eu/news/jessika-roswall-i-danmark-2026-09-23_da"],"confidence":"high"}],"sources":[{"title":"Jessika Roswall i Danmark","publisher":"EU-Kommissionens repræsentation i Danmark","url":"https://denmark.representation.ec.europa.eu/news/jessika-roswall-i-danmark-2026-09-23_da","publishedAt":"2026-09-23T12:00:00Z","kind":"primary"}]},{"id":"story-anthropic-enzyme-discovery-2026-09-24","eventKey":"anthropic-claude-art-enzyme-discovery","materialFacts":["Anthropic siger, at ca. 950 Claude-agenter på 21 timer og 210 mio. tokens fandt en ny CRISPR-lignende enzymfamilie (ART) blandt 200.000+ kandidater.","Fundet er en ikke-fagfællebedømt preprint uden fastlagt biologisk funktion; Feng Zhang kalder det 'genuinely intriguing'."],"section":"AI og videnskab","headline":"Claude discovers a novel enzyme system with CRISPR-like repeats","primarySourceUrl":"https://www.anthropic.com/news/claude-discovers-novel-enzyme-system","subheadline":"Omkring 950 Claude-agenter brugte 21 timer på at gennemgå over 200.000 kandidatenzymer og fandt en hidtil ukendt enzymfamilie, som CRISPR-medopdageren Feng Zhang kalder genuint interessant.","body":["Anthropic oplyser, at ca. 950 Claude-agenter på 21 timer og 210 mio. tokens gennemsøgte over 200.000 kandidat-enzymer, indsnævrede dem til 3.500 og endte med 20 stærke kandidater. Resultatet er en ny enzymfamilie, ART, der minder om CRISPR med et RNA-gentagelsesmønster koblet til et enzym-gen.","Fundet er en ikke-fagfællebedømt preprint; Anthropic understreger selv, at funktionen endnu ikke er fastlagt. CRISPR-medopdageren Feng Zhang kalder fundet 'genuinely intriguing' og siger, det fortjener videre undersøgelse."],"whyItMatters":"Det er et eksempel på AI-agenter brugt til at accelerere arbejdskrævende screening i grundforskning – frem for selve opdagelsen af, hvad mønstrene betyder.","analysis":"Anthropic er selv part i sagen og har en åbenlys interesse i at vise modellernes nytteværdi, hvilket taler for at læse resultatet som lovende, men uafprøvet, indtil uafhængige laboratorier har set på ART-familiens funktion.","image":{"url":"https://www-cdn.anthropic.com/images/4zrzovbb/website/394de337d8a5d8db93a1c048fa1cb53e16a09625-2048x1240.jpg","credit":"Kilde: Anthropic","alt":"A scientist pipetting","sourceUrl":"https://www.anthropic.com/news/claude-discovers-novel-enzyme-system"},"topics":["AI","biotech"],"entities":["Anthropic","Claude","Feng Zhang"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":58,"decisionValue":45,"novelty":78,"sourceQuality":72,"personalRelevance":62,"contrast":58},"claims":[{"text":"About 950 Claude agents ran for 21 hours using 210M tokens, screening 200,000+ candidate reverse transcriptases down to a novel CRISPR-like enzyme family (ART), published as an unreviewed preprint.","sourceUrls":["https://www.anthropic.com/news/claude-discovers-novel-enzyme-system"],"confidence":"high"},{"text":"Feng Zhang called the finding 'genuinely intriguing' and said it merits further investigation.","sourceUrls":["https://www.anthropic.com/news/claude-discovers-novel-enzyme-system"],"confidence":"high"}],"sources":[{"title":"Claude discovers a novel enzyme system with CRISPR-like repeats","publisher":"Anthropic","url":"https://www.anthropic.com/news/claude-discovers-novel-enzyme-system","publishedAt":"2026-09-23T12:00:00Z","kind":"primary"}]},{"id":"story-irankrig-energipriser-2026-09-24","eventKey":"irankrig-energipriser-danske-omkostninger","materialFacts":["Green Power Denmark vurderer, at krigen i Iran har kostet danske virksomheder og forbrugere 10,6 mia. kr.","Olieprisen er steget fra 60-70 til over 100 dollar tønden, og gasprisen er næsten fordoblet siden februar."],"section":"Energi og geopolitik","headline":"Vinteren kan blive dyr: Irankrigen har allerede kostet danskerne milliardbeløb","primarySourceUrl":"https://ing.dk/artikel/vinteren-kan-blive-dyr-irankrigen-har-allerede-kostet-danskerne-milliardbeloeb","subheadline":"En opgørelse fra Green Power Denmark sætter tal på, hvad krigen mellem Israel og Iran indtil videre har kostet danske virksomheder og forbrugere i højere energiregninger.","body":["Ifølge Green Power Denmark har krigen i Iran indtil videre kostet danske virksomheder og forbrugere 10,6 milliarder kroner. En tønde olie kostede i februar mellem 60 og 70 dollar og koster nu over 100, mens naturgasprisen næsten er fordoblet i samme periode.","Green Power Denmark, der repræsenterer størstedelen af dansk elproduktion, venter på den baggrund den dyreste vinter i flere år, hvis konflikten fortsætter uændret."],"whyItMatters":"Regningen rammer bredt: både energitung industri, der konkurrerer på eksportmarkeder med faste marginer, og private husholdninger, der allerede har vænnet sig til svingende priser siden krigen i Ukraine.","analysis":"Tallet er brancheorganisationens eget skøn, ikke en uafhængigt revideret opgørelse, men retningen understøttes af de observerbare priser – en påmindelse om, hvor direkte en konflikt uden dansk eller europæisk part alligevel slår igennem på bundlinjen og varmeregningen.","image":{"url":"https://ing.dk/sites/mi/files/styles/open_graph_image_16_9/public/2026-09/20250803-095050-7-1920x1280web.jpg?itok=yJ5gO1KI","credit":"Kilde: Ingeniøren","alt":"Arkivfoto anvendt af Ingeniøren til dækningen af energiprisernes stigning","sourceUrl":"https://ing.dk/artikel/vinteren-kan-blive-dyr-irankrigen-har-allerede-kostet-danskerne-milliardbeloeb"},"topics":["energy-prices","geopolitics","macroeconomics"],"entities":["Green Power Denmark"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":65,"decisionValue":58,"novelty":55,"sourceQuality":78,"personalRelevance":62,"contrast":55},"claims":[{"text":"Green Power Denmark estimates the Iran war has cost Danish businesses and consumers 10.6 billion kroner so far, as oil moved from 60-70 to over 100 dollars a barrel and gas nearly doubled since February 2026.","sourceUrls":["https://ing.dk/artikel/vinteren-kan-blive-dyr-irankrigen-har-allerede-kostet-danskerne-milliardbeloeb"],"confidence":"medium"}],"sources":[{"title":"Vinteren kan blive dyr: Irankrigen har allerede kostet danskerne milliardbeløb","publisher":"Ingeniøren","url":"https://ing.dk/artikel/vinteren-kan-blive-dyr-irankrigen-har-allerede-kostet-danskerne-milliardbeloeb","publishedAt":"2026-09-23T09:45:00Z","kind":"reporting"}]},{"id":"story-fbi-shinyhunters-breach-2026-09-24","eventKey":"fbi-shinyhunters-data-breach","materialFacts":["ShinyHunters udnyttede en zero-day i Oracle PeopleSoft til at stjæle 2 TB FBI-medarbejderdata fra AWS GovCloud.","Gruppen siger, angrebet er hævn for en FBI-udmelding om et tidligere angreb, ikke pengeafpresning."],"section":"Cybersikkerhed","headline":"Verdensberømt hacker-gruppe stærkt fortørnet over udmelding fra politiet: Hacker politiets systemer som hævn","primarySourceUrl":"https://www.computerworld.dk/art/296939/verdensberoemt-hacker-gruppe-staerkt-fortoernet-over-udmelding-fra-politiet-hacker-politiets-systemer-som-haevn","subheadline":"Hackergruppen ShinyHunters har udnyttet en sårbarhed i FBI's jobopslags-side til at stjæle to terabyte data om ansatte – og siger selv, at angrebet er hævn, ikke pengeafpresning.","body":["Hackergruppen ShinyHunters har ifølge Computerworld udnyttet en zero day-sårbarhed i Oracle PeopleSoft på FBI's jobside til at hente to terabyte data om tidligere og nuværende medarbejdere fra FBI's filer på Amazons AWS GovCloud.","Gruppen slår selv fast, at angrebet ikke er økonomisk motiveret: »Dette er IKKE finansielt begrundet, Vi vil have FBI til at ændre eller tilbagetrække sine meldinger, som indeholder grundlæggende forkerte beskyldninger,« lyder det fra ShinyHunters, der svarer på en FBI-udmelding om et tidligere angreb på Canvas."],"whyItMatters":"At en gruppe kan bryde ind hos forbundspolitiets egne systemer via en velkendt sårbarhed i tredjeparts-software, minder om, at selv sikkerhedsmyndigheder er afhængige af den samme lappede infrastruktur som alle andre.","analysis":"Sagen adskiller sig fra almindelig cyberkriminalitet ved motivet: en magtkamp om et tidligere angreb, udkæmpet ved at stjæle flere data.","image":{"url":"https://www.computerworld.dk/fil/236627?width=1200&height=630&focus=1","credit":"Kilde: Computerworld","alt":"Illustration fra Computerworld til nyheden om ShinyHunters' angreb på FBI","sourceUrl":"https://www.computerworld.dk/art/296939/verdensberoemt-hacker-gruppe-staerkt-fortoernet-over-udmelding-fra-politiet-hacker-politiets-systemer-som-haevn"},"topics":["cybersecurity","national-security"],"entities":["ShinyHunters","FBI"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":60,"decisionValue":40,"novelty":55,"sourceQuality":68,"personalRelevance":30,"contrast":70},"claims":[{"text":"ShinyHunters breached the FBI's job-listi lsboe-Jørgensen kan ikke beslutte en udskydelse alene, men skal finde fælles fodslag i regeringen."],"whyItMatters":"For danske virksomheder er sagen et eksempel på den administrative byrde, EU's regulering kan pålægge – og på, hvor direkte én brancheorganisations lobbyarbejde kan forsinke en allerede vedtaget EU-regel.","analysis":"En udskydelse er ikke det samme som en afvisning af direktivet, men endnu en udsættelse rejser spørgsmålet, om Danmark reelt kan holde EU's tidsfrister, når hjemlige erhvervsinteresser presser på.","image":{"url":"https://legacy.altinget.dk/images/article/306454/161026.jpg","credit":"Kilde: Altinget","alt":"Illustration fra Altinget til dækningen af ligelønsdirektivet","sourceUrl":"https://www.altinget.dk/artikel/arbejdsgiverne-har-presset-haardt-paa-nu-er-regeringen-taet-paa-at-udskyde-omstridt-ligeloenslov-igen"},"topics":["regulatory-burden","eu-directive","dansk-erhverv"],"entities":["Ane Halsboe-Jørgensen","Dansk Arbejdsgiverforening","Jacob Holbraad","EU-Kommissionen"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":55,"decisionValue":55,"novelty":62,"sourceQuality":78,"personalRelevance":65,"contrast":50},"claims":[{"text":"The Danish government is reportedly close to delaying implementation of the EU pay-transparency directive for a second time, after months of pressure from employer body DA under director Jacob Holbraad.","sourceUrls":["https://www.altinget.dk/artikel/arbejdsgiverne-har-presset-haardt-paa-nu-er-regeringen-taet-paa-at-udskyde-omstridt-ligeloenslov-igen"],"confidence":"medium"},{"text":"The directive requires companies to produce detailed wage reports documenting equal pay between men and women for the same work.","sourceUrls":["https://www.altinget.dk/artikel/arbejdsgiverne-har-presset-haardt-paa-nu-er-regeringen-taet-paa-at-udskyde-omstridt-ligeloenslov-igen"],"confidence":"high"}],"sources":[{"title":"Arbejdsgiverne har presset hårdt på. Nu er regeringen tæt på at udskyde omstridt ligelønslov ige   // src/web/renderArchive.js
  function weekLabel(weekId) {

    return match ? `Uge ${Number(match[1])}` : weekId ?? "";
  }
  function periodEntry(entry, label) {
    if (entry.frozen) {
      const link = element("a", "archive-entry archive-entry-link", label);
      link.href = `${entry.id}.html`;
      link.addEventListener("click", (event) => event.stopPropagation());
      return link;
    }
    const span = element("span", "archive-entry archive-entry-empty", label);
    span.setAttribute("aria-disabled", "true");
    return span;
  }
  function renderMonth(month) {
    const box = element("details", "archive-month");
    const summary = element("summary", "archive-month-summary");
    summary.append(periodEntry(month, monthLabelFor(month.id)));
    box.append(summary);
    const weeks = element("ul", "archive-weeks");
    for (const week of month.weeks) {
      const item = element("li", "archive-week");
      item.append(periodEntry(week, weekLabel(week.id)));
      weeks.append(item);
    }
    box.append(weeks);
    return box;
  }
  function renderArchiveBrowser(index) {
    const root = element("div", "archive-browser");
    const years = index?.years ?? [];
    if (years.length === 0) {
      root.append(element("p", "archive-empty", "Arkivet er tomt indtil videre."));
      return root;
    }
    years.forEach((year, yearIndex) => {
      const box = element("details", "archive-year");
      if (yearIndex === 0) box.open = true;
      const summary = element("summary", "archive-year-summary");
      summary.append(periodEntry({ id: year.id, frozen: year.frozen }, String(year.year)));
      box.append(summary);
      for (const month of year.months) {
        box.append(renderMonth(month));
      }
      root.append(box);
    });
    return root;
  }

  // src/web/app.js
  function renderBrief(brief) {

    document.querySelector("#brief-reading-time").textContent = `${brief.readingMinutes} minutters l\xE6sning`;
    document.querySelector("#brief-title").textContent = brand();
    document.querySelector("#brief-dek").textContent = brief.dek;

    if (keyNumberSlot) {
      const keyNumberPanel = renderKeyNumber(brief.keyNumber);
      keyNumberSlot.replaceChildren(...keyNumberPanel ? [keyNumberPanel] : []);
      keyNumberSlot.hidden = !keyNumberPanel;
    }
    const klummeSlot = document.querySelector("#klumme-slot");
    if (klummeSlot) {

      klummeSlot.replaceChildren(...klummePanel ? [klummePanel] : []);
      klummeSlot.hidden = !klummePanel;
    }

    const storyGrid2 = document.querySelector("#story-grid");
    const leadSignals = document.querySelector("#lead-signals");
    const shortNews = document.querySelector("#short-news");
    const shortNewsSection = document.querySelector("#short-news-section");
    leadContainer.replaceChildren();
    storyGrid2.replaceChildren();
    leadSignals.replaceChildren(element("h2", "signals-title", "Morgenens signaler"));
    shortNews.replaceChildren();
    for (const story of brief.stories) {
      (story.isLead ? leadContainer : storyGrid2).append(renderStory(story));
    }
    for (const signal of brief.signals.slice(0, 4)) {
      leadSignals.append(renderSignal(signal));
    }
    const remainingSignals = brief.signals.slice(4);
    for (const signal of remainingSignals) shortNews.append(renderSignal(signal));
    shortNewsSection.hidden = remainingSignals.length === 0;
    renderRecommendations(brief.recommendations);
    renderQualityFooter(brief.quality);
  }
  async function sendFeedback(button, transport, reason) {
    const article = button.closest("article");
    const direction = button.dataset.direction ?? article.querySelector('[aria-pressed="true"]')?.dataset.direction;
    const isRecommendation = article.dataset.contentType === "recommendation";
    const payload = {
      storyId: article.dataset.storyId,
      browserId: getBrowserId(),
      direction,
      ...isRecommendation ? { contentType: "recommendation" } : {},
      ...reason ? { reason } : {},

        const pressed = active ? control.dataset.direction === direction : previousPressed[index] === "true";

        control.classList.toggle("is-selected", pressed);
      });
    };
    applyState(true);
    const reasonsPanel = article.querySelector(".feedback-reasons");
    if (reasonsPanel) reasonsPanel.hidden = false;
    localStorage.setItem(
      feedbackStorageKey(payload.storyId, payload.contentType),
      direction

    const status = document.querySelector("#feedback-status");
    if (status) status.textContent = "Feedback gemt";
    try {
      const result = await transport(payload);
      if (status && result?.status !== "saved") {
        status.textContent = "Gemt lokalt i denne browser \u2013 p\xE5virker ikke morgendagens udvalg";
      }
      return payload;
    } catch (error) {
      applyState(false);
      if (status) status.textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      throw error;
    }
  }
  function appsScriptTransport(payload) {

      globalThis.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveFeedback(payload);
    });
  }
  async function httpFeedbackTransport(payload, fetcher = globalThis.fetch) {
    const response = await fetcher(feedbackUrl(), {
      method: "POST",
      redirect: "follow",

  function defaultFeedbackTransport() {

  }
  function bindFeedback(transport = defaultFeedbackTransport()) {
    document.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-direction], button[data-reason]");
      if (!button) return;
      try {
        const directionButton = button.dataset.direction ? button : button.closest("article").querySelector('[data-direction][aria-pressed="true"]');
        if (!directionButton) return;
        const reasonButton = button.dataset.reason ? button : null;
        let rollbackReason = null;
        if (reasonButton) {
          const article = reasonButton.closest("article");
          const storyId = article?.dataset.storyId;
          const contentType = article?.dataset.contentType === "recommendation" ? "recommendation" : "story";
          const wasSelected = reasonButton.classList.contains("is-selected");
          reasonButton.classList.add("is-selected");
          reasonButton.setAttribute("aria-pressed", "true");
          if (storyId) rememberReason(storyId, contentType, reasonButton.dataset.reason);
          rollbackReason = () => {
            reasonButton.classList.toggle("is-selected", wasSelected);
            reasonButton.setAttribute("aria-pressed", String(wasSelected));
            if (storyId && !wasSelected) forgetReason(storyId, contentType, reasonButton.dataset.reason);
          };
        }
        try {
          await sendFeedback(directionButton, transport, button.dataset.reason);
        } catch (error) {
          rollbackReason?.();
          throw error;
        }
      } catch {
        const status = document.querySelector("#feedback-status");
        if (status) status.textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      }
    });
  }
  function bindReadLater() {
    const panel = document.querySelector("#read-later");
    document.addEventListener("click", (event) => {
      const save = event.target.closest("[data-save-story]");
      if (save) {
        toggleSaved({
          id: save.dataset.saveStory,
          headline: save.dataset.saveHeadline,
          url: save.dataset.saveUrl
        });
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const dismiss = event.target.closest("[data-readlater-dismiss]");
      if (dismiss) {
        clearSaved(dismiss.dataset.readlaterDismiss);
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const link = event.target.closest(".read-later-link");
      if (link?.href) {
        markOpened(link.href);
      }
    });
  }
  function buildNarrationSegments(brief) {
    const segments = [];
    if (brief.title) segments.push(brief.title);
    if (brief.dek) segments.push(brief.dek);
    const ordered = [...brief.stories].sort((a, b) => Number(b.isLead) - Number(a.isLead));
    for (const story of ordered) {
      if (story.headline) segments.push(story.headline);
      if (story.subheadline) segments.push(story.subheadline);
      if (Array.isArray(story.body)) {
        for (const paragraph of story.body) segments.push(paragraph);
      }
      if (story.whyItMatters) segments.push(story.whyItMatters);
      if (story.analysis) segments.push(story.analysis);
    }
    return segments.filter((segment) => typeof segment === "string" && segment.trim().length > 0);
  }
  function pickDanishVoice(synth) {
    const voices = synth.getVoices?.() ?? [];
    return voices.find((voice) => voice.lang === "da-DK") ?? voices.find((voice) => voice.lang?.toLowerCase().startsWith("da")) ?? null;
  }
  function createNarrator(brief, synth = globalThis.speechSynthesis) {

    let playing = false;
    const speakFrom = (start) => {
      synth.cancel();
      index = start;
      const voice = pickDanishVoice(synth);
      for (let i = start; i < segments.length; i += 1) {
        const utterance = new globalThis.SpeechSynthesisUtterance(segments[i]);
        utterance.lang = "da-DK";
        if (voice) utterance.voice = voice;
        utterance.rate = 1.05;
        utterance.onstart = () => {
          index = i;
        };
        if (i === segments.length - 1) {
          utterance.onend = () => {
            playing = false;
            api.onstatechange?.("stopped");

      api.onstatechange?.("playing");
    };

      onstatechange: null,
      play() {

          playing = true;
          api.onstatechange?.("playing");
          return;
        }

      },
      pause() {
        if (synth.speaking && !synth.paused) {
          synth.pause();
          playing = false;
          api.onstatechange?.("paused");

      resume() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");

      toggle() {

        index = 0;

  }
  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {
      slot.hidden = true;
      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";
      toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";

  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");

  function boot(brief = globalThis.__BRIEF_DATA__) {
