<!doctype html>
<html lang="da" data-chrome="minimal" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Thomas' Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),

.media-fallback-label {

.story-eyebrow {

.story-byline,

.story-headline {

.headline-link { text-decoration: none; }

.story-subheadline {

.story-card .story-subheadline {

.story-body,

.story-body p,

.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {

  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);

}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {

  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 90ms ease;
  /* Suppress the grey flash iOS paints over a tapped button, which otherwise
     competes with the :active state below, and remove the 300ms tap delay. */
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}
/* A tap must feel like a press. :hover and :focus-visible never fire on a touch
   tap, so before this the chip was visually inert on a phone and the reader had
   no way to tell the click had registered. :active gives the immediate press,
   .is-selected gives the lasting answer, matching .feedback-button above. */
.reason-chip:active {
  background: color-mix(in srgb, var(--ink) 12%, transparent);
  transform: scale(0.96);
}
.reason-chip.is-selected {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.reason-chip.is-selected:hover,
.reason-chip.is-selected:focus-visible {
  background: color-mix(in srgb, var(--ink) 86%, var(--paper));
}
@media (prefers-reduced-motion: reduce) {
  .reason-chip { transition: none; }
  .reason-chip:active { transform: none; }
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

/* A reader with only a daily edition gets no bar at all: three of the five
   edition links would 404, and the "Vis som" switcher is a question nobody
   asked. Keyed off <html data-chrome>, stamped at render time from the profile,
   so the bar is gone before first paint rather than flashing in and vanishing
   once the module boots. The bindings are skipped too (see bindEditionNav), so
   the links are absent from the DOM rather than merely invisible. */
:root[data-chrome="minimal"] .top-bar {
  display: none;
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {

sikofaktor for hele AI-boomet, og UBS vurderer, at Nvidia kan tabe over 50 milliarder dollars, hvis finansieringen strammes. Kreditspændet på AI-obligationer ligger nu omkring 140 basispoint mod under 100 for ikke-AI-selskaber."],"whyItMatters":"Modellen har fungeret, fordi Nvidias egne investeringer skabte efterspørgslen, der retfærdiggjorde flere chipkøb - en selvforstærkende cirkel. Alene i 2026 stod Nvidia for 129 VC-aftaler, 27 procent af global VC-dealværdi. Efter Huangs afgang ventes efterfølgeren at stramme finansieringen.","analysis":"Pointen er ikke, om AI er en boble, men at branchens vækst er finansieret af én leverandør, der nu skærer ned. Alene cloud-selskabet Lambda har Nvidia-garanterede lejeforpligtelser for knap 20 milliarder dollars.","image":{"url":"https://ugebrev.dk/wp-content/uploads/2021/01/bubble.jpg","credit":"Kilde: Økonomisk Ugebrev","alt":"Tech-nedtur? Nvidias finansieringsmodel vakler: Risiko for, at hele AI-boomet rammes af en kreditkrise","sourceUrl":"https://ugebrev.dk/finans/tech-nedtur-nvidias-finansieringsmodel-vakler-risiko-for-at-hele-ai-boomet-rammes-af-en-kreditkrise/"},"topics":["ai","makroekonomi","finans"],"entities":["Nvidia","Jensen Huang","Lambda","Goldman Sachs","UBS"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":75,"decisionValue":60,"novelty":70,"sourceQuality":75,"personalRelevance":70,"contrast":55},"claims":[{"text":"Nvidia havde ved udgangen af juli 2026 forpligtelser og garantier for 530 milliarder dollars.","sourceUrls":["https://ugebrev.dk/finans/tech-nedtur-nvidias-finansieringsmodel-vakler-risiko-for-at-hele-ai-boomet-rammes-af-en-kreditkrise/"],"confidence":"medium"},{"text":"Kreditspændet på AI-relaterede obligationer ligger omkring 140 basispoint mod under 100 for ikke-AI-selskaber, ifølge Goldman Sachs.","sourceUrls":["https://ugebrev.dk/finans/tech-nedtur-nvidias-finansieringsmodel-vakler-risiko-for-at-hele-ai-boomet-rammes-af-en-kreditkrise/"],"confidence":"medium"}],"sources":[{"title":"Tech-nedtur? Nvidias finansieringsmodel vakler: Risiko for, at hele AI-boomet rammes af en kreditkrise","publisher":"Økonomisk Ugebrev","url":"https://ugebrev.dk/finans/tech-nedtur-nvidias-finansieringsmodel-vakler-risiko-for-at-hele-ai-boomet-rammes-af-en-kreditkrise/","publishedAt":"2026-11-16T16:15:00Z","kind":"analysis"}]},{"id":"story-danish-crown-ceo-20261117","eventKey":"danish-crown-ceo-fired","materialFacts":["Bestyrelsen fyrede CEO Niels Ulrich Duedahl med øjeblikkelig virkning efter knap to år i rollen","Formand Søren Skou siger bestyrelsen vil have en profil tættere på driften","Skou rykker selv tættere på den daglige ledelse under søgningen efter ny CEO"],"section":"Erhverv","headline":"Danish Crown fyrer sin administrerende direktør","primarySourceUrl":"https://nyheder.tv2.dk/live/business/2026-11-16-danish-crown-fyrer-sin-administrerende-direktoer","subheadline":"Bestyrelsen afskediger Niels Ulrich Duedahl med øjeblikkelig virkning efter knap to år i stolen og vil nu have en profil tættere på driften.","body":["Danish Crowns bestyrelse har fyret administrerende direktør Niels Ulrich Duedahl med øjeblikkelig virkning. Duedahl tiltrådte i september 2024 og havde siddet knap to år i en periode med betydelig uro for selskabet og dets ejere, de danske svineproducenter.","Bestyrelsesformand Søren Skou siger, at Duedahl har ledet en nødvendig transformation i en svær periode, men at bestyrelsen nu ønsker en profil tættere på den daglige drift. Skou rykker selv tættere på ledelsen, mens der søges en efterfølger."],"whyItMatters":"Duedahl blev i sin tid hentet udefra som en strategisk profil. At bestyrelsen nu i stedet efterspørger driftsnærhed, signalerer, at Danish Crowns problemer opfattes som operationelle snarere end strategiske.","analysis":"Lederskiftet i en af Danmarks største eksport- og fødevarekoncerner er endnu et punkt på listen over, hvem der nu er i spil til nye topposter i dansk erhvervsliv.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/2/8/6/286ccebc-1255-4480-b6d3-6293eba32bda?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=MCwwLDgzNzgsNDcxOQ&s=50f516af688ff6855332245f4ab1f96b","credit":"Kilde: TV2","alt":"Danish Crown fyrer sin administrerende direktør","sourceUrl":"https://nyheder.tv2.dk/live/business/2026-11-16-danish-crown-fyrer-sin-administrerende-direktoer"},"topics":["erhverv","ledelse","foedevareindustri"],"entities":["Danish Crown","Niels Ulrich Duedahl","Søren Skou"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":70,"decisionValue":72,"novelty":80,"sourceQuality":75,"personalRelevance":85,"contrast":40},"claims":[{"text":"Danish Crowns bestyrelse fyrede CEO Niels Ulrich Duedahl med øjeblikkelig virkning.","sourceUrls":["https://nyheder.tv2.dk/live/business/2026-11-16-danish-crown-fyrer-sin-administrerende-direktoer"],"confidence":"high"}],"sources":[{"title":"Danish Crown fyrer sin administrerende direktør","publisher":"TV2","url":"https://nyheder.tv2.dk/live/business/2026-11-16-danish-crown-fyrer-sin-administrerende-direktoer","publishedAt":"2026-11-16T07:14:00Z","kind":"reporting"},{"title":"Danish Crown-topchef er fyret","publisher":"Altinget","url":"https://www.altinget.dk/erhverv/jobskifte/danish-crown-topchef-er-fyret","publishedAt":"2026-11-16T07:30:00Z","kind":"reporting"}]},{"id":"story-eu-steel-antidump-20261117","eventKey":"eu-steel-antidumping-cold-rolled","materialFacts":["Endelig antidumpingtold: Indien 9,5%, Japan 27,9%, Taiwan 20,7-27%, Tyrkiet 3-7,8%, Vietnam 16%","EU's hjemlige produktion af koldvalset stål findes i 12 lande og beskæftiger over 8.600 mennesker","Kommissionen fandt 'særlig markedssituation' i Indien og Taiwan"],"section":"EU og handel","headline":"Commission imposes anti-dumping duties on certain cold-rolled flat steel products","primarySourceUrl":"https://policy.trade.ec.europa.eu/news/commission-imposes-anti-dumping-duties-certain-cold-rolled-flat-steel-products-2026-11-16_en","subheadline":"EU-Kommissionen indfører told på op til 27,9 procent på importeret koldvalset stål fra fem lande efter en antidumpingundersøgelse.","body":["EU-Kommissionen har indført endelige antidumpingtold på koldvalsede, flade stålprodukter fra Indien, Japan, Taiwan, Tyrkiet og Vietnam, efter en undersøgelse konkluderede, at produkterne blev solgt til EU under dumpede priser. Tolden: 9,5 procent for Indien, 27,9 for Japan, 20,7-27 for Taiwan, 3-7,8 for Tyrkiet og 16 for Vietnam.","Importværdien fra de fem lande var samlet omkring 1,17 milliarder euro. Kommissionen fandt desuden, at Indien og Taiwan opererede under en særlig markedssituation, der forvrider priserne."],"whyItMatters":"EU's egen produktion af koldvalset stål findes i 12 lande og beskæftiger over 8.600 mennesker. Tolden beskytter produktionen, men fordyrer råvaren for virksomheder i bilindustri, hvidevarer og byggeri.","analysis":"Sagen viser, at EU's handelspolitik bruges aktivt til at skærme industrien, mens Kommissionen samtidig forhandler om at lette erhvervslivets byrder andre steder.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Rolled_coils_in_Tornio_Sep2008.jpg/1920px-Rolled_coils_in_Tornio_Sep2008.jpg","credit":"Foto: Wikimedia Commons","alt":"Koldvalsede stålcoils - den type produkt, EU nu lægger antidumpingtold på fra fem lande.","sourceUrl":"https://commons.wikimedia.org/wiki/File:Rolled_coils_in_Tornio_Sep2008.jpg"},"topics":["eu","handel","industri"],"entities":["EU-Kommissionen","Indien","Japan","Taiwan","Tyrkiet","Vietnam"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":60,"decisionValue":55,"novelty":70,"sourceQuality":90,"personalRelevance":75,"contrast":30},"claims":[{"text":"EU-Kommissionen har indført endelig antidumpingtold på koldvalset stål fra Indien (9,5%), Japan (27,9%), Taiwan (20,7-27%), Tyrkiet (3-7,8%) og Vietnam (16%).","sourceUrls":["https://policy.trade.ec.europa.eu/news/commission-imposes-anti-dumping-duties-certain-cold-rolled-flat-steel-products-2026-11-16_en"],"confidence":"high"}],"sources":[{"title":"Commission imposes anti-dumping duties on certain cold-rolled flat steel products","publisher":"Europa-Kommissionen","url":"https://policy.trade.ec.europa.eu/news/commission-imposes-anti-dumping-duties-certain-cold-rolled-flat-steel-products-2026-11-16_en","publishedAt":"2026-11-16T10:00:00Z","kind":"primary"}]},{"id":"story-togkaos-banedanmark-20261117","eventKey":"togkaos-banedanmark","materialFacts":["Skinnefejl og en udbrændt teknikhytte ved Aarup tvang Banedanmark til hastighedsnedsættelser","Forventes at vare omkring to uger","Flere togstrækninger ramt af aflysninger og forsinkelser"],"section":"Danmark","headline":"Togkaos vækker frustration landet over: 'Det er et mareridt'","primarySourceUrl":"https://www.dr.dk/nyheder/indland/reels/togkaos-vaekker-frustration-landet-over-det-er-et-mareridt","subheadline":"Skinnefejl og en udbrændt teknikhytte ved Aarup tvinger Banedanmark til landsdækkende hastighedsnedsættelser i op mod to uger.","body":["Tusindvis af togpassagerer landet over er de seneste dage blevet mødt af færre afgange og forsinkelser. Baggrunden er, at Banedanmark har indført hastighedsnedsættelser på flere strækninger efter skinnefejl og en udbrændt teknikhytte ved Aarup.","Banedanmark forventer, at situationen med aflysninger og forsinkelser vil vare omkring to uger, mens fejlene udbedres. Flere togstrækninger i landet er ramt, og rejsende beskriver morgenerne som kaotiske."],"whyItMatters":"Togkaos af denne varighed rammer bredt - fra pendlere til godstransport - og kommer i en periode, hvor den danske jernbane i øvrigt kæmper med et ekstraordinært antal skinnefejl og forsinkelser mellem København og Fredericia.","analysis":"For virksomheder, der er afhængige af rettidig godstransport eller medarbejdere, der pendler med tog, er to ugers landsdækkende forsinkelser en reel driftsomkostning - selv når den enkelte fejl i sig selv er lille.","topics":["danmark","transport"],"entities":["Banedanmark"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":50,"decisionValue":30,"novelty":50,"sourceQuality":80,"personalRelevance":40,"contrast":30},"claims":[{"text":"Banedanmark har indført landsdækkende hastighedsnedsættelser efter skinnefejl og en udbrændt teknikhytte ved Aarup, ventet at vare omkring to uger.","sourceUrls":["https://www.dr.dk/nyheder/indland/reels/togkaos-vaekker-frustration-landet-over-det-er-et-mareridt"],"confidence":"medium"}],"sources":[{"title":"Togkaos vækker frustration landet over: 'Det er et mareridt'","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/reels/togkaos-vaekker-frustration-landet-over-det-er-et-mareridt","publishedAt":"2026-11-16T07:00:00Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/hydra-odacache/api/Publication/Image/urn:dr:od3:clippublication:6afade0b27273300012b7879?imageId=de500d4e-a341-4052-bede-db8338a1d665&impolicy=featurecrop","credit":"Kilde: DR","alt":"Togkaos vækker frustration landet over: 'Det er et mareridt'","sourceUrl":"https://www.dr.dk/nyheder/indland/reels/togkaos-vaekker-frustration-landet-over-det-er-et-mareridt"}},{"id":"story-golf-olesen-pga-20261117","eventKey":"golf-olesen-pgacard","materialFacts":["Jacob Skov Olesen (27) sikrede sig et PGA Tour-kort for 2027","Sluttede på 6. plads ved DP World Tour Championship i Dubai efter en sidste runde på 4 under par","Vandt The Amateur Championship i 2024 som den første dansker"],"section":"Sport","headline":"Dansker sikrer sig adgang til golfens mest prestigefyldte tour","primarySourceUrl":"https://www.dr.dk/sporten/seneste-sport/dansker-sikrer-sig-adgang-til-golfens-mest-prestigefyldte-tour","subheadline":"Jacob Skov Olesen sluttede på en sjetteplads ved DP World Tour Championship i Dubai og sikrede sig dermed et PGA Tour-kort for 2027.","body":["Den danske golfspiller Jacob Skov Olesen har søndag sikret sig et PGA Tour-kort til næste sæson. Det skete, da han færdigspillede DP World Tour Championship i Dubai med en sjetteplads efter en sidste runde på fire slag under par.","Dermed har den 27-årige dansker point nok til at være blandt de ti spillere uden et PGA Tour-kort i forvejen, som belønnes med adgang til touren i 2027. Olesen får dobbelt medlemskab af DP World Tour og PGA Tour og vandt i 2024 som første dansker The Amateur Championship."],"whyItMatters":"Et PGA Tour-kort er den mest direkte vej til golfens bedste turneringer og største præmiepuljer. For dansk golf er endnu en dansker på PGA Touren et tegn på bredden i golfnationen.","analysis":"At Olesen sikrede kortet via sæsonens pointsystem snarere end kvalifikationsskolen, viser, at konsistens over en hel sæson nu tæller mindst lige så meget som enkeltstående gennembrud.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/pfffgzbr/20261115-111941-l_crop001.jpg","credit":"Kilde: DR","alt":"Jacob Skov Olesen, der har sikret sig et PGA Tour-kort for 2027.","sourceUrl":"https://www.dr.dk/sporten/seneste-sport/dansker-sikrer-sig-adgang-til-golfens-mest-prestigefyldte-tour"},"topics":["sport","golf"],"entities":["Jacob Skov Olesen","PGA Tour","DP World Tour"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":30,"decisionValue":15,"novelty":70,"sourceQuality":75,"personalRelevance":45,"contrast":25},"claims":[{"text":"Jacob Skov Olesen sluttede på en sjetteplads ved DP World Tour Championship i Dubai og sikrede sig dermed et PGA Tour-kort for 2027.","sourceUrls":["https://www.dr.dk/sporten/seneste-sport/dansker-sikrer-sig-adgang-til-golfens-mest-prestigefyldte-tour"],"confidence":"high"}],"sources":[{"title":"Dansker sikrer sig adgang til golfens mest prestigefyldte tour","publisher":"DR","url":"https://www.dr.dk/sporten/seneste-sport/dansker-sikrer-sig-adgang-til-golfens-mest-prestigefyldte-tour","publishedAt":"2026-11-15T11:56:00Z","kind":"reporting"}]},{"id":"story-novo-wegovy-step-20261117","eventKey":"novo-wegovy-step-young-pediatric","materialFacts":["STEP Young fase 3-studie, 6-12 år, 167 børn (112 semaglutid/55 placebo)","BMI-ændring ved uge 68: -17,4% semaglutid mod +2,2% placebo","40,4% af de behandlede børn var ikke længere klassificeret som overvægtige mod 0% placebo","Resultater offentliggjort i NEJM og præsenteret på ObesityWeek 2026"],"section":"Sundhed","headline":"Novo Nordisks Wegovy gav markant BMI-fald hos børn med svær overvægt i studie","primarySourceUrl":"https://ugebrev.dk/flashnews/novo-nordisks-wegovy-gav-markant-bmi-fald-hos-boern-med-svaer-overvaegt-i-studie/","subheadline":"Fase 3-studiet STEP Young viste et BMI-fald på 17,4 procent hos børn mellem 6 og 12 år efter 68 uger med semaglutid, mod en stigning på 2,2 procent i placebogruppen.","body":["Novo Nordisk har offentliggjort resultater fra fase 3-studiet STEP Young af semaglutid (Wegovy) hos børn med svær overvægt. Studiet omfattede 167 børn mellem 6 og under 12 år - 112 fik semaglutid, 55 fik placebo - kombineret med kostomlægning og mere fysisk aktivitet.","Efter 68 uger var BMI faldet 17,4 procent i semaglutid-gruppen mod en stigning på 2,2 procent i placebogruppen. 40,4 procent af børnene på semaglutid var ikke længere klassificeret som overvægtige, mod 0 procent i placebogruppen."],"whyItMatters":"Resultaterne er offentliggjort i New England Journal of Medicine og præsenteret på ObesityWeek 2026, uden uventede bivirkninger eller tegn på negativ påvirkning af børnenes vækst eller pubertet.","analysis":"Et positivt resultat hos børn udvider potentielt Wegovys marked og er relevant for Novo Nordisks indtjening, der udgør en betydelig andel af dansk eksport.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Ozempic%C2%AE_3ml.jpg/1920px-Ozempic%C2%AE_3ml.jpg","credit":"Foto: Wikimedia Commons","alt":"Arkivfoto af en injektionspen med semaglutid fra Novo Nordisk, her i Ozempic-udgaven; Wegovy anvender samme type pen.","sourceUrl":"https://commons.wikimedia.org/wiki/File:Ozempic%C2%AE_3ml.jpg"},"topics":["sundhed","eksport","dansk-oekonomi"],"entities":["Novo Nordisk","Wegovy"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":65,"decisionValue":40,"novelty":70,"sourceQuality":75,"personalRelevance":70,"contrast":35},"claims":[{"text":"I STEP Young-studiet faldt BMI 17,4% med semaglutid mod en stigning på 2,2% med placebo efter 68 uger hos børn 6-12 år.","sourceUrls":["https://ugebrev.dk/flashnews/novo-nordisks-wegovy-gav-markant-bmi-fald-hos-boern-med-svaer-overvaegt-i-studie/"],"confidence":"high"}],"sources":[{"title":"Novo Nordisks Wegovy gav markant BMI-fald hos børn med svær overvægt i studie","publisher":"Økonomisk Ugebrev","url":"https://ugebrev.dk/flashnews/novo-nordisks-wegovy-gav-markant-bmi-fald-hos-boern-med-svaer-overvaegt-i-studie/","publishedAt":"2026-11-16T15:34:00Z","kind":"reporting"}]},{"id":"story-svensk-teen-drab-20261117","eventKey":"svensk-teenager-bestillingsdrab","materialFacts":["Svensk teenager (15 år og 2 måneder ved gerningen) idømt 5 år og 6 måneder for forsøg på bestillingsmord i Danmark","Var 15 år og 2 måneder ved gerningen; politiet har aldrig opklaret det tiltænkte mål","29-årig medsammensvoren idømt 7 år; 28-årig våbenleverandør idømt 2 år og 3 måneder"],"section":"Danmark","headline":"Hidtil yngste svenske dreng idømmes fem et halvt år for drabsforsøg","primarySourceUrl":"https://nyheder.tv2.dk/krimi/2026-11-16-hidtil-yngste-svenske-dreng-idoemmes-fem-et-halvt-aar-for-drabsforsoeg","subheadline":"En svensk teenager er idømt fængsel for at lade sig hyre til et bestillingsdrab i Danmark, som politiet aldrig fik opklaret det tiltænkte mål for.","body":["En svensk dreng er af Retten i Lyngby idømt fem år og seks måneders fængsel for at lade sig hyre til et drab i Danmark sidste sommer. Han var kun 15 år og to måneder, da han blev indlogeret i en lejlighed i Værløse - den yngste i en række unge svenskere dømt for lignende sager.","Drengen medbragte en pistol med 13 patroner, en latexmaske og engangshandsker. Politiet har aldrig opklaret, hvem der skulle dræbes. En 29-årig, der skaffede lejligheden og mad, fik syv års fængsel; en 28-årig, der leverede våbnet, fik to år og tre måneder."],"whyItMatters":"Sagen er endnu et eksempel på et mønster, politiet har advaret om: netværk i Sverige rekrutterer stadig yngre teenagere til bestillingsdrab, fordi børn under den kriminelle lavalder giver lavere strafferisiko.","analysis":"At hverken offer eller bagmand er identificeret, mens kun de udøvende straffes, viser, hvor svært det er at komme til bunds i denne kriminalitet.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/8/9/7/8973beb7-371a-45be-ad07-d1c2700b5e84?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=MCwzNjIsNjk0MywzOTA1&s=da67dd142f5f56a5fa2ae9f3a78248e0","credit":"Kilde: TV2","alt":"Arkivfoto fra sagen om det planlagte bestillingsdrab i Værløse, som en svensk teenager er dømt for.","sourceUrl":"https://nyheder.tv2.dk/krimi/2026-11-16-hidtil-yngste-svenske-dreng-idoemmes-fem-et-halvt-aar-for-drabsforsoeg"},"topics":["danmark","kriminalitet"],"entities":["Retten i Lyngby","Værløse"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":50,"decisionValue":20,"novelty":70,"sourceQuality":75,"personalRelevance":15,"contrast":65},"claims":[{"text":"En svensk teenager, der var 15 år og 2 måneder ved gerningen, er idømt 5 år og 6 måneders fængsel for forsøg på bestillingsmord i Danmark; en 29-årig medsammensvoren fik 7 år.","sourceUrls":["https://nyheder.tv2.dk/krimi/2026-11-16-hidtil-yngste-svenske-dreng-idoemmes-fem-et-halvt-aar-for-drabsforsoeg"],"confidence":"high"}],"sources":[{"title":"Hidtil yngste svenske dreng idømmes fem et halvt år for drabsforsøg","publisher":"TV2","url":"https://nyheder.tv2.dk/krimi/2026-11-16-hidtil-yngste-svenske-dreng-idoemmes-fem-et-halvt-aar-for-drabsforsoeg","publishedAt":"2026-11-16T13:11:00Z","kind":"reporting"}]},{"id":"story-nvidia-huang-reject-20261117","eventKey":"nvidia-board-rejects-huang-return","materialFacts":["Nvidias bestyrelse overvejer ikke at genindsætte Jensen Huang som topch         range: "#brief-range",
        readingTime: "#brief-reading-time",
        title: "#brief-title",
        dek: "#brief-dek",
        featuredGrid: "#featured-grid",
        threads: "#threads",
        moreGrid: "#more-year-grid",
        numbers: "#year-numbers",
        numbersSection: "#year-numbers-section",
        shortNews: "#short-news"
      }
    });
  }

  // src/web/renderArchive.js
  function weekLabel(weekId) {
    const match = /^\d{4}-W(\d{2})$/.exec(weekId ?? "");
    return match ? `Uge ${Number(match[1])}` : weekId ?? "";
  }
  function periodEntry(entry, label) {
    if (entry.frozen) {
      const link = element("a", "archive-entry archive-entry-link", label);
      link.href = `${entry.id}.html`;
      link.addEventListener("click", (event) => event.stopPropagation());
      return link;
    }
    const span = element("span", "archive-entry archive-entry-empty", label);
    span.setAttribute("aria-disabled", "true");
    return span;
  }
  function renderMonth(month) {
    const box = element("details", "archive-month");
    const summary = element("summary", "archive-month-summary");
    summary.append(periodEntry(month, monthLabelFor(month.id)));
    box.append(summary);
    const weeks = element("ul", "archive-weeks");
    for (const week of month.weeks) {
      const item = element("li", "archive-week");
      item.append(periodEntry(week, weekLabel(week.id)));
      weeks.append(item);
    }
    box.append(weeks);
    return box;
  }
  function renderArchiveBrowser(index) {
    const root = element("div", "archive-browser");
    const years = index?.years ?? [];
    if (years.length === 0) {
      root.append(element("p", "archive-empty", "Arkivet er tomt indtil videre."));
      return root;
    }
    years.forEach((year, yearIndex) => {
      const box = element("details", "archive-year");
      if (yearIndex === 0) box.open = true;
      const summary = element("summary", "archive-year-summary");
      summary.append(periodEntry({ id: year.id, frozen: year.frozen }, String(year.year)));
      box.append(summary);
      for (const month of year.months) {
        box.append(renderMonth(month));
      }
      root.append(box);
    });
    return root;
  }

  // src/web/app.js
  function renderBrief(brief) {
    document.querySelector("#brief-date").textContent = formatDate(brief.date);
    document.querySelector("#brief-reading-time").textContent = `${brief.readingMinutes} minutters l\xE6sning`;
    document.querySelector("#brief-title").textContent = brand();
    document.querySelector("#brief-dek").textContent = brief.dek;
    const keyNumberSlot = document.querySelector("#key-number-slot");
    if (keyNumberSlot) {
      const keyNumberPanel = renderKeyNumber(brief.keyNumber);
      keyNumberSlot.replaceChildren(...keyNumberPanel ? [keyNumberPanel] : []);
      keyNumberSlot.hidden = !keyNumberPanel;
    }
    const klummeSlot = document.querySelector("#klumme-slot");
    if (klummeSlot) {
      const klummePanel = renderColumn(brief.column);
      klummeSlot.replaceChildren(...klummePanel ? [klummePanel] : []);
      klummeSlot.hidden = !klummePanel;
    }
    const leadContainer = document.querySelector("#lead-story");
    const storyGrid2 = document.querySelector("#story-grid");
    const leadSignals = document.querySelector("#lead-signals");
    const shortNews = document.querySelector("#short-news");
    const shortNewsSection = document.querySelector("#short-news-section");
    leadContainer.replaceChildren();
    storyGrid2.replaceChildren();
    leadSignals.replaceChildren(element("h2", "signals-title", "Morgenens signaler"));
    shortNews.replaceChildren();
    for (const story of brief.stories) {
      (story.isLead ? leadContainer : storyGrid2).append(renderStory(story));
    }
    for (const signal of brief.signals.slice(0, 4)) {
      leadSignals.append(renderSignal(signal));
    }
    const remainingSignals = brief.signals.slice(4);
    for (const signal of remainingSignals) shortNews.append(renderSignal(signal));
    shortNewsSection.hidden = remainingSignals.length === 0;
    renderRecommendations(brief.recommendations);
    renderQualityFooter(brief.quality);
  }
  async function sendFeedback(button, transport, reason) {
    const article = button.closest("article");
    const direction = button.dataset.direction ?? article.querySelector('[aria-pressed="true"]')?.dataset.direction;
    const isRecommendation = article.dataset.contentType === "recommendation";
    const payload = {
      storyId: article.dataset.storyId,
      browserId: getBrowserId(),
      direction,
      ...isRecommendation ? { contentType: "recommendation" } : {},
      ...reason ? { reason } : {},
      createdAt: (/* @__PURE__ */ new Date()).toISOString()
    };
    const directionButtons = [...article.querySelectorAll("button[data-direction]")];
    const previousPressed = directionButtons.map((control) => control.getAttribute("aria-pressed"));
    const applyState = (active) => {
      directionButtons.forEach((control, index) => {
        const pressed = active ? control.dataset.direction === direction : previousPressed[index] === "true";
        control.setAttribute("aria-pressed", String(pressed));
        control.classList.toggle("is-selected", pressed);
      });
    };
    applyState(true);
    const reasonsPanel = article.querySelector(".feedback-reasons");
    if (reasonsPanel) reasonsPanel.hidden = false;
    localStorage.setItem(
      feedbackStorageKey(payload.storyId, payload.contentType),
      direction
    );
    const status = document.querySelector("#feedback-status");
    if (status) status.textContent = "Feedback gemt";
    try {
      const result = await transport(payload);
      if (status && result?.status !== "saved") {
        status.textContent = "Gemt lokalt i denne browser \u2013 p\xE5virker ikke morgendagens udvalg";
      }
      return payload;
    } catch (error) {
      applyState(false);
      if (status) status.textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      throw error;
    }
  }
  function appsScriptTransport(payload) {
    if (!globalThis.google?.script?.run) {
      return Promise.resolve({ status: "saved-local" });
    }
    return new Promise((resolve, reject) => {
      globalThis.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveFeedback(payload);
    });
  }
  async function httpFeedbackTransport(payload, fetcher = globalThis.fetch) {
    const response = await fetcher(feedbackUrl(), {
      method: "POST",
      redirect: "follow",
      headers: { "content-type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "feedback", ...payload })

    if (!response.ok) {

    }

  }
  function defaultFeedbackTransport() {

    if (url) return (payload) => httpFeedbackTransport(payload);
    if (globalThis.google?.script?.run) return appsScriptTransport;
    return () => Promise.resolve({ status: "saved-local" });
  }
  function bindFeedback(transport = defaultFeedbackTransport()) {
    document.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-direction], button[data-reason]");
      if (!button) return;
      try {
        const directionButton = button.dataset.direction ? button : button.closest("article").querySelector('[data-direction][aria-pressed="true"]');
        if (!directionButton) return;
        const reasonButton = button.dataset.reason ? button : null;
        let rollbackReason = null;
        if (reasonButton) {
          const article = reasonButton.closest("article");
          const storyId = article?.dataset.storyId;
          const contentType = article?.dataset.contentType === "recommendation" ? "recommendation" : "story";
          const wasSelected = reasonButton.classList.contains("is-selected");
          reasonButton.classList.add("is-selected");
          reasonButton.setAttribute("aria-pressed", "true");
          if (storyId) rememberReason(storyId, contentType, reasonButton.dataset.reason);
          rollbackReason = () => {
            reasonButton.classList.toggle("is-selected", wasSelected);
            reasonButton.setAttribute("aria-pressed", String(wasSelected));
            if (storyId && !wasSelected) forgetReason(storyId, contentType, reasonButton.dataset.reason);
          };
        }
        try {
          await sendFeedback(directionButton, transport, button.dataset.reason);
        } catch (error) {
          rollbackReason?.();
          throw error;
        }
      } catch {
        const status = document.querySelector("#feedback-status");
        if (status) status.textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      }
    });
  }
  function bindReadLater() {
    const panel = document.querySelector("#read-later");
    document.addEventListener("click", (event) => {
      const save = event.target.closest("[data-save-story]");
      if (save) {
        toggleSaved({
          id: save.dataset.saveStory,
          headline: save.dataset.saveHeadline,
          url: save.dataset.saveUrl
        });
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const dismiss = event.target.closest("[data-readlater-dismiss]");
      if (dismiss) {
        clearSaved(dismiss.dataset.readlaterDismiss);
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const link = event.target.closest(".read-later-link");
      if (link?.href) {
        markOpened(link.href);
      }
    });
  }
  function buildNarrationSegments(brief) {
    const segments = [];
    if (brief.title) segments.push(brief.title);
    if (brief.dek) segments.push(brief.dek);
    const ordered = [...brief.stories].sort((a, b) => Number(b.isLead) - Number(a.isLead));
    for (const story of ordered) {
      if (story.headline) segments.push(story.headline);
      if (story.subheadline) segments.push(story.subheadline);
      if (Array.isArray(story.body)) {
        for (const paragraph of story.body) segments.push(paragraph);
      }
      if (story.whyItMatters) segments.push(story.whyItMatters);
      if (story.analysis) segments.push(story.analysis);
    }
    return segments.filter((segment) => typeof segment === "string" && segment.trim().length > 0);
  }
  function pickDanishVoice(synth) {
    const voices = synth.getVoices?.() ?? [];
    return voices.find((voice) => voice.lang === "da-DK") ?? voices.find((voice) => voice.lang?.toLowerCase().startsWith("da")) ?? null;
  }
  function createNarrator(brief, synth = globalThis.speechSynthesis) {
    if (!synth || typeof globalThis.SpeechSynthesisUtterance !== "function") return null;
    const segments = buildNarrationSegments(brief);
    if (!segments.length) return null;
    let index = 0;
    let playing = false;
    const speakFrom = (start) => {
      synth.cancel();
      index = start;
      const voice = pickDanishVoice(synth);
      for (let i = start; i < segments.length; i += 1) {
        const utterance = new globalThis.SpeechSynthesisUtterance(segments[i]);
        utterance.lang = "da-DK";
        if (voice) utterance.voice = voice;
        utterance.rate = 1.05;
        utterance.onstart = () => {
          index = i;
        };
        if (i === segments.length - 1) {
          utterance.onend = () => {
            playing = false;
            api.onstatechange?.("stopped");
          };
        }
        synth.speak(utterance);
      }
      playing = true;
      api.onstatechange?.("playing");
    };
    const api = {
      onstatechange: null,
      play() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
          return;
        }
        speakFrom(0);
      },
      pause() {
        if (synth.speaking && !synth.paused) {
          synth.pause();
          playing = false;
          api.onstatechange?.("paused");
        }
      },
      resume() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
        }
      },
      toggle() {
        if (synth.speaking && !synth.paused) {
          api.pause();
        } else if (synth.paused) {
          api.resume();
        } else {
          speakFrom(0);
        }
      },
      stop() {
        synth.cancel();
        index = 0;
        playing = false;
        api.onstatechange?.("stopped");
      },
      get isPlaying() {
        return playing;
      }
    };
    return api;
  }
  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {
      slot.hidden = true;
      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";
      toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";
      toggleButton.setAttribute("aria-pressed", String(active));
      stopButton.disabled = state === "stopped";
    };
    toggleButton.addEventListener("click", () => narrator.toggle());
    stopButton.addEventListener("click", () => narrator.stop());

    slot.replaceChildren(toggleButton, stopButton);
    return narrator;
  }
  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }
    bindEditionNav("archive");
    bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
