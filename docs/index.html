<!doctype html>
<html lang="da" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Dagens Kompas</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}

suspension of the EU rebalancing measures against the United States","publisher":"European Commission — DG Trade","url":"https://policy.trade.ec.europa.eu/news/eu-extends-suspension-eu-rebalancing-measures-against-united-states-2026-07-31_en","publishedAt":"2026-07-31T00:00:00.000Z","kind":"primary"}]},{"id":"story-eu-steel-scope-consultation-20260802","eventKey":"eu-steel-regulation-product-scope-consultation","section":"Handelspolitik","headline":"EU Steel Regulation: Commission launches targeted consultation on first product scope review","primarySourceUrl":"https://policy.trade.ec.europa.eu/news/eu-steel-regulation-commission-launches-targeted-consultation-first-product-scope-review-2026-07-30_en","subheadline":"Otte uger til at få tråd, rør og smedede stænger ind eller ud af 50-procentstolden. Det rammer aftagerne, ikke stålværkerne.","body":["Kommissionen åbnede 28. juli en høring om produktdækningen i EU's nye stålforordning (EU) 2026/1384, i kraft 1. juli. Den har en toldfri kvote på 18,3 mio. ton og 50 pct. told på al import derudover.","Fire varegrupper skal vurderes: rør og hule profiler af støbejern, tråd af ulegeret og legeret stål, tråd af rustfrit stål samt smedede stænger. Høringen lukker 28. september; vurderingen skal være færdig 31. december."],"whyItMatters":"Udvidelsen rammer ikke stålværkerne, men de aftagende led. Dansk industri, der importerer tråd, rør og smedede stænger som input til pumper, vindmøllekomponenter, beslag og byggeelementer, risikerer 50 pct. told på import ud over kvoten.","analysis":"De otte uger er det eneste vindue, hvor aftagerne kan få egne mængde- og pristal ind i vurderingen. Det er en afgrænset sag, hvor ét velunderbygget høringssvar faktisk kan flytte produktdækningen.","topics":["handelspolitik","stål","told","EU-regulering","industri"],"entities":["Europa-Kommissionen","DG Trade","EU","Kina"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":78,"decisionValue":92,"novelty":71,"sourceQuality":97,"personalRelevance":90,"contrast":55},"materialFacts":["Consultation opened 28 July 2026 and runs eight weeks, closing 28 September 2026","Announced by DG Trade 30 July 2026","Regulation (EU) 2026/1384 entered into force 1 July 2026","Duty-free tariff-rate quota of 18.3 million tonnes; out-of-quota duty of 50%","Product scope assessment required under Article 12.1, to be finalised by 31 December 2026","Four candidate categories: tubes, pipes and hollow profiles of cast iron; non-alloy and other alloy wire; stainless wire; non-alloy and other alloy forged bars","Target respondents: steel producers, steel users, traders, importers, industry associations and other stakeholders"],"claims":[{"text":"Høringen om produktdækningen i forordning (EU) 2026/1384 løber otte uger og lukker 28. september 2026.","sourceUrls":["https://policy.trade.ec.europa.eu/news/eu-steel-regulation-commission-launches-targeted-consultation-first-product-scope-review-2026-07-30_en"],"confidence":"high"},{"text":"Ordningen har en toldfri kvote på 18,3 mio. ton og 50 pct. told på import derudover.","sourceUrls":["https://policy.trade.ec.europa.eu/news/eu-steel-regulation-commission-launches-targeted-consultation-first-product-scope-review-2026-07-30_en"],"confidence":"high"}],"sources":[{"title":"EU Steel Regulation: Commission launches targeted consultation on first product scope review","publisher":"European Commission — DG Trade","url":"https://policy.trade.ec.europa.eu/news/eu-steel-regulation-commission-launches-targeted-consultation-first-product-scope-review-2026-07-30_en","publishedAt":"2026-07-30T00:00:00.000Z","kind":"primary"}]},{"id":"story-outokumpu-europe-president-20260802","eventKey":"outokumpu-leadership-europe-2026","section":"Navne","headline":"Changes in Outokumpu Leadership Team - Matthieu Jehl appointed as President, business area Europe","primarySourceUrl":"https://view.news.eu.nasdaq.com/view?id=bf0074fc2658fcb98d8b7909e52448021&lang=en&src=listed","subheadline":"Europas største producent af rustfrit stål samler sin europæiske forretning under én mand — i Krefeld, ikke i Helsinki.","body":["Finske Outokumpu udnævnte 31. juli franskmanden Matthieu Jehl til President for det nye forretningsområde Europe fra 1. august. Han kom fra Stainless Europe og har siddet i koncernledelsen siden 2025. Samtidig forlader Rolf Schencking, President for Advanced Materials, virksomheden.","De to forretningslinjer lægges sammen under én europæisk ledelse som led i EVOLVE-strategien. Jehl har base i Krefeld i Tyskland og refererer til koncernchef Kati ter Horst. Koncernen omsatte for 5,5 mia. euro i 2025."],"whyItMatters":"Stål er det mest betændte handelspolitiske dossier mellem EU og USA, og Outokumpu er den europæiske industris tungeste stemme i den diskussion.","analysis":"At tyngdepunktet flytter fra Helsinki til Krefeld placerer beslutningerne tættere på det tyske marked, netop mens Kommissionen skal afgøre, hvilke stålvarer 50-procentstolden rammer. Samtidig frigives en senior materialeprofil til markedet.","topics":["navne","stålindustri","handelspolitik","Norden","industri"],"entities":["Outokumpu Oyj","Matthieu Jehl","Rolf Schencking","Kati ter Horst","Finland","Tyskland"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":62,"decisionValue":84,"novelty":79,"sourceQuality":95,"personalRelevance":92,"contrast":58},"materialFacts":["Matthieu Jehl udnævnt til President, business area Europe i Outokumpu med virkning fra 1. august 2026; meddelelse offentliggjort 31. juli 2026","Jehl kom fra posten som President, business line Stainless Europe, og har siddet i koncernledelsen siden 2025","Rolf Schencking, President for business line Advanced Materials, forlader virksomheden","Forretningslinjerne Stainless Europe og Advanced Materials lægges sammen under ét forretningsområde Europe med to kommercielle organisationer","Jehl er fransk statsborger med base i Krefeld, Tyskland, og refererer til koncernchef Kati ter Horst","Outokumpu: 5,5 mia. euro i omsætning i 2025, ca. 8.600 ansatte, hovedkontor i Helsinki, produktion i Finland, Tyskland, Sverige, Holland, USA og Mexico"],"claims":[{"text":"Matthieu Jehl er udnævnt til President for Outokumpus nye forretningsområde Europe med virkning fra 1. august 2026.","sourceUrls":["https://view.news.eu.nasdaq.com/view?id=bf0074fc2658fcb98d8b7909e52448021&lang=en&src=listed"],"confidence":"high"},{"text":"Rolf Schencking, President for Advanced Materials og medlem af koncernledelsen, forlader Outokumpu.","sourceUrls":["https://view.news.eu.nasdaq.com/view?id=bf0074fc2658fcb98d8b7909e52448021&lang=en&src=listed"],"confidence":"high"}],"sources":[{"title":"Changes in Outokumpu Leadership Team - Matthieu Jehl appointed as President, business area Europe","publisher":"Outokumpu Oyj (Nasdaq Helsinki company announcement)","url":"https://view.news.eu.nasdaq.com/view?id=bf0074fc2658fcb98d8b7909e52448021&lang=en&src=listed","publishedAt":"2026-07-31T08:00:00.000Z","kind":"primary"}]},{"id":"story-dk-ledighed-juni-20260802","eventKey":"dk-bruttoledighed-juni-2026","section":"Dansk økonomi","headline":"Ledigheden steg med 500 i juni","primarySourceUrl":"https://www.dst.dk/da/Statistik/nyheder-analyser-publ/nyt/NytHtml?cid=52324","subheadline":"Fjerde måned i træk med stigende ledighed — samtidig med at industrien melder mangel på efterspørgsel, ikke på hænder.","body":["Bruttoledigheden steg med 500 til 93.800 fuldtidspersoner fra maj til juni; ledighedsprocenten var uændret på 3,1 pct. Hele stigningen lå hos dagpengemodtagerne, der voksede med 600 til 78.500.","Det er fjerde måned i træk: 92.100 i marts, 92.700 i april, 93.400 i maj, 93.800 i juni. Vestjylland har landets laveste ledighed på 2,2 pct., Byen København den højeste på 3,9 pct."],"whyItMatters":"Arbejdskraftmangel har i over et årti været dansk erhvervslivs hovedargument over for både Christiansborg og Bruxelles. Danmarks Statistiks eget konjunkturbarometer fra 22. juli siger nu det modsatte.","analysis":"Mangel på efterspørgsel er nu den mest udbredte produktionsbegrænsning i industrien (43 pct.), byggeriet (24 pct.) og servicefagene (34 pct.). Det modsiger det argument, der har båret dansk erhvervspolitik i ti år — værd at have en holdning til før efterårets arbejdsudbudsdiskussion.","topics":["dansk økonomi","arbejdsmarked","ledighed","konjunktur"],"entities":["Danmarks Statistik","Danmark","Vestjylland","Byen København"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":74,"decisionValue":80,"novelty":58,"sourceQuality":99,"personalRelevance":86,"contrast":77},"materialFacts":["Bruttoledigheden steg 500 til 93.800 fuldtidspersoner fra maj til juni 2026 (sæsonkorrigeret, Danmark)","Ledighedsprocenten uændret på 3,1 pct. af arbejdsstyrken","Ledige dagpengemodtagere +600 til 78.500 fuldtidspersoner; kontanthjælpsmodtagere -100 til 15.400","Sæsonkorrigeret forløb 2026: marts 92.100, april 92.700, maj 93.400, juni 93.800","Laveste ledighed i Vestjylland med 2,2 pct.; højeste i Byen København med 3,9 pct.","Ledighedsprocenten steg 0,1 procentpoint i Byen København, på Fyn og på Bornholm; uændret i landets øvrige otte landsdele","Aldersfordeling: 16-24-årige 1,6 pct., 25-29-årige 4,9 pct.; mænd 3,0 pct., kvinder 3,1 pct.","Kilde: statistikbanken.dk/aus07; tal for marts, april og maj revideret med effekt tæt på nul","Kontekst fra DST 22. juli: erhvervstillidsindikatoren steg til 105,4 i juli fra 101,1 i juni; industriens beskæftigelsesforventning minus 9 i juli mod minus 21 i juni"],"claims":[{"text":"Bruttoledigheden steg med 500 til 93.800 fuldtidspersoner fra maj til juni 2026; ledighedsprocenten var uændret på 3,1 pct.","sourceUrls":["https://www.dst.dk/da/Statistik/nyheder-analyser-publ/nyt/NytHtml?cid=52324"],"confidence":"high"},{"text":"Mangel på efterspørgsel er den mest udbredte produktionsbegrænsning i industrien, byggeriet og serviceerhvervene.","sourceUrls":["https://www.dst.dk/da/Statistik/nyheder-analyser-publ/nyt/NytHtml?cid=52462"],"confidence":"high"}],"sources":[{"title":"Ledigheden steg med 500 i juni","publisher":"Danmarks Statistik","url":"https://www.dst.dk/da/Statistik/nyheder-analyser-publ/nyt/NytHtml?cid=52324","publishedAt":"2026-07-30T00:00:00.000Z","kind":"primary"},{"title":"Mangel på efterspørgsel begrænser erhvervslivet","publisher":"Danmarks Statistik","url":"https://www.dst.dk/da/Statistik/nyheder-analyser-publ/nyt/NytHtml?cid=52462","publishedAt":"2026-07-22T00:00:00.000Z","kind":"primary"}]},{"id":"story-dk-foedevaremoms-provenu-20260802","eventKey":"dk-foedevaremoms-provenutab-2026","section":"Dansk økonomi","headline":"Lavere moms på mad forventes at koste 17,4 milliarder årligt","primarySourceUrl":"https://www.dr.dk/nyheder/politik/lavere-moms-paa-mad-forventes-koste-17-4-milliarder-aarligt","subheadline":"Et folketingssvar sætter for første gang en samlet pris på fødevaremomsplanen. Pengene går til husholdningerne, ikke til virksomhederne.","body":["Skatte- og Vækstministeriet regner med 2,6 mia. kr. for at fjerne momsen på frugt og grønt og 14,7 mia. kr. for at halvere momsen på øvrige fødevarer — i alt 17,4 mia. kr. om året. Tallet stammer fra et folketingssvar fra minister Jakob Engel-Schmidt (M).","Beløbet er behæftet med forbehold: afgrænsningen af varegrupperne er uafklaret, helt ned til om frugtsalat og smoothies tæller med. Restauranter er ikke omfattet, og ændringen kan tidligst træde i kraft i 2028, fordi den kræver et nyt it-system i skattevæsenet."],"whyItMatters":"17,4 mia. kr. om året er periodens største enkeltstående skattetiltag, og det lægger beslag på præcis det råderum, erhvervsbeskatning og erhvervsfremme ellers skulle konkurrere om.","analysis":"Afgrænsningen af varegrupperne afgøres i embedsværket frem mod 2028, ikke i den politiske aftale. Det er der, den reelle fordeling mellem brancher bestemmes.","topics":["skattepolitik","moms","finanspolitik","dansk økonomi","detailhandel"],"entities":["Jakob Engel-Schmidt","Skatte- og Vækstministeriet","Folketinget","Danmark"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":83,"novelty":72,"sourceQuality":84,"personalRelevance":84,"contrast":60},"materialFacts":["Samlet årligt provenutab beregnet til 17,4 mia. DKK af Skatte- og Vækstministeriet (Danmark)","Fjernelse af moms på frugt og grønt: 2,6 mia. DKK årligt","Halvering af moms på øvrige fødevarer: 14,7 mia. DKK årligt","Tallet stammer fra et folketingssvar fra skatte- og vækstminister Jakob Engel-Schmidt (Moderaterne)","Beregningen er behæftet med forbehold, da afgrænsningen af varegrupper (frugtsalat, kartoffelsalat, smoothies) ikke er afklaret","Restauranter står ikke umiddelbart til at blive omfattet af en lavere moms","Tidligst virkelighed i 2028, fordi det kræver et nyt it-system i det danske skattevæsen","Skatteministeriets tidligere skøn fra juni 2025: 15-20 mia. DKK årligt","Den tidligere SVM-regering afsatte i januar 2026 en pulje på 6 mia. DKK; arbejdet blev afbrudt af folketingsvalget i marts 2026"],"claims":[{"text":"Skatte- og Vækstministeriet beregner det samlede årlige provenutab ved fødevaremomsplanen til 17,4 mia. kr.","sourceUrls":["https://www.dr.dk/nyheder/politik/lavere-moms-paa-mad-forventes-koste-17-4-milliarder-aarligt"],"confidence":"high"},{"text":"Ændringen kan tidligst træde i kraft i 2028, fordi den kræver et nyt it-system i skattevæsenet.","sourceUrls":["https://www.dr.dk/nyheder/politik/lavere-moms-paa-mad-forventes-koste-17-4-milliarder-aarligt"],"confidence":"medium"}],"sources":[{"title":"Lavere moms på mad forventes at koste 17,4 milliarder årligt","publisher":"DR","url":"https://www.dr.dk/nyheder/politik/lavere-moms-paa-mad-forventes-koste-17-4-milliarder-aarligt","publishedAt":"2026-08-02T07:07:00.000Z","kind":"reporting"},{"title":"Tidligere S-formand angriber regeringens planer om lavere moms på mad","publisher":"DR","url":"https://www.dr.dk/nyheder/politik/tidligere-s-formand-angriber-regeringens-planer-om-lavere-moms-paa-mad","publishedAt":"2026-07-30T12:46:00.000Z","kind":"reporting"}]},{"id":"story-goldman-kapitalcyklus-20260802","eventKey":"goldman-capital-intensive-cycle-2026","section":"Kapitalmarkeder","headline":"Goldman: AI-boomet udløser historiens mest kapitalhungrende investeringscyklus","primarySourceUrl":"https://ugebrev.dk/finans/goldman-ai-boomet-udloeser-historiens-mest-kapitalhungrende-investeringscyklus/","subheadline":"Hvis kapitalen bliver strukturelt dyrere, ændrer business casen sig for præcis de projekter, dansk industripolitik bygger på.","body":["Mark Wilson, Goldman Sachs' chef for europæisk hedgefonddækning, argumenterer for, at verdensøkonomien forlader årtier med billig kapital: AI-udbygning, genindustrialisering, oprustning og ombygningen af energisystemet skal finansieres samtidig.","Konklusionen: kapitalomkostningerne kan blive strukturelt højere i mange år, og centralbanken er passager snarere end chauffør. Den amerikanske 30-årige statsrente er brudt op til niveauer, der ikke er set siden før finanskrisen."],"whyItMatters":"Havvind, Power-to-X og netudbygning er regnet igennem med 2010'ernes kapitalomkostninger. Flytter den præmis sig, flytter forretningsmodellen for hele den industripolitiske dagsorden med.","analysis":"Det interessante er ikke rentevarslet, men konkurrencen: europæisk energiinfrastruktur og amerikansk AI-capex søger de samme penge.","counterpoint":"Det er en investeringsbanks markedssyn, ikke en prognose.","topics":["kapitalomkostninger","renter","AI-investeringer","industripolitik","europæisk økonomi"],"entities":["Goldman Sachs","Mark Wilson","Federal Reserve","USA","Europa"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":78,"novelty":81,"sourceQuality":76,"personalRelevance":88,"contrast":84},"materialFacts":["Analysen stammer fra Mark Wilson, chef for europæisk hedgefonddækning i Goldman Sachs (USA)","Den amerikanske 30-årige statsrente er ifølge analysen brudt op til niveauer, der ikke er set siden før den globale finanskrise","En markedsneutral momentumstrategi (køb af vindere, salg af tabere) faldt omkring 40 pct., større end faktorrotationen i marts 2000","Amazon steg 15 pct. og Apple faldt 10 pct. på samme handelsdag","Fundamentale porteføljeforvalteres samlede eksponering er faldet til laveste niveau i et år ifølge Goldmans prime brokerage-data","USA: kvartalsvis indtjeningsvækst ventes at toppe omkring 26 pct. i andet kvartal 2026","Europa: indtjeningsvækst ventes at gå fra 13 pct. i første halvår til 19 pct. i andet halvår 2026","I 13 midtvejsvalgår siden 1974 har medianafkastet for S&P 500 været nul fra begyndelsen af august frem til valgdagen","Kapitalkonkurrencen drives af AI-datacentre, chips, energiforsyning, genindustrialisering, militær oprustning og statslige rente- og velfærdsudgifter"],"claims":[{"text":"Goldman Sachs' Mark Wilson vurderer, at verdensøkonomien går ind i en af historiens mest kapitalhungrende investeringscyklusser, og at kapitalomkostningerne kan blive strukturelt højere i flere år.","sourceUrls":["https://ugebrev.dk/finans/goldman-ai-boomet-udloeser-historiens-mest-kapitalhungrende-investeringscyklus/"],"confidence":"medium"},{"text":"Den amerikanske 30-årige statsrente er ifølge analysen brudt op til niveauer, der ikke er set siden før den globale finanskrise.","sourceUrls":["https://ugebrev.dk/finans/goldman-ai-boomet-udloeser-historiens-mest-kapitalhungrende-investeringscyklus/"],"confidence":"medium"}],"sources":[{"title":"Goldman: AI-boomet udløser historiens mest kapitalhungrende investeringscyklus","publisher":"Økonomisk Ugebrev","url":"https://ugebrev.dk/finans/goldman-ai-boomet-udloeser-historiens-mest-kapitalhungrende-investeringscyklus/","publishedAt":"2026-08-02T09:31:00.000Z","kind":"analysis"},{"title":"Chefredaktøren har ordet – Et markant anderledes andet halvår for investorer","publisher":"Økonomisk Ugebrev","url":"https://ugebrev.dk/formue/chefredaktoeren-har-ordet-et-markant-anderledes-andet-halvaar-for-investorer/","publishedAt":"2026-08-02T06:30:00.000Z","kind":"analysis"}]},{"id":"story-australien-datacentre-stroem-20260802","eventKey":"australia-datacentre-own-power-rule","section":"Energi","headline":"Vil tvinge datasentre til å skaffe egen strøm","primarySourceUrl":"https://e24.no/energi-og-klima/i/5prrW1/vil-tvinge-datasentre-til-aa-skaffe-egen-stroem","subheadline":"Australien vil kræve, at nye datacentre leverer lige så meget strøm til nettet, som de trækker ud. Det er den første regulatoriske skabelon af sin art.","body":["Premierminister Anthony Albanese vil indføre, hvad regeringen kalder verdens første nationale regler for datacentre: nye anlæg skal levere lige så meget energi til elnettet, som de trækker ud. Australien har omkring 160 datacentre og er verdens næststørste marked efter USA.","Datacentrene står for ca. 2 pct. af elnetforbruget i dag, men andelen kan nå 10 pct. om ti år. En analyse bestilt af regeringens grønne investeringsbank viser, at elpriserne i New South Wales og Victoria ellers kan stige mærkbart."],"whyItMatters":"Det er den første konkrete skabelon for at vælte datacentrenes netomkostninger over på datacentrene selv — og den kommer fra et land, der hidtil har budt AI-investeringerne udpræget velkommen.","analysis":"Danmark og EU står i samme klemme mellem nettilslutningskøer, industriens elpriser og ønsket om ikke at skræmme investorer væk. Argumenterne fra Canberra er præcis dem, der vil blive gentaget her.","topics":["energi","datacentre","elnet","regulering","industripolitik"],"entities":["Australien","Anthony Albanese","New South Wales","Victoria","USA"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":71,"decisionValue":79,"novelty":88,"sourceQuality":82,"personalRelevance":83,"contrast":80},"materialFacts":["Australiens premierminister Anthony Albanese vil indføre det, regeringen kalder verdens første nationale regler for datacentre","Kravet: nye datacentre skal levere lige så meget energi til elnettet, som de trækker ud (kilde: Australiens statsministers kontor)","Australien har i dag omkring 160 datacentre","Australien er verdens næststørste marked for datacenterinvesteringer efter USA (ifølge Bloomberg)","Datacentre står for ca. 2 pct. af det australske elnetforbrug i dag; kan nå 10 pct. om ti år (ifølge ABC News)","Analyse fra analyseselskabet Bangria, bestilt af den australske regerings bank for finansiering af vedvarende energi: elpriser i New South Wales og Victoria kan stige med hhv. 26 og 23 pct. frem mod 2035 uden ny strømproduktion","Analysen konkluderer, at de nuværende udbygningsplaner for strøm ikke er nok","Da væksten bremsede kraftigt i 1. kvartal, stod datacenterinvesteringer for næsten hele BNP-væksten (Westpac-økonomer citeret af Bloomberg)","Private investeringer steg 4 pct. i årets tre første måneder; investeringer i maskiner og udstyr havde den største stigning i 30 år på grund af datacentre","Ved møde mellem delstaters og territoriers energiministre tirsdag stemte Queensland og Northern Territory imod flere af tiltagene; alle delstater skal bakke op for national indførelse","Queenslands delstatsminister David Crisafulli har tidligere afvist krav om vedvarende kraft af frygt for at skræmme investorer væk","YouGov-måling bestilt af Climate Council: 82 pct. mener, nye datacentre bør betale for den vedvarende kraft og energilagring, de har brug for (gengivet af Bloomberg)","Industri- og innovationsminister Tim Ayres om datacentre: de er ikke store arbejdsgivere, men giver Australien en plads i systemet"],"claims":[{"text":"Australiens regering vil kræve, at nye datacentre leverer lige så meget energi til elnettet, som de trækker ud.","sourceUrls":["https://e24.no/energi-og-klima/i/5prrW1/vil-tvinge-datasentre-til-aa-skaffe-egen-stroem"],"confidence":"high"},{"text":"Australske datacentre står for ca. 2 pct. af elnetforbruget i dag og kan nå 10 pct. om ti år.","sourceUrls":["https://e24.no/energi-og-klima/i/5prrW1/vil-tvinge-datasentre-til-aa-skaffe-egen-stroem"],"confidence":"medium"}],"sources":[{"title":"Vil tvinge datasentre til å skaffe egen strøm","publisher":"E24","url":"https://e24.no/energi-og-klima/i/5prrW1/vil-tvinge-datasentre-til-aa-skaffe-egen-stroem","publishedAt":"2026-07-30T18:12:40.000Z","kind":"reporting"}],"image":{"url":"https://akamai.vgc.no/v2/images/2b78c0a4-9ccb-32bd-bc35-77778816e0d2?format=auto&w=1080&s=c4c11d489e6b2fb22b20d8d4c97c6e17ab472926","credit":"E24 / Schibsted","alt":"Elmaster og højspændingsledninger mod en overskyet himmel.","sourceUrl":"https://e24.no/energi-og-klima/i/5prrW1/vil-tvinge-datasentre-til-aa-skaffe-egen-stroem"}},{"id":"story-kopper-genomer-amerika-20260802","eventKey":"smallpox-americas-genomic-evidence-2026","section":"Videnskab","headline":"How smallpox reached the Americas: first genomic evidence points to Europeans","primarySourceUrl":"https://www.nature.com/articles/d41586-026-02366-y","subheadline":"DNA fra to mumier i Chile leverer det første genetiske bevis for, at kopper kom til Amerika med europæerne — og fundet var et tilfælde.","body":["Forskere har fundet en hidtil ukendt koppevariant i DNA fra to mumificerede personer i det nordlige Chile, som levede mellem 1492 og 1631. Studiet blev offentliggjort 30. juli i Science. Fundet var utilsigtet: holdet testede software til DNA-analyse.","Sammenligningen viser, at den chilenske variant skilte sig fra en europæisk gren omkring 1200-tallet. Kun to andre koppesekvenser fra før 1900-tallet findes: vikingeknogler fra 600-tallet og en litauisk mumie fra 1600-tallet."],"whyItMatters":"En af de dyreste utilsigtede konsekvenser af europæisk ekspansion er her for første gang dokumenteret genetisk i stedet for udledt af krøniker. Kopper dræbte anslået 300 millioner mennesker alene i det 20. århundrede.","analysis":"Studiet peger på, at koppevirus mistede gener, mens det tilpassede sig mennesker — og at mpox kan være i gang med samme mekanisme i dag. Det flytter fundet fra historie til smitteovervågning.","topics":["videnskab","genomik","historie","epidemiologi"],"entities":["Science","Universidad de Chile","Charité Berlin","Chile","Europa"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":58,"decisionValue":30,"novelty":93,"sourceQuality":94,"personalRelevance":22,"contrast":95},"materialFacts":["To mumificerede personer fra en lille bosættelse i det nordlige Chile, som levede mellem 1492 og 1631","Studiet publiceret 30. juli 2026 i Science; Nature omtalte det 31. juli 2026","Den chilenske koppevariant skilte sig fra en europæisk gren omkring 1200-tallet","Medforfatter Constanza de la Fuente Castro, biologisk antropolog, Universidad de Chile, Santiago","Terry Jones, computationel virolog ved Charité, Universitetsmedicin Berlin, Tyskland, kommenterer studiet","Kopper (Orthopoxvirus variola) dræbte anslået 300 millioner mennesker alene i det 20. århundrede","Kun to andre koppesekvenser fra før 1900-tallet findes: vikingeknogler fra 600-tallet og en litauisk mumie fra 1600-tallet","Virusset mistede gener, mens det tilpassede sig mennesker; mpox kan bruge samme mekanisme","Opdagelsen var utilsigtet og skete under afprøvning af software til DNA-analyse"],"claims":[{"text":"DNA fra to mumificerede personer i det nordlige Chile, som levede mellem 1492 og 1631, indeholdt en hidtil ukendt koppevariant.","sourceUrls":["https://www.nature.com/articles/d41586-026-02366-y"],"confidence":"high"},{"text":"Den chilenske variant skilte sig fra en europæisk gren omkring 1200-tallet.","sourceUrls":["https://www.nature.com/articles/d41586-026-02366-y"],"confidence":"medium"}],"sources":[{"title":"How smallpox reached the Americas: first genomic evidence points to Europeans","publisher":"Nature","url":"https://www.nature.com/articles/d41586-026-02366-y","publishedAt":"2026-07-31T00:00:00.000Z","kind":"reporting"}],"image":{"url":"https://media.nature.com/lw1200/magazine-assets/d41586-026-02366-y/d41586-026-02366-y_53043414.jpg","credit":"Florilegius/Alamy","alt":"Historisk illustration af en koppeepidemi.","sourceUrl":"https://www.nature.com/articles/d41586-026-02366-y"}}],"signals":[{"text":"Amerikansk oliefirma er gået i land - Grønland sender dem 'stærk advarsel'","headline":"Amerikansk oliefirma er gået i land - Grønland sender dem 'stærk advarsel'","url":"https://www.dr.dk/nyheder/penge/amerikansk-oliefirma-er-gaaet-i-land-groenland-sender-dem-staerk-advarsel","summary":"Greenland Energy Company har sat boreudstyr i land i Jameson Land uden at orientere myndighederne, og Råstofdepartementet nøjes med en \"stærk advarsel\" frem for at kræve udstyret fjernet – en praktisk test af, hvor meget selvstyret reelt kan håndhæve over for amerikanske råstofinteresser.","publisher":"DR","section":"Erhverv","publishedAt":"2026-07-31T08:43:00.000Z"},{"text":"Handelsspændinger truer sommerens ro med nye toldsatser og tvister","headline":"Handelsspændinger truer sommerens ro med nye toldsatser og tvister","url":"https://ugebrev.dk/flashnews/handelsspaendinger-truer-sommerens-ro-med-nye-toldsatser-og-tvister/","summary":"Trumps 50 procents told på canadiske varer træder i kraft 19. august, USMCA er sat i en tiårig afvikling, og de udløbne Section 122-tillæg er afløst af Section 301-undersøgelser mod cirka 60 økonomier med 10-12,5 procents told.","publisher":"Økonomisk Ugebrev","section":"Handel","publishedAt":"2026-07-22T17:50:00.000Z"},{"text":"Optrapning mellem USA og Iran trækker Saudi-Arabien og Irak ind i konflikten","headline":"Optrapning mellem USA og Iran trækker Saudi-Arabien og Irak ind i konflikten","url":"https://ugebrev.dk/flashnews/optrapning-mellem-usa-og-iran-traekker-saudi-arabien-og-irak-ind-i-konflikten/","summary":"Irans viceudenrigsminister gør retten til at opkræve transitafgifter i Hormuzstrædet til et krav i enhver aftale, mens houthierne ifølge rapporter overvejer det samme i Det Røde Hav – en mulig permanent fordyrelse af søfragt til Europa snarere end en midlertidig risikopræmie.","publisher":"Økonomisk Ugebrev","section":"Udland","publishedAt":"2026-07-29T15:29:00.0
