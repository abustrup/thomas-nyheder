<!doctype html>
<html lang="da" data-chrome="minimal" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Thomas' Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

/* A reader with only a daily edition gets no bar at all: three of the five
   edition links would 404, and the "Vis som" switcher is a question nobody
   asked. Keyed off <html data-chrome>, stamped at render time from the profile,
   so the bar is gone before first paint rather than flashing in and vanishing
   once the module boots. The bindings are skipped too (see bindEditionNav), so
   the links are absent from the DOM rather than merely invisible. */
:root[data-chrome="minimal"] .top-bar {
  display: none;
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band

åbnes igen.","analysis":"Det flytter sagen fra spansk indenrigspolitik til handelspolitik. EU forhandler med Rabat om fiskeri, landbrug og migration, og kan grænsen bruges som løftestang, indgår den i prisen.","counterpoint":"Motivet er udokumenteret. Marokko peger selv på sociale medier, smuglere og fejltolkning.","topics":["migration","eu","marokko","spanien","energi"],"entities":["Ceuta","Marokko","Spanien","Algeriet","Morten Heiberg","Københavns Universitet"],"materialFacts":["50.000 migranter krydsede grænsen til Ceuta på 24 timer","72 mennesker har mistet livet i forsøget på at nå eksklaven","Et spansk regeringsparti vil have FN til at undersøge Marokkos ansvar","Spanien har opsat en barriere i havet ud for Ceuta"],"scores":{"importance":88,"decisionValue":72,"novelty":74,"sourceQuality":86,"personalRelevance":80,"contrast":70},"claims":[{"text":"50.000 migranter krydsede på 24 timer grænsen til den spanske eksklave Ceuta, og 72 mennesker mistede livet i forsøget på at nå eksklaven.","confidence":"high","sourceUrls":["https://www.dr.dk/nyheder/udland/graensekrise-mellem-spanien-og-marokko-traekker-traade-til-gasleverancer-og-et-oprindeligt-folk"]},{"text":"Professor Morten Heiberg peger på spanske spekulationer om et marokkansk motiv knyttet til Spaniens tilnærmelse til Algeriet, men understreger, at der ikke foreligger beviser for marokkansk myndighedsinvolvering.","confidence":"high","sourceUrls":["https://www.dr.dk/nyheder/udland/graensekrise-mellem-spanien-og-marokko-traekker-traade-til-gasleverancer-og-et-oprindeligt-folk"]}],"sources":[{"title":"Grænsekrise mellem Spanien og Marokko trækker tråde til gasleverancer og et oprindeligt folk","url":"https://www.dr.dk/nyheder/udland/graensekrise-mellem-spanien-og-marokko-traekker-traade-til-gasleverancer-og-et-oprindeligt-folk","publisher":"DR","kind":"reporting","publishedAt":"2026-08-02T14:40:00Z"},{"title":"Marokko giver sociale medier, smuglere og fejltolkning skylden for massetilstrømning","url":"https://www.dr.dk/nyheder/seneste/marokkansk-ministerie-giver-sociale-medier-smuglere-og-fejltolkning-skylden-massetilstroemning","publisher":"DR","kind":"reporting","publishedAt":"2026-08-02T20:12:10Z"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/rzshpkcr/20260801-161343-l.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","alt":"Migranter passerer gennem et ødelagt hegn, mens de forlader den spanske eksklave Ceuta med kurs mod den marokkanske by Fnideq den 1. august 2026.","credit":"Kilde: DR (foto: Abdel Majid Bziouat, AFP/Ritzau Scanpix)","sourceUrl":"https://www.dr.dk/nyheder/udland/graensekrise-mellem-spanien-og-marokko-traekker-traade-til-gasleverancer-og-et-oprindeligt-folk"}},{"id":"story-btig-marked-aar-2000-20260803","eventKey":"btig-momentum-comeback-markedsbredde","section":"Økonomi","isLead":false,"isOutsideProfile":false,"headline":"Finanshus: Markedet ligner år 2000: Rekordstort comeback kan være sidste optur før nye store kursfald","subheadline":"Momentumaktier steg voldsomt på én dag, men markedsbredden var den dårligste nogensinde på en dag med så stort et løft.","primarySourceUrl":"https://ugebrev.dk/formue/finanshus-markedet-ligner-aar-2000-rekordstort-comeback-kan-vaere-sidste-optur-foer-nye-store-kursfald/","body":["Det amerikanske aktiemarked leverede fredag et opsigtsvækkende comeback efter julis nedsmeltning. High-beta-momentum steg 13,3 pct. på én dag — ifølge finanshuset BTIG den fjerdestørste daglige stigning nogensinde.","Afgørende er, hvad der lå under stigningen. Markedsbredden var ifølge analysen den dårligste nogensinde på en dag med et så stort kursløft — et indeks løftet af meget få papirer. Det er parallellen til it-boblen i 2000: der kan være mere rebound tilbage, men også risiko for nye kursbunde."],"whyItMatters":"Danske pensionskasser og industriselskaber har amerikansk aktieeksponering og finansieringsomkostninger, der følger de samme risikopræmier. En optur båret af få aktier er skrøbelig på en måde, indekstallet ikke viser.","analysis":"Læs det som mekanik, ikke prognose. BTIG siger ikke, at faldet kommer, men at fordelingen bag stigningen historisk er et dårligt tegn.","topics":["aktiemarked","usa","risiko","makroøkonomi"],"entities":["BTIG","S&P 500","USA"],"materialFacts":["High-beta-momentum steg 13,3 pct. på én dag, ifølge BTIG den fjerdestørste daglige stigning nogensinde","Markedsbredden var ifølge analysen den dårligste nogensinde på en dag med så stort et kursløft","BTIG trækker parallellen til it-boblen i 2000"],"scores":{"importance":74,"decisionValue":78,"novelty":72,"sourceQuality":78,"personalRelevance":82,"contrast":66},"claims":[{"text":"High-beta-momentum steg 13,3 pct. på én dag, hvilket ifølge finanshuset BTIG er den fjerdestørste daglige stigning nogensinde, og markedsbredden var samtidig den dårligste nogensinde på en dag med et så stort kursløft.","confidence":"medium","sourceUrls":["https://ugebrev.dk/formue/finanshus-markedet-ligner-aar-2000-rekordstort-comeback-kan-vaere-sidste-optur-foer-nye-store-kursfald/"]}],"sources":[{"title":"Finanshus: Markedet ligner år 2000: Rekordstort comeback kan være sidste optur før nye store kursfald","url":"https://ugebrev.dk/formue/finanshus-markedet-ligner-aar-2000-rekordstort-comeback-kan-vaere-sidste-optur-foer-nye-store-kursfald/","publisher":"Økonomisk Ugebrev","kind":"analysis","publishedAt":"2026-08-02T13:45:46Z"}],"image":{"url":"https://ugebrev.dk/wp-content/uploads/2021/01/bubble.jpg","alt":"Arkivbillede af en sæbeboble, som Økonomisk Ugebrev anvender til analysen af parallellen mellem det nuværende aktiemarked og it-boblen i 2000.","credit":"Kilde: Økonomisk Ugebrev","sourceUrl":"https://ugebrev.dk/formue/finanshus-markedet-ligner-aar-2000-rekordstort-comeback-kan-vaere-sidste-optur-foer-nye-store-kursfald/"}},{"id":"story-rusland-teenagere-sabotage-20260803","eventKey":"rusland-rekruttering-unge-sabotage-europa","section":"Sikkerhed","isLead":false,"isOutsideProfile":false,"headline":"Rusland hyrer teenagere til at spionere og sabotere i Europa","subheadline":"Opgaverne udbydes med prisliste over Telegram, og de rammer også Nato-territorium.","primarySourceUrl":"https://www.dr.dk/nyheder/udland/rusland-hyrer-teenagere-til-spionere-og-sabotere-i-europa","body":["En ildspåsættelse, et fotografi af en militærinstallation, i yderste fald placering af en bombe. Det er den type opgaver, den russiske sikkerhedstjeneste ifølge DR udbyder mod betaling til især unge ukrainere over beskedtjenesten Telegram, hvor der cirkulerer prislister.","DR's Ukraine- og Rusland-korrespondent, Matilde Kimer, siger, at mange har fået tilsendt sådan en liste: »Der er 7.000 dollar, hvis man sætter ild til et rekrutteringskontor i Ukraine, men det giver også rigtig mange penge, hvis man sætter ild til Nato-udstyr i Polen.«"],"whyItMatters":"Truslen standses ikke af kontraspionage mod professionelle agenter. De rekrutterede er unge uden træning, og målene er fysiske: lagre, udstyr og transportled i Polen og resten af Nato-området.","analysis":"Billigheden er pointen. Når opgaven koster nogle tusinde dollar, og udfaldet er ligegyldigt for afsenderen, holder afskrækkelse dårligt.","topics":["sikkerhed","rusland","nato","hybridkrig","polen"],"entities":["Rusland","Ukraine","Polen","Nato","Telegram","Matilde Kimer","Andrzej Kozłowski"],"materialFacts":["Russisk sikkerhedstjeneste udbyder sabotageopgaver mod betaling via Telegram, med cirkulerende prislister","7.000 dollar nævnes for ildspåsættelse af et rekrutteringskontor i Ukraine","En 18-årig ukrainer, i polske medier kendt som Ilja K, er anklaget i en sådan sag"],"scores":{"importance":82,"decisionValue":70,"novelty":68,"sourceQuality":84,"personalRelevance":72,"contrast":64},"claims":[{"text":"Russisk sikkerhedstjeneste rekrutterer især unge ukrainere til ildspåsættelse, fotografering af militærinstallationer og sabotage via Telegram, og aktiviteten foregår også på Nato-territorium.","confidence":"high","sourceUrls":["https://www.dr.dk/nyheder/udland/rusland-hyrer-teenagere-til-spionere-og-sabotere-i-europa"]}],"sources":[{"title":"Rusland hyrer teenagere til at spionere og sabotere i Europa","url":"https://www.dr.dk/nyheder/udland/rusland-hyrer-teenagere-til-spionere-og-sabotere-i-europa","publisher":"DR","kind":"reporting","publishedAt":"2026-08-02T04:22:00Z"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/315jugiw/telegram.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","alt":"DR's billede til historien om, at rekrutteringen af typisk unge ukrainere ofte foregår over beskedtjenesten Telegram, hvor der også optræder prislister for opgaver som ildspåsættelse.","credit":"Kilde: DR","sourceUrl":"https://www.dr.dk/nyheder/udland/rusland-hyrer-teenagere-til-spionere-og-sabotere-i-europa"}},{"id":"story-australien-some-forbud-evaluering-20260803","eventKey":"australien-some-forbud-esafety-evaluering","section":"Regulering","isLead":false,"isOutsideProfile":true,"headline":"Tre måneder efter forbud er 8 ud af 10 australske teenagere stadig på sociale medier","subheadline":"Verdens første aldersgrænse på sociale medier er nu målt. Kontoejerskabet faldt, forbruget gjorde ikke.","primarySourceUrl":"https://www.dr.dk/nyheder/udland/tre-maaneder-efter-forbud-er-8-ud-af-10-australske-teenagere-stadig-paa-sociale-medier","body":["Australien indførte i december 2025 som det første land i verden et forbud mod sociale medier for unge under 16 år. Internetstilsynet eSafety offentliggjorde fredag en rapport, der sammenligner data fra før forbuddet med data fra marts.","Andelen af unge med egne konti faldt fra 52 til 42 procent. Men mere end otte ud af ti under 16 år bruger stadig sociale medier. Årsagen er ifølge rapporten mangelfuld aldersverifikation: 50 procent var slet ikke blevet bedt om at bekræfte deres alder."],"whyItMatters":"En indgribende regulering, der faktisk måles bagefter. Resultatet er, at pligten lå hos platformene, håndhævelsen af pligten lå ikke noget sted, og reglen blev en formalitet.","analysis":"Mønstret går igen i EU-regulering, hvor efterlevelsen afhænger af, at den regulerede selv bygger kontrollen.","counterpoint":"Et fald fra 52 til 42 procent på tre måneder er ikke ingenting. En regel kan flytte adfærd uden at blive efterlevet fuldt.","topics":["regulering","sociale medier","australien","børn og unge","håndhævelse"],"entities":["Australien","eSafety","Andrew Leigh","Meta","TikTok","YouTube"],"materialFacts":["eSafety offentliggjorde fredag en evalueringsrapport tre måneder efter forbuddets ikrafttræden","Andelen af under-16-årige med egne konti faldt fra 52 til 42 procent","Mere end otte ud af ti under 16 år bruger stadig sociale medier","Regeringen vil fordoble maksimumbøden til 99 millioner australske dollar"],"scores":{"importance":70,"decisionValue":74,"novelty":84,"sourceQuality":82,"personalRelevance":46,"contrast":86},"claims":[{"text":"eSafetys rapport viser, at andelen af australske under-16-årige med egne konti på sociale medier faldt fra 52 til 42 procent, mens mere end otte ud af ti stadig bruger sociale medier tre måneder efter forbuddet.","confidence":"high","sourceUrls":["https://www.dr.dk/nyheder/udland/tre-maaneder-efter-forbud-er-8-ud-af-10-australske-teenagere-stadig-paa-sociale-medier"]}],"sources":[{"title":"Tre måneder efter forbud er 8 ud af 10 australske teenagere stadig på sociale medier","url":"https://www.dr.dk/nyheder/udland/tre-maaneder-efter-forbud-er-8-ud-af-10-australske-teenagere-stadig-paa-sociale-medier","publisher":"DR","kind":"reporting","publishedAt":"2026-08-02T03:30:00Z"}],"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/7/7b/Anthony_Albanese_portrait_%28re-crop%29.jpg","alt":"Portræt af Australiens premierminister Anthony Albanese, som annoncerede forbuddet mod sociale medier for unge under 16 år.","credit":"Foto: Wikimedia Commons","sourceUrl":"https://commons.wikimedia.org/wiki/File:Anthony_Albanese_portrait_(re-crop).jpg"}},{"id":"story-cyclorphin-danmark-20260803","eventKey":"dk-cyclorphin-foerste-fund","section":"Danmark","isLead":false,"isOutsideProfile":false,"headline":"Under obduktion fandt Jørgen nyt og livsfarligt stof: Myndighederne advarer","subheadline":"Sundhedsstyrelsen advarede fredag om cyclorphin, der er fundet i Danmark i to tilfælde — det ene i en afdød person.","primarySourceUrl":"https://www.dr.dk/nyheder/indland/under-obduktion-fandt-joergen-nyt-og-livsfarligt-stof-myndighederne-advarer","body":["Det syntetiske opioid cyclorphin er for første gang fundet i Danmark — i en narkoransagning og i en afdød person. Sundhedsstyrelsen sendte fredag en advarsel ud, fordi der på grund af stoffets styrke skal meget små mængder til at forårsage akutte forgiftninger.","Bag obduktionen står Jørgen Bo Hasselstrøm, seniorforsker og retskemiker på Aarhus Universitet. »Det er meget potent. I hvert fald mindst lige så potent som fentanyl, som er cirka 100 gange så potent som morfin,« siger han til DR."],"whyItMatters":"Det er den ordinære danske nyhed, man bliver spurgt om: et nyt stof, som pårørende og arbejdspladser ikke kender navnet på endnu, og hvor styrken gør en fejldosering til en dødsulykke.","analysis":"Detektionen er det interessante. Stoffet blev ikke fundet, fordi nogen ledte efter det, men fordi en analyse fangede noget ukendt.","topics":["sundhed","kriminalitet","danmark","opioider"],"entities":["Sundhedsstyrelsen","Jørgen Bo Hasselstrøm","Aarhus Universitet","Institut for Retsmedicin"],"materialFacts":["Cyclorphin er for første gang fundet i Danmark, i to tilfælde","Sundhedsstyrelsen sendte fredag en advarsel ud","Stoffet beskrives som mindst lige så potent som fentanyl"],"scores":{"importance":68,"decisionValue":58,"novelty":80,"sourceQuality":84,"personalRelevance":60,"contrast":58},"claims":[{"text":"Det syntetiske opioid cyclorphin er for første gang fundet i Danmark, i to tilfælde, hvoraf det ene var i en afdød person, og Sundhedsstyrelsen udsendte fredag en advarsel.","confidence":"high","sourceUrls":["https://www.dr.dk/nyheder/indland/under-obduktion-fandt-joergen-nyt-og-livsfarligt-stof-myndighederne-advarer"]}],"sources":[{"title":"Under obduktion fandt Jørgen nyt og livsfarligt stof: Myndighederne advarer","url":"https://www.dr.dk/nyheder/indland/under-obduktion-fandt-joergen-nyt-og-livsfarligt-stof-myndighederne-advarer","publisher":"DR","kind":"reporting","publishedAt":"2026-08-02T18:04:00Z"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/f5plu0ny/000_1ke143_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","alt":"Arkivfoto anvendt af DR til historien om det syntetiske opioid cyclorphin, der for første gang er fundet i Danmark.","credit":"Kilde: DR (foto: Eric Baradat, AFP/Ritzau Scanpix)","sourceUrl":"https://www.dr.dk/nyheder/indland/under-obduktion-fandt-joergen-nyt-og-livsfarligt-stof-myndighederne-advarer"}},{"id":"story-fifa-infantino-schweiz-20260803","eventKey":"fifa-ffe-infantino-mistillid","section":"Sport","isLead":false,"isOutsideProfile":false,"headline":"Selv på Infantinos hjemmebane rasler de med sablen trods skrinlagt plan","subheadline":"Det schweiziske forbund og de europæiske ligaer vender sig mod Fifa-præsidenten, efter at milliardplanen blev lagt frem uden om forbundets hovedorganer.","primarySourceUrl":"https://www.dr.dk/sporten/selv-paa-infantinos-hjemmebane-rasler-de-med-sablen-trods-skrinlagt-plan","body":["Fifa meddelte tirsdag, at forbundet ville rejse 4,2 milliarder dollar — 27,6 milliarder kroner — til et kommercielt selskab ved navn Fifa Forward Enterprise. Planen er nu skrinlagt, men kritikken er ikke stoppet.","Uefa har mistet tilliden til Gianni Infantino som præsident, og nu vender også hans schweiziske bagland sig. Claudius Schäfer, der står i spidsen for de europæiske ligaer og det schweiziske forbund, siger til DR: »Da jeg så, hvordan alt det her udfoldede sig, og at Fifas hovedorganer ikke var involveret, så er der til syvende og sidst kun én konsekvens i enhver virksomhed eller organisation.«"],"whyItMatters":"En governance-sag forklædt som sport: en ledelse rejser kapital i milliardklassen uden om de organer, der skal godkende det.","analysis":"At kritikken fortsætter, efter at planen er trukket tilbage, er signalet. Havde sagen handlet om selskabet, var den slut. Nu handler den om mandatet.","topics":["fodbold","governance","fifa","schweiz"],"entities":["Fifa","Gianni Infantino","Uefa","Claudius Schäfer","Fifa Forward Enterprise"],"materialFacts":["Fifa ville rejse 4,2 milliarder dollar (27,6 milliarder kroner) til selskabet Fifa Forward Enterprise","Selskabet skulle værdiansættes til omkring 20 milliarder dollar (131 milliarder kroner)","Det schweiziske forbund og de europæiske ligaer kritiserer Infantino, efter at planen er skrinlagt"],"scores":{"importance":62,"decisionValue":48,"novelty":72,"sourceQuality":82,"personalRelevance":74,"contrast":62},"claims":[{"text":"Fifa meddelte tirsdag en plan om at rejse 4,2 milliarder dollar til selskabet Fifa Forward Enterprise med en værdiansættelse på omkring 20 milliarder dollar, og planen er siden skrinlagt.","confidence":"high","sourceUrls":["https://www.dr.dk/sporten/selv-paa-infantinos-hjemmebane-rasler-de-med-sablen-trods-skrinlagt-plan"]}],"sources":[{"title":"Selv på Infantinos hjemmebane rasler de med sablen trods skrinlagt plan","url":"https://www.dr.dk/sporten/selv-paa-infantinos-hjemmebane-rasler-de-med-sablen-trods-skrinlagt-plan","publisher":"DR","kind":"reporting","publishedAt":"2026-08-02T15:18:50Z"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/dfeie1w4/20260801-122153-l.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","alt":"Foto anvendt af DR til historien om Fifa-præsident Gianni Infantino og den skrinlagte plan om selskabet Fifa Forward Enterprise.","credit":"Kilde: DR","sourceUrl":"https://www.dr.dk/sporten/selv-paa-infantinos-hjemmebane-rasler-de-med-sablen-trods-skrinlagt-plan"}},{"id":"story-tdf-femmes-etape2-wiebes-20260803","eventKey":"tdf-femmes-2026-etape2","section":"Sport","isLead":false,"isOutsideProfile":false,"headline":"Ny magtdemonstration af den gule trøje","subheadline":"Lorena Wiebes vandt også 2. etape af Tour de France Femmes. Amalie Dideriksen kom i mål som nummer 93.","primarySourceUrl":"https://sport.tv2.dk/live/cykling/2026-08-02-ny-magtdemonstration-af-den-gule-troeje","body":["Lorena Wiebes var helt og aldeles overlegen i massespurten på 2. etape af Tour de France Femmes, der blev afgjort i den schweiziske by Genève. Den hollandske sprinter fra SD Worx har dermed vundet begge etaper i årets udgave og beholder den gule trøje. Elisa Balsamo fra Lidl-Trek og Marianne Vos fra Visma kom i mål på de efterfølgende pladser.","Fra dansk side var der ikke meget at hente. Amalie Dideriksen kom i mål som nummer 93, mere end syv minutter efter Wiebes."],"whyItMatters":"To spurtetaper afgør ingenting samlet. Men to sejre ud af to siger noget om SD Worx' kontrol over feltets afslutninger, og det former, hvordan de øvrige hold må køre, når bjergene kommer.","analysis":"Wiebes vinder ikke løbet på flade etaper, og den gule trøje skifter, når terrænet gør. Det, der er værd at følge, er om holdet kan holde sammen på feltet lige så effektivt uden den hurtigste rytter tilbage.","topics":["cykling","tour de france femmes","danskere"],"entities":["Lorena Wiebes","SD Worx","Elisa Balsamo","Marianne Vos","Amalie Dideriksen","Genève"],"materialFacts":["Lorena Wiebes vandt 2. etape af Tour de France Femmes i massespurt i Genève","Wiebes har vundet begge etaper og beholder den gule trøje","Amalie Dideriksen kom i mål som nummer 93, mere end syv minutter efter"],"scores":{"importance":44,"decisionValue":30,"novelty":62,"sourceQuality":78,"personalRelevance":84,"contrast":40},"claims":[{"text":"Lorena Wiebes vandt 2. etape af Tour de France Femmes i massespurt i Genève, har vun  kan gøres om, og det, der ikke kan, er ensartet grundighed efter beløbsstørrelse den mere robuste regel.","topics":["beslutninger","risiko","ledelse"]},"recommendations":[{"id":"rec-wto-tariff-profiles-2026","mode":"try","kind":"Rapport","status":"new","title":"World Tariff Profiles 2026","creator":"WTO, International Trade Centre og UNCTAD","provider":"World Trade Organization","url":"https://www.wto.org/english/res_e/publications_e/world-tariff-profiles-2026_e.htm","availability":"Gratis PDF samt Excel-tabeller og landeprofiler i HTML. Trykt udgave kan købes i WTO's boghandel. Siden angiver udgivelsesår 2026, ikke måned.","commitment":"20 minutter for egne markeder","description":"WTO's årlige opslagsværk med bundne og anvendte toldsatser samt ikke-toldmæssige barrierer for over 150 økonomier. Hvert land har en etsidersprofil med produktopdeling, og tallene findes også som Excel-tabeller.","rationale":"Det er ikke læsestof, det er et arbejdsredskab til en rådgivningspraksis: slå en kundes marked op og se den faktiske toldmur i stedet for at citere overskrifter. Excel-tabellerne gør det muligt at bygge egne sammenligninger mellem EU, USA, Indien og Brasilien uden abonnement.","topics":["told","handelsdata","eksport","emerging markets"],"isFeatured":true,"image":{"url":"https://www.wto.org/images/img_bkshop/tariffprofiles2026.jpg","alt":"Forsiden af WTO-publikationen World Tariff Profiles 2026.","credit":"Kilde: World Trade Organization","sourceUrl":"https://www.wto.org/english/res_e/publications_e/world-tariff-profiles-2026_e.htm"}},{"id":"rec-bruegel-china-shock-20","mode":"listen","kind":"Podcast","status":"timely","title":"Europe's China shock 2.0","creator":"Yuyun Zhan og Alicia García-Herrero med gæsten Philippe Le Corre","provider":"Bruegel","url":"https://www.bruegel.org/podcast/europes-china-shock-20","availability":"Gratis, uden login, tilgængelig globalt. Udgivet 23. juni 2026.","commitment":"Et afsnit til køreturen","description":"Bruegel-afsnit om Kina
