<!doctype html>
<html lang="da" data-chrome="minimal" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Thomas' Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

/* A reader with only a daily edition gets no bar at all: three of the five
   edition links would 404, and the "Vis som" switcher is a question nobody
   asked. Keyed off <html data-chrome>, stamped at render time from the profile,
   so the bar is gone before first paint rather than flashing in and vanishing
   once the module boots. The bindings are skipped too (see bindEditionNav), so
   the links are absent from the DOM rather than merely invisible. */
:root[data-chrome="minimal"] .top-bar {
  display: none;
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band

,4. Epicentret lå nær San José del Palmar i Chocó-provinsen, mens det højeste dødstal er meldt fra Risaralda.","Hårdest ramt er storbyen Cali, hvor mindst 30 bygninger er styrtet sammen, og hvor redningsfolk mandag aften stadig gravede efter overlevende. Præsident Abelardo de la Espriella oplyste ifølge Reuters, at 188 personer er savnet, og at der sendes 1.000 ekstra sikkerhedsfolk til byen. Der er indført udgangsforbud i Cali, Armenia og Manizales af frygt for plyndringer."],"whyItMatters":"Tallene er foreløbige. De 188 savnede afgør, om dødstallet bliver stående omkring 111 eller stiger markant, og udgangsforbuddet fortæller, at myndighederne regner med uro oven i katastrofen.","analysis":"Et skælv på 7,4 dræber ikke i sig selv; bygningsmassen gør. At tabene samler sig i Cali og Risaralda snarere end ved epicentret i det tyndt befolkede Chocó peger på, at det er byggeriet og ikke afstanden til bruddet, der har afgjort udfaldet.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/k4bjycgq/20260811-033509-6.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Foto: Sergio Acero, Reuters/Ritzau Scanpix","alt":"Redningsarbejdere i Cali løfter næverne i vejret for at bede om stilhed, så de kan lokalisere ofre under murbrokkerne ved en sammenstyrtet bygning.","sourceUrl":"https://www.dr.dk/nyheder/udland/mindst-111-mennesker-har-mistet-livet-i-jordskaelv-i-colombia-alt-faldt-sammen-alt-revnede-siger"},"topics":["naturkatastrofe","colombia","beredskab"],"entities":["Colombia","Cali","Risaralda","Chocó","USGS","Abelardo de la Espriella"],"isLead":true,"isOutsideProfile":true,"scores":{"importance":94,"decisionValue":52,"novelty":88,"sourceQuality":84,"personalRelevance":46,"contrast":60},"claims":[{"text":"Jordskælvet i Colombia mandag kostede mindst 111 mennesker livet og sårede mindst 87","sourceUrls":["https://www.dr.dk/nyheder/udland/mindst-111-mennesker-har-mistet-livet-i-jordskaelv-i-colombia-alt-faldt-sammen-alt-revnede-siger"],"confidence":"high"},{"text":"Colombias geologiske institut oplyser, at skælvet er det kraftigste registreret i landet i det 21. århundrede, og USGS har vurderet styrken til 7,4","sourceUrls":["https://www.dr.dk/nyheder/udland/mindst-111-mennesker-har-mistet-livet-i-jordskaelv-i-colombia-alt-faldt-sammen-alt-revnede-siger"],"confidence":"high"},{"text":"Præsident Abelardo de la Espriella oplyser ifølge Reuters, at 188 personer er savnet, og at der sendes 1.000 ekstra sikkerhedsfolk til Cali","sourceUrls":["https://www.dr.dk/nyheder/udland/mindst-111-mennesker-har-mistet-livet-i-jordskaelv-i-colombia-alt-faldt-sammen-alt-revnede-siger"],"confidence":"high"}],"sources":[{"title":"Dødstal stiger kraftigt efter jordskælv i Colombia: 'Alt styrtede sammen, alt revnede', siger øjenvidne","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/mindst-111-mennesker-har-mistet-livet-i-jordskaelv-i-colombia-alt-faldt-sammen-alt-revnede-siger","publishedAt":"2026-08-11T02:33:30.000Z","kind":"reporting"}]},{"id":"thomas-20260811-fodevarepriser-moms","eventKey":"dst-forbrugerpriser-juli-2026-fodevarer-momsplan","materialFacts":["Smør er knap 12 pct. billigere end for et år siden, ost 11,2 pct. og grisekød 8,2 pct.","Danmarks Statistik opgjorde 10. august inflationen i juli til 1,7 pct. mod 1,9 pct. i juni","Kerneinflationen var 2,3 pct. i både juni og juli","Fødevarer trak den årlige inflation ned med 0,26 procentpoint, elektricitet med 0,68 procentpoint","Regeringen vil halvere momsen på fødevarer og afskaffe momsen på frugt og grønt; Skatteministeriet anslår 17,4 mia. kr. årligt"],"section":"Økonomi","headline":"Priserne på flere dagligvarer rasler ned","primarySourceUrl":"https://nyheder.tv2.dk/business/2026-08-11-priserne-paa-flere-dagligvarer-rasler-ned","subheadline":"Smør, ost og grisekød er blevet markant billigere på et år, samtidig med at regeringen forbereder en momsnedsættelse på mad til 17,4 milliarder kroner om året.","body":["Smør er knap 12 procent billigere end for et år siden, ost 11,2 procent og grisekød 8,2 procent, viser nye tal fra Danmarks Statistik. Den samlede inflation i juli blev 10. august gjort op til 1,7 procent mod 1,9 procent i juni.","Fødevarer trak den årlige prisstigning ned med 0,26 procentpoint, elektricitet med 0,68. Alligevel holder regeringen fast i at halvere momsen på fødevarer og fjerne den på frugt og grønt, en regning på 17,4 milliarder kroner om året ifølge Skatteministeriet."],"whyItMatters":"Overvismand Carl-Johan Dalgaard har advaret mod differentieret moms med henvisning til \"administrativt bøvl\". Prisfaldet er derimod allerede sket, og det kostede ikke statskassen noget.","analysis":"Kerneinflationen står stille på 2,3 procent, mens overskriftstallet falder. Det største enkeltbidrag nedad er elektricitet, som momsplanen ikke rører. Fødevarepriserne faldt af sig selv, før nogen nedsættelse er vedtaget.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/8/3/1/831fa1fd-69fd-43da-a324-28019fa6e30b?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=MCw4LDgwMTgsNDUwMg&s=f4c26f8ce1fa37de498e2a319e8d4a70","credit":"Foto: Ida Marie Odgaard / Ritzau Scanpix","alt":"Arkivfoto anvendt af TV 2 til historien om faldende fødevarepriser: en kunde står ved køledisken i et supermarked med frostvarer i forgrunden.","sourceUrl":"https://nyheder.tv2.dk/business/2026-08-11-priserne-paa-flere-dagligvarer-rasler-ned"},"topics":["inflation","skat","danske erhvervsvilkaar","forbrug"],"entities":["Danmarks Statistik","Skatteministeriet","Carl-Johan Dalgaard","Jakob Engel-Schmidt"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":76,"decisionValue":80,"novelty":70,"sourceQuality":92,"personalRelevance":82,"contrast":58},"claims":[{"text":"Smør er knap 12 pct. billigere end for et år siden, ost 11,2 pct. og grisekød 8,2 pct.","sourceUrls":["https://nyheder.tv2.dk/business/2026-08-11-priserne-paa-flere-dagligvarer-rasler-ned"],"confidence":"high"},{"text":"Forbrugerprisindekset steg 1,7 pct. i juli mod 1,9 pct. i juni, mens kerneinflationen var 2,3 pct. begge måneder","sourceUrls":["https://www.dst.dk/nyt/52439"],"confidence":"high"},{"text":"Fødevarer bidrog med minus 0,26 procentpoint og elektricitet med minus 0,68 procentpoint til den årlige inflation i juli","sourceUrls":["https://www.dst.dk/nyt/52439"],"confidence":"high"},{"text":"Skatteministeriet anslår, at momsændringerne på fødevarer vil koste 17,4 mia. kr. årligt","sourceUrls":["https://nyheder.tv2.dk/business/2026-08-11-priserne-paa-flere-dagligvarer-rasler-ned"],"confidence":"high"}],"sources":[{"title":"Priserne på flere dagligvarer rasler ned","publisher":"TV 2","url":"https://nyheder.tv2.dk/business/2026-08-11-priserne-paa-flere-dagligvarer-rasler-ned","publishedAt":"2026-08-11T11:33:14.170Z","kind":"reporting"},{"title":"Fald i inflationen","publisher":"Danmarks Statistik","url":"https://www.dst.dk/nyt/52439","publishedAt":"2026-08-10T07:00:00.000Z","kind":"primary"}]},{"id":"thomas-20260811-solformoerkelse-elpris","eventKey":"solformoerkelse-2026-08-12-europaeisk-elpris-solkraft","materialFacts":["Solformørkelsen onsdag aften ventes at dæmpe europæisk solkraft med omkring 10.000 megawatt","Entso-E har anslået et bortfald på op til 9.700 megawatt mellem 19.15 og 21.30","Solkraft udgør for tiden 13 pct. af EU's elproduktion ifølge Entso-E","Prisen i det sydlige Norge topper i kvarteret mellem 19.45 og 20.00, og prisen i Tyskland ligger endnu højere","Kernekraftkapacitet er lukket ned eller reduceret i Ungarn, Rumænien, Polen, Slovenien og Frankrig på grund af lav vandstand og køleproblemer"],"section":"Energi","headline":"Strømprisen hopper under solformørkelse","primarySourceUrl":"https://e24.no/energi-og-klima/i/d4r7oX/stroemprisen-hopper-under-solformoerkelse","subheadline":"Onsdag aften forsvinder omkring 10.000 megawatt europæisk solstrøm. Det rammer et system, der i forvejen mangler kølevand til kernekraften.","body":["Når månen onsdag aften skygger for solen over Europa, dæmpes solkraftproduktionen med omkring 10.000 megawatt, vurderer kraftanalytiker Sigbjørn Seland fra Storm Geo over for norske E24. Nettoperatørorganisationen Entso-E anslår selv op til 9.700 megawatt mellem klokken 19.15 og 21.30. Solkraft udgør 13 procent af EU-elproduktionen.","Prisudslaget bliver størst i kvarteret fra 19.45, hvor Tyskland ligger højest og trækker det sydlige Norge med op. At formørkelsen falder om aftenen dæmper effekten: solproduktionen topper midt på dagen og er på vej ned mod solnedgang."],"whyItMatters":"Samtidig kører kernekraftværker i lande som Ungarn, Rumænien, Polen, Slovenien og Frankrig med lukket eller nedsat kapacitet efter lav vandstand.","analysis":"Formørkelsen er et varslet laboratorieforsøg med kendt tidspunkt. Bortfaldet falder sammen med en tørke, der allerede har taget kernekraft ud af markedet flere steder.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/Solar_eclipse_of_August_12%2C_2026_map_in_Europe.png/1280px-Solar_eclipse_of_August_12%2C_2026_map_in_Europe.png","credit":"Kort: Ekkehard Domning, CC BY-SA 4.0, via Wikimedia Commons","alt":"Kort over solformørkelsen 12. august 2026 set over Europa: kerneskyggen trækker fra Nordatlanten ned over Island og Spanien, mens halvskyggen dækker hele Nordvesteuropa.","sourceUrl":"https://commons.wikimedia.org/wiki/File:Solar_eclipse_of_August_12,_2026_map_in_Europe.png"},"topics":["energi","elmarked","forsyningssikkerhed","groen omstilling"],"entities":["Entso-E","Storm Geo","Volue Insight","Tyskland","Norge","Copernicus"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":72,"decisionValue":78,"novelty":90,"sourceQuality":80,"personalRelevance":76,"contrast":88},"claims":[{"text":"Solkraftproduktionen i Europa ventes dæmpet med omkring 10.000 megawatt under solformørkelsen onsdag aften","sourceUrls":["https://e24.no/energi-og-klima/i/d4r7oX/stroemprisen-hopper-under-solformoerkelse"],"confidence":"high"},{"text":"Entso-E har anslået et bortfald på op til 9.700 megawatt mellem 19.15 og 21.30, og solkraft udgør 13 pct. af EU's elproduktion","sourceUrls":["https://e24.no/energi-og-klima/i/d4r7oX/stroemprisen-hopper-under-solformoerkelse"],"confidence":"high"},{"text":"Kernekraftkapacitet er lukket ned eller reduceret i Ungarn, Rumænien, Polen, Slovenien og Frankrig efter lav vandstand og køleproblemer","sourceUrls":["https://e24.no/energi-og-klima/i/d4r7oX/stroemprisen-hopper-under-solformoerkelse"],"confidence":"medium"}],"sources":[{"title":"Strømprisen hopper under solformørkelse","publisher":"E24","url":"https://e24.no/energi-og-klima/i/d4r7oX/stroemprisen-hopper-under-solformoerkelse","publishedAt":"2026-08-11T11:52:02.000Z","kind":"reporting"}]},{"id":"thomas-20260811-koebenhavn-dao","eventKey":"koebenhavns-kommune-opsiger-dao-brevomdeling-2026","materialFacts":["Københavns Kommune opsiger aftalen med Dao om brevomdeling ved udgangen af august","Begrundelsen er, at Dao ikke kan garantere overenskomstmæssig løn hos sine samarbejdspartnere","Overborgmester Sisse Marie Welling (SF) har skrevet til transportminister Signe Munk (SF); Økonomiudvalget orienteres i dag","Dao overtog brevomdelingen i Danmark fra 2026","Dao har selv skrevet til ministeren og oplyser, at tvisten handler om, hvem der må påtale og sanktionere overtrædelser"],"section":"Erhverv","headline":"Københavns Kommune opsiger samarbejdet med Dao","primarySourceUrl":"https://www.dr.dk/nyheder/indland/koebenhavns-kommune-opsiger-samarbejdet-med-dao","subheadline":"Kommunen vil ikke købe brevomdeling af et selskab, der ikke kan garantere overenskomstmæssig løn hos sine underleverandører. Begge parter kalder nu transportministeren ind.","body":["Københavns Kommune opsiger ved udgangen af august sin aftale med Dao om at omdele breve til byens postkasser. \"Dao kan desværre ikke garantere, at deres samarbejdspartnere giver en overenskomstmæssig løn til deres medarbejdere\", siger overborgmester Sisse Marie Welling (SF), som har skrevet til transportminister Signe Munk (SF).","Dao har selv skrevet til ministeren. Selskabet oplyser, at arbejdsklausuler for dets Dao-shops er på plads, men at tvisten står om, hvem der må påtale og sanktionere overtrædelser."],"whyItMatters":"Kommunen hæver en aftale om en kritisk forsyning frem for at forhandle videre, og det er uafklaret, hvordan brevene kommer frem efter august.","analysis":"Parterne er ikke enige om, hvad striden handler om. Kommunen peger på lønnen i underleverandørleddet; Dao siger, at klausulerne er på plads, og at uenigheden står om sanktionsretten. Det er den mekanik, en arbejdsklausul står og falder med.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/mcnlwexe/20260312-102330-l.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Foto: Thomas Traasdahl, Ritzau Scanpix","alt":"Arkivfoto anvendt af DR til historien: et bud i rød Dao-jakke og hjelm står med ryggen til ved en række postkasser i en opgang.","sourceUrl":"https://www.dr.dk/nyheder/indland/koebenhavns-kommune-opsiger-samarbejdet-med-dao"},"topics":["danske erhvervsvilkaar","den danske model","offentlige indkoeb","transport"],"entities":["Københavns Kommune","Dao","Sisse Marie Welling","Signe Munk","Hans Peter Nissen"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":70,"decisionValue":76,"novelty":84,"sourceQuality":82,"personalRelevance":86,"contrast":62},"claims":[{"text":"Københavns Kommune opsiger aftalen med Dao om brevomdeling ved udgangen af august","sourceUrls":["https://www.dr.dk/nyheder/indland/koebenhavns-kommune-opsiger-samarbejdet-med-dao"],"confidence":"high"},{"text":"Overborgmester Sisse Marie Welling skriver, at Dao ikke kan garantere overenskomstmæssig løn hos sine samarbejdspartnere","sourceUrls":["https://www.dr.dk/nyheder/indland/koebenhavns-kommune-opsiger-samarbejdet-med-dao"],"confidence":"high"},{"text":"Dao oplyser, at tvisten handler om, hvem der må påtale og sanktionere eventuelle overtrædelser","sourceUrls":["https://www.dr.dk/nyheder/indland/koebenhavns-kommune-opsiger-samarbejdet-med-dao"],"confidence":"high"}],"sources":[{"title":"Københavns Kommune opsiger samarbejdet med Dao","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/koebenhavns-kommune-opsiger-samarbejdet-med-dao","publishedAt":"2026-08-11T07:53:28.000Z","kind":"reporting"}]},{"id":"thomas-20260811-governance-rating-finans","eventKey":"oekonomisk-ugebrev-governance-rating-finans-2026","materialFacts":["Tryg Forsikring topper årets Governance Rating for finans med ni ud af ti point","Ringkjøbing Landbobank og Sydbank deler andenpladsen; Kreditbanken, BankNordik og Lollands Bank ligger i bunden","Ratingen omfatter de tyve danske børsnoterede finansselskaber","Fem af de syv øverst placerede selskaber scorer flere point end sidste år","Kun tre af de tyve selskaber har bestyrelser med en gennemsnitsalder under 55 år, mens halvdelen ligger over 60 år"],"section":"Erhverv","headline":"Tema: Governance Rating Finans: Tryg lægger sig alene i front","primarySourceUrl":"https://ugebrev.dk/finans/tema-governance-rating-finans-tryg-laegger-sig-alene-i-front/","subheadline":"Tryg tager førstepladsen i Økonomisk Ugebrevs årlige governance-rating af de tyve børsnoterede finansselskaber. Halvdelen har bestyrelser med en gennemsnitsalder over 60 år.","body":["Tryg Forsikring ligger alene i spidsen for årets Governance Rating for finans med ni ud af ti mulige point. Sidste års vinder, Ringkjøbing Landbobank, deler andenpladsen med Sydbank, mens Kreditbanken, BankNordik og Lollands Bank ligger i bunden af listen over de tyve børsnoterede finansselskaber.","De to halve point, Tryg mangler, er oplysende. Det ene koster bestyrelsens gennemsnitsalder, der ligger over 55 år. Det andet koster en manglende whistleblower-ordning med indberetning til uafhængig tredjepart. Kun seks af de tyve tilbyder den."],"whyItMatters":"Ratingen er et af de få danske forsøg på at gøre governance sammenligneligt på tværs af selskaber år for år. Den læses af de bestyrelser, den måler.","analysis":"Aldersmålepunktet er det mest oplysende: der gives point for yngre bestyrelser med indsigt i digitalisering og kunstig intelligens, og halvdelen af sektoren ligger over 60 år i gennemsnit.","topics":["governance","finanssektor","bestyrelser","danske erhvervsvilkaar"],"entities":["Tryg Forsikring","Ringkjøbing Landbobank","Sydbank","BankNordik","Økonomisk Ugebrev","Morten W. Langer"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":64,"decisionValue":84,"novelty":78,"sourceQuality":76,"personalRelevance":90,"contrast":66},"claims":[{"text":"Tryg Forsikring topper årets Governance Rating for finans med ni ud af ti point, foran Ringkjøbing Landbobank og Sydbank","sourceUrls":["https://ugebrev.dk/finans/tema-governance-rating-finans-tryg-laegger-sig-alene-i-front/"],"confidence":"high"},{"text":"Kun tre af de tyve børsnoterede finansselskaber har bestyrelser med en gennemsnitsalder under 55 år, mens halvdelen ligger over 60 år","sourceUrls":["https://ugebrev.dk/finans/tema-governance-rating-finans-tryg-laegger-sig-alene-i-front/"],"confidence":"high"},{"text":"Seks finansvirksomheder giver ansatte mulighed for at indberette til en uafhængig tredjepart; Danske Bank, Jyske Bank og Tryg gør ikke","sourceUrls":["https://ugebrev.dk/finans/tema-governance-rating-finans-tryg-laegger-sig-alene-i-front/"],"confidence":"high"}],"sources":[{"title":"Tema: Governance Rating Finans: Tryg lægger sig alene i front","publisher":"Økonomisk Ugebrev","url":"https://ugebrev.dk/finans/tema-governance-rating-finans-tryg-laegger-sig-alene-i-front/","publishedAt":"2026-08-11T09:00:58.000Z","kind":"analysis"}],"image":{"url":"https://ugebrev.dk/wp-content/uploads/2024/12/Johan-Kirstein-Brammer.jpg","credit":"Foto: Gregers Tycho/Ritzau Scanpix","alt":"Arkivfoto anvendt af Økonomisk Ugebrev: Johan Kirstein Brammer, adm. direktør i Tryg, i mørkeblåt jakkesæt i et sivområde.","sourceUrl":"https://ugebrev.dk/finans/tema-governance-rating-finans-tryg-laegger-sig-alene-i-front/"}},{"id":"thomas-20260811-trump-media-q2","eventKey":"trump-media-technology-group-q2-2026-underskud","materialFacts":["Trump Media & Technology Group tabte over 230 mio. dollar i andet kvartal mod 20 mio. dollar i samme kvartal sidste år","Omsætningen var 1,7 mio. dollar, en stigning på 89 pct.","190 mio. dollar af tabet stammer fra digitale aktiver og værdipapirer","Selskabet lancerede 1. august en betalt tjeneste med hurtig adgang til opslag; over ti kunder betaler mellem 60.000 og 100.000 dollar om måneden","Direktør Kevin McGurn oplyser, at abonnenterne hovedsageligt er højfrekvenshandelsfirmaer"],"section":"Økonomi","headline":"Selskab bag Trumps sociale medie taber milliarder","primarySourceUrl":"https://nyheder.tv2.dk/udland/2026-08-11-selskab-bag-trumps-sociale-medie-taber-milliarder","subheadline":"Trump Media tabte over 230 millioner dollar på et kvartal med en omsætning på 1,7 millioner. Den nye indtægtskilde er højfrekvenshandlere, der betaler for hurtig adgang til platformens mest fulgte opslag.","body":["Moderselskabet bag Truth Social, Trump Media & Technology Group, tabte over 230 millioner dollar i andet kvartal mod 20 millioner i samme kvartal sidste år. Omsætningen var 1,7 millioner dollar, en fremgang på 89 procent. 190 millioner af tabet kom fra værdifald på digitale aktiver og værdipapirer, oplyser selskabet ifølge AFP.","Den 1. august lancerede selskabet en betalt tjeneste med hurtig adgang til opslag fra platformens mest fulgte brugere. Over ti kunder betaler mellem 60.000 og 100.000 dollar om måneden, og de er ifølge direktør Kevin McGurn hovedsageligt højfrekvenshandelsfirmaer."],"whyItMatters":"Forskellen mellem 1,7 millioner i omsætning og 230 millioner i tab er ikke et driftsproblem. Det er en oplysning om, hvad selskabet er.","analysis":"Det nye produkt er den egentlige nyhed. Når præsidentens udmeldinger kommer på en platform, hans eget selskab ejer, kan latenstiden på dem sælges.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/3/5/9/3591ea08-316b-400f-b430-0f50e524a60b?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=MCwxNTcsMzAwMCwxNjg4&s=dbeaaa69c26c0c38c914b06c2661ff8c","credit":"Foto: Dado Ruvic / Ritzau Scanpix","alt":"Illustrationsfoto anvendt af TV 2: en silhuet af Donald Trumps profil i forgrunden foran Truth Social-logoet på en skærm.","sourceUrl":"https://nyheder.tv2.dk/udland/2026-08-11-selskab-bag-trumps-sociale-medie-taber-milliarder"},"topics":["usa","kapitalmarkeder","medier","krypto"],"entities":["Trump Media & Technology Group","Truth Social","Kevin McGurn","Donald Trump","TAE"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":62,"decisionValue":58,"novelty":86,"sourceQuality":74,"personalRelevance":64,"contrast":84},"claims":[{"text":"Trump Media & Technology Group tabte over 230 mio. dollar i andet kvartal 2026 mod 20 mio. dollar i samme kvartal året før","sourceUrls":["https://nyheder.tv2.dk/udland/2026-08-11-selskab-bag-trumps-sociale-medie-taber-milliarder"],"confidence":"high"},{"text":"Selskabets omsætning i andet kvartal var 1,7 mio. dollar, en stigning på 89 pct.","sourceUrls":["https://nyheder.tv2.dk/udland/2026-08-11-selskab-bag-trumps-sociale-medie-taber-milliarder"],"confidence":"high"},{"text":"Mere end ti kunder betaler 60.000-100.000 dollar om måneden for hurtig adgang til opslag, og de er hovedsageligt højfrekvenshandelsfirmaer","sourceUrls":["https://nyheder.tv2.dk/udland/2026-08-11-selskab-bag-trumps-sociale-medie-taber-milliarder"],"confidence":"high"}],"sources":[{"title":"Selskab bag Trumps sociale medie taber milliarder","publisher":"TV 2","url":"https://nyheder.tv2.dk/udland/2026-08-11-selskab-bag-trumps-sociale-medie-taber-milliarder","publishedAt":"2026-08-11T03:33:02.931Z","kind":"reporting"}]},{"id":"thomas-20260811-assad-doedsstraf","eventKey":"syrien-domstol-doedsstraf-assad-in-absentia-2026","materialFacts":["En syrisk domstol har idømt Bashar al-Assad og hans bror Maher dødsstraf in absentia","Dommen lyder på forbrydelser mod menneskeheden og krigsforbrydelser under borgerkrigen","Assads fætter Atef Najib, tidligere brigadegeneral, er også idømt dødsstraf og var til stede i retten","Najib er dømt for at have ledet undertrykkelsen i Daraa-provinsen, hvor borgerkrigen brød ud i 2011","Bashar og Maher al-Assad flygtede til Rusland i 2024"],"section":"Udland","headline":"Syriens tidligere præsident Assad idømt dødsstraf in absentia","primarySourceUrl":"https://www.dr.dk/nyheder/udland/syriens-tidligere-praesident-assad-idoemt-doedsstraf-absentia","subheadline":"Bashar al-Assad og hans bror er dømt for krigsforbrydelser af en syrisk domstol. De sidder i Rusland. Fætteren, der ledede undertrykkelsen i Daraa, sad i retssalen.","body":["En syrisk domstol har tirsdag idømt den afsatte præsident Bashar al-Assad og hans bror Maher dødsstraf in absentia for forbrydelser mod menneskeheden og krigsforbrydelser under den næsten 14 år lange borgerkrig, der kostede omkring en halv million mennesker livet. Begge flygtede til Rusland i 2024.","Assads fætter Atef Najib, tidligere brigadegeneral i den syriske hær, er også idømt dødsstraf og var til stede, da dommen faldt. Han er dømt for at have ledet undertrykkelsen i Daraa-provinsen, hvor borgerkrigen brød ud i 2011."],"whyItMatters":"Dommen kan ikke fuldbyrdes, så længe Rusland huser de dømte. Værdien er, at et syrisk retsvæsen nu har skrevet ned, hvad regimet gjorde.","analysis":"In absentia-domme afvises let som symbolik, men de fastlægger en position i syrisk ret, som enhver senere normalisering skal forholde sig til. Fætteren Atef Najib viser forskellen: han var til stede, og hans dom kan fuldbyrdes.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/ku4d2clv/20250725-190619-l_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Foto: Joseph Eid, AFP/Ritzau Scanpix","alt":"Arkivfoto: Bashar al-Assad siddende og gestikulerende under et interview, mens han var Syriens præsident.","sourceUrl":"https://www.dr.dk/nyheder/udland/syriens-tidligere-praesident-assad-idoemt-doedsstraf-absentia"},"topics":["syrien","retsopgoer","krigsforbrydelser"],"entities":["Bashar al-Assad","Maher al-Assad","Atef Najib","Syrien","Daraa","Rusland"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":80,"decisionValue":48,"novelty":88,"sourceQuality":82,"personalRelevance":44,"contrast":70},"claims":[{"text":"En syrisk domstol har idømt Bashar al-Assad og hans bror Maher dødsstraf in absentia for forbrydelser mod menneskeheden og krigsforbrydelser","sourceUrls":["https://www.dr.dk/nyheder/udland/syriens-tidligere-praesident-assad-idoemt-doedsstraf-absentia"],"confidence":"high"},{"text":"Atef Najib er idømt dødsstraf og var til stede i retten, dømt for at have ledet undertrykkelsen i Daraa","sourceUrls":["https://www.dr.dk/nyheder/udland/syriens-tidligere-praesident-assad-idoemt-doedsstraf-absentia"],"confidence":"high"}],"sources":[{"title":"Syriens tidligere præsident Assad idømt dødsstraf in absentia","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/syriens-tidligere-praesident-assad-idoemt-doedsstraf-absentia","publishedAt":"2026-08-11T09:12:03.000Z","kind":"reporting"}]},{"id":"thomas-20260811-boeje-christiansen-vm","eventKey":"boeje-christiansen-mixeddouble-vm-2026-indien-seedet","materialFacts":["Mathias Christiansen og Alexandra Bøje er nummer tre på verdensranglisten i mixeddouble","Parret er ifølge TV 2 Sport for første gang seedet til en medalje ved et VM","VM afholdes i Indien","Parret har vundet tre turneringer i 2026","Forberedelserne omfatter samtaler med en sportspsykolog"],"section":"Sport","headline":"Dansk toppar står i ny situation ved VM","primarySourceUrl":"https://sport.tv2.dk/badminton/2026-08-11-dansk-toppar-staar-i-ny-situation-ved-vm","subheadline":"Mathias Christiansen og Alexandra Bøje er nummer tre i verden og for første gang seedet til VM-medalje. Det har de hyret en sportspsykolog til at kunne bære.","body":["Tre turneringssejre i 2026 har sendt den danske mixeddouble Mathias Christiansen og Alexandra Bøje op som nummer tre på verdensranglisten. Ved VM i Indien er de dermed seedet til en medalje, noget parret ifølge TV 2 Sport aldrig har prøvet før.","\"Det skal vi lige kunne kapere. Men vi vil rigtig gerne være i den her situation, hvor der er gode muligheder i stedet for at skulle lave et mirakelresultat, for at det kan lade sig gøre\", siger Mathias Christiansen. Samtaler med en sportspsykolog er en del af forberedelsen, og ambitionen er udtalt: alt andet end en medalje ville være uambitiøst, siger han."],"whyItMatters":"Et seedet par går ind til et mesterskab med en anden forventning end et, der skal overraske. Det er den forskel, de selv peger på.","analysis":"Det bemærkelsesværdige er, hvad de siger højt. Presset skifter karakter, når man går fra outsider til favorit, og de behandler det som en teknisk opgave.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/2/8/f/28f97da1-a352-4eaf-913f-2f0740f4d869?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=MTkxNywwLDQ3MzAsMjY2MQ&s=6465bb7e41b90b9bec996b34929e9dcf","credit":"Foto: Mads Claus Rasmussen / Ritzau Scanpix","alt":"Mathias Christiansen og Alexandra Bøje i dialog på banen under en kamp; hendes landsholdstrøje bærer navnet BØJE og DENMARK.","sourceUrl":"https://sport.tv2.dk/badminton/2026-08-11-dansk-toppar-staar-i-ny-situation-ved-vm"},"topics":["sport","badminton","danske sportsfolk"],"entities":["Mathias Christiansen","Alexandra Bøje","Indien"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":48,"decisionValue":30,"novelty":72,"sourceQuality":74,"personalRelevance":88,"contrast":52},"claims":[{"text":"Mathias Christiansen og Alexandra Bøje er nummer tre på verdensranglisten, og parret er ifølge TV 2 Sport for første gang seedet til en VM-medalje","sourceUrls":["https://sport.tv2.dk/badminton/2026-08-11-dansk-toppar-staar-i-ny-situation-ved-vm"],"confidence":"high"},{"text":"Parret har vundet tre turneringer i 2026 og bruger en sportspsykolog i forberedelserne til VM i Indien","sourceUrls":["https://sport.tv2.dk/badminton/2026-08-11-dansk-toppar-staar-i-ny-situation-ved-vm"],"confidence":"high"}],"sources":[{"title":"Dansk toppar står i ny situation ved VM","publisher":"TV 2 Sport","url":"https://sport.tv2.dk/badminton/2026-08-11-dansk-toppar-staar-i-ny-situation-ved-vm","publishedAt":"2026-08-11T13:32:23.220Z","kind":"reporting"}]}],"signals":[{"text":"Erhvervsministeriet scorer 1.600 årsværk fra Fødevareministeriet","headline":"Erhvervsministeriet scorer 1.600 årsværk fra Fødevareministeriet","url":"https://www.altinget.dk/artikel/erhvervsministeriet-scorer-1600-aarsvaerk-fra-foedevareministeriet","publisher":"Altinget","section":"Politik","publishedAt":"2026-08-11T00:00:00.000Z","summary":"Erhvervsministeriet får ansvaret for 1.606 årsværk fra det nedlagte Ministerium for Fødevarer, Landbrug og Fiskeri og vokser samlet med over 1.100 årsværk som følge af regeringens ressortomlægninger. Det oplyser ministeriet til Altinget."},{"text":"Tidligere Microsoft-topchef Mette Kaagaard er en perfekt brik i André Rogaczewskis store plan","headline":"Tidligere Microsoft-topchef Mette Kaagaard er en perfekt brik i André Rogaczewskis store plan","url":"https://www.computerworld.dk/art/296443/tidligere-microsoft-topchef-mette-kaagaard-er-en-perfekt-brik-i-andr-rogaczewskis-store-plan","publisher":"Computerworld","section":"Navne","publishedAt":"2026-08-11T08:55:00.000Z","summary":"Computerworlds kommentar: André Rogaczewski har gjort det til en del af Netcompanys vækstmodel at hente profiler med erfaring, netværk og tyngde ind udefra, og ansættelsen af Mette Kaagaard passer ind i den strategi. Resten af artiklen er bag betalingsmur."},{"text":"GHG Protocol og ISO vil lave fælles standard for CO2-regnskab","headline":"GHG Protocol og ISO vil lave fælles standard for CO2-regnskab","url":"https://ugebrev.dk/samfundsansvar/esg-nyt/ghg-protocol-og-iso-vil-lave-faelles-standard-for-co2-regnskab/","publisher":"Økonomisk Ugebrev","section":"Erhverv","publishedAt":"2026-08-11T12:05:07.000Z","summary":"GHG Protocol og ISO lægger scope 1, 2 og 3 sammen med ISO 14064-1 i én global standard for virksomheders klimaregnskaber. Udkast ventes i høring i andet kvartal 2027, den endelige standard først i fjerde kvartal 2028."},{"text":"Trods årelangt fokus er lærermanglen massiv: Nu poster flere og flere kommuner selv penge i fremtidens lærere","headline":"Trods årelangt fokus er lærermanglen massiv: Nu poster flere og flere kommuner selv penge i fremtidens lærere","url":"https://www.dr.dk/nyheder/indland/trods-aarelangt-fokus-er-laerermanglen-massiv-nu-poster-flere-og-flere-kommuner-selv-penge-i","publisher":"DR","section":"Indland","publishedAt":"2026-08-11T04:48:00.000Z","summary":"Færre søger ind på læreruddannelsen, frafaldet er stort, og en stor del af de nuværende lærere nærmer sig pensionsalderen. Kommunerne opretter nu selv uddannelsesstillinger, hvor lærerstuderende arbejder fast på skoler i nærheden. Både nu og fremover kommer der til at mangle uddannede folkeskolelærere, siger KL-næstformand Martin Damm (V)."},{"text":"Mens droner leder efter en problemulv, luntede der i aftes en ulv rundt ved en familierestaurant","headline":"Mens droner leder efter en problemulv, luntede der i aftes en ulv rundt ved en familierestaurant","url":"https://www.dr.dk/nyheder/indland/mens-droner-leder-efter-en-problemulv-luntede-der-i-aftes-en-ulv-rundt-ved-en-familierestaurant","publisher":"DR","section":"Indland","publishedAt":"2026-08-11T08:40:37.000Z","summary":"En formodet ulv gik mandag aften rundt ved familierestauranten Den Gyldne Pande få kilometer fra Nørre Nebel, kort efter at myndighederne satte droner ind i jagten på en problemulv. Restauranten ligger i den reguleringszone, hvor Naturstyrelsen forsøger at skyde ulven."},{"text":"Kommune vil undersøge arbejdsforholdene op til skoleleders selvmord","headline":"Kommune vil undersøge arbejdsforholdene op til skoleleders selvmord","url":"https://www.dr.dk/nyheder/indland/kommune-vil-undersoege-arbejdsforholdene-op-til-skoleleders-selvmord","publisher":"DR","section":"Indland","publishedAt":"2026-08-11T07:56:00.000Z","summary":"Alle otte partier i Ringkøbing-Skjern Kommunes byråd er enige om en ekstern uvildig undersøgelse af forløbet før og efter skoleleder Hans Henrik Jakobsens død i januar. Borgmester Lone Andersen (V) har brugt udtrykket \"voksenmobning\" om sagen."},{"text":"Sidste år opløste PKK sig selv - nu giver Tyrkiet delvis amnesti til militante","headline":"Sidste år opløste PKK sig selv - nu giver Tyrkiet delvis amnesti til militante","url":"https://www.dr.dk/nyheder/udland/sidste-aar-oploeste-pkk-sig-selv-nu-giver-tyrkiet-delvis-amnesti-til-militante","publisher":"DR","section":"Udland","publishedAt":"2026-08-11T05:38:52.000Z","summary":"Tyrkiets parlament vedtog mandag en lov, der giver begrænset juridisk beskyttelse til tidligere PKK-militante og åbner for at suspendere fængselsstraffe for medlemskab. Forsætlige drab og forbrydelser før sommeren 2005 er ikke omfattet. 468 af 600 parlamentsmedlemmer stemte for."},{"text":"Russisk spionoperation stoppet i Sverige","headline":"Russisk spionoperation stoppet i Sverige","url":"https://nyheder.tv2.dk/udland/2026-08-10-russisk-spionoperation-stoppet-i-sverige","publisher":"TV 2","section":"Udland","publishedAt":"2026-08-10T18:47:04.786Z"},{"text":"Ungt forældrepar tiltalt i sag om drab på spædbarn","headline":"Ungt forældrepar tiltalt i sag om drab på spædbarn","url":"https://nyheder.tv2.dk/krimi/2026-08-11-ungt-foraeldrepar-tiltalt-i-sag-om-drab-paa-spaedbarn","publisher":"TV 2","section":"Krimi","publishedAt":"2026-08-11T04:31:49.655Z"},{"text":"Restauratører melder om ”den bedste sommer i 20 år”","headline":"Restauratører melder om ”den bedste sommer i 20 år”","url":"https://nyheder.tv2.dk/samfund/2026-08-11-restauratoerer-melder-om-den-bedste-sommer-i-20-aar","publisher":"TV 2","section":"Indland","publishedAt":"2026-08-11T07:20:00.099Z","summary":"Restauratører i Blokhus og Løkken melder om den bedste indtjeningssommer i omkring 20 år og tilskriver det vejret. De har samtidig set flere nordmænd og svenskere samt gæster sydfra, der ifølge Thomas Othegraven fra Futten og Salino i Blokhus søger nordpå for at slippe for heden."},{"text":"Efter dårlige sager om hestevelfærd skal danskere forsvare VM-titel: 'Der er ikke sket nok'","headline":"Efter dårlige sager om hestevelfærd skal danskere forsvare VM-titel: 'Der er ikke sket nok'","url":"https://www.dr.dk/sporten/efter-daarlige-sager-om-hestevelfaerd-skal-danskere-forsvare-vm-titel-der-er-ikke-sket-nok","publisher":"DR Sporten","section":"Sport","publishedAt":"2026-08-11T05:15:00.000Z","summary":"Det danske dressurlandshold med Cathrine Laudrup-Dufour, nummer ét på Det Internationale Rideforbunds verdensrangliste, samt Carina Cassøe Krüth, Daniel Bachmann Andersen og Nadja Aabo Sloth indleder i dag VM-titelforsvaret i Aachen, oven på flere sager om dyrevelfærd i sporten siden OL i Paris i 2024."},{"text":"”Celtics perfekte signing” – britiske medier i svime over Høgh","headline":"”Celtics perfekte signing” – britiske medier i svime over Høgh","url":"https://sport.tv2.dk/fodbold/2026-08-10-celtics-perfekte-signing-britiske-medier-i-svime-over-hoegh","publisher":"TV 2 Sport","section":"Sport","publishedAt":"2026-08-10T07:28:43.441Z"}],"column":{"authoredBy":"ai","slug":"uenigheden-ligger-i-inddelingen","title":"Uenigheden ligger i inddelingen","thesis":"Når to velinformerede mennesker er uenige om, hvorvidt noget går fremad eller tilbage, skyldes det sjældent, at de bruger forskellige tal; de deler den samme virkelighed op på hver sin måde.","body":["Et gennemsnit er en beslutning, ikke en observation. Man vælger, hvem der tælles med, og hvor grænserne går, og først derefter falder tallet ud. Skifter man inddelingen, kan retningen vende, uden at et eneste datapunkt ændrer sig. Statistikere kender fænomenet som Simpsons paradoks: hver undergruppe kan bevæge sig den ene vej, mens totalen bevæger sig den anden.","Jeg mener, det har en konsekvens, der sjældent trækkes. Striden om, hvorvidt et samfund forbedres, er ofte ikke en strid om fakta, men om en inddeling, ingen af parterne har gjort eksplicit. Derfor fører flere tal så sjældent til enighed."],"uncertainty":"Hvis de fleste virkelige uenigheder viser sig at bero på, at parterne citerer forskellige kilder, og ikke på den samme størrelse opgjort på hver sin inddeling, så beskriver jeg et særtilfælde, som om det var reglen.","topics":["statistik","erkendelse","offentlig debat"],"sources":[{"title":"Simpson’s Paradox","publisher":"Stanford Encyclopedia of Philosophy","url":"https://plato.stanford.edu/entries/paradox-simpson/","kind":"analysis","publishedAt":"2026-06-06T00:00:00.000Z"}]},"recommendations":[{"id":"thomas-rec-20260811-arendalsuka","mode":"experience","kind":"Konference og debatuge","status":"available","title":"Arendalsuka","creator":"Arendalsuka","provider":"Arendalsuka","url":"https://www.arendalsuka.no/","availability":"10.-14. august 2026 i Arendal. Gratis adgang uden billetter til alle arrangementer. Mange streames direkte og kan ses i optagelse, men hos de enkelte arrangører, ikke på én platform.","commitment":"Fra ét arrangement på en time til fem dage","description":"Norges demokratifestival: fem dage, hvor partier, erhvervsorganisationer, fagbevægelse, myndigheder og NGO'er holder åbne arrangementer i Arendal. Hovedprogrammet og kulturprogrammet er offentligt, og en stor del sendes direkte fra festivalen.","rationale":"Det er Folkemødet set udefra, og forskellen er lærerig: den norske udgave er tættere på erhvervsorganisationernes egen dagsorden og bruges åbenlyst som markedsplads for positioner og folk. Den kører netop nu og til og med fredag, så du kan følge de sessioner, der lig
