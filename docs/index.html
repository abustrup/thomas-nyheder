<!doctype html>
<html lang="da" data-chrome="minimal" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Thomas' Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),

.media-fallback-label {

.story-eyebrow {

.story-byline,

.story-headline {

.headline-link { text-decoration: none; }

.story-subheadline {

.story-card .story-subheadline {

.story-body,

.story-body p,

.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {

  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);

}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {

  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 90ms ease;
  /* Suppress the grey flash iOS paints over a tapped button, which otherwise
     competes with the :active state below, and remove the 300ms tap delay. */
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}
/* A tap must feel like a press. :hover and :focus-visible never fire on a touch
   tap, so before this the chip was visually inert on a phone and the reader had
   no way to tell the click had registered. :active gives the immediate press,
   .is-selected gives the lasting answer, matching .feedback-button above. */
.reason-chip:active {
  background: color-mix(in srgb, var(--ink) 12%, transparent);
  transform: scale(0.96);
}
.reason-chip.is-selected {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.reason-chip.is-selected:hover,
.reason-chip.is-selected:focus-visible {
  background: color-mix(in srgb, var(--ink) 86%, var(--paper));
}
@media (prefers-reduced-motion: reduce) {
  .reason-chip { transition: none; }
  .reason-chip:active { transform: none; }
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

/* A reader with only a daily edition gets no bar at all: three of the five
   edition links would 404, and the "Vis som" switcher is a question nobody
   asked. Keyed off <html data-chrome>, stamped at render time from the profile,
   so the bar is gone before first paint rather than flashing in and vanishing
   once the module boots. The bindings are skipped too (see bindEditionNav), so
   the links are absent from the DOM rather than merely invisible. */
:root[data-chrome="minimal"] .top-bar {
  display: none;
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {

nd-sag har kostet sektoren omdømme og compliance-milliarder — og her lander straffen markant under anklagemyndighedens krav.","analysis":"At anklagemyndigheden overvejer anke, mens banken allerede har hensat tilstrækkelige midler, antyder, at begge parter læser dommen som en delvis sejr. Det mest sigende tal er ikke bøden, men forholdet mellem krav og udfald: 2,3 procent.","topics":["finans","hvidvask","danmark"],"entities":["Nordea","Københavns Byret","Anders Holkmann Olsen"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":70,"novelty":55,"sourceQuality":92,"personalRelevance":70,"contrast":60},"claims":[{"text":"Københavns Byret frifandt Nordea på 5 ud af 7 forhold og idømte en bøde på 155 mio. kr. mod et krav på 6,6 mia. kr.","sourceUrls":["https://www.nordea.com/da/presse/2026-11-09/nordea-kommenterer-dom-i-sag-om-foranstaltninger-til-forebyggelse-af-hvidvask-fra-2012-til-2015","https://politi.dk/national-enhed-for-saerlig-kriminalitet/nyhedsliste/nordea-skal-betale-en-boede-paa-155-millioner-kroner-for-brud-paa-hvidvaskloven/2026/11/09"],"confidence":"high"}],"sources":[{"title":"Nordea kommenterer dom i sag om foranstaltninger til forebyggelse af hvidvask fra 2012 til 2015","publisher":"Nordea","url":"https://www.nordea.com/da/presse/2026-11-09/nordea-kommenterer-dom-i-sag-om-foranstaltninger-til-forebyggelse-af-hvidvask-fra-2012-til-2015","publishedAt":"2026-11-09T13:03:00Z","kind":"primary"},{"title":"Nordea skal betale en bøde på 155 millioner kroner for brud på hvidvaskloven","publisher":"National enhed for Særlig Kriminalitet (NSK)","url":"https://politi.dk/national-enhed-for-saerlig-kriminalitet/nyhedsliste/nordea-skal-betale-en-boede-paa-155-millioner-kroner-for-brud-paa-hvidvaskloven/2026/11/09","publishedAt":"2026-11-09T13:57:00Z","kind":"primary"}],"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Kobenhavns_byret.jpg/1920px-Kobenhavns_byret.jpg","credit":"Foto: Johannes Jansson/norden.org, Wikimedia Commons (CC BY 2.5 DK)","alt":"Københavns Byrets søjlefacade med indskriften \"Med lov skal man land bygge\" — stedet hvor dommen mod Nordea blev afsagt.","sourceUrl":"https://commons.wikimedia.org/wiki/File:Kobenhavns_byret.jpg"}},{"id":"story-nvidia-20261114","eventKey":"nvidia-ceo-transition-20261112","materialFacts":["Jensen Huang fratrådte øjeblikkeligt efter 33 år","Colette Kress konstitueret CEO","Harvey C. Jones ny bestyrelsesformand"],"section":"Teknologi","headline":"NVIDIA Announces CEO Transition","primarySourceUrl":"https://nvidianews.nvidia.com/news/nvidia-announces-ceo-transition","subheadline":"Jensen Huang forlader efter 33 år ansvaret for verdens mest værdifulde chipproducent uden en opgivet årsag; finansdirektør Colette Kress overtager midlertidigt.","body":["Nvidia meddelte torsdag, at Jensen Huang øjeblikkeligt er fratrådt som president, CEO og bestyrelsesmedlem efter 33 år i spidsen. Finansdirektør Colette Kress, CFO siden 2013, er konstitueret direktør og beholder CFO-titlen. Harvey C. Jones, tidligere topchef i Synopsys, bliver bestyrelsens første formand nogensinde.","Meddelelsen angiver ingen årsag ud over tak for Huangs \"umådelige bidrag\". Bestyrelsen oplyser, at søgningen efter en permanent direktør er i gang, og udtrykker \"fuld tillid\" til Kress i mellemtiden."],"whyItMatters":"Huang har personificeret Nvidias vej fra grafikkort-producent til AI-industriens vigtigste leverandør, og en brat afgang rammer, netop som markedsværdien er under pres.","analysis":"At Nvidia ikke oplyser en årsag, mens ekstern omtale kobler afgangen til en personlig sag, er en kløft værd at holde adskilt: bekræftet er kun hvem der går, hvem der overtager, og at det skete øjeblikkeligt.","topics":["ai","erhverv","usa"],"entities":["Nvidia","Jensen Huang","Colette Kress","Harvey C. Jones"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":88,"decisionValue":60,"novelty":90,"sourceQuality":95,"personalRelevance":55,"contrast":85},"claims":[{"text":"Jensen Huang fratrådte øjeblikkeligt som president, CEO og bestyrelsesmedlem; Colette Kress blev konstitueret CEO; Harvey C. Jones blev ny bestyrelsesformand.","sourceUrls":["https://nvidianews.nvidia.com/news/nvidia-announces-ceo-transition"],"confidence":"high"}],"sources":[{"title":"NVIDIA Announces CEO Transition","publisher":"NVIDIA Newsroom","url":"https://nvidianews.nvidia.com/news/nvidia-announces-ceo-transition","publishedAt":"2026-11-12T13:00:00Z","kind":"primary"}],"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Jensen_Huang_%28cropped%29.jpg/1920px-Jensen_Huang_%28cropped%29.jpg","credit":"Foto: Prime Minister's Office, Indien / Wikimedia Commons (GODL-India)","alt":"Arkivfoto af Jensen Huang, der efter 33 år er fratrådt som Nvidias administrerende direktør.","sourceUrl":"https://commons.wikimedia.org/wiki/File:Jensen_Huang_(cropped).jpg"}},{"id":"story-flights-20261114","eventKey":"us-faa-groundstop-20261114","materialFacts":["Over 8.000 fly aflyst/forsinket","Længste startforbud siden 9/11","Eurocontrol suspenderede afgange fra 42 lande til USA"],"section":"Udland","headline":"Det længste startforbud siden 9/11 skabte flykaos I USA: Konsekvenserne kan vare flere dage, siger minister","primarySourceUrl":"https://www.dr.dk/nyheder/udland/det-laengste-startforbud-siden-9-11-skabte-flykaos-i-usa-konsekvenserne-kan-vare-flere-dage-siger","subheadline":"Over 8.000 fly blev aflyst eller forsinket, da forældet kontroltårns-teknologi kollapsede under datamængden — og Danmark blev ramt, da Eurocontrol lukkede for afgange til USA.","body":["Et fire timer langt startforbud lammede natten til lørdag amerikansk indenrigstrafik og ramte over 8.000 flyafgange — det længste siden 11. september 2001. Minister Sean Duffy peger på forældede routere og kontroltårns-systemer, overbelastet af datamængden, og beder Kongressen om 50 milliarder dollar til et nyt system.","Eurocontrol suspenderede afgange fra alle 42 medlemslande til USA frem til klokken seks lørdag morgen og ramte også danske rejsende — blandt dem Theodor Shalmi, der sad fast i Chicago i over to timer."],"whyItMatters":"Hændelsen lægger et konkret tal på, hvor skrøbelig amerikansk lufttrafikinfrastruktur er blevet, og hvor hurtigt det spreder sig til rejsende, der aldrig sætter deres fod i et amerikansk kontroltårn.","analysis":"Duffys krav om 50 milliarder dollar er en politisk åbning snarere end et budgetteret tal, men timingen gør politisk fremdrift sandsynlig, uanset hvor beløbet ender.","topics":["usa","transport","international"],"entities":["Sean Duffy","Eurocontrol","Theodor Shalmi"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":75,"decisionValue":50,"novelty":70,"sourceQuality":82,"personalRelevance":30,"contrast":75},"claims":[{"text":"Over 8.000 fly blev aflyst eller forsinket under det længste amerikanske startforbud siden 9/11; Eurocontrol suspenderede afgange fra 42 lande til USA.","sourceUrls":["https://www.dr.dk/nyheder/udland/det-laengste-startforbud-siden-9-11-skabte-flykaos-i-usa-konsekvenserne-kan-vare-flere-dage-siger"],"confidence":"high"}],"sources":[{"title":"Det længste startforbud siden 9/11 skabte flykaos I USA: Konsekvenserne kan vare flere dage, siger minister","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/det-laengste-startforbud-siden-9-11-skabte-flykaos-i-usa-konsekvenserne-kan-vare-flere-dage-siger","publishedAt":"2026-11-14T04:53:41Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/bnbfuw1z/15054653_jerr_us_dc_duffy_flights_congress_ncaa-00010005.jpg?im=SmartCrop%2Csize%3D%281200%2C675%29","credit":"Kilde: DR","alt":"USA's transportminister Sean Duffy orienterer om det landsdækkende startforbud fra Det Hvide Hus.","sourceUrl":"https://www.dr.dk/nyheder/udland/det-laengste-startforbud-siden-9-11-skabte-flykaos-i-usa-konsekvenserne-kan-vare-flere-dage-siger"}},{"id":"story-ailawsuit-20261114","eventKey":"ai-lawsuit-freeze-models-20261111","materialFacts":["Fire organisationer sagsøgte fem AI-selskaber","Kræver retskendelse der fryser nye modeller","Sagsanlagt 11. november ved San Francisco Superior Court"],"section":"Teknologi","headline":"US nonprofits sue tech giants to halt AI development","primarySourceUrl":"https://www.aljazeera.com/news/2026/11/12/us-nonprofits-sue-tech-giants-to-halt-ai-development","subheadline":"Fire amerikanske interesseorganisationer kræver ved en domstol i San Francisco, at Anthropic, Google, Meta, OpenAI og SpaceX stopper udvikling af nye AI-modeller, indtil de kan bevise menneskelig kontrol.","body":["Irreplaceable Education Fund, Public Citizen, Heat Initiative og Alliance for Secure AI anlagde onsdag sag mod de fem selskaber ved San Francisco Superior Court. Søgsmålet kræver et forbud mod træning og udrulning af nye modeller, indtil selskaberne kan dokumentere menneskelig kontrol.","Vejen går gennem Californiens lov om illoyal konkurrence: selskaberne bringer angiveligt folkesundhed og computersystemer i fare. Som bevis bruges dokumenterede AI-drevne cyberangreb og selskabernes egne udtalelser om, at uregulerede modeller kan \"løbe løbsk\"."],"whyItMatters":"Det er usædvanligt, at en koalition af forbrugerorganisationer — ikke regulatorer — bruger konkurrenceret til at forsøge at stoppe udviklingen af frontier-AI hos fem selskaber samtidig.","analysis":"Søgsmålet vinder næppe en nedlukning, men er et retorisk greb værd at bemærke: det bruger selskabernes egne advarsler om eksistentiel risiko som bevis imod dem selv.","topics":["ai","regulering","usa"],"entities":["Anthropic","Google","Meta","OpenAI","SpaceX","Public Citizen"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":68,"decisionValue":55,"novelty":75,"sourceQuality":70,"personalRelevance":45,"contrast":70},"claims":[{"text":"Fire interesseorganisationer sagsøgte fem AI-selskaber ved San Francisco Superior Court og kræver en retskendelse, der fryser træning og udrulning af nye frontier-modeller.","sourceUrls":["https://www.aljazeera.com/news/2026/11/12/us-nonprofits-sue-tech-giants-to-halt-ai-development"],"confidence":"medium"}],"sources":[{"title":"US nonprofits sue tech giants to halt AI development","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/11/12/us-nonprofits-sue-tech-giants-to-halt-ai-development","publishedAt":"2026-11-12T00:00:00Z","kind":"reporting"}],"image":{"url":"https://www.aljazeera.com/wp-content/uploads/2026/11/ap_6af606cdc097e-1794508493.jpg?resize=1920%2C1440","credit":"Kilde: Al Jazeera","alt":"US nonprofits sue tech giants to halt AI development","sourceUrl":"https://www.aljazeera.com/news/2026/11/12/us-nonprofits-sue-tech-giants-to-halt-ai-development"}},{"id":"story-bisgaard-20261114","eventKey":"bisgaard-dcai-exit-20261113","materialFacts":["Bisgaard forlader DCAI efter 5 måneder","Starter egen virksomhed","Tredje lederskifte i DCAI i 2026"],"section":"Erhverv","headline":"Efter blot fem måneder: Tidligere Nvidia-chef forlader selskabet bag Danmarks AI-supercomputer","primarySourceUrl":"https://www.computerworld.dk/art/297606/efter-blot-fem-maaneder-tidligere-nvidia-chef-forlader-selskabet-bag-danmarks-ai-supercomputer","subheadline":"Rasmus Bisgaard forlader posten som kommerciel direktør i Danish Centre for AI Innovation for at starte egen virksomhed — tredje lederskifte i DCAI i år.","body":["Rasmus Bisgaard, der tiltrådte som kommerciel direktør i Danish Centre for AI Innovation (DCAI) 1. juni 2026, forlader nu posten efter kun fem måneder. DCAI driver Danmarks AI-supercomputer Gefion. Bisgaard kom fra Nvidia og skriver på LinkedIn, at han vil starte sin egen virksomhed.","Afgangen kommer kort efter, at Netcompany købte 23,7 procent af DCAI, og er det tredje lederskifte i organisationen i 2026: Bisgaard tiltrådte samtidig med ny direktør Martin Svensson, der afløste Nadia Carlsten, efter hun forlod posten brat."],"whyItMatters":"Tre lederskifter på ét år i en nøgleinstitution for dansk AI-infrastruktur er ikke støj, men et signal om manglende leje i organisationens grundlag.","analysis":"\"Starte egen virksomhed\" er den mest neutrale begrundelse, en afgående direktør kan give — men kombineret med Netcompanys nye ejerskab peger det på en organisation, der stadig leder efter sin styringsform.","topics":["ai","danmark","erhverv"],"entities":["Rasmus Bisgaard","DCAI","Gefion","Martin Svensson","Netcompany"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":55,"decisionValue":55,"novelty":70,"sourceQuality":78,"personalRelevance":85,"contrast":55},"claims":[{"text":"Rasmus Bisgaard forlader DCAI efter fem måneder som kommerciel direktør for at starte egen virksomhed; tredje lederskifte i DCAI i 2026.","sourceUrls":["https://www.computerworld.dk/art/297606/efter-blot-fem-maaneder-tidligere-nvidia-chef-forlader-selskabet-bag-danmarks-ai-supercomputer"],"confidence":"high"}],"sources":[{"title":"Efter blot fem måneder: Tidligere Nvidia-chef forlader selskabet bag Danmarks AI-supercomputer","publisher":"Computerworld DK","url":"https://www.computerworld.dk/art/297606/efter-blot-fem-maaneder-tidligere-nvidia-chef-forlader-selskabet-bag-danmarks-ai-supercomputer","publishedAt":"2026-11-13T12:56:00Z","kind":"reporting"}],"image":{"url":"https://www.computerworld.dk/fil/221834?width=1200&height=630&focus=1","credit":"Kilde: Computerworld","alt":"Rasmus Bisgaard, der efter fem måneder forlader posten som kommerciel direktør i DCAI.","sourceUrl":"https://www.computerworld.dk/art/297606/efter-blot-fem-maaneder-tidligere-nvidia-chef-forlader-selskabet-bag-danmarks-ai-supercomputer"}},{"id":"story-harris-20261114","eventKey":"jacob-harris-rt-interview-20261113","materialFacts":["Harris gav interview til Russia Today","Løkke: forbi punktet for 'nyttig idiot'","S-ordfører kalder det farligt og skadeligt"],"section":"Politik","headline":"Jacob Harris sammenligner Danmark med diktatur. Løkke hælder ham ned ad brættet","primarySourceUrl":"https://www.dr.dk/nyheder/politik/jacob-harris-sammenligner-danmark-med-diktatur-loekke-haelder-ham-ned-ad-braettet","subheadline":"Løsgængeren gav et interview til det sanktionerede russiske statsmedie Russia Today — udenrigsministeren kalder ham forbi punktet for \"nyttig idiot\".","body":["Folketingsmedlem Jacob Harris (løsgænger) medvirkede i et interview på det sanktionerede russiske statsmedie Russia Today, hvor han sagde: \"Vi taler om at have demokrati i Europa, men jeg synes, vi nærmer os diktatur,\" og talte imod dansk militær støtte til Ukraine.","Udenrigsminister Lars Løkke Rasmussen svarer: \"Vi har haft begrebet 'nyttig idiot', men vi er forbi det punkt.\" S-ordfører Rasmus Stoklund kalder optrædenen \"decideret farlig og skadelig\". Harris forsvarer selv medvirken som dialog."],"whyItMatters":"Det er usædvanligt, at et siddende folketingsmedlem stiller op på et sanktioneret russisk statsmedie for at kritisere europæisk Ukraine-politik, og regeringens hårde sprog markerer grænsen for det.","analysis":"Ordvalget fra Løkke og Stoklund — \"nyttig idiot\", \"farlig og skadelig\" — er stærkere end normal partipolitisk uenighed: episoden læses som et sikkerhedsspørgsmål, ikke en ytringsfrihedsdebat.","topics":["politik","danmark","sikkerhed"],"entities":["Jacob Harris","Lars Løkke Rasmussen","Rasmus Stoklund","Russia Today"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":65,"decisionValue":45,"novelty":60,"sourceQuality":85,"personalRelevance":60,"contrast":70},"claims":[{"text":"Jacob Harris gav interview til Russia Today og sammenlignede Europas udvikling med diktatur; Løkke svarede at Harris er forbi punktet for 'nyttig idiot'.","sourceUrls":["https://www.dr.dk/nyheder/politik/jacob-harris-sammenligner-danmark-med-diktatur-loekke-haelder-ham-ned-ad-braettet"],"confidence":"high"}],"sources":[{"title":"Jacob Harris sammenligner Danmark med diktatur. Løkke hælder ham ned ad brættet","publisher":"DR","url":"https://www.dr.dk/nyheder/politik/jacob-harris-sammenligner-danmark-med-diktatur-loekk   }

  // src/web/app.js
  function renderBrief(brief) {

    document.querySelector("#brief-reading-time").textContent = `${brief.readingMinutes} minutters l\xE6sning`;
    document.querySelector("#brief-title").textContent = brand();
    document.querySelector("#brief-dek").textContent = brief.dek;

      const keyNumberPanel = renderKeyNumber(brief.keyNumber);
      keyNumberSlot.replaceChildren(...keyNumberPanel ? [keyNumberPanel] : []);
      keyNumberSlot.hidden = !keyNumberPanel;
    }
    const klummeSlot = document.querySelector("#klumme-slot");
    if (klummeSlot) {
      const klummePanel = renderColumn(brief.column);
      klummeSlot.replaceChildren(...klummePanel ? [klummePanel] : []);
      klummeSlot.hidden = !klummePanel;
    }

    const storyGrid2 = document.querySelector("#story-grid");
    const leadSignals = document.querySelector("#lead-signals");
    const shortNews = document.querySelector("#short-news");
    const shortNewsSection = document.querySelector("#short-news-section");
    leadContainer.replaceChildren();
    storyGrid2.replaceChildren();
    leadSignals.replaceChildren(element("h2", "signals-title", "Morgenens signaler"));
    shortNews.replaceChildren();
    for (const story of brief.stories) {
      (story.isLead ? leadContainer : storyGrid2).append(renderStory(story));
    }
    for (const signal of brief.signals.slice(0, 4)) {

    }

  }
  async function sendFeedback(button, transport, reason) {

    const direction = button.dataset.direction ?? article.querySelector('[aria-pressed="true"]')?.dataset.direction;
    const isRecommendation = article.dataset.contentType === "recommendation";
    const payload = {
      storyId: article.dataset.storyId,
      browserId: getBrowserId(),
      direction,

      ...reason ? { reason } : {},

        control.classList.toggle("is-selected", pressed);
      });
    };

      feedbackStorageKey(payload.storyId, payload.contentType),
      direction

    if (status) status.textContent = "Feedback gemt";
    try {
      const result = await transport(payload);
      if (status && result?.status !== "saved") {
        status.textContent = "Gemt lokalt i denne browser \u2013 p\xE5virker ikke morgendagens udvalg";
      }
      return payload;
    } catch (error) {

  }
  function appsScriptTransport(payload) {

  }
  async function httpFeedbackTransport(payload, fetcher = globalThis.fetch) {

  function defaultFeedbackTransport() {

  function bindFeedback(transport = defaultFeedbackTransport()) {

      if (!button) return;
      try {
        const directionButton = button.dataset.direction ? button : button.closest("article").querySelector('[data-direction][aria-pressed="true"]');
        if (!directionButton) return;
        const reasonButton = button.dataset.reason ? button : null;
        let rollbackReason = null;
        if (reasonButton) {
          const article = reasonButton.closest("article");
          const storyId = article?.dataset.storyId;
          const contentType = article?.dataset.contentType === "recommendation" ? "recommendation" : "story";
          const wasSelected = reasonButton.classList.contains("is-selected");
          reasonButton.classList.add("is-selected");
          reasonButton.setAttribute("aria-pressed", "true");

        } catch (error) {

          throw error;
        }

  function bindReadLater() {

      if (save) {
        toggleSaved({
          id: save.dataset.saveStory,
          headline: save.dataset.saveHeadline,
          url: save.dataset.saveUrl

        syncSaveButtons();
        renderReadLater(panel);
        return;

  }
  function buildNarrationSegments(brief) {
    const segments = [];
    if (brief.title) segments.push(brief.title);
    if (brief.dek) segments.push(brief.dek);
    const ordered = [...brief.stories].sort((a, b) => Number(b.isLead) - Number(a.isLead));
    for (const story of ordered) {
      if (story.headline) segments.push(story.headline);
      if (story.subheadline) segments.push(story.subheadline);
      if (Array.isArray(story.body)) {
        for (const paragraph of story.body) segments.push(paragraph);
      }
      if (story.whyItMatters) segments.push(story.whyItMatters);
      if (story.analysis) segments.push(story.analysis);

  }
  function pickDanishVoice(synth) {

  }

  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");

    if (!narrator) {

    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";

    stopButton.disabled = true;
    narrator.onstatechange = (state) => {

  function renderDaily(brief) {

  function bootArchive(index = globalThis.__BRIEF_DATA__) {

  function boot(brief = globalThis.__BRIEF_DATA__) {
