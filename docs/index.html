<!doctype html>
<html lang="da" data-chrome="minimal" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Thomas' Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

/* A reader with only a daily edition gets no bar at all: three of the five
   edition links would 404, and the "Vis som" switcher is a question nobody
   asked. Keyed off <html data-chrome>, stamped at render time from the profile,
   so the bar is gone before first paint rather than flashing in and vanishing
   once the module boots. The bindings are skipped too (see bindEditionNav), so
   the links are absent from the DOM rather than merely invisible. */
:root[data-chrome="minimal"] .top-bar {
  display: none;
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band

hweizerfranc per ton mod normalt 17,50 til 25 franc. Lars van Wageningen, leder for forskning og rådgivning i Global Insights, ser ingen bedring i sigte. I 2022 nåede raterne 260 franc, så det er ikke et rekordniveau. Yara har i år skåret sine lægtervolumener til Tyskland med næsten 40 procent, og Elkem flytter last over på vej."],"whyItMatters":"Rhinen er den billigste vej ind i det tyske industrilandskab, og dansk eksport til Tyskland ligger for enden af den kæde. Når vandstanden afgør, hvor meget et skib må laste, er klima blevet en logistikomkostning.","analysis":"Lavvandet rammer også Donau. Ungarns eneste atomkraftværk, Paks, er lukket ned og kan ifølge Reuters køre på 10 procents kapacitet i de kommende uger, afhængigt af vandstanden.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Rhein_in_K%C3%B6ln_bei_Niedrigwasser_2026-7444.jpg/1280px-Rhein_in_K%C3%B6ln_bei_Niedrigwasser_2026-7444.jpg","credit":"Foto: Raimond Spekking / CC BY-SA 4.0 (via Wikimedia Commons)","alt":"Rheinauhafen i Köln den 1. august 2026: havnebassinet er svundet ind til en smal rende, og bunden ligger tørlagt og algegrøn ved siden af bådebroerne. Domkirkens spir ses i baggrunden.","sourceUrl":"https://commons.wikimedia.org/wiki/File:Rhein_in_K%C3%B6ln_bei_Niedrigwasser_2026-7444.jpg"},"topics":["logistik","europaeisk-industri","klima","forsyningskaeder","tyskland"],"entities":["Rhinen","CCNR","Jörg Rusche","Yara","Elkem","Norsk Hydro","Global Insights"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":86,"novelty":82,"sourceQuality":78,"personalRelevance":84,"contrast":72},"claims":[{"text":"Lastskibe på Rhinen kan i øjeblikket kun fragte omkring 20 til 25 procent af deres normale last","sourceUrls":["https://e24.no/energi-og-klima/i/QJ8d2W/historisk-lav-vannstand-i-rhinen-har-skapt-transportutfordringer"],"confidence":"high"},{"text":"Fragtraten til Basel er steget til 250 schweizerfranc per ton mod normalt 17,50 til 25 franc; i 2022 nåede raterne 260 franc, så det er ikke et rekordniveau","sourceUrls":["https://e24.no/energi-og-klima/i/QJ8d2W/historisk-lav-vannstand-i-rhinen-har-skapt-transportutfordringer"],"confidence":"high"},{"text":"Ungarns eneste atomkraftværk Paks er lukket ned på grund af lav vandstand i Donau og kan ifølge Reuters køre på 10 procents kapacitet i de kommende uger","sourceUrls":["https://e24.no/energi-og-klima/i/QJ8d2W/historisk-lav-vannstand-i-rhinen-har-skapt-transportutfordringer"],"confidence":"medium"}],"sources":[{"title":"Historisk lav vannstand i Rhinen: – Har skapt transportutfordringer","publisher":"E24","url":"https://e24.no/energi-og-klima/i/QJ8d2W/historisk-lav-vannstand-i-rhinen-har-skapt-transportutfordringer","publishedAt":"2026-08-09T20:32:00.000Z","kind":"reporting"}]},{"id":"thomas-20260810-cbp-toldrefusion","eventKey":"cbp-toldrefusion-100-mia-dollar-liberation-day","materialFacts":["CBP har færdigbehandlet krav på omkring 100 milliarder dollar i told opkrævet efter Liberation Day 2. april 2025","USA's højesteret underkendte tolden i februar","Ved udgangen af juli var krav for 128,68 milliarder dollar accepteret til behandling","Næsten 20.000 ansøgninger for i alt 1,6 milliarder dollar blev afvist på grund af manglende kontooplysninger","Den amerikanske regering har tidligere oplyst, at den opkrævede omkring 166 milliarder dollar under kriseloven IEEPA"],"section":"Økonomi","headline":"Har tilbakebetalt 100 milliarder toll-dollar","primarySourceUrl":"https://e24.no/internasjonal-oekonomi/i/ExB3gP/har-tilbakebetalt-100-milliarder-toll-dollar","subheadline":"USA's toldmyndighed har færdigbehandlet krav for omkring 100 milliarder dollar, efter at højesteret underkendte Trumps Liberation Day-told. Pengene går til importørerne, ikke til forbrugerne.","body":["USA's told- og grænsekontrol CBP har færdigbehandlet krav på omkring 100 milliarder dollar i told, opkrævet efter Donald Trumps såkaldte Liberation Day den 2. april 2025. Det fremgår af et dokument til handelsdomstolen CIT. Beløbet inkluderer renter og er sendt til finansministeriet til udbetaling.","Ved udgangen af juli var krav for 128,68 milliarder dollar accepteret til behandling, mens næsten 20.000 ansøgninger for 1,6 milliarder var afvist på grund af manglende kontooplysninger. Ifølge CNN har Apple allerede fået omkring 2,2 milliarder tilbage, Amazon 600 millioner og Nike 300 millioner."],"whyItMatters":"Kun selskaber, der betalte tolden direkte, kan kræve pengene igen. Tolden kostede amerikanske husholdninger omkring 1.000 dollar i 2025 ifølge Tax Foundation, refereret af CNN.","analysis":"For en europæisk eksportør er lektien, at en told kan rulles tilbage, uden at kompensationen når frem til køberen.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/31/Port_of_Savannah_Non-Intrusive_Inspections_%28NII%29_and_Cargo_Operations_%2853069308293%29.jpg/1280px-Port_of_Savannah_Non-Intrusive_Inspections_%28NII%29_and_Cargo_Operations_%2853069308293%29.jpg","credit":"Foto: CBP / Jerry Glaser (public domain, via Wikimedia Commons)","alt":"Arkivfoto fra juni 2023: en officer fra USA's told- og grænsekontrol CBP signalerer til føreren af en terminaltraktor under containerinspektion i Port of Savannah.","sourceUrl":"https://commons.wikimedia.org/wiki/File:Port_of_Savannah_Non-Intrusive_Inspections_(NII)_and_Cargo_Operations_(53069308293).jpg"},"topics":["eu-us-handel","told","usa","handelspolitik","importoerer"],"entities":["CBP","Donald Trump","USA's højesteret","CIT","Apple","Amazon","Nike"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":84,"novelty":80,"sourceQuality":76,"personalRelevance":92,"contrast":70},"claims":[{"text":"CBP har færdigbehandlet krav på omkring 100 milliarder dollar i told opkrævet efter Liberation Day den 2. april 2025, og beløbet er sendt til finansministeriet til udbetaling","sourceUrls":["https://e24.no/internasjonal-oekonomi/i/ExB3gP/har-tilbakebetalt-100-milliarder-toll-dollar"],"confidence":"high"},{"text":"Ved udgangen af juli var krav for 128,68 milliarder dollar accepteret til behandling, og næsten 20.000 ansøgninger for 1,6 milliarder dollar var afvist på grund af manglende kontooplysninger","sourceUrls":["https://e24.no/internasjonal-oekonomi/i/ExB3gP/har-tilbakebetalt-100-milliarder-toll-dollar"],"confidence":"high"},{"text":"Tolden kostede amerikanske husholdninger omkring 1.000 dollar i 2025 ifølge Tax Foundation, refereret af CNN, og husholdninger er ikke omfattet af tilbagebetalingen","sourceUrls":["https://e24.no/internasjonal-oekonomi/i/ExB3gP/har-tilbakebetalt-100-milliarder-toll-dollar"],"confidence":"medium"}],"sources":[{"title":"Har tilbakebetalt 100 milliarder toll-dollar","publisher":"E24","url":"https://e24.no/internasjonal-oekonomi/i/ExB3gP/har-tilbakebetalt-100-milliarder-toll-dollar","publishedAt":"2026-08-07T17:57:00.000Z","kind":"reporting"}]},{"id":"thomas-20260810-pfas-lambda-cyhalothrin","eventKey":"miljoestyrelsen-lambda-cyhalothrin-tfa-drikkevand-2026","materialFacts":["Salget af lambda-cyhalothrin er steget i Danmark siden 2015","I 2024 blev der solgt midler med i alt 3.326 kilo af stoffet","TFA er i 2021-2024 fundet i 902 danske drikkevandsboringer, ifølge Miljøministeriet 40 procent af de undersøgte","Miljøstyrelsen vurderer, at de nuværende TFA-værdier ikke er til fare for mennesker","Ministeren har bedt ministeriet vurdere et forbud ud fra EU's forsigtighedsprincip, mens forskningen afventes"],"section":"Indland","headline":"Salg af mistænkt PFAS-sprøjtegift stiger i Danmark","primarySourceUrl":"https://www.dr.dk/nyheder/indland/salg-af-mistaenkt-pfas-sproejtegift-stiger-i-danmark","subheadline":"Miljøstyrelsen mistænker insektgiften lambda-cyhalothrin for at danne evighedsstoffet TFA. Ministeren siger, hun forbyder produkterne, hvis forskningen bekræfter frygten.","body":["Salget af insektgiften lambda-cyhalothrin er steget i Danmark siden 2015, og i 2024 blev der solgt midler med i alt 3.326 kilo. Miljøstyrelsen mistænker det og fire andre PFAS-stoffer, der fortsat er tilladt i Danmark, for at danne evighedskemikaliet TFA. Stoffet er i 2021 til 2024 fundet i 902 drikkevandsboringer, 40 procent af de undersøgte.","Miljøstyrelsen vurderer ikke de nuværende værdier som farlige for mennesker. Miljøminister Maria Reumert Gjerding (SF) siger ifølge Ritzau, at hvis forskningen viser det, hun frygter, »så kommer vi til at forbyde produkter med lambda-cyhalothrin«. GEUS har fået 1,8 millioner kroner til at afklare det."],"whyItMatters":"Et dansk forbud mod pesticider, der stadig sælges lovligt, rammer landbrugets omkostningsside.","analysis":"Der kører to spor: ministeren har bedt sit ministerium vurdere et forbud ud fra EU's forsigtighedsprincip, mens forskningen afventes.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/sjoio50s/20260624-150912-l_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Foto: Ida Marie Odgaard, Ritzau Scanpix","alt":"Arkivfoto af miljøminister Maria Reumert Gjerding (SF) i Folketingssalen.","sourceUrl":"https://www.dr.dk/nyheder/indland/salg-af-mistaenkt-pfas-sproejtegift-stiger-i-danmark"},"topics":["miljoe","drikkevand","regulering","eu-regulering","landbrug"],"entities":["Miljøstyrelsen","Maria Reumert Gjerding","GEUS","TFA","lambda-cyhalothrin"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":78,"decisionValue":72,"novelty":76,"sourceQuality":80,"personalRelevance":70,"contrast":62},"claims":[{"text":"I 2024 blev der solgt midler med i alt 3.326 kilo lambda-cyhalothrin i Danmark, og salget er steget siden 2015","sourceUrls":["https://www.dr.dk/nyheder/indland/salg-af-mistaenkt-pfas-sproejtegift-stiger-i-danmark"],"confidence":"high"},{"text":"TFA er i 2021-2024 fundet i 902 danske drikkevandsboringer, ifølge Miljøministeriet 40 procent af de undersøgte, og Miljøstyrelsen vurderer ikke de nuværende værdier som farlige for mennesker","sourceUrls":["https://www.dr.dk/nyheder/indland/salg-af-mistaenkt-pfas-sproejtegift-stiger-i-danmark"],"confidence":"high"}],"sources":[{"title":"Salg af mistænkt PFAS-sprøjtegift stiger i Danmark","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/salg-af-mistaenkt-pfas-sproejtegift-stiger-i-danmark","publishedAt":"2026-08-09T17:52:03.000Z","kind":"reporting"}]},{"id":"thomas-20260810-spanien-italien-graensekontrol","eventKey":"spanien-italien-gensidig-graensekontrol-ceuta-2026","materialFacts":["Italien har indført skærpet grænsekontrol med rejsende fra Spanien og fastholdt den i denne uge","Spanien har svaret med skærpet paskontrol af passagerer fra Italien med fly eller skib","De spanske foranstaltninger løber ifølge BBC efter planen til 7. september","Ifølge El País kontrolleres kun en brøkdel af passagererne","Giorgia Meloni har sagt, at Spanien burde suspenderes fra Schengen-samarbejdet"],"section":"Udland","headline":"Spanien og Italien har nu indført grænsekontrol mod hinanden som følge af begivenhederne i Ceuta","primarySourceUrl":"https://www.dr.dk/nyheder/udland/spanien-og-italien-har-nu-indfoert-graensekontrol-mod-hinanden-som-foelge-af-begivenhederne-i-ceuta","subheadline":"To store EU-lande kontrollerer nu hinandens rejsende. Anledningen er Ceuta, men indholdet er Schengen, og de spanske foranstaltninger løber efter planen til 7. september.","body":["Italien indførte skærpet grænsekontrol med rejsende fra Spanien, efter at tusindvis af migranter strømmede ind over grænsen til den spanske eksklave Ceuta, og fastholdt den i denne uge. Premierminister Giorgia Meloni havde forinden sagt, at Spanien burde suspenderes fra Schengen.","Spanien svarede med skærpet paskontrol af passagerer fra Italien med fly eller skib; landene deler ingen landegrænse. Foranstaltningerne løber ifølge BBC efter planen til 7. september, medmindre omstændighederne ændrer sig. Den italienske indenrigsminister Matteo Piantedosi sagde lørdag, at Italiens kontrol står på en uge endnu. Ifølge El País bliver kun en brøkdel af passagererne kontrolleret."],"whyItMatters":"Det er ikke en migrationssag, men en indre-marked-sag: fri bevægelighed som forhandlingskort mellem to hovedstæder.","analysis":"Kontrollen er tynd, og det er pointen: virkningen ligger i friktionen og i signalet, ikke i opdagelsen.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/0uhiff4u/20260808-133627-3.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Foto: Spanish Police, Reuters/Ritzau Scanpix","alt":"Spansk politi tager imod et fly med rejsende fra Italien i Barajas-lufthavnen i Madrid.","sourceUrl":"https://www.dr.dk/nyheder/udland/spanien-og-italien-har-nu-indfoert-graensekontrol-mod-hinanden-som-foelge-af-begivenhederne-i-ceuta"},"topics":["eu","schengen","indre-marked","spanien","italien"],"entities":["Spanien","Italien","Giorgia Meloni","Matteo Piantedosi","Ceuta","Schengen"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":74,"novelty":82,"sourceQuality":76,"personalRelevance":86,"contrast":78},"claims":[{"text":"Spaniens skærpede paskontrol med passagerer fra Italien løber ifølge BBC efter planen til 7. september, medmindre omstændighederne ændrer sig","sourceUrls":["https://www.dr.dk/nyheder/udland/spanien-og-italien-har-nu-indfoert-graensekontrol-mod-hinanden-som-foelge-af-begivenhederne-i-ceuta"],"confidence":"medium"},{"text":"Ifølge El País bliver kun en brøkdel af passagererne reelt kontrolleret","sourceUrls":["https://www.dr.dk/nyheder/udland/spanien-og-italien-har-nu-indfoert-graensekontrol-mod-hinanden-som-foelge-af-begivenhederne-i-ceuta"],"confidence":"medium"}],"sources":[{"title":"Spanien og Italien har nu indført grænsekontrol mod hinanden som følge af begivenhederne i Ceuta","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/spanien-og-italien-har-nu-indfoert-graensekontrol-mod-hinanden-som-foelge-af-begivenhederne-i-ceuta","publishedAt":"2026-08-09T18:08:40.000Z","kind":"reporting"}]},{"id":"thomas-20260810-fangeflugt-overbelaeg","eventKey":"fangeflugt-hvidovre-hospital-faengselsoverbelaeg-2026","materialFacts":["En 34-årig mand, der afsoner en dom for røveri, flygtede søndag omkring klokken 21.50 fra Hvidovre Hospital","Politiet vurderer ikke, at han er farlig, og beder ikke offentligheden om hjælp","Der sidder i gennemsnit 4.671 indsatte i de danske fængsler, mere end 1.000 flere end for ti år siden","Ringe Fængsel har plads til 141 indsatte","Kredsdirektør Michael Frølich beskriver manglende bemanding og meget stort overbelæg"],"section":"Indland","headline":"34-årig fange flygtede ved besøg på Hvidovre Hospital","primarySourceUrl":"https://nyheder.tv2.dk/krimi/2026-08-10-34-aarig-fange-flygtede-ved-besoeg-paa-hvidovre-hospital","subheadline":"Manden stak af fra ambulancen søndag aften. Han er ikke farlig, siger politiet. Men han forlod et fængselsvæsen med mere end 1.000 flere indsatte end for ti år siden.","body":["En 34-årig mand, der afsoner en dom for røveri, flygtede søndag omkring klokken 21.50 fra Hvidovre Hospital. Han havde sagt, at han havde det skidt, og »da han skulle ud af ambulancen og ind på skadestuen, så han sit snit til at stikke af«, siger vagtchef Jens Møller, Københavns Vestegns Politi.","Politiet vurderer ikke, at han er farlig, og beder ikke offentligheden om hjælp. Flugten falder ned i et fængselsvæsen under pres: der sidder i gennemsnit 4.671 indsatte i danske fængsler, over 1.000 flere end for ti år siden. Kredsdirektør Michael Frølich taler om »manglende bemanding og meget stort overbelæg«."],"whyItMatters":"Transporten til en skadestue er den mest almindelige situation, hvor en indsat forlader matriklen, og den koster bemanding.","analysis":"Én flugt beviser intet om et system. Men tallene står uafhængigt af den, og det er Kriminalforsorgens egen kredsdirektør, der bruger ordet overbelæg.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/e/5/c/e5cce148-deb5-4cdf-ad99-cdb4962 ,"eventKey":"pentagon-feinberg-notat-forsvarsindustri-leveringstempo-2026","materialFacts":["Viceforsvarsminister Steve Feinberg sendte onsdag et notat til den amerikanske forsvarsindustris ledere","Notatet kræver markant hurtigere leveringsplaner og øget produktion af kritiske kapaciteter","The Washington Post har set rundskrivelsen og bragte den først","Reuters har berettet, at USA brugte betydelige dele af sin beholdning af langtrækkende præcisionsmissiler under krigen i Iran","Pete Hegseth har på X afvist CNN's historie om, at knap 80 procent af THAAD-missilerne skulle være opbrugt"],"section":"Udland","headline":"Pentagon kræver mere fart på USA's forsvarsindustri","primarySourceUrl":"https://nyheder.tv2.dk/udland/2026-08-09-pentagon-kraever-mere-fart-paa-usas-forsvarsindustri","subheadline":"Viceforsvarsminister Steve Feinberg har sendt et notat til forsvarsindustriens ledere: årelange udviklingscyklusser er uacceptable, og produktionen skal op.","body":["USA's viceforsvarsminister Steve Feinberg sendte onsdag et notat til den amerikanske forsvarsindustris ledere med krav om »markant hurtigere, mere aggressive leveringsplaner og/eller øget produktion af kritiske kapaciteter«. »Årelange udviklingscyklusser er uacceptable,« skriver han ifølge The Washington Post, som har set rundskrivelsen.","Reuters har berettet, at USA brugte betydelige dele af sin beholdning af langtrækkende præcisionsmissiler under krigen i Iran. Pete Hegseth har på X afvist CNN's historie om, at USA skulle have opbrugt knap 80 procent af sine THAAD-missiler."],"whyItMatters":"Når Washington beder sin egen industri om at løbe hurtigere, bliver ordrebøgerne fyldt indefra. Europæiske underleverandører konkurrerer nu mod et hastekrav.","analysis":"Notatet er en indrømmelse: udviklingstiden er problemet, ikke bevillingen — samme diagnose, europæiske forsvarsministerier stiller om sig selv.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/8/c/1/8c118e9e-2b1a-473c-bca4-9e463b9d5e6f?ixlib= Løbets eneste dansker, Amalie Dideriksen, sluttede som nummer 92"],"section":"Sport","headline":"Hollandsk stjerne tager Tour-triumf efter stort drama på sidste etape","primarySourceUrl":"https://www.dr.dk/sporten/cykling/tourdefrance/historisk-taet-tour-afgoerelse-venter-paa-spraengfarlig-etape","subheadline":"Demi Vollering kørte fra Katarzyna Niewiadoma-Phinney på sidste stigning og vandt Tour de France Femmes for anden gang. Otte sekunder skilte dem ved etapestart.","body":["Demi Vollering er den første kvinde, der har vundet Tour de France Femmes to gange. Den 29-årige hollænder fra FDJ kørte søndag solo på 9. og sidste etape og tog både sin tredje etapesejr i løbet og den samlede sejr; hun vandt også i 2023.","Ved etapestart havde hun kun otte sekunders forspring til polske Katarzyna Niewiadoma-Phinney fra Canyon. De angreb hinanden igen og igen på den sidste stigning, indtil polakken ikke kunne følge med. Hun blev nummer to samlet, mens italienske Elisa Longo Borghini fra UAE overtog tredjepladsen. Løbets eneste dansker, Amalie Dideriksen, blev nummer 92."],"whyItMatters":"Kvindernes Tour er nu ni etaper lang, og det er langt nok til, at et forspring kan bygges op og forsvares.","analysis":"Tredje etapesejr og samlet sejr i samme løb er en dominans, der ikke passer til otte sekunders forspring ved dagens start.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/0wxkgqhe/20260809-190255-l_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Foto: Manon Cruz, Reuters/Ritzau Scanpix","alt":"Demi Vollering fejrer sin samlede sejr i Tour de France Femmes 2026.","sourceUrl":"https://www.dr.dk/sporten/cykling/tourdefrance/historisk-taet-tour-afgoerelse-venter-paa-spraengfarlig-etape"},"topics":["cykling","sport","tour-de-france"],"entities":["Demi Vollering","Katarzyna Niewiadoma-Phinney","Elisa Longo Borghini","Amalie Dideriksen","FDJ","Canyon"],"isLead":false,"isOutsideProfile":false,"scores":{ rne i WBA, WBC, IBF og WBO. Alle dommere havde hende som vinder.","Thorslund havde selv to af bælterne, men måtte opgive dem, da hun blev gravid i sommeren 2025. Hun er fortsat ubesejret med 25 sejre i 25 kampe som professionel. »Det er en kæmpe eksplosion af følelser og lettelse over, at alt det hårde arbejde har betalt sig,« sagde hun ifølge DR i vinderinterviewet til ESPN i ringen."],"whyItMatters":"Ubestridt verdensmester kræver alle fire forbunds bælter samlet, og det sker sjældent.","analysis":"Det bemærkelsesværdige er rækkefølgen: hun gav to bælter fra sig frivilligt og vandt fire tilbage i én kamp.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/10zebbvm/20240525-233753-l_crop001.jpg","credit":"Foto: Thomas Sjoerup, Ritzau Scanpix","alt":"Arkivfoto af Dina Thorslund i en tidligere kamp. DR bruger billedet til historien om, at hun nu er verdensmester hos de fire største bokseforbund.","sourceUrl":"https://www.dr.dk/sporten/boksning/dina-thorslund-er-verdensmester-efter-en-overbevisende-sejr"},"topics":["boksning","sport","danske-sportsfolk"],"entities":["Dina Thorslund","Cherneka Johnson","WBA","WBC","IBF","WBO"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":60,"decisionValue":38,"novelty":84,"sourceQuality":76,"personalRelevance":88,"contrast":58},"claims":[{"text":"Dina Thorslund besejrede Cherneka Johnson og er ubestridt verdensmester i bantamvægt med alle fire bælter; alle dommere havde hende som vinder","sourceUrls":["https://sport.tv2.dk/boksning/2026-08-09-dansk-boksestjerne-i-kaempe-triumf"],"confidence":"high"},{"text":"Hun er ubesejret med 25 sejre i 25 kampe og måtte opgive to bælter, da hun blev gravid i sommeren 2025","sourceUrls":["https://sport.tv2.dk/boksning/2026-08-09-dansk-boksestjerne-i-kaempe-triumf","https://www.dr.dk/sporten/boksning/dina-thorslund-er-verdensmester-efter-en-overbevisende-sejr"],"confidence":"high"}],"sources":[{"title":"Dansk boksestjerne i kæmpe triumf","publisher":"TV 2 Sport","url":"https:/ "text":"Mistenker valutabløff bak Kinas eksportfest","headline":"Mistenker valutabløff bak Kinas eksportfest","url":"https://e24.no/internasjonal-oekonomi/i/6qVn83/mistenker-valutabloeff-bak-kinas-eksportfest","publisher":"E24","section":"Økonomi","publishedAt":"2026-08-09T12:19:00.000Z","summary":"Kinas eksport steg 23,9 procent i juli målt i dollar, og handelsoverskuddet for januar til juli er 687,4 milliarder dollar. Goldman Sachs vurderede i maj yuanen mere end 20 procent undervurderet over for dollaren, Brad Setser fra Council on Foreign Relations 30 til 35 procent."},{"text":"Oljefondet får kraftig rapport-motbør: – Henger ikke sammen","headline":"Oljefondet får kraftig rapport-motbør: – Henger ikke sammen","url":"https://e24.no/boers-og-finans/i/V6dm5l/oljefondet-faar-kraftig-rapport-motboer-henger-ikke-sammen","publisher":"E24","section":"Økonomi","publishedAt":"2026-08-09T15:59:00.000Z","summary":"Oljefondet vil afskaffe kravet om kvartalsrapportering som kilde til kortsigtethed. Folketrygdfondet frygter smitte til Norden, og flere norske forvaltere afviser argumentet. Norge gjorde kvartalsrapporter frivillige i 2017, og over 99 procent af høringssvarene til SEC's tilsvarende forslag er negative."},{"text":"Martin Hansen bliver ny viceadm. direktør i Green Power Denmark","headline":"Martin Hansen bliver ny viceadm. direktør i Green Power Denmark","url":"https://greenpowerdenmark.dk/nyheder/martin-hansen-bliver-ny-viceadm-direktoer-green-power-denmark","publisher":"Green Power Denmark","section":"Erhverv","publishedAt":"2026-08-03T07:33:22.000Z","summary":"Meldt 3. august: Martin Hansen, afdelingschef i Miljøministeriet og tidligere vicedirektør i Energistyrelsen, tiltræder 1. september med ansvar for industri og energiproduktion. Han afløser Jan Hylleberg, der bliver adm. direktør i Foreningen af Rådgivende Ingeniører."},{"text":"Sinner tvunget til afbud i stor turnering","headline":"Sinner tvunget til afbud i stor turnering","url":"https://sport.tv2.dk/tennis/2026-08-09-sinner-tvunget-til-afbud-i-stor-turnering","publisher":"TV 2 Sport","section":"Sport","publishedAt":"2026-08-09T21:36:07.342Z","summary":"Verdensetteren Jannik Sinner melder afbud til Cincinnati med en knæskade og har ikke spillet siden Wimbledon-finalen 12. juli. Carlos Alcaraz står også over med en håndledsskade. US Open begynder om tre uger."},{"text":"Katrine Koch følte sig nervøs og lille: Nu er hun Danmarks største medaljehåb","headline":"Katrine Koch følte sig nervøs og lille: Nu er hun Danmarks største medaljehåb","url":"https://www.dr.dk/sporten/atletik/em/katrine-koch-foelte-sig-nervoes-og-lille-nu-er-hun-danmarks-stoerste-medaljehaab","publisher":"DR","section":"Sport","publishedAt":"2026-08-09T19:36:03.000Z","summary":"Hammerkasteren Katrine Koch Jacobsen, 25, går i aktion ved EM i atletik i Birmingham fra i dag. Danmark har sendt rekordstore 28 atleter af sted med et officielt mål om mindst én medalje og tre top-8-placeringer. Hun blev nummer 10 i OL-finalen i Paris."},{"text":"Anders har opsagt sin lejlighed for at besøge alle Jyllands brune værtshuse","headline":"Anders har opsagt sin lejlighed for at besøge alle Jyllands brune værtshuse","url":"https://www.dr.dk/nyheder/indland/anders-har-opsagt-sin-lejlighed-besoege-alle-jyllands-brune-vaertshuse","publisher":"DR","section":"Indland","publishedAt":"2026-08-09T17:36:00.000Z","summary":"Anders Melsen, 28, har sagt sin lejlighed op for at cykle 3.000 kilometer op gennem Jylland og besøge lokale værtshuse. Han er på niende dag og har været på 16 værtshuse i Sønderjylland. Hans test er den hellige treenighed: dart, billardbord og spillemaskiner."}],"column":{"authoredBy":"ai","slug":"reglen-og-skoennet","title":"Reglen og skønnet","thesis":"Institutioner vælger faste regler frem for skøn, ikke fordi regler træffer bedre afgørelser, men fordi en regel flytter ansvaret fra den, der dømmer, til den, der skrev reglen.","body":["En regel afgøres på forhånd, et skøn i det øjeblik, sagen ligger på bordet. Begge kan tage fejl. Forskellen er, hvem der står med fejlen. Rammer en regel forkert, er det reglen, der er for grov; den, der anvendte den, gjorde sit arbejde. Rammer et skøn forkert, var det en person, der skønnede.","Derfor breder reglerne sig i takt med kravet om at kunne stilles til regnskab, ikke med at afgørelserne bliver bedre. Jeg mener, det er værd at sige højt, fordi diskussionen næsten altid føres som en om præcision. Den handler om et bytte: træfsikkerhed i den enkelte sag mod en ansvarsfordeling, alle kan leve med. Det bytte kan være rigtigt. Men det bliver sjældent foretaget med åbne øjne, når det kaldes forenkling."],"uncertainty":"Hvis nye regler typisk indføres dér, hvor skønnet dokumenterbart tog fejl oftest, og ikke dér, hvor presset for at placere ansvar var størst, så beskriver jeg noget, der ikke findes.","topics":["institutioner","regulering","ansvar"]},"recommendations":[{"id":"thomas-rec-20260810-mourinho","mode":"watch","kind":"Dokumentarserie","status":"upcoming","title":"MOURINHO","creator":"Joe Pearlman","provider":"Netflix","url":"https://www.netflix.com/dk/title/81762073","availability":"Netflix-abonnement. Netflix oplyser global premiere 11. august 2026 i sin egen pressemeddelelse på about.netflix.com; titelsiden selv oplyser ingen dato.","commitment":"3 afsnit","description":"Tredelt dokumentarserie om José Mourinho, filmet over to år. Netflix nævner Porto, Chelsea, Inter og Real Madrid og interviews med blandt andre Alex Ferguson, John Terry, Iker Casillas, Zlatan Ibrahimovic, Didier Drogba og Frank Lampard.","rationale":"Stoffet er ledelse mere end fodbold: en mand, der byggede vindende organisationer i fire lande og brændte broerne hvert sted. Ferguson-interviewet er den direkte anledning, men det interessante er, hvad der sker med en kultur bygget på én persons konfliktevne. Den lander i morgen, så du er først.","topics":["ledelse","sport","fodbold","organisationskultur"],"isFeatured":true,"image":{"url":"https://occ-     bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
</html>
