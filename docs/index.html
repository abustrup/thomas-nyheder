<!doctype html>
<html lang="da" data-chrome="minimal" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Thomas' Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),

.media-fallback-label {

.story-eyebrow {

.story-byline,

.story-headline {

.headline-link { text-decoration: none; }

.story-subheadline {

.story-card .story-subheadline {

.story-body,

.story-body p,

.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {

  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);

}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {

  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 90ms ease;
  /* Suppress the grey flash iOS paints over a tapped button, which otherwise
     competes with the :active state below, and remove the 300ms tap delay. */
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}
/* A tap must feel like a press. :hover and :focus-visible never fire on a touch
   tap, so before this the chip was visually inert on a phone and the reader had
   no way to tell the click had registered. :active gives the immediate press,
   .is-selected gives the lasting answer, matching .feedback-button above. */
.reason-chip:active {
  background: color-mix(in srgb, var(--ink) 12%, transparent);
  transform: scale(0.96);
}
.reason-chip.is-selected {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.reason-chip.is-selected:hover,
.reason-chip.is-selected:focus-visible {
  background: color-mix(in srgb, var(--ink) 86%, var(--paper));
}
@media (prefers-reduced-motion: reduce) {
  .reason-chip { transition: none; }
  .reason-chip:active { transform: none; }
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

/* A reader with only a daily edition gets no bar at all: three of the five
   edition links would 404, and the "Vis som" switcher is a question nobody
   asked. Keyed off <html data-chrome>, stamped at render time from the profile,
   so the bar is gone before first paint rather than flashing in and vanishing
   once the module boots. The bindings are skipped too (see bindEditionNav), so
   the links are absent from the DOM rather than merely invisible. */
:root[data-chrome="minimal"] .top-bar {
  display: none;
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {

ningerne; et exit ville efter selskabets egen vurdering lade milliardværdier tilfalde den russiske stat. I januar mistede koncernen alligevel kontrollen efter et dekret fra Putin."],"whyItMatters":"Stribevis af de største danske virksomheder kappede båndene til Rusland i 2022. Rockwool blev. At kravet nu kommer fra selskabets eget datterselskab viser, at passivt ejerskab hverken beskyttede aktiverne eller lukkede sagen.","analysis":"Pressechef Rasmus Windfeld bekræfter stævningen og afviser sagen, fordi Rusland \"ikke er en retsstat\". Syv måneder efter tabet af kontrollen er Rusland stadig en åben post — nu som krav frem for aktiv.","counterpoint":"Argumentet i 2022 var, at et exit ville forære værdierne til staten. De gik tabt.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/ynagvfog/20221123-124729-l_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR Nyheder (Foto: Bo Amstrup, Ritzau Scanpix)","alt":"Paller med indpakket Rockwool-isolering står stablet foran en Rockwool-fabrik med koncernens navn på facaden. Arkivfoto anvendt af DR i historien om det russiske søgsmål.","sourceUrl":"https://www.dr.dk/nyheder/penge/foerst-stjal-putin-danske-milliard-fabrikker-nu-sagsoeger-russerne-deres-danske-ejer-kaempe"},"topics":["rusland","markedsrisiko","dansk erhvervsliv","sanktioner"],"entities":["Rockwool","Rockwool LLC","Vladimir Putin","Rasmus Windfeld","Moskva"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":78,"decisionValue":84,"novelty":82,"sourceQuality":80,"personalRelevance":92,"contrast":62},"claims":[{"text":"Rockwool er sagsøgt af sit russiske datterselskab Rockwool LLC ved retten i Moskva.","sourceUrls":["https://www.dr.dk/nyheder/penge/foerst-stjal-putin-danske-milliard-fabrikker-nu-sagsoeger-russerne-deres-danske-ejer-kaempe"],"confidence":"high"},{"text":"Kravet lyder på 8,6 milliarder rubler, cirka 660 millioner kroner, og søgsmålet blev indgivet tirsdag.", eUrl":"https://www.dr.dk/nyheder/udland/nye-spor-i-tysk-efterforskning-af-droneangreb-med-bombe-peger-paa-et-bestemt-land","subheadline":"Fund i en skov og et frisk DNA-spor styrker mistanken mod Rusland. Målet var ukrainske transportfly i Nato-landenes våbenbro.","body":["Tyske efterforskere nærmer sig en opklaring af droneangrebet mod Leipzig/Halle-lufthavnen tirsdag i sidste uge. Mindst én specialbygget drone med plastisk sprængstof blev sendt ind mellem ukrainske Antonov-transportfly, der fragter vestlige våben til Ukraine for de europæiske Nato-lande.","Politiet fandt en metaldåse med 600 gram Semtex få meter fra dronen. Ifølge Die Zeit ramte dronen en vinge og faldt fire timer før en buschauffør opdagede den; dåsen røg af, og tændsatsen svigtede. Dronen var ombygget med ekstra batterier, kamera, 5G-router og to simkort."],"whyItMatters":"Tyske politikere har slået fast, at det ikke var spionage, men en fremmed magts angreb på tysk jord. Våbenbroen til Ukraine er nu et mål.","analysis":"Et frisk DNA-spor og fund i en skov styrker ifølge DR mistanken mod Rusland. DR skriver samtidig, at dronen har kunnet styres fra meget lang afstand — teoretisk set hvor som helst fra.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/rmpdgvk2/20260806-112818-7_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR Nyheder (Foto: Filip Singer, EPA/Ritzau Scanpix)","alt":"En lufthavnsmedarbejder i gul refleksvest sidder under motoren på et af de ukrainske transportfly i Leipzig/Halle-lufthavnen.","sourceUrl":"https://www.dr.dk/nyheder/udland/nye-spor-i-tysk-efterforskning-af-droneangreb-med-bombe-peger-paa-et-bestemt-land"},"topics":["sikkerhed","rusland","ukraine","nato","tyskland"],"entities":["Leipzig/Halle","Rusland","Tyskland","Ukraine","Antonov","Die Zeit"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":90,"decisionValue":66,"novelty":84,"sourceQuality":82,"personalRelevance":64, elser til syv kinesiske skibe","Maersk sejlede foerste containerskib gennem ruten i 2018 og har siden holdt sig vaek"],"section":"Verdenshandel og ruter","headline":"Kinesiske containerskip seiler gjennom Arktis med russisk godkjenning","primarySourceUrl":"https://e24.no/internasjonal-oekonomi/i/Gx53pB/kinesiske-containerskip-seiler-gjennom-arktis-med-russisk-godkjenning","subheadline":"Sea Legend åbner den første faste containerrute fra Kina til Europa gennem Nordøstpassagen. Rejsetiden halveres fra cirka 40 til 20 dage.","body":["Det kinesiske rederi Sea Legend åbner i denne uge den første faste containerrute mellem Asien og Europa gennem Arktis. Ruten går fra Ningbo til Felixstowe og halverer rejsetiden fra omkring 40 dage til cirka 20. Rosatom, det russiske statsselskab, bekræftede fredag tilladelser til syv kinesiske skibe.","Danske Mærsk sendte i 2018 det første containerskib gennem Nordøstpassagen, men har siden holdt sig væk, og flere europæiske rederier har lovet ikke at bruge ruten — dels af hensyn til økosystemet, dels på grund af Rusland. Rosatoms leder Alexei Likhachev siger, at 2026-programmet lægger op til ugentlige afgange."],"whyItMatters":"Tyve dage færre mellem Kina og Nordeuropa ændrer regnestykket for Suez og for de europæiske havne. Prisen er en russisk godkendelse.","analysis":"Jan Solski fra Norsk senter for havrett i Tromsø siger, at Rusland i praksis kontrollerer trafikken, men ikke frit kan afvise udenlandske skibe.","image":{"url":"https://akamai.vgc.no/v2/images/a61e3d28-670c-3353-ab19-0a9f3e6f7016?format=auto&w=1080&s=017582c3a537578021bc4c50c3e5ac2ed1ff692a","credit":"Kilde: E24 (Foto: China Daily / Reuters / NTB)","alt":"Et containerskib lastes under røde kraner mærket Port of Ningbo Zhoushan i det østlige Kina, hvor den nye arktiske rute mod Europa begynder. Arkivfoto anvendt af E24.","sourceUrl":"https://e24.no/internasjonal-oekonomi/i/Gx53pB/kinesiske-containerskip-seiler-gjennom-arktis-med-russisk-godkjenning"},"topics":["verdenshandel","kina","rusland","arktis","shipping"],"entities":["Sea Legend","Rosatom","Alexei Likhachev","Jan Solski","Mærsk","Ningbo","Felixstowe"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":80,"novelty":86,"sourceQuality":76,"personalRelevance":88,"contrast":70},"claims":[{"text":"Sea Legend åbner den første faste containerrute mellem Asien og Europa gennem Arktis, fra Ningbo til Felixstowe.","sourceUrls":["https://e24.no/internasjonal-oekonomi/i/Gx53pB/kinesiske-containerskip-seiler-gjennom-arktis-med-russisk-godkjenning"],"confidence":"high"},{"text":"Ruten halverer rejsetiden fra omkring 40 dage til cirka 20.","sourceUrls":["https://e24.no/internasjonal-oekonomi/i/Gx53pB/kinesiske-containerskip-seiler-gjennom-arktis-med-russisk-godkjenning"],"confidence":"high"},{"text":"Rosatom bekræftede fredag, at der er udstedt tilladelser til syv kinesiske skibe.","sourceUrls":["https://e24.no/internasjonal-oekonomi/i/Gx53pB/kinesiske-containerskip-seiler-gjennom-arktis-med-russisk-godkjenning"],"confidence":"high"},{"text":"Mærsk sendte i 2018 det første containerskib gennem Nordøstpassagen og har siden holdt sig væk.","sourceUrls":["https://e24.no/internasjonal-oekonomi/i/Gx53pB/kinesiske-containerskip-seiler-gjennom-arktis-med-russisk-godkjenning"],"confidence":"high"},{"text":"Jan Solski, førsteamanuensis ved Norsk senter for havrett på Universitetet i Tromsø, siger, at Rusland i praksis kontrollerer trafikken, men ikke frit kan afvise udenlandske skibe.","sourceUrls":["https://e24.no/internasjonal-oekonomi/i/Gx53pB/kinesiske-containerskip-seiler-gjennom-arktis-med-russisk-godkjenning"],"confidence":"high"}],"sources":[{"title":"Kinesiske containerskip seiler gjennom Arktis med russisk godkjenning","publisher":"E24","url":"https://e24.no/internasjonal-oekonomi/i/Gx53pB/kinesiske-containerskip-seiler-gjennom-arktis-med-russisk-godkjenning","publishedAt":"2026-08-14T18:38:58.000Z","kind":"reporting"}]},{"id":"thomas-2026-08-15-lovable-runde","eventKey":"lovable-kapitalrunde-scaleup-europe-2026-08","materialFacts":["Lovable har hentet 400 millioner dollars i en ny runde","Vaerdisaettelsen er 13,3 milliarder dollars mod 6,6 milliarder i december 2025","Investorerne omfatter Menlo Ventures, Tencent og EU-Kommissionens Scaleup Europe Fund","Scaleup Europe Fund forvaltes af svenske EQT"],"section":"Europæisk kapital og AI","headline":"Nærmer sig værdisætning på 100 milliarder kroner: Skandinavisk vibe coding-komet henter stort beløb for at vokse yderligere","primarySourceUrl":"https://www.computerworld.dk/art/296505/naermer-sig-vaerdisaetning-paa-100-milliarder-kroner-skandinavisk-vibe-coding-komet-henter-stort-beloeb-for-at-vokse-yderligere","subheadline":"Svenske Lovable har hentet 400 millioner dollars og er værdisat til 13,3 milliarder. EU-Kommissionens Scaleup Europe Fund er med i runden ved siden af Tencent.","body":["Det svenske AI-selskab Lovable har hentet 400 millioner dollars, mere end 2,5 milliarder kroner. Værdien er nu 13,3 milliarder dollars, cirka 86 milliarder kroner — en fordobling siden december 2025, hvor den lød på 6,6 milliarder. Selskabet er fra 2023, og platformen kom på markedet i november 2024.","Blandt investorerne er amerikanske Menlo Ventures, kinesiske Tencent og EU-Kommissionens Scaleup Europe Fund, der forvaltes af svenske EQT. Produktet er vibe coding: brugeren beskriver i almindeligt sprog, hvad programmet skal kunne. Direktør og medstifter er Anton Osika."],"whyItMatters":"EU-Kommissionens egen fond investerer her side om side med Tencent. Europæisk kapital i et europæisk vækstselskab, men ikke uafhængighed.","analysis":"Værdien er fordoblet på otte måneder på et produkt under to år gammelt. Multiplen forudsætter, at kodegenerering forbliver et marked, ikke en funktion i modellernes abonnementer.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/3/3d/Anton_Osika_Web_Summit_2025_%28cropped%29.jpg","credit":"Foto: Sam Barnes/Web Summit via Sportsfile (CC BY ere niveau,\" siger forperson Benjamin Hansen.","Bruddet kom i februar 2024, da Pride spurgte sponsorerne om deres \"interesser og aktiviteter i Israel og Palæstina\" og gjorde partnerskab betinget af svaret. Mærsk, Google og Novo Nordisk trak sig. I år er blandt andre Dansk Industri, Danske Bank og Google tilbage. Pride skal årligt finde ti millioner kroner."],"whyItMatters":"Et prisskilt på, hvad en værdipolitisk stillingtagen koster en organisation, der lever af partnerskaber.","analysis":"Interessen er ifølge Pride større nu end i de seneste år. At Dansk Industri er tilbage, er det tungeste signal: erhvervsorganisationerne sætter normen for medlemmerne.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/msicg4bo/20230819-173837-l_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR Nyheder (Foto: Ritzau Scanpix)","alt":"Deltagere, vogne og regnbueflag i Copenhagen Pride-paraden i Københavns gader. DR angiver, at billedet er fra optoget i 2023.","sourceUrl":"https://www.dr.dk/nyheder/indland/aar-efter-sponsorflugt-arbejder-copenhagen-pride-stadig-paa-genoprette-tilliden"},"topics":["erhvervsorganisationer","omdømme","sponsorater","dansk industri"],"entities":["Copenhagen Pride","Dansk Industri","Danske Bank","Google","Mærsk","Novo Nordisk","Benjamin Hansen"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":62,"decisionValue":70,"novelty":68,"sourceQuality":76,"personalRelevance":86,"contrast":64},"claims":[{"text":"Copenhagen Pride er ikke tilbage på tidligere niveau af partnerskaber, siger forperson Benjamin Hansen.","sourceUrls":["https://www.dr.dk/nyheder/indland/aar-efter-sponsorflugt-arbejder-copenhagen-pride-stadig-paa-genoprette-tilliden"],"confidence":"high"},{"text":"Bruddet kom i februar 2024, da Pride spurgte sponsorerne om deres interesser og aktiviteter i Israel og Palæstina.","sourceUrls":["https://www.dr.dk/nyheder/indland/aar-efter-sponsorflugt-arbejder- ag på under ti meters afstand nær Houstrup syd for Nørre Nebel. Det menes at være samme ulv som ved Oksbøl.","Zonen blev udvidet, efter at ulven tre gange havde opsøgt legende børn i private haver og senest nærmede sig en legeplads i Lønne. Onsdag blev jagten skærpet: skud på over 30 meter, på private arealer efter aftale og med haglvåben. Blåbjergskolen havde anbefalet eleverne at færdes i grupper."],"whyItMatters":"Peter Sunde fra Aarhus Universitets Institut for Ecoscience har tidligere sagt til TV 2, at ulven sandsynligvis er blevet fodret.","analysis":"Tærsklen er adfærd, ikke bestand. Minister for natur og dyrevelfærd Christian Rabjerg Madsen (S) siger, at en ulv, der udviser problematisk adfærd og har mistet skyheden, skal skydes.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/6/8/8/688b4ad6-70aa-420c-b91d-62fd726c5202?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=MCwxNCw0NjMsMjYw&s=a0a3a21d88423f7f42bbac6c443a5bc6","credit":"Kilde: TV 2","alt":"Videostill fra Vestjylland: en ulv går langs et trådhegn, mens et sløret barn i blå jakke er i forgrunden.","sourceUrl":"https://nyheder.tv2.dk/samfund/2026-08-14-problemulv-draebt-efter-intens-jagt"},"topics":["danmark","natur","forvaltning","ulve"],"entities":["Naturstyrelsen","Nørre Nebel","Houstrup","Christian Rabjerg Madsen","Peter Sunde","Aarhus Universitet"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":66,"decisionValue":52,"novelty":78,"sourceQuality":78,"personalRelevance":48,"contrast":72},"claims":[{"text":"Ulven blev skudt torsdag inden for ti meters afstand nær Houstrup syd for Nørre Nebel; Ministeriet for Natur og Dyrevelfærd oplyste det til TV 2. Kilden angiver ikke, hvem der affyrede skuddet.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-08-14-problemulv-draebt-efter-intens-jagt"],"confidence":"high"},{"text":"Ulven havde i tre forskellige tilfælde opsøgt legende børn i private haver og nærmede sig senest en legeplads i Lønne.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-08-14-problemulv-draebt-efter-intens-jagt"],"confidence":"high"},{"text":"Jagten blev skærpet onsdag, så der måtte skydes på over 30 meters afstand, på private arealer efter aftale og med haglvåben.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-08-14-problemulv-draebt-efter-intens-jagt"],"confidence":"high"},{"text":"Peter Sunde fra Aarhus Universitets Institut for Ecoscience har tidligere sagt til TV 2, at ulven sandsynligvis er blevet fodret.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-08-14-problemulv-draebt-efter-intens-jagt"],"confidence":"high"}],"sources":[{"title":"Problemulv dræbt efter intens jagt","publisher":"TV 2","url":"https://nyheder.tv2.dk/samfund/2026-08-14-problemulv-draebt-efter-intens-jagt","publishedAt":"2026-08-14T06:00:06.851Z","kind":"reporting"}]},{"id":"thomas-2026-08-15-vm-dressur-soelv","eventKey":"vm-dressur-2026-laudrup-dufour-individuelt-soelv","materialFacts":["Cathrine Laudrup-Dufour vandt VM-soelv fredag med 80,927 point","Britiske Charlotte Fry vandt guld med 82,295 point","Tyske Katharina Hemmer tog bronze","Det er danskerens anden medalje ved dette VM efter holdbronze onsdag"],"section":"Sport","headline":"Laudrup-Dufour vinder VM-sølv","primarySourceUrl":"https://sport.tv2.dk/ridning/2026-08-14-laudrup-dufour-vinder-vm-soelv","subheadline":"Danskeren fik 80,927 point og måtte se britiske Charlotte Fry vinde med 82,295. Det er hendes anden medalje ved dette VM.","body":["Cathrine Laudrup-Dufour tog fredag VM-sølv i dressur. Med hesten Mount St. John Freestyle fik hun 80,927 point, mens den regerende verdensmester, britiske Charlotte Fry, vandt med 82,295. Tyske Katharina Hemmer fik bronze. Det er danskerens anden medalje ved dette VM efter holdbronzen onsdag.","Laudrup-Dufour topper verdensranglisten, men undervejs kom et par mindre fejl og en enkelt større, som trak ned. \"Tak for opbakningen. Den betyder virkelig meget, og jeg beklager bare, at jeg ikke kunne levere på toppen i dag,\" siger hun til DR."],"whyItMatters":"Hun mangler stadig et individuelt VM-guld. Ved VM i Herning for fire år siden blev det til holdguld og to individuelle sølvmedaljer, og ved OL i Paris i 2024 til holdsølv.","analysis":"TV 2 beskriver en aften, hvor de fleste havde svært ved at holde fejlene ude af ridtet. Forskellen på guld og sølv blev, at Fry som den eneste af topekvipagerne ikke fejlede.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/0/1/5/015c3fc0-5cef-4bdf-9683-0947af2e35cd?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=MCwyNTEsMjUwNSwxNDEw&s=0e15891cd2151502dd10f82a03a0ee50","credit":"Kilde: TV 2","alt":"Arkivfoto fra OL i Paris 2024, anvendt af TV 2 i historien om Cathrine Laudrup-Dufours VM-sølv: dansk dressurrytter til hest vinker efter et ridt.","sourceUrl":"https://sport.tv2.dk/ridning/2026-08-14-laudrup-dufour-vinder-vm-soelv"},"topics":["sport","dressur","danske sportsfolk"],"entities":["Cathrine Laudrup-Dufour","Charlotte Fry","Katharina Hemmer","Mount St. John Freestyle"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":48,"decisionValue":32,"novelty":74,"sourceQuality":76,"personalRelevance":78,"contrast":46},"claims":[{"text":"Cathrine Laudrup-Dufour fik 80,927 point og vandt VM-sølv fredag.","sourceUrls":["https://sport.tv2.dk/ridning/2026-08-14-laudrup-dufour-vinder-vm-soelv"],"confidence":"high"},{"text":"Britiske Charlotte Fry, den regerende verdensmester, vandt guld med 82,295 point, og tyske Katharina Hemmer tog bronze.","sourceUrls":["https://sport.tv2.dk/ridning/2026-08-14-laudrup-dufour-vinder-vm-soelv"],"confidence":"high"},{"text":"Det er Laudrup-Dufours anden medalje ved dette VM efter holdbronze onsdag.","sourceUrls":["https://sport.tv2.dk/ridning/2026-08-14-laudrup-dufour-vinder-vm-soelv"],"confidence":"high"},{"text":"Ved VM i Herning for fire år siden vandt hun holdguld og to individuelle sølvmedaljer, og ved OL i Paris i 2024 holdsølv.","sourceUrls":["https://sport.tv2.dk/ridning/2026-08-14-laudrup-dufour-vinder-vm-soelv"],"confidence":"high"}],"sources":[{"title":"Laudrup-Dufour vinder VM-sølv","publisher":"TV 2","url":"https://sport.tv2.dk/ridning/2026-08-14-laudrup-dufour-vinder-vm-soelv","publishedAt":"2026-08-14T14:55:10.856Z","kind":"reporting"}]},{"id":"thomas-2026-08-15-flypriser","eventKey":"danske-flypriser-stigning-uge36-2026-08","materialFacts":["Koebenhavn-Paris er 55 procent dyrere end samme periode sidste aar","Aalborg-Stockholm er steget 83 procent","Langdistanceruter er steget mellem 14 og 21 procent i gennemsnit","Aarhus og Billund er stort set uaendrede paa europaeiske ruter"],"section":"Priser og forbrug","headline":"Flypriser stiger markant: - Usikkert, hvad fremtiden bringer","primarySourceUrl":"https://nyheder.tv2.dk/penge/2026-08-14-flypriser-stiger-markant-usikkert-hvad-fremtiden-bringer","subheadline":"København–Paris er 55 procent dyrere end sidste år, Aalborg–Stockholm 83 procent. Brændstof peges ud som hoveddriveren.","body":["Flybilletter fra danske lufthavne er blevet markant dyrere. Ifølge Dansk Flyprisindex, der udgives af Travelmarket.dk, er København–Paris steget 55 procent og Aalborg–Stockholm 83 procent. Tallene sammenligner uge 36 sidste år med samme uge i år.","På langdistanceruterne er priserne steget mellem 14 og 21 procent i gennemsnit, og Billund–Dubai 67 procent. På europæiske ruter er gennemsnittet steget 16 procent fra København og 37 procent fra Aalborg, mens Aarhus og Billund er stort set uændrede. Direktør Ole Stouby peger på brændstofomkostninger."],"whyItMatters":"Den brugbare forskel ligger mellem lufthavnene: på europæiske ruter er København og Aalborg steget markant, mens Aarhus og Billund er stort set uændrede.","analysis":"Ole Sloth Hansen, chef for råvarestrategi i Saxo Bank, siger, at de høje priser, man havde håbet var en forårs- og sommerting, nu også ser ud til at vare hen over efteråret.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/c/4/b/c4b08a3c-985e-487f-bdbb-95cf97e78a9d?ixlib=js-3.8.0&w=1280&h=720&q=45&auto=format&fit=crop&rect64=Mzc0LDUwNywzODUwLDIxNjI&s=b2889cea849b9d2e84ed27994d44eeaa","credit":"Kilde: TV 2","alt":"Arkivfoto af en dansk afgangshal med lange køer af rejsende ved check-in under skiltet Afgang/Departures.","sourceUrl":"https://nyheder.tv2.dk/penge/2026-08-14-flypriser-stiger-markant-usikkert-hvad-fremtiden-bringer"},"topics":["priser","luftfart","forbrug","erhvervsrejser"],"entities":["Travelmarket.dk","Dansk Flyprisindex","Ole Stouby","Ole Sloth Hansen","Saxo Bank"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":54,"decisionValue":68,"novelty":62,"sourceQuality":58,"personalRelevance":72,"contrast":44},"claims":[{"text":"Prisen på ruten København–Paris er steget 55 procent, og Aalborg–Stockholm 83 procent, sammenlignet med samme periode sidste år.","sourceUrls":["https://nyheder.tv2.dk/penge/2026-08-14-flypriser-stiger-markant-usikkert-hvad-fremtiden-bringer"],"confidence":"high"},{"text":"Priserne på langdistanceruter er steget mellem 14 og 21 procent i gennemsnit fra de store danske lufthavne.","sourceUrls":["https://nyheder.tv2.dk/penge/2026-08-14-flypriser-stiger-markant-usikkert-hvad-fremtiden-bringer"],"confidence":"high"},{"text":"Gennemsnitsprisen på europæiske flyvninger er steget 16 procent fra København og 37 procent fra Aalborg, mens Aarhus og Billund er stort set uændrede.","sourceUrls":["https://nyheder.tv2.dk/penge/2026-08-14-flypriser-stiger-markant-usikkert-hvad-fremtiden-bringer"],"confidence":"high"},{"text":"Tallene fra Dansk Flyprisindex sammenligner uge 36 sidste år med samme uge i år.","sourceUrls":["https://nyheder.tv2.dk/penge/2026-08-14-flypriser-stiger-markant-usikkert-hvad-fremtiden-bringer"],"confidence":"high"},{"text":"Ole Sloth Hansen fra Saxo Bank siger, at de høje priser ser ud til også at vare hen over efteråret.","sourceUrls":["https://nyheder.tv2.dk/penge/2026-08-14-flypriser-stiger-markant-usikkert-hvad-fremtiden-bringer"],"confidence":"high"}],"sources":[{"title":"Flypriser stiger markant: - Usikkert, hvad fremtiden bringer","publisher":"TV 2","url":"https://nyheder.tv2.dk/penge/2026-08-14-flypriser-stiger-markant-usikkert-hvad-fremtiden-bringer","publishedAt":"2026-08-14T14:02:24.780Z","kind":"reporting"}]}],"signals":[{"headline":"Datacentre mangler at udnytte overskud af varme","url":"https://www.dr.dk/nyheder/indland/datacentre-mangler-udnytte-overskud-af-varme","publisher":"DR Nyheder","section":"Energi","publishedAt":"2026-08-15T08:37:44.000Z","summary":"Kun fire ud af 50 datacentre udnytter overskudsvarmen, viser en opgørelse fra Energistyrelsen; brancheforeningen Datacenterindustrien mener, tallet er syv. Direktør Henrik Hansen peger på, at en afgift og et prisloft længe gjorde det til en dårlig forretningsmodel. Efter en lovændring i 2022 kan afgiften undgås gennem en ordning med Energistyrelsen.","text":"Datacentre mangler at udnytte overskud af varme"},{"headline":"I 15 annoncer sælger ung kvinde tøj identisk med varer fra Shein som vintage. Og hun er ikke den eneste","url":"https://www.dr.dk/nyheder/indland/i-15-annoncer-saelger-ung-kvinde-toej-identisk-med-varer-fra-shein-som-vintage-og-hun-er-ikke-den","publisher":"DR Nyheder","section":"Forbrug","publishedAt":"2026-08-15T09:20:00.000Z","summary":"DR har gennemgået flere Vinted-profiler, der systematisk sælger tøj som \"vintage\", selv om det til forveksling ligner varer fra kinesiske Shein. En grå top til 350 kroner kan købes for 85 kroner hos producenten. Seniorjurist Daniel Mathias Bager fra Forbrugerrådet Tænk siger, at nogle øjensynligt spekulerer i det.","text":"I 15 annoncer sælger ung kvinde tøj identisk med varer fra Shein som vintage. Og hun er ikke den eneste"},{"headline":"Trump vil snart erklære Hormuzstrædet for amerikansk territorium","url":"https://www.dr.dk/nyheder/udland/trump-vil-snart-erklaere-hormuzstraedet-amerikansk-territorium","publisher":"DR Nyheder","section":"Geopolitik","publishedAt":"2026-08-14T22:17:15.000Z","summary":"Donald Trump sagde fredag på et vælgermøde i New York, at USA snart vil erklære Hormuzstrædet for amerikansk territorium, og at ingen skibe kommer igennem blokaden uden amerikansk tilladelse. Irans viceudenrigsminister Kazem Gharibabadi svarer, at strædet ikke kan overtages med et tweet eller en valgtale.","text":"Trump vil snart erklære Hormuzstrædet for amerikansk territorium"},{"headline":"Microsoft trækker sig ud af store dele af det kinesiske marked – kun en satsning forbliver","url":"https://www.computerworld.dk/art/296503/microsoft-traekker-sig-ud-af-store-dele-af-det-kinesiske-marked-kun-en-satsning-forbliver","publisher":"Computerworld","section":"Kina","publishedAt":"2026-08-14T06:20:00.000Z","summary":"Ifølge Reuters har Microsoft over fem år lukket mindst 15 filialer og joint ventures i Kina og overvejede i 2023 at forlade markedet helt. Kina stod i 2024 for 1,5 procent af koncernens globale omsætning. Beijing har siden 2017 skubbet på for indenlandsk software, og amerikanske eksportrestriktioner har spærret for at skalere AI- og cloudforretningen.","text":"Microsoft trækker sig ud af store dele af det kinesiske marked – kun en satsning forbliver"},{"headline":"Næsten dobbelt så mange børn får antidepressiv medicin","url":"https://www.dr.dk/nyheder/indland/naesten-dobbelt-saa-mange-boern-faar-antidepressiv-medicin","publisher":"DR Nyheder","section":"Sundhed","publishedAt":"2026-08-14T18:45:00.000Z","summary":"Antallet af 0-17-årige i behandling med SSRI er gået fra 3.694 i 2020 til 7.050 i 2025, viser tal fra Sundhedsdatabanken. Overlæge Nina Tejs Jørring kalder det godt, at børn får medicin, når de har brug for den, men beklager, at ressourcerne til psykoterapi og støtte til forældre mangler.","text":"Næsten dobbelt så mange børn får antidepressiv medicin"},{"headline":"Chipsproducent taber sag om ostepops","url":"https://nyheder.tv2.dk/business/2026-08-14-chipsproducent-taber-sag-om-ostepops","publisher":"TV 2","section":"Retssager","publishedAt":"2026-08-14T08:48:36.660Z","summary":"Sø- og Handelsretten har afvist Orkla Snacks' krav om, at ordbogsdefinitionen af en ostepop skulle nævne, at den sælges under Kims' varemærke. Retten fandt, at Det Danske Sprog- og Litteraturselskab lever op til varemærkelovens paragraf 7, fordi definitionen allerede angiver, at \"Ostepops\" er registreret som varemærke.","text":"Chipsproducent taber sag om ostepops"},{"headline":"'Potentiel demokratisering af overvågning': Datatilsynet ser flere problematikker i AI-briller","url":"https://www.dr.dk/nyheder/indland/potentiel-demokratisering-af-overvaagning-datatilsynet-ser-flere-problematikker-i-ai-briller","publisher":"DR Nyheder","section":"Teknologi og regulering","publishedAt":"2026-08-14T17:46:00.000Z","summary":"Det danske datatilsyn peger på flere problemer ved AI-briller med indbygget kamera, mens det norske datatilsyn har opfordret til at stoppe salget af brillerne i Norge.","text":"'Potentiel demokratisering af overvågning': Datatilsynet ser flere problematikker i AI-briller"},{"headline":"Fransk højesteret spænder ben for forbud mod sociale medier","url":"https://www.dr.dk/nyheder/udland/fransk-hoejesteret-spaender-ben-forbud-mod-sociale-medier","publisher":"DR Nyheder","section":"Regulering","publishedAt":"2026-08-14T13:57:10.000Z","summary":"Den franske præsident har beordret sin premierminister til at gennemarbejde lovforslaget om et forbud mod sociale medier igen og tage rettens indvendinger i betragtning.","text":"Fransk højesteret spænder ben for forbud mod sociale medier"},{"headline":"650 søfolk med krigsskibe, droner og helikoptere øver sig lige nu","url":"https://nyheder.tv2.dk/samfund/2026-08-14-650-soefolk-med-krigsskibe-droner-og-helikoptere-oever-sig-lige-nu","publisher":"TV 2","section":"Forsvar","publishedAt":"2026-08-14T20:46:07.740Z","summary":"Mere end 650 søfolk deltager i en flådeøvelse, der skal sikre de danske farvande i et ændret trusselbillede.","text":"650 søfolk med krigsskibe, droner og helikoptere øver sig li ktion er hendes signatur.","rationale":"Calle gør det, andre mennesker ikke kan eller ikke vil sige, til materiale, og gør det uden at være nøgtern. Det er en mere interessant indgang til spørgsmålet om at dokumentere andres liv end nogen rapport om emnet. Udstillingen lukker 6. september.","topics":["kunst","overvågning","dokumentarisme"],"isFeatured":true,"image":{"url":"https://louisiana.dk/wp-content/uploads/2025/02/10-Sophie-Calle-Musee-Picasso-Paris25-juillet-23-%C2%A9-Yves-Geant-huge_jpg.jpg","credit":"Foto: Yves Géant, via Louisiana Museum of Modern Art","alt":"Portrætfoto af kunstneren Sophie Calle med grønne solbriller og denimjakke foran en væg med indrammede værker. Louisianas billede til udstillingen.","sourceUrl":"https://louisiana.dk/udstilling/sophie-calle/"}},{"id":"thomas-rec-2026-08-15-ecipe-life-sciences","mode":"read","kind":"Working paper","status":"timely","title":"A Tale of Three Industries: The Rise, Decline and Rise Again of the Swedish Life Sciences Sector","provider":"ECIPE","url":"https://ecipe.org/publications/swedish-life-sciences-sector/","availability":"Frit tilgængelig, pdf kan hentes","description":"ECIPE-working paper udarbejdet for den svenske brancheforening LIF. Svensk life science er gået fra store selskaber med blockbustere til en mere spredt sektor: siden 2016 er medicinalindustrien vokset hurtigere i Sverige end i næsten noget andet EU-land, og salget er blevet mindre afhængigt af EU- og USA-markederne.","rationale":"Den danske eksportkoncentration i pharma diskuteres næsten altid som en risiko uden fortilfælde. Sverige har været igennem både faldet og genrejsningen. Læs det som partsindlæg — det er bestilt af branchen selv — men forløbet er det tætteste, Danmark har på en sammenlignelig case.","topics":["life science","eksportkoncentration","sverige","eu-politik"],"isFeatured":false},{"id":"thomas-rec-2026-08-15-bruegel-crm","mode":"read","kind":"Policy brief","status":"timely","title":"Competing for inputs: how the Europe             if (storyId && !wasSelected) forgetReason(storyId, contentType, reasonButton.dataset.reason);
          };
        }
        try {
          await sendFeedback(directionButton, transport, button.dataset.reason);
        } catch (error) {
          rollbackReason?.();
          throw error;
        }
      } catch {
        const status = document.querySelector("#feedback-status");
        if (status) status.textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      }
    });
  }
  function bindReadLater() {
    const panel = document.querySelector("#read-later");
    document.addEventListener("click", (event) => {
      const save = event.target.closest("[data-save-story]");
      if (save) {
        toggleSaved({
          id: save.dataset.saveStory,
          headline: save.dataset.saveHeadline,
          url: save.dataset.saveUrl
        });
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const dismiss = event.target.closest("[data-readlater-dismiss]");
      if (dismiss) {
        clearSaved(dismiss.dataset.readlaterDismiss);
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const link = event.target.closest(".read-later-link");
      if (link?.href) {
        markOpened(link.href);
      }
    });
  }
  function buildNarrationSegments(brief) {
    const segments = [];
    if (brief.title) segments.push(brief.title);
    if (brief.dek) segments.push(brief.dek);
    const ordered = [...brief.stories].sort((a, b) => Number(b.isLead) - Number(a.isLead));
    for (const story of ordered) {
      if (story.headline) segments.push(story.headline);
      if (story.subheadline) segments.push(story.subheadline);
      if (Array.isArray(story.body)) {
        for (const paragraph of story.body) segments.push(paragraph);
      }
      if (story.whyItMatters) segments.push(story.whyItMatters);
      if (story.analysis) segments.push(story.analysis);
    }
    return segments.filter((segment) => typeof segment === "string" && segment.trim().length > 0);
  }
  function pickDanishVoice(synth) {
    const voices = synth.getVoices?.() ?? [];
    return voices.find((voice) => voice.lang === "da-DK") ?? voices.find((voice) => voice.lang?.toLowerCase().startsWith("da")) ?? null;
  }
  function createNarrator(brief, synth = globalThis.speechSynthesis) {
    if (!synth || typeof globalThis.SpeechSynthesisUtterance !== "function") return null;
    const segments = buildNarrationSegments(brief);
    if (!segments.length) return null;
    let index = 0;
    let playing = false;
    const speakFrom = (start) => {
      synth.cancel();
      index = start;
      const voice = pickDanishVoice(synth);
      for (let i = start; i < segments.length; i += 1) {
        const utterance = new globalThis.SpeechSynthesisUtterance(segments[i]);
        utterance.lang = "da-DK";
        if (voice) utterance.voice = voice;
        utterance.rate = 1.05;
        utterance.onstart = () => {
          index = i;
        };
        if (i === segments.length - 1) {
          utterance.onend = () => {
            playing = false;
            api.onstatechange?.("stopped");
          };
        }
        synth.speak(utterance);
      }
      playing = true;
      api.onstatechange?.("playing");
    };
    const api = {
      onstatechange: null,
      play() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
          return;
        }
        speakFrom(0);
      },
      pause() {
        if (synth.speaking && !synth.paused) {
          synth.pause();
          playing = false;
          api.onstatechange?.("paused");
        }
      },
      resume() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
        }
      },
      toggle() {
        if (synth.speaking && !synth.paused) {
          api.pause();
        } else if (synth.paused) {
          api.resume();
        } else {
          speakFrom(0);
        }
      },
      stop() {
        synth.cancel();
        index = 0;
        playing = false;
        api.onstatechange?.("stopped");
      },
      get isPlaying() {
        return playing;
      }
    };
    return api;
  }
  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {
      slot.hidden = true;
      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";
      toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";
      toggleButton.setAttribute("aria-pressed", String(active));
      stopButton.disabled = state === "stopped";
    };
    toggleButton.addEventListener("click", () => narrator.toggle());
    stopButton.addEventListener("click", () => narrator.stop());
    globalThis.addEventListener?.("beforeunload", () => narrator.stop());
    slot.replaceChildren(toggleButton, stopButton);
    return narrator;
  }
  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }
    bindEditionNav("archive");
    bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
</html>
