<!doctype html>
<html lang="da" data-chrome="minimal" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e8">
  <title>Thomas' Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "broadsheet", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "broadsheet";
      } catch (e) {
        document.documentElement.dataset.layout = "broadsheet";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Broadsheet : the business-press direction -------------------------------
   Built for a reader whose paper is Børsen — so the paper itself is the idea.
   The salmon-tinted newsprint that Børsen and the FT share is the most legible
   signal in business publishing, and it does the work an accent colour usually
   has to: you know what kind of publication this is before reading a word.
   Held back from costume by desaturating it well below either masthead's ink,
   so it reads as warm paper rather than pink.

   Against that warmth the accent goes the other way — a deep navy, the colour
   of the ink rather than of a highlight. One accent, used structurally (rules,
   kickers, the lead's frame), never decoratively. Source Serif 4 carries the
   text: a working serif with more spine than Newsreader and none of the
   literary softness, which is the register of someone who reads for decisions.
   Everything else — spacing scale, grid, component rules — is shared with the
   other directions, which is what keeps this a sibling and not a second product.
   ---------------------------------------------------------------------------- */
:root[data-layout="broadsheet"] {
  color-scheme: light;
  --bg: #fbf1e8;
  --surface: #f5e3d6;
  --ink: #1a1f2b;
  --muted: #6d6459;
  --body-soft: #3b3f49;
  --rule: #ddc6b5;
  --accent: #17455e;
  /* 9.2:1 on --bg — past AAA, so the accent needs no darkened twin for labels
     the way the vibrant magazine/feed accents do. */
  --accent-ink: var(--accent);
  --teal: #1d5f57;
  --green: #245a4a;
  --blue: #17455e;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 2px;
  --fb-more: #245a4a;
  --fb-less: #8a3324;
  --fb-icon: #6d6459;
  --fb-icon-active: #fbf1e8;
  --fb-bg: transparent;
  --fb-border-color: #ddc6b5;
}

/* Imageless is the normal case here, not the exception.
   This reader's best sources are Commission documents, statistics releases and
   company announcements — primary material that carries no photography at all.
   On the first real edition six of eight stories had no image, so the shared
   .media-fallback reserved a 16:9 block above the lead and a 3:2 block above
   most of the rest, and the page read as a gallery with the pictures missing.
   Rather than fill those blocks with decoration, this direction does not render
   them at all: a story with no image simply starts at its own section kicker,
   which is what a business broadsheet looks like anyway. The fallback's only
   content was the section name, and the story already prints that immediately
   below — so keeping it also printed the section twice. Stories that DO have an
   image keep their full frame, so the contrast carries information: a picture
   means there was one. */
:root[data-layout="broadsheet"] .media-fallback {
  display: none;
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

/* A reader with only a daily edition gets no bar at all: three of the five
   edition links would 404, and the "Vis som" switcher is a question nobody
   asked. Keyed off <html data-chrome>, stamped at render time from the profile,
   so the bar is gone before first paint rather than flashing in and vanishing
   once the module boots. The bindings are skipped too (see bindEditionNav), so
   the links are absent from the DOM rather than merely invisible. */
:root[data-chrome="minimal"] .top-bar {
  display: none;
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band

engen-samarbejdet","publishedAt":"2026-08-01T08:11:00Z","kind":"reporting"}]},{"id":"story-ai-act-haandhaevelse-20260802","eventKey":"eu-ai-act-enforcement","section":"Regulering","headline":"Commission starts enforcing AI Act rules and new transparency requirements on 2 August","primarySourceUrl":"https://ec.europa.eu/commission/presscorner/detail/en/ip_26_1714","subheadline":"Fra i dag håndhæves AI-forordningen. Chatbots skal fortælle brugerne, at de taler med en maskine.","body":["Fra 2. august 2026 begynder Kommissionens AI Office sammen med de nationale myndigheder at håndhæve EU's AI-forordning. Samme dato træder nye gennemsigtighedsregler i kraft: chatbots skal fortælle brugerne, at de taler med en AI og ikke et menneske, mens deepfakes og andet AI-genereret indhold skal mærkes.","Alle udbydere af generelle AI-modeller skal desuden have en ophavsretspolitik og offentliggøre et resumé af det indhold, modellerne er trænet på. Kommissionen offentliggjorde 31. juli en første liste med mere end 180 organisationer, der har underskrevet adfærdskodekset om gennemsigtighed i AI-genereret indhold."],"whyItMatters":"Det er ikke længere en forordning på vej, men en tilsynsmyndighed med en dato. For en virksomhed med en kundeservice-bot er det en driftsopgave fra i dag.","analysis":"Kommissionen fremstiller reglerne som en fordel: klarere pligter og en dokumenterbar måde at vise overholdelse på.","topics":["ai-forordningen","eu-regulering","gennemsigtighed","regelbyrde","kunstig intelligens"],"entities":["Europa-Kommissionen","AI Office","EU"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":88,"decisionValue":86,"novelty":82,"sourceQuality":96,"personalRelevance":90,"contrast":58},"materialFacts":["Håndhævelsen af AI-forordningen begynder 2. august 2026 og varetages af Kommissionens AI Office sammen med nationale myndigheder.","Chatbots og andre interaktive AI-systemer skal fortælle brugerne, at de har med AI at gøre.","Deepfakes skal mærkes, og AI-genereret eller ændret indhold skal bære maskinlæsbare mærker.","Alle udbydere af GPAI-modeller skal have en ophavsretspolitik og offentliggøre et resumé af træningsindholdet.","Kommissionen offentliggjorde 31. juli 2026 en første liste med mere end 180 organisationer, der har underskrevet adfærdskodekset om gennemsigtighed i AI-genereret indhold."],"claims":[{"text":"Håndhævelsen af AI-forordningen begynder 2. august 2026.","sourceUrls":["https://ec.europa.eu/commission/presscorner/detail/en/ip_26_1714"],"confidence":"high"},{"text":"Chatbots skal oplyse brugerne om, at de taler med en AI, og deepfakes skal mærkes.","sourceUrls":["https://ec.europa.eu/commission/presscorner/detail/en/ip_26_1714"],"confidence":"high"},{"text":"GPAI-udbydere skal have en ophavsretspolitik og offentliggøre et tilstrækkeligt detaljeret resumé af træningsdata.","sourceUrls":["https://ec.europa.eu/commission/presscorner/detail/en/ip_26_1714"],"confidence":"high"}],"sources":[{"title":"Commission starts enforcing AI Act rules and new transparency requirements on 2 August","publisher":"Europa-Kommissionen","url":"https://ec.europa.eu/commission/presscorner/detail/en/ip_26_1714","publishedAt":"2026-07-31T11:17:46Z","kind":"primary"}]},{"id":"story-ai-gigafabrikker-20260802","eventKey":"eu-ai-gigafabrikker-udbud","section":"Teknologi","headline":"EU stiller kæmpe milliardpulje til rådighed: Klar til investere i syv nye AI-gigafabrikker","primarySourceUrl":"https://www.computerworld.dk/art/296340/eu-stiller-kaempe-milliardpulje-til-raadighed-klar-til-investere-i-syv-nye-ai-gigafabrikker","subheadline":"Udbudsrunden er åbnet for op til syv anlæg. Begrundelsen er konkurrenceevne og digital suverænitet.","body":["Europa-Kommissionen har åbnet en officiel udbudsrunde for etableringen af syv store AI-gigafabrikker i EU. Puljen opgøres af Computerworld til 224 milliarder kroner, og formålet er ifølge artiklen at styrke unionens konkurrenceevne og digitale suverænitet på AI-området.","Billedteksten på artiklen anfører, at Kommissionen kan se, at EU halter efter USA, når det gælder finansiering af lokale AI-gigafabrikker."],"whyItMatters":"Anlæg i den skala er lige så meget et energiprojekt som et it-projekt. Hvor de kan bygges, hænger uløseligt sammen med strøm, køling og nettilslutning.","analysis":"Digital suverænitet er den erklærede begrundelse, men anlæggene skal stå et fysisk sted, og placeringen bliver dermed lige så meget et spørgsmål om elnet som om AI-strategi. Det er en konkurrence, hvor Danmark har noget at byde ind med.","topics":["ai-gigafabrikker","eu","datacentre","digital suverænitet","energi"],"entities":["Europa-Kommissionen","EU","USA"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":78,"novelty":80,"sourceQuality":80,"personalRelevance":84,"contrast":64},"materialFacts":["Europa-Kommissionen har åbnet en officiel udbudsrunde for etableringen af syv AI-gigafabrikker i EU.","Computerworld opgør puljen til 224 milliarder kroner.","Formålet er ifølge artiklen at styrke unionens konkurrenceevne og digitale suverænitet på AI-området."],"claims":[{"text":"Kommissionen har åbnet en udbudsrunde for syv AI-gigafabrikker i EU.","sourceUrls":["https://www.computerworld.dk/art/296340/eu-stiller-kaempe-milliardpulje-til-raadighed-klar-til-investere-i-syv-nye-ai-gigafabrikker"],"confidence":"high"},{"text":"Computerworld opgør puljen til 224 milliarder kroner.","sourceUrls":["https://www.computerworld.dk/art/296340/eu-stiller-kaempe-milliardpulje-til-raadighed-klar-til-investere-i-syv-nye-ai-gigafabrikker"],"confidence":"high"}],"sources":[{"title":"EU stiller kæmpe milliardpulje til rådighed: Klar til investere i syv nye AI-gigafabrikker","publisher":"Computerworld","url":"https://www.computerworld.dk/art/296340/eu-stiller-kaempe-milliardpulje-til-raadighed-klar-til-investere-i-syv-nye-ai-gigafabrikker","publishedAt":"2026-07-30T13:40:00Z","kind":"reporting"}],"image":{"url":"https://www.computerworld.dk/fil/241141?width=1200&height=630&focus=1","alt":"Billede inde fra Microsofts datacenter i Dublin, Irland.","credit":"Foto: Naoise Culhane/Microsoft","sourceUrl":"https://www.computerworld.dk/art/296340/eu-stiller-kaempe-milliardpulje-til-raadighed-klar-til-investere-i-syv-nye-ai-gigafabrikker"}},{"id":"story-muslingekrise-mors-20260802","eventKey":"dk-muslinger-eu-bifangst","section":"Erhverv","headline":"EU-regel skaber muslingekrise på Mors","primarySourceUrl":"https://nyheder.tv2.dk/samfund/2026-08-01-eu-regel-skaber-muslingekrise-paa-mors","subheadline":"En regel fra 2013 har sat en dansk produktion på pause i tre uger. Regelbyrde målt i årsværk frem for i høringssvar.","body":["Vilsund Blue i Nykøbing Mors har været sat på pause i tre uger, efter at nye krav om fuld sortering og registrering af bifangst ifølge direktør Poul Kærgaard har gjort det fysisk umuligt at drive produktionen videre. Kravet stammer fra en EU-regel fra 2013, men rammer først nu det danske muslingefiskeri for alvor.","Med en gennemsnitlig daglig fangst på 500 ton ville fuld sortering kræve 23 årsværk om dagen. Virksomheden taber efter egne oplysninger over 100.000 kroner om dagen og er begyndt at miste kunder. EU har ifølge virksomheden afvist at behandle prøvetagningsplanen, fordi nye regler træder i kraft i 2027."],"whyItMatters":"Det er regelbyrde i den form, der standser en arbejdsplads. Miljøminister Maria Reumert Gjerding (SF) er indkaldt til samråd.","analysis":"En regel vedtaget i 2013 og håndhævet i 2026. Om løsningen bliver en dispensation, en forlænget frist eller status quo, er stadig uvist.","topics":["eu-regulering","regelbyrde","fiskeri","mors","erhvervsvilkår"],"entities":["Vilsund Blue","Poul Kærgaard","Mors","Charlotte Green","Søren Gade","Anni Matthiesen","Maria Reumert Gjerding"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":74,"decisionValue":80,"novelty":86,"sourceQuality":82,"personalRelevance":90,"contrast":72},"materialFacts":["Vilsund Blue i Nykøbing Mors har været sat på pause i tre uger.","Kravet stammer oprindeligt fra en EU-regel fra 2013.","Med en gennemsnitlig daglig fangst på 500 ton ville fuld sortering kræve 23 årsværk om dagen.","Virksomheden taber ifølge egne oplysninger over 100.000 kroner dagligt.","EU har ifølge virksomheden afvist at behandle prøvetagningsplanen, fordi nye regler træder i kraft i 2027."],"claims":[{"text":"Vilsund Blue har været sat på pause i tre uger på grund af nye krav om fuld sortering og registrering af bifangst.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-08-01-eu-regel-skaber-muslingekrise-paa-mors"],"confidence":"high"},{"text":"Fuld sortering ville ved en gennemsnitlig daglig fangst på 500 ton kræve 23 årsværk om dagen.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-08-01-eu-regel-skaber-muslingekrise-paa-mors"],"confidence":"high"},{"text":"Virksomheden oplyser, at EU har afvist at behandle prøvetagningsplanen, fordi nye regler træder i kraft i 2027.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-08-01-eu-regel-skaber-muslingekrise-paa-mors"],"confidence":"high"}],"sources":[{"title":"EU-regel skaber muslingekrise på Mors","publisher":"TV 2 Nyheder","url":"https://nyheder.tv2.dk/samfund/2026-08-01-eu-regel-skaber-muslingekrise-paa-mors","publishedAt":"2026-08-01T18:48:15Z","kind":"reporting"}]},{"id":"story-goldman-kapitalcyklus-20260802","eventKey":"goldman-kapitalcyklus-ai","section":"Økonomi","headline":"Goldman: AI-boomet udløser historiens mest kapitalhungrende investeringscyklus","primarySourceUrl":"https://ugebrev.dk/finans/goldman-ai-boomet-udloeser-historiens-mest-kapitalhungrende-investeringscyklus/","subheadline":"Bliver kapital strukturelt dyrere, ændrer forretningsmodellen sig for netop de projekter, dansk industripolitik bygger på.","body":["Mark Wilson, Goldman Sachs' chef for europæisk hedgefonddækning, argumenterer i en markedsanalyse for, at verdensøkonomien efter mange år med globalt opsparingsoverskud og lave renter er på vej ind i en af de mest kapitalhungrende investeringscyklusser i historien.","AI, oprustning, energiinfrastruktur og voksende statsudgifter skal finansieres samtidig. Resultatet er ifølge analysen en skærpet konkurrence om kapitalen, som kan holde renterne strukturelt højere i mange år."],"whyItMatters":"Havvind, Power-to-X og netudbygning forudsætter alle tålmodig kapital. Bliver kapitalomkostningerne strukturelt højere, er det ikke efterspørgslen, der falder væk, men forrentningen.","analysis":"Analysen beskriver Federal Reserve som passager snarere end chauffør: renteniveauet afgøres mere af, hvad verden vil bygge, end af hvad centralbanken beslutter.","counterpoint":"Det er en investeringsbanks markedssyn, ikke en prognose.","topics":["renter","kapitalmarkeder","ai","energiinfrastruktur","investering"],"entities":["Goldman Sachs","Mark Wilson","Federal Reserve"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":78,"novelty":76,"sourceQuality":84,"personalRelevance":86,"contrast":74},"materialFacts":["Analysen er skrevet af Mark Wilson, Goldman Sachs' chef for europæisk hedgefonddækning.","AI, oprustning, energiinfrastruktur og voksende statsudgifter skal ifølge analysen finansieres samtidig.","Analysen vurderer, at konkurrencen om kapital kan holde renterne strukturelt højere i mange år.","Federal Reserve beskrives i analysen som passager snarere end chauffør."],"claims":[{"text":"Analysen er skrevet af Mark Wilson, Goldman Sachs' chef for europæisk hedgefonddækning.","sourceUrls":["https://ugebrev.dk/finans/goldman-ai-boomet-udloeser-historiens-mest-kapitalhungrende-investeringscyklus/"],"confidence":"high"},{"text":"Analysen vurderer, at konkurrencen om kapital kan holde renterne strukturelt højere i mange år.","sourceUrls":["https://ugebrev.dk/finans/goldman-ai-boomet-udloeser-historiens-mest-kapitalhungrende-investeringscyklus/"],"confidence":"high"}],"sources":[{"title":"Goldman: AI-boomet udløser historiens mest kapitalhungrende investeringscyklus","publisher":"Økonomisk Ugebrev","url":"https://ugebrev.dk/finans/goldman-ai-boomet-udloeser-historiens-mest-kapitalhungrende-investeringscyklus/","publishedAt":"2026-08-02T09:31:20Z","kind":"analysis"}]},{"id":"story-foedevaremoms-20260802","eventKey":"dk-foedevaremoms-provenu","section":"Politik","headline":"Lavere moms på mad forventes at koste 17,4 milliarder årligt","primarySourceUrl":"https://www.dr.dk/nyheder/politik/lavere-moms-paa-mad-forventes-koste-17-4-milliarder-aarligt","subheadline":"Et nyt folketingssvar indsnævrer Skatteministeriets tidligere spænd på 15-20 milliarder til ét tal.","body":["Regeringens plan om at afskaffe momsen på frugt og grønt og halvere den på al anden mad kan komme til at koste statskassen 17,4 milliarder kroner. Tallet fremgår af et folketingssvar fra skatte- og vækstminister Jakob Engel-Schmidt (M). Ministeriet har beregnet frugt og grønt til 2,6 milliarder årligt og halveringen af den øvrige fødevaremoms til 14,7 milliarder.","Skatteministeriet vurderede i juni sidste år, at de to tiltag tilsammen ville koste 15-20 milliarder om året, så det nye svar lægger sig inden for det tidligere spænd."],"whyItMatters":"Beløbet lægger beslag på præcis det finanspolitiske råderum, som erhvervsbeskatning og erhvervsfremme ellers skulle konkurrere om.","analysis":"Den tidligere SVM-regering afsatte i januar seks milliarder til formålet. Afstanden op til 17,4 er sagens indhold: enten skæres ambitionen til, eller også findes forskellen et andet sted.","topics":["skat","moms","fødevarer","finanslov","erhvervsvilkår"],"entities":["Jakob Engel-Schmidt","Skatteministeriet","Folketinget"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":78,"decisionValue":74,"novelty":80,"sourceQuality":86,"personalRelevance":80,"contrast":58},"materialFacts":["Skatte- og Vækstministeriet har beregnet afskaffelsen af momsen på frugt og grønt til 2,6 milliarder kroner årligt.","En halvering af momsen på øvrige fødevarer er beregnet til 14,7 milliarder kroner.","Tallene stammer fra et folketingssvar fra skatte- og vækstminister Jakob Engel-Schmidt (M).","Skatteministeriet vurderede i juni sidste år, at de to tiltag tilsammen ville koste 15-20 milliarder kroner om året.","Den tidligere SVM-regering afsatte i januar en pulje på seks milliarder kroner til formålet.","Restauranter står ifølge svaret ikke umiddelbart til at få en lavere moms."],"claims":[{"text":"Et folketingssvar opgør prisen på regeringens fødevaremomsplan til 17,4 milliarder kroner.","sourceUrls":["https://www.dr.dk/nyheder/politik/lavere-moms-paa-mad-forventes-koste-17-4-milliarder-aarligt"],"confidence":"high"},{"text":"Skatteministeriet vurderede i juni sidste år, at de to tiltag tilsammen ville koste 15-20 milliarder kroner om året.","sourceUrls":["https://www.dr.dk/nyheder/politik/lavere-moms-paa-mad-forventes-koste-17-4-milliarder-aarligt"],"confidence":"high"},{"text":"Den tidligere SVM-regering afsatte i januar en pulje på seks milliarder kroner til formålet.","sourceUrls":["https://www.dr.dk/nyheder/politik/lavere-moms-paa-mad-forventes-koste-17-4-milliarder-aarligt"],"confidence":"high"}],"sources":[{"title":"Lavere moms på mad forventes at koste 17,4 milliarder årligt","publisher":"DR Nyheder","url":"https://www.dr.dk/nyheder/politik/lavere-moms-paa-mad-forventes-koste-17-4-milliarder-aarligt","publishedAt":"2026-08-02T07:07:20Z","kind":"reporting"}]},{"id":"story-danmark-rundt-20260802","eventKey":"postnord-danmark-rundt-2026-afslutning","section":"Sport","headline":"Dansk triumf i Danmark Rundt – van Aert vinder samlet","primarySourceUrl":"https://sport.tv2.dk/live/cykling/2026-08-02-dansk-triumf-i-danmark-rundt-van-aert-vinder-samlet","subheadline":"Rasmus Søjberg vandt sidste etape i en spurt, han ikke var favorit til. Wout van Aert tog løbet samlet.","body":["Rasmus Søjberg vandt 5. og sidste etape af PostNord Danmark Rundt. Han sad bag australske Plowright, der åbnede tidligt uden den fart, han havde vist indtil da, og fik derved et lead-out, hverken Walscheid eller Crabbe kunne følge. Der var et stort styrt på opløbsstrækningen.","Wout van Aert vandt løbet samlet og tog tre etapesejre undervejs. Ifølge livebloggens slutresultat kom Lukas Kubis ind 21 sekunder efter og Henrik Pedersen 28 sekunder efter."],"whyItMatters":"Det er den ene uge om året, hvor international cykelsport køres på danske veje, og et landshold uden resultater havde gjort ugen til en transportetape.","analysis":"Ifølge TV 2's cykelekspert er det blot Søjbergs anden professionelle sejr efter DM-titlen i 2024. Den kom i en spurt mod hurtigere folk og blev afgjort af, at føringsmanden åbnede for tidligt.","topics":["cykling","danmark rundt","sport","dansk sport"],"entities":["Rasmus Søjberg","Wout van Aert","Lukas Kubis","Henrik Pedersen","Søren Kragh","PostNord Danmark Rundt"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":54,"decisionValue":30,"novelty":88,"sourceQuality":84,"personalRelevance":88,"contrast":52},"materialFacts":["Rasmus Søjberg vandt 5. og sidste etape af PostNord Danmark Rundt.","Wout van Aert vandt løbet samlet og vandt tre etaper undervejs.","Slutresultatet ifølge livebloggen: Wout van Aert, Lukas Kubis 21 sekunder efter, Henrik Pedersen 28 sekunder efter.","Der var et stort styrt på opløbsstrækningen."],"claims":[{"text":"Rasmus Søjberg vandt 5. og sidste etape af PostNord Danmark Rundt.","sourceUrls":["https://sport.tv2.dk/live/cykling/2026-08-02-dansk-triumf-i-danmark-rundt-van-aert-vinder-samlet"],"confidence":"high"},{"text":"Wout van Aert vandt løbet samlet og tog tre etapesejre undervejs.","sourceUrls":["https://sport.tv2.dk/live/cykling/2026-08-02-dansk-triumf-i-danmark-rundt-van-aert-vinder-samlet"],"confidence":"high"}],"sources":[{"title":"Dansk triumf i Danmark Rundt – van Aert vinder samlet","publisher":"TV 2 Sport","url":"https://sport.tv2.dk/live/cykling/2026-08-02-dansk-triumf-i-danmark-rundt-van-aert-vinder-samlet","publishedAt":"2026-08-02T10:35:15Z","kind":"reporting"}]},{ andt ti personer, der omkom i en lavine på verdens 12. højeste bjerg."],"claims":[{"text":"Nirmal Purjas lig er bjærget fra Broad Peak i Pakistan i omkring 5.700 meters højde.","sourceUrls":["https://www.dr.dk/nyheder/seneste/den-beroemte-bjergbestiger-nirmal-purjas-lig-er-hentet-ned-fra-bjerg"],"confidence":"high"},{"text":"Purja var blandt ti personer, der omkom i en lavine på verdens 12. højeste bjerg.","sourceUrls":["https://www.dr.dk/nyheder/seneste/den-beroemte-bjergbestiger-nirmal-purjas-lig-er-hentet-ned-fra-bjerg"],"confidence":"high"},{"text":"Purja besteg alle verdens 14 bjergtoppe over 8.000 meter på lidt over seks måneder.","sourceUrls":["https://www.dr.dk/nyheder/seneste/den-beroemte-bjergbestiger-nirmal-purjas-lig-er-hentet-ned-fra-bjerg"],"confidence":"high"}],"sources":[{"title":"Den berømte bjergbestiger Nirmal Purjas lig er hentet ned fra bjerg","publisher":"DR Nyheder","url":"https://www.dr.dk/nyheder/seneste/den-beroemte-bjergbestiger-nirmal-purjas-lig-er-hentet-ned-fra-bjerg","publishedAt":"2026-08-02T13:27:37Z","kind":"reporting"}]}],"signals":[{"text":"Løkke ansætter ny særlig rådgiver","headline":"Løkke ansætter ny særlig rådgiver","url":"https://www.altinget.dk/navnenyt/loekke-ansaetter-ny-saerlig-raadgiver","summary":"Moderaternes partisekretær Jonas Juul Bisserup Bechfeldt er fra 1. august ny særlig rådgiver for udenrigsminister Lars Løkke Rasmussen. Han afløser Morten E. G. Brautsch, der forlod posten for at stille op til Folketinget.","publisher":"Altinget","section":"Navnenyt","publishedAt":"2026-08-01T14:06:00Z"},{"text":"Udnævnelse af ny CFO","headline":"Udnævnelse af ny CFO","url":"https://view.news.eu.nasdaq.com/view?id=bf577a4e2c78436b60f41d5b389644f86&lang=da&src=listed","summary":"ChemoMetec skifter finansdirektør: Phillip Massie Price tiltræder 3. august, og den hidtidige CFO Kim Nicolajsen fratræder samme dag. Direktionen bliver derefter på to personer.","publisher":"Nasdaq Copenhagen / ChemoMetec","section":"Selskabsmeddelels skriver skiftet som en ændring af selve formålet: efter forløbet skal de værnepligtige kunne indsættes operativt.","publisher":"DR Nyheder","section":"Indland","publishedAt":"2026-08-02T04:05:00Z"},{"text":"Privatansatte fædre holder længere barsel","headline":"Privatansatte fædre holder længere barsel","url":"https://www.dr.dk/nyheder/seneste/privatansatte-faedre-holder-laengere-barsel","summary":"Fire år efter de nye regler om øremærket barsel trådte i kraft, holder privatansatte mænd i gennemsnit 15,2 ugers barsel mod 12,7 uger før, viser en medlemsundersøgelse fra Djøf. Analysen viser samtidig, at barselsvilkårene fortsat afhænger af arbejdspladsen.","publisher":"DR Nyheder","section":"Seneste","publishedAt":"2026-08-02T06:24:19Z"},{"text":"Borgmestre tager afstand fra påsat brand og stenkast i Tingbjerg: 'Følger udviklingen tæt'","headline":"Borgmestre tager afstand fra påsat brand og stenkast i Tingbjerg: 'Følger udviklingen tæt'","url":"https://www.dr.dk/nyheder/indland/borgmestre-tager-afstand-fra-paasat-brand-og-stenkast-i-tingbjerg-foelger-udviklingen-taet","summary":"Københavns overborgmester og beskæftigelsesborgmesteren tager afstand fra nattens påsatte brande i Tingbjerg og vil have et samlet overblik over episoden. Den 22-årige, som politiet skød, er varetægtsfængslet i foreløbig 18 dage, og skudafgivelsen skal undersøges af Den Uafhængige Politiklagemyndighed.","publisher":"DR Nyheder","section":"Indland","publishedAt":"2026-08-02T12:30:00Z"},{"text":"Her i landet er brandfaren størst: Vær forsigtig, opfordrer beredskabsdirektør","headline":"Her i landet er brandfaren størst: Vær forsigtig, opfordrer beredskabsdirektør","url":"https://www.dr.dk/nyheder/indland/her-i-landet-er-brandfaren-stoerst-vaer-forsigtig-opfordrer-beredskabsdirektoer","summary":"Tørt og varmt sommervejr har sendt brandfareindekset i rødt flere steder i Nordjylland, hvor beredskabet har rykket ud til en række naturbrande. Beredskabsdirektøren opfordrer til at lade ukrudtsbrænderen blive i skuret og advarer om, at høstarbejdet i sig selv kan antænde marker.","publisher":"DR Nyheder","section":"Indland","publishedAt":"2026-08-01T07:32:05Z"},{"text":"Fifa har brug for en ny præsident, mener DBU-formand","headline":"Fifa har brug for en ny præsident, mener DBU-formand","url":"https://www.dr.dk/sporten/fodbold/fifa-har-brug-en-ny-praesident-mener-dbu-formand","summary":"DBU-formand Jesper Møller siger til DR, at han håber, Fifa får en ny præsident, efter at Gianni Infantino trak forslaget om at sælge andele i international fodbold til private investorer. DBU stemte ikke på Infantino i 2023, og Møller kan heller ikke se DBU gøre det i 2027.","publisher":"DR","section":"Fodbold","publishedAt":"2026-08-01T13:06:37Z"},{"text":"Rekordstort dansk hold udtaget til EM i atletik","headline":"Rekordstort dansk hold udtaget til EM i atletik","url":"https://www.dr.dk/sporten/seneste-sport/rekordstort-dansk-hold-udtaget-til-em-i-atletik","summary":"Dansk Atletik Forbund har udtaget 28 atleter til EM i atletik i Birmingham 10.-16. august, hvilket ifølge DR er et rekordstort dansk hold. Målsætningen er en medalje og tre top-8-placeringer.","publisher":"DR","section":"Kort sport","publishedAt":"2026-07-31T11:07:46Z"},{"text":"'Sopranos'-stjernen Vincent Pastore er død","headline":"'Sopranos'-stjernen Vincent Pastore er død","url":"https://www.dr.dk/nyheder/seneste/sopranos-stjernen-vincent-pastore-er-doed","summary":"Den amerikanske skuespiller Vincent Pastore, kendt som 'Big Pussy' i tv-serien 'Sopranos', er død, 80 år gammel. Han blev fundet død i sit hjem i Bronx i New York, og dødsårsagen er ukendt.","publisher":"DR Nyheder","section":"Seneste","publishedAt":"2026-08-02T05:15:56Z"},{"text":"Evenepoel vinder stor klassiker efter problemer","headline":"Evenepoel vinder stor klassiker efter problemer","url":"https://sport.tv2.dk/live/cykling/2026-08-01-evenepoel-vinder-stor-klassiker-efter-problemer","summary":"Remco Evenepoel vandt WorldTour-klassikeren Clasi 81035090181.jpg","credit":"Omslag: Pan Macmillan","alt":"Omslaget til bogen How to Win a Trade War – A Friendly Guide to an Unfriendly World af Soumaya Keynes og Chad Bown.","sourceUrl":"https://www.panmacmillan.com/authors/soumaya-keynes/how-to-win-a-trade-war/9781035090181"}},{"id":"rec-draghi-implementering-20260802","mode":"read","kind":"Rapport","status":"available","title":"Implementing the Draghi Report: The Moment of Truth","creator":"François Chimits, Jeanne Lebaudy, Enora Morin, Eve Talkowski","provider":"Institut Montaigne","url":"https://www.institutmontaigne.org/en/publications/implementing-draghi-report-moment-truth","availability":"Gratis. Både femsiders resumé og den fulde note på 130 sider kan hentes uden registrering.","commitment":"20 minutter for resuméet, cirka tre timer for hele noten","description":"Institut Montaigne har fulgt alle 567 anbefalinger fra Draghi-rapporten og opgør implementeringsgraden til 30 procent pr. maj 2026. Noten dækker fem temaer og tyve politikområder.","rationale":"Han har ført Draghi-dagsordenen fra BusinessEuropes side. Her får han et talgrundlag for, hvor langt den faktisk er nået, område for område, og hvad der ligger til forhandling mellem EU-lovgiverne de næste tolv måneder.","topics":["eu-konkurrenceevne","draghi-rapporten","regelforenkling","bruxelles","industripolitik"],"isFeatured":false},{"id":"rec-lucian-freud-louisiana-20260802","mode":"experience","kind":"Udstilling","status":"timely","title":"Lucian Freud – Everything is a Portrait","creator":"Lucian Freud","provider":"Louisiana Museum of Modern Art","url":"https://louisiana.dk/en/exhibition/lucian-freud-2026/","availability":"Adgang med almindelig entrébillet. Udvidet åbningstid i juli og august: tirsdag til fredag 10-22, lørdag og søndag 10-18, lukket mandag.","commitment":"1-2 timer, 40 min. tog fra København","description":"Louisianas udstilling om Lucian Freuds tegninger gennem hele karrieren, fra blyant, pen og blæk til kul og radering, sat i dialog med et udvalg af hovedværker på lærred. Vises i Humlebæk sammen med Sophie Calle og Arthur Jafa.","rationale":"En søndag uden nyhedsværdi og uden anvendelighed. Udstillingen samler tegningerne fra hele karrieren og rummer værker, der vises offentligt for første gang, og den lukker 27. september. Sophie Calle i samme hus lukker allerede 6. september.","topics":["kunst","louisiana","tegning","udstilling","humlebæk"],"isFeatured":false},{"id":"rec-cycling-podcast-feminin-20260802","mode":"listen","kind":"Podcast","status":"timely","title":"The Cycling Podcast Féminin","creator":"Rose Manley, Denny Gray og Lizzy Banks","provider":"The Cycling Podcast","url":"https://podcasts.apple.com/podcast/the-cycling-podcast/id665713706","availability":"Gratis i alle podcast-apps, i hovedfeedet The Cycling Podcast. Et betalt Friends of the Podcast-abonnement giver adgang til bagkataloget.","commitment":"50-60 minutter per etape","description":"Daglige afsnit fra Tour de France Femmes 2026, optaget på selve løbet med analyse og interviews. Første afsnit dækker etape 1, Lausanne-Lausanne, der blev kørt 1. august.","rationale":"Løbet kører netop nu, og afsnittene optages på selve løbet frem for i et studie. Lizzy Banks kender feltet indefra, hvilket høres på, hvad hun spørger om. Hvis han vil følge kvindernes Tour uden at læse resultatlister, er det her formatet.","topics":["cykling","tour de france femmes","sport","podcast"],"isFeatured":false}],"quality":{"sourceQuality":88,"verification":93,"outsideProfile":86,"freshness":94}};</script>
